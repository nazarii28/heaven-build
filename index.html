  // The Associate has the last word, and it is a different one for each of the three endings
  // (GDD 8.4). That is the whole of "this ending was written for your run": `state.loseReason`
  // already knew which way it went wrong, and nothing in the game had ever said so out loud.
  renderSpeakerPlate(ctx, playAgainButtonRect().y - SPEAKER.h - 10, text.host, accent, false,
                     state.endTime);

  drawButton(ctx, playAgainButtonRect(), 'PLAY AGAIN');
}

function renderWin(ctx) {
  renderEndScreen(ctx, WIN_TEXT, C.ink);
}

function renderLose(ctx) {
  renderEndScreen(ctx, LOSE_TEXT[state.loseReason], C.suspicion);
}

// Drawn with its own scale transform on a full-viewport canvas, so it stays readable exactly
// when the game itself would not be. Everything below is laid out inside NOTICE_W x NOTICE_H.
function renderRotateNotice(ctx) {
  const k = Display.noticeScale;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.bgDeep;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.setTransform(k, 0, 0, k,
    Math.floor((canvas.width - NOTICE_W * k) / 2),
    Math.floor((canvas.height - NOTICE_H * k) / 2));

  const cx = NOTICE_W / 2;

  // A sideways phone, an arrow, an upright phone. Two silhouettes and a direction, which needs
  // no glyph that could be mistaken for anything else at this size.
  const left = cx - 34;
  strokeRect(ctx, left, 12, 34, 20, C.inkFaint);
  fillRect(ctx, left + 2, 21, 1, 4, C.inkFaint);
  drawText(ctx, '→', left + 38, 16, C.credits, 1);
  strokeRect(ctx, left + 48, 5, 20, 34, C.ink);
  fillRect(ctx, left + 55, 8, 6, 1, C.ink);
  fillRect(ctx, left + 56, 35, 4, 1, C.ink);

  drawTextCentered(ctx, ROTATE_NOTICE[0], cx, 48, C.ink, 1);
  drawTextCentered(ctx, ROTATE_NOTICE[1], cx, 58, C.ink, 1);
  drawTextCentered(ctx, ROTATE_NOTICE[2], cx, 70, C.inkFaint, 1);
  drawTextCentered(ctx, ROTATE_NOTICE[3], cx, 78, C.inkFaint, 1);
}

// --- The alarm vignette (GDD 10) ----------------------------------------------
// Red creeping in from the edges once the meter is in the red. Nested one-pixel frames with falling
// alpha rather than a radial gradient: a gradient bands under an integer upscale, and steps are
// what the rest of the game is drawn with anyway. It pulses in time with the Suspicion bar - one
// alarm, reported twice, so it can be caught in peripheral vision while reading a card.
function renderVignette(ctx) {
  if (state.suspicion < SUSP_ALARM) return;
  const depth = clamp((state.suspicion - SUSP_ALARM) / (SUSP_MAX - SUSP_ALARM), 0, 1);
  const pulse = 0.55 + 0.45 * Math.sin(Fx.time * Math.PI * 2 * SUSP_ALARM_PULSE);
  const peak = VIGNETTE_ALPHA * (0.4 + 0.6 * depth) * pulse;
  const h = Display.viewH;

  ctx.fillStyle = C.suspicion;
  for (let k = 0; k < VIGNETTE_W; k++) {
    const f = 1 - k / VIGNETTE_W;
    ctx.globalAlpha = peak * f * f;
    ctx.fillRect(k, k, VIEW_W - k * 2, 1);
    ctx.fillRect(k, h - 1 - k, VIEW_W - k * 2, 1);
    ctx.fillRect(k, k, 1, h - k * 2);
    ctx.fillRect(VIEW_W - 1 - k, k, 1, h - k * 2);
  }
  ctx.globalAlpha = 1;
}

function renderDebug(ctx, fps) {
  const line = 'x' + Display.scale + ' ' + VIEW_W + 'x' + Display.viewH + ' ' + fps + 'fps';
  drawTextRight(ctx, line, VIEW_W - 2, Display.viewH - 10, C.inkFaint, 1);
}

function renderUI(ctx) {
  // The work zone keeps drawing over the end-of-day plate so a swipe made on the last second of
  // the day finishes its animation instead of vanishing.
  if (state.screen === SCREEN.DAY_ACTIVE || state.screen === SCREEN.DAY_END ||
      state.screen === SCREEN.AUDIT) {
    renderPopups(ctx);      // over the scene, under the HUD: they float off guests inside the cloud
    renderWorkZone(ctx);
  }
  // The HUD stays up through the audit: the meter that just filled is the explanation for what is
  // happening on screen, and hiding it would make the beam arbitrary.
  if (state.screen !== SCREEN.TITLE && state.screen !== SCREEN.WIN && state.screen !== SCREEN.LOSE) {
    renderHud(ctx);
  }
  // The banner is scene furniture rather than HUD - it reports something happening in the lounge -
  // but it is drawn here so a holding onboarding beat can dim it along with everything else.
  if (state.screen === SCREEN.DAY_ACTIVE) renderSupplyBanner(ctx);

  // Over the scene and the HUD, under the vignette: a holding beat dims everything behind itself,
  // and the alarm border is the one thing that still has to be visible through that.
  if (state.screen === SCREEN.DAY_ACTIVE) renderTutorial(ctx);

  if (state.screen === SCREEN.TITLE) renderTitle(ctx);
  if (state.screen === SCREEN.DAY_END) renderDayEndPlate(ctx);
  if (state.screen === SCREEN.NIGHT_CARD) renderNight(ctx);
  if (state.screen === SCREEN.SHOP) renderShop(ctx);
  // Outside renderShop's slide transform: the beat only fires once the panel has settled, and a
  // plate that rode the panel up would arrive from off screen after the thing it explains.
  if (state.screen === SCREEN.SHOP && tutorialOnShop()) renderTutorial(ctx, shopPlateY());
  if (state.screen === SCREEN.AUDIT) renderAudit(ctx);
  if (state.screen === SCREEN.LOSE) renderLose(ctx);
  if (state.screen === SCREEN.WIN) renderWin(ctx);

  // Over everything, including the HUD it is warning about, but never on the title or the end
  // screens: those have their own colour, and a red border around a statistics table is decoration
  // rather than a signal.
  if (state.screen === SCREEN.DAY_ACTIVE || state.screen === SCREEN.DAY_END ||
      state.screen === SCREEN.NIGHT_CARD || state.screen === SCREEN.SHOP ||
      state.screen === SCREEN.AUDIT) {
    renderVignette(ctx);
  }

  // Last of all, so nothing tints it: the title and the end screens dim the whole canvas, and a
  // greyed-out mute button on the screen where the defeat theme is playing is the wrong answer.
  if (soundButtonVisible()) drawSoundIcon(ctx, soundButtonRect(), soundEnabled());
}

// ==========================================================================
// 18_render_card.js
// ==========================================================================

// The work zone: the soul card, the swipe affordances around it, the FULL refusal and the filed
// cards flying to their slots (GDD 5.3, 12.2). Build step 2.

let cardLayer = null;      // the card is drawn here first, then blitted with a shear, see blitTilted

// Card geometry. Most of it is no longer here: the blank in 15e_art_card.js owns the portrait well
// and the ten pip sockets and reports both in its own def, so the layout moves when the art is
// re-cut rather than when somebody remembers to update a constant.
//
// What is left is the three places the blank leaves clear for printing, measured off its grid: the
// band over the rule to the right of the portrait, the strip after each coloured marker where a
// stat is named, and the shaded footer. The first version of this card ran the name across the full
// width above everything, because a 32 px portrait beside it left 134 px and the longest archetype
// needs 140. The blank buys the name 150 by putting its rule under it instead of over it.
const CARD_WELL = { w: 32, h: 40 };      // the portrait well the blank cuts, at SPR_SOUL_CARD.portrait
const CARD_NAME = { x: 44, y: 14 };
const CARD_STAT_X = 50;                  // after the coloured marker, where the leader dots begin
// x clears the tick the blank prints in the footer at column 5: at 10 the arrow sat right against
// it and the pair read as a minus sign in front of a positive number.
const CARD_WORTH = { x: 16, y: 60, right: 190 };

// The photograph on the personnel file, and the reason this card stopped reading as a row in a
// table (GDD 12.5). The same figure that stands in the lounge, and now at full length: the well the
// blank cuts is 32x40 and a soul is 22x38, so the whole person fits in it and the waist crop the
// old plate needed is gone.
//
// The well is filled dark before the figure goes in. The blank leaves it paper-white and half the
// roster carries something pale - a white toque, a light coat - which on paper would leave the
// figure nothing to be light against. Filled with the Operations back wall it also matches the
// plate the Associate's portrait has baked into it, so a guest and the host read as the same kind
// of object on the same kind of card.
function drawSoulPortrait(g, soul) {
  const spr = soulSprite(soul);
  const wx = SPR_SOUL_CARD.portrait[0], wy = SPR_SOUL_CARD.portrait[1];
  fillRect(g, wx, wy, CARD_WELL.w, CARD_WELL.h, C.opsBg);
  if (spr) drawSprite(g, spr, wx + (CARD_WELL.w - GUEST.w) / 2, wy + (CARD_WELL.h - GUEST.h) / 2);
}

// A stat is five sockets and the blank has already printed the empty ones, so filling one means
// painting the inside of a socket that is already on the paper. Nothing here draws an outline: an
// empty pip is a hole in the form, not a box somebody drew.
function drawPips(ctx, y, value, color) {
  const pips = SPR_SOUL_CARD.pips;
  for (let i = 0; i < value; i++) {
    fillRect(ctx, pips.x + i * pips.step + 1, y + 1, pips.size - 2, pips.size - 2, color);
  }
}

// The card is a pale docket on a dark desk: the contrast runs the other way to the rest of the
// screen, which is what makes the work zone read as a separate surface rather than as more scene.
function paintCard(g, soul) {
  drawSprite(g, SPR_SOUL_CARD, 0, 0);

  drawText(g, soul.name, CARD_NAME.x, CARD_NAME.y, C.inkText, 1);
  drawSoulPortrait(g, soul);

  const pips = SPR_SOUL_CARD.pips;
  drawText(g, STAT_LABEL.g, CARD_STAT_X, pips.rows[0], C.inkText, 1);
  drawPips(g, pips.rows[0], soul.g, C.good);
  drawText(g, STAT_LABEL.s, CARD_STAT_X, pips.rows[1], C.inkText, 1);
  drawPips(g, pips.rows[1], soul.s, C.suspicion);

  // What this particular soul is worth, in each direction, before the player has to decide. The
  // arrows are the same ones the swipe hints use, so the line reads as two options and not as two
  // facts. Doing this arithmetic in the player's head is not the interesting part of the game.
  //
  // The line is split across two colours, and the split is the whole point. Aura cyan and Credits
  // gold were picked to carry against the near-black of the tower; measured against the cream
  // footer of this form they come out at 1.0:1, which is not dim, it is invisible. The deep end of
  // each ramp only reaches 2.4:1. So the number - the part that has to be read - is printed in the
  // form's own ink at 9.5:1, and the colour is spent on the arrow and the unit mark, which are
  // shapes the player already knows from the HUD and only have to be recognised.
  const aura = soul.g > 0 ? C.auraDark : C.inkDim;
  drawWorth(g, '+' + soulAura(soul).toFixed(1), '↑', '✦/s', CARD_WORTH.x, aura);
  const down = '+' + soulCredits(soul).toFixed(1);
  drawWorth(g, down, '↓', '◈/s', CARD_WORTH.right - worthWidth(down, '↓', '◈/s'), C.goldDark);
}

// One side of the worth line: a coloured arrow, the value in ink, a coloured unit. Kept next to
// its own measuring function so the right-hand side can be right-aligned without either of them
// drifting from the other.
function worthWidth(value, arrow, unit) {
  return textWidth(arrow + ' ', 1) + textWidth(value, 1) + textWidth(' ' + unit, 1);
}

function drawWorth(g, value, arrow, unit, x, color) {
  drawText(g, arrow, x, CARD_WORTH.y, color, 1);
  const vx = x + textWidth(arrow + ' ', 1);
  drawText(g, value, vx, CARD_WORTH.y, C.inkText, 1);
  drawText(g, ' ' + unit, vx + textWidth(value, 1), CARD_WORTH.y, color, 1);
}

// A pixel-exact tilt: the card is blitted one row at a time with an integer horizontal offset.
// ctx.rotate would antialias every edge into grey fringes, which the integer upscale then makes
// four times as obvious. `lead` is how far the top row runs ahead of the middle one.
function blitTilted(ctx, layer, x, y, lead) {
  if (!lead) { ctx.drawImage(layer, x, y); return; }
  const h = layer.height;
  const half = (h - 1) / 2;
  for (let r = 0; r < h; r++) {
    const dx = Math.round(-lead * (r - half) / half);
    ctx.drawImage(layer, 0, r, layer.width, 1, x + dx, y + r, layer.width, 1);
  }
}

function renderCard(ctx) {
  const card = state.card;
  const rest = cardRect();

  if (!card) {
    // While a verdict is still on the desk the placeholder stays away: RECEPTION CLEAR printed
    // under a stamp that has just landed contradicts the stamp.
    if (Fx.stamp) return;
    dashedRect(ctx, rest.x, rest.y, rest.w, rest.h, C.panel, 3, 5, 0);
    drawTextCentered(ctx, 'RECEPTION CLEAR', VIEW_W / 2, rest.y + rest.h / 2 - 4, C.inkFaint, 1);
    return;
  }

  if (!cardLayer) cardLayer = makeLayer(CARD.w, CARD.h);
  const g = cardLayer.getContext('2d');
  paintCard(g, card.soul);

  const rise = Math.round((1 - easeOut(card.in)) * 24);
  const lead = Math.round(CARD_TILT * clamp(card.ox / CARD_DRAG_MAX, -1, 1));
  blitTilted(ctx, cardLayer, Math.round(rest.x + card.ox), Math.round(rest.y + card.oy + rise), lead);
}

let stampLayer = null;

// The verdict, slammed onto the docket that just left (GDD 10). Drawn into its own layer and
// blitted with the same integer shear as the card, because a rubber stamp lands askew and
// ctx.rotate would fringe every edge of it on the way.
function renderStamp(ctx) {
  const s = Fx.stamp;
  if (!s) return;

  // As large as it fits. The one-word verdicts read right across the desk; a deny stamp that is a
  // whole sentence steps down to body size rather than being cropped or wrapped - a stamp with two
  // lines on it is a memo.
  const px = textWidth(s.text, 2) + 16 <= CARD.w ? 2 : 1;
  const w = textWidth(s.text, px) + 16;
  const h = FONT_H * px + 12;

  if (!stampLayer) stampLayer = makeLayer(CARD.w, FONT_H * 2 + 12 + STAMP_OVERSHOOT * 2);
  const g = stampLayer.getContext('2d');
  g.clearRect(0, 0, stampLayer.width, stampLayer.height);

  // The impact is the plate closing onto the words: it comes down oversized and shrinks to fit.
  // The text itself never scales - a bitmap font moved by a fraction of a pixel is mush, and this
  // is the largest thing on screen at the moment it lands.
  const slam = clamp(s.t / STAMP_SLAM, 0, 1);
  const grow = Math.round(STAMP_OVERSHOOT * (1 - easeOut(slam)));
  const x = Math.floor((stampLayer.width - w) / 2);
  const y = Math.floor((stampLayer.height - h) / 2);

  fillRect(g, x - grow, y - grow, w + grow * 2, h + grow * 2, C.bgDeep);
  strokeRect(g, x - grow, y - grow, w + grow * 2, h + grow * 2, s.color);
  strokeRect(g, x - grow + 1, y - grow + 1, w + grow * 2 - 2, h + grow * 2 - 2, s.color);
  drawTextCentered(g, s.text, stampLayer.width / 2, y + 6, s.color, px);

  const fade = s.t - STAMP_SLAM - STAMP_HOLD;
  ctx.globalAlpha = fade > 0 ? Math.max(0, 1 - fade / STAMP_FADE) : 1;
  blitTilted(ctx, stampLayer,
             Math.round(cardRect().x + (CARD.w - stampLayer.width) / 2),
             Math.round(cardRect().y + (CARD.h - stampLayer.height) / 2), s.tilt);
  ctx.globalAlpha = 1;
}

// The three affordances sit in the free field around the card at rest. They are drawn UNDER the
// card on purpose: a dragged card slides over the space they occupy, and a label printed across
// the soul's own name was the first thing the screenshot pass caught.
function renderSwipeHints(ctx) {
  if (!cardIsLive()) return;
  const rest = cardRect();

  // The snap flash lands in the same band; two lines of text stacked there read as one smeared
  // block, and the bonus is the more important of the two messages while it is up.
  if (state.snapFlash <= 0) drawTextCentered(ctx, SWIPE_HINT.up, VIEW_W / 2, rest.y - 12, C.inkFaint, 1);
  const belowY = rest.y + rest.h + 6;
  drawText(ctx, SWIPE_HINT.left, EDGE_MARGIN + 4, belowY, C.inkFaint, 1);
  drawTextRight(ctx, SWIPE_HINT.down, VIEW_W - EDGE_MARGIN - 4, belowY, C.inkFaint, 1);
}

function labelPlate(ctx, text, cx, y, color) {
  const w = textWidth(text, 1) + 10;
  const x = Math.round(cx - w / 2);
  fillRect(ctx, x, y - 3, w, 15, C.bgDeep);
  strokeRect(ctx, x, y - 3, w, 15, color);
  drawTextCentered(ctx, text, cx, y, color, 1);
}

// Once the drag passes the threshold the action announces itself over the place the soul is
// about to go, not next to the card: the card is already covering everything around itself, and
// the target zone is where the player is looking anyway.
function renderActionLabel(ctx) {
  const dir = dragDirection();
  if (!dir || dir === 'right') return;
  const cx = VIEW_W / 2;
  const soul = state.card.soul;
  if (dir === 'up') {
    labelPlate(ctx, 'CHECK IN  +' + soulAura(soul).toFixed(1) + ' ✦/s', cx, Display.zones.heaven.y + 14, C.aura);
  } else if (dir === 'down') {
    labelPlate(ctx, 'REASSIGN  +' + soulCredits(soul).toFixed(1) + ' ◈/s', cx, Display.zones.ops.y + 10, C.ink);
  } else {
    labelPlate(ctx, 'DENY  -' + DENY_COST + ' ◈', cx, Display.zones.work.y + 10, C.suspicion);
  }
}

// Production floating off a soul. Outlined rather than plated: a dark box over the cloud would
// read as an object in the scene, and cyan on white cloud has no contrast without the outline.
function drawTextOutlined(ctx, text, cx, y, color, outline, px) {
  px = px || 1;
  const x = Math.round(cx - textWidth(text, px) / 2);
  drawText(ctx, text, x - 1, y, outline, px);
  drawText(ctx, text, x + 1, y, outline, px);
  drawText(ctx, text, x, y - 1, outline, px);
  drawText(ctx, text, x, y + 1, outline, px);
  drawText(ctx, text, x, y, color, px);
}

function renderPopups(ctx) {
  for (const p of state.popups) {
    const t = clamp(p.t, 0, 1);
    const y = Math.round(p.y - POPUP_RISE * easeOut(t));
    ctx.globalAlpha = t > 0.6 ? (1 - t) / 0.4 : 1;
    drawTextOutlined(ctx, p.text, p.x, y, p.color, C.bgDeep);
    ctx.globalAlpha = 1;
  }
}

// The snap bonus does not exist unless it is announced: it is a permanent 10% on one soul, and a
// silent one would just be a number the player never learns to chase.
function renderSnapFlash(ctx) {
  if (state.snapFlash <= 0) return;
  const t = 1 - state.snapFlash / SNAP_FLASH;
  const y = Math.round(cardRect().y - 14 - 10 * easeOut(t));
  ctx.globalAlpha = t > 0.6 ? (1 - t) / 0.4 : 1;
  drawTextOutlined(ctx, 'SNAP DECISION +10%', VIEW_W / 2, y, C.credits, C.bgDeep);
  ctx.globalAlpha = 1;
}

// FULL over a floor that had no room. This replaces a greyed-out button: the player finds out why
// the swipe failed, at the place where the failure is.
function renderFullFlash(ctx) {
  for (const zone of ['heaven', 'ops']) {
    const t = state.fullFlash[zone];
    if (t <= 0) continue;
    const z = zone === 'heaven' ? Display.zones.heaven : Display.zones.ops;
    const y = z.y + Math.floor(z.h / 2) - 8;
    const w = textWidth('FULL', 2) + 12;
    const x = Math.floor((VIEW_W - w) / 2);
    fillRect(ctx, x, y - 3, w, 20, C.bgDeep);
    strokeRect(ctx, x, y - 3, w, 20, C.suspicion);
    drawTextCentered(ctx, 'FULL', VIEW_W / 2, y, C.suspicion, 2);
  }
}

// A filed card shrinking into the slot it went to, or sliding off the left edge when denied.
// Outline only: a shrinking copy of the docket would sit on top of the guest that has already
// been placed there and read as two souls in one slot.
function renderFlyers(ctx) {
  for (const f of state.flyers) {
    const t = easeOut(clamp(f.t, 0, 1));
    const x = lerp(f.x0, f.x1, t);
    const y = lerp(f.y0, f.y1, t);
    const w = lerp(f.w0, f.w1, t);
    const h = lerp(f.h0, f.h1, t);
    ctx.globalAlpha = 1 - t * 0.7;
    strokeRect(ctx, x, y, w, h, f.color);
    ctx.globalAlpha = 1;
  }
}

function renderWorkZone(ctx) {
  renderSwipeHints(ctx);
  renderCard(ctx);
  renderActionLabel(ctx);
  renderFlyers(ctx);
  renderStamp(ctx);
  renderSnapFlash(ctx);
  renderFullFlash(ctx);
}

// ==========================================================================
// 19_tutorial.js
// ==========================================================================

// The onboarding beats and the Associate who delivers them (GDD 8.4). Plan v3, wave A.
//
// Playability is a quarter of the score and this build had no teaching in it at all: a judge opened
// the game, saw a docket carrying two unexplained stats, and had to guess that it wanted to be
// swiped. Six lines answer that, delivered by one speaker, each fired by the state that makes it
// mean something, each shown once per run.
//
// The beats live in `state` rather than in a module variable of their own, for the reason the whole
// state object exists: PLAY AGAIN is one call, and a run that remembered the last run's lessons
// would teach the second judge nothing.

function tutorialActive() { return state.tutorial.line !== null; }

// A holding beat has stopped the day and is waiting to be tapped away. Two places outside this
// module ask: the state machine, which freezes everything behind it, and the balance harness, which
// has to tap it away like a player would.
function tutorialHolding() { return tutorialActive() && state.tutorial.hold; }

// Queued rather than shown: two beats can become true in the same frame - the quota clock and a
// lounge that just filled - and the second one would otherwise overwrite the first before it had
// been read. Marking it seen at the moment it is queued is what keeps it to once per run.
function tutorialSay(id) {
  const t = state.tutorial;
  if (t.seen[id]) return;
  t.seen[id] = true;
  t.queue.push(id);
}

// The shop beats skip the queue and take the plate immediately. Nothing else can be speaking on
// the night panel - `tutorialCheck` only runs inside a day - so the reason the queue exists is not
// present here, and going through it would mean a beat that arrives one frame late on the one
// screen where the player is already looking at the thing being explained.
function tutorialSayNow(id) {
  const t = state.tutorial;
  if (t.seen[id]) return;
  const beat = TUTORIAL[id];
  t.seen[id] = true;
  t.id = id;
  t.line = beat.text;
  t.hold = beat.hold;
  t.life = beat.life || TUTORIAL_LIFE;
  t.t = 0;
}

// Which beat is on the plate, so the two screens that draw one can tell each other's beats apart.
// A day beat still fading when the clock ran out rides through the night in state - it is dismissed
// at START DAY, not at the shop - and without this it would be drawn over the prices.
function tutorialOnShop() {
  const id = state.tutorial.id;
  return !!id && !!TUTORIAL[id] && !!TUTORIAL[id].shop;
}

function tutorialDismiss() {
  const t = state.tutorial;
  t.id = null;
  t.line = null;
  t.hold = false;
  t.t = 0;
  t.life = TUTORIAL_LIFE;
}

// The staged unlock, spoken instead of captioned (GDD 9). Called once the panel has finished
// sliding up: the tab arrives, the grid settles, and then he says what it is for. `tutorialSayNow`
// is idempotent through `seen`, so this can be asked on every frame of the shop.
function shopPageBeat() {
  const i = newShopPage();
  const page = i >= 0 ? SHOP_PAGES[i] : null;
  if (page && page.beat) tutorialSayNow(page.beat);
}

// Conditions, not a script: each beat is the answer to a question the player is being asked for the
// first time. The riot beat is fired from riot() instead, because a riot is an event and by the
// time it can be seen in the state the guest is already gone.
function tutorialCheck() {
  if (state.card && state.card.in >= 1) {
    tutorialSay('firstCard');
    // A full lounge is the moment the second swipe becomes the answer, and a full lounge over a
    // full basement is the moment the third one does. They are the same question twice.
    if (firstFreeSlot(state.heavenSlots) < 0) {
      tutorialSay(freeSlotCount(state.cubicles) > 0 ? 'deskSwipe' : 'denySwipe');
    }
  }
  if (expiredGuestCount() > 0) tutorialSay('expiry');

  // The turn, and the last day (GDD 8, 8.4). Both are checked before the day-one beats below have
  // any chance of being true again, and both fire in the first frames of their day - the Associate
  // arrives before the first card does, which is the only quiet moment a day has.
  if (state.day >= APOCALYPSE_DAY) tutorialSay('apocalypse');
  if (state.day >= LAST_DAY) tutorialSay('lastDay');

  // The first consumable carried into a day (GDD 9.1). Fired off the slot rather than off the
  // purchase, because the purchase happened on a screen where the slot was not usable yet.
  if (state.supplies[0] || state.supplies[1]) tutorialSay('supply');

  // The starvation zone (GDD 4.1, 7.1). Not on day one, and not in the first seconds of a day: the
  // meter is legitimately low at the top of the morning, and a warning fired then would be about
  // the clock rather than about how the player is playing.
  if (state.day >= 2 && state.suspicion < SUSP_STARVE && state.dayLen - state.dayTime >= 12) {
    tutorialSay('starved');
  }

  // Late enough into day one that the player has sorted a few souls and can see the Aura counter
  // moving, which is what the line is about.
  if (state.day === 1 && !state.dayHold && state.dayLen - state.dayTime >= TUTORIAL_QUOTA_AT) {
    tutorialSay('quota');
  }
}

// The clock on whichever beat is up. `tutorialCheck` is NOT called from here: it reads the card,
// the lounge and the day timer, and the shop ticks this same function on a screen where all three
// belong to a day that is already over. The day calls the check itself, one line above this one.
function updateTutorial(dt) {
  const t = state.tutorial;
  if (!t.line && t.queue.length) {
    const id = t.queue.shift();
    const beat = TUTORIAL[id];
    t.id = id;
    t.line = beat.text;
    t.hold = beat.hold;
    // A beat that tells a story rather than an instruction is given longer to be read: three lines
    // at the arrival rate of day eight are not five seconds of reading.
    t.life = beat.life || TUTORIAL_LIFE;
    t.t = 0;
  }
  if (!t.line) return;
  t.t += dt;
  if (!t.hold && t.t >= t.life) tutorialDismiss();
}

// --- The plate ----------------------------------------------------------------

// Fades in, and fades out again on its own if it is not the kind that waits to be tapped.
function tutorialAlpha() {
  const t = state.tutorial;
  const arriving = clamp(t.t / TUTORIAL_FADE, 0, 1);
  if (t.hold) return arriving;
  return Math.min(arriving, clamp((t.life - t.t) / TUTORIAL_FADE, 0, 1));
}

// The speaker, 32x40, at the anchor wave A reserved for exactly this. The primitive that stood
// here - a dark suit, a tie and a headset drawn out of five rectangles - is now the sprite it was
// a placeholder for, and the anchor and size did not have to move, which was the point of fixing
// them at step 1.
//
// The sprite carries four mouth shapes and nothing else: rows 0-22 are identical across all four,
// so the head cannot shimmer, and only the mouth box moves. The cycle below is fixed rather than
// random because a random mouth at nine shapes a second reads as a glitch, while a repeating
// pattern with rests in it reads as speech. Frame 0 is the closed mouth, which is why it appears
// inside the cycle as well as at the end of it.
const VISEME_CYCLE = [1, 2, 0, 3, 2, 1, 0, 3];
const VISEME_RATE = 9;            // mouth shapes per second
const TALK_CPS = 17;              // characters per second, the speed the line is "read" at

// He talks while he is delivering a line and rests once it has been said, which is the difference
// the plate already draws with TAP TO CONTINUE. `talkT` is seconds since this plate went up, and
// the line takes as long to say as it takes to read at TALK_CPS.
//
// Delivering is NOT the same as "the screen is still running", and getting those two confused is
// what kept the mouth shut on two thirds of the beats in the game. A holding beat is waiting on a
// tap from its very first frame, so gating the animation on the wait meant eight of the thirteen
// beats - every swipe lesson, the expiry, the turn on day four and all three shop tabs - showed a
// closed mouth for the whole of a line the player had not read yet. It is not looped instead: a
// mouth that keeps moving after the words have run out reads as a stuck animation, and it argues
// with TAP TO CONTINUE, which is the plate saying he has finished and it is the player's turn.
function speakerViseme(text, talkT) {
  if (talkT === undefined || talkT === null) return 0;
  if (talkT > text.length / TALK_CPS) return 0;
  return VISEME_CYCLE[Math.floor(talkT * VISEME_RATE) % VISEME_CYCLE.length];
}

function drawSpeakerPortrait(ctx, x, y, frame) {
  drawSprite(ctx, SPR_ASSOCIATE_ONBOARDING, x, y, frame);
}

// One plate, used by the day-one beats and by the last word on all three ending screens. Its height
// is fixed at three lines whether it holds one or three, so a run of beats never makes the layout
// jump - and the ending screens can reserve the space for it before they know which text they have.
function renderSpeakerPlate(ctx, y, text, accent, waiting, talkT) {
  const x = EDGE_MARGIN;
  const w = VIEW_W - EDGE_MARGIN * 2;
  fillRect(ctx, x, y, w, SPEAKER.h, C.hudBg);
  strokeRect(ctx, x, y, w, SPEAKER.h, accent);
  drawSpeakerPortrait(ctx, x + SPEAKER.pad, y + SPEAKER.pad, speakerViseme(text, talkT));

  const tx = x + SPEAKER.pad + SPEAKER.pw + SPEAKER.gap;
  const tw = x + w - SPEAKER.pad - tx;
  drawText(ctx, SPEAKER_NAME, tx, y + 4, C.inkFaint, 1);
  const lines = wrapText(text, tw, 1);
  for (let i = 0; i < lines.length && i < SPEAKER_LINES; i++) {
    drawText(ctx, lines[i], tx, y + 14 + i * 9, C.ink, 1);
  }
  // Only a beat that stopped the clock says this, and it says it inside the plate: the row below
  // the plate is the top of the lounge slots, where the halos are.
  if (waiting) drawTextRight(ctx, 'TAP TO CONTINUE', x + w - SPEAKER.pad, y + 41, C.credits, 1);
}

// Parked in the sky, under the queue row and above the lounge slots. The GDD drew it at the bottom
// of the screen; measured against the 384 px view there are 27 free pixels down there, under the
// card and its three swipe labels, and 52 up here - and covering the card while telling the player
// what to do with the card is the one placement that cannot work.
//
// Once the halos moved off the guests' heads and up over the slot frames they landed in the bottom
// of that band, and on the shortest supported view there is no arrangement where the plate, the
// queue row and a row of halos all fit. The plate rides up until it clears the halos, which on a
// 384 px view pins it under the HUD and covers the queue. That is the right thing to lose: the
// queue is frozen while a beat holds the day and is read as a length rather than as individuals,
// whereas the beat that says "tap them" is pointing at the halos.
//
// The clearance is computed from the halo rather than written down as a number. It was 18, which
// was the halo of the day - lift 9, half-height 7, a shadow row and one clear row - and a constant
// that silently encodes another constant is wrong the first time either moves. It has moved three
// times since: the halo was redrawn smaller, thickened into a band and back to its old height, and
// then replaced by a drawing four rows shorter than the band was. None of the three needed an edit
// here, which is the point of writing it as the sum it is.
function tutorialPlateY() {
  const z = Display.zones.heaven;
  const slotTop = Display.zones.ground.y - HEAVEN_SLOT.h;
  // The drawing reaches half its height above the centre, and one more row of daylight over it.
  const clear = HALO_LIFT + (HALO_H - 1) / 2 + 1;
  return Math.max(z.y, Math.min(z.y + 17, slotTop - SPEAKER.h - clear));
}

function renderTutorial(ctx, y) {
  const t = state.tutorial;
  if (!t.line) return;
  // A held beat dims the scene behind it, so a stopped clock reads as waiting rather than as stuck.
  if (t.hold) dim(ctx, 0.5);
  ctx.globalAlpha = tutorialAlpha();
  renderSpeakerPlate(ctx, y === undefined ? tutorialPlateY() : y,
                     t.line, C.credits, t.hold, t.t);
  ctx.globalAlpha = 1;
}

//
// It sits last but one in the build on purpose. Its note data is one packed varint string of
// about 95 KB on a single line - data, in the same sense as the bitmap font table in
// 02_font_table.js, not minified code - and dropping that into the middle of the file would put
// it between the game modules a reader is trying to follow.
//
// The game never calls into this directly. 07_audio.js is the only translator, and it maps the

// 3. Audio graph
//   voice -> panner[tr][ch][0..2] -> dry -> busGain[tr] -> (hell: shaper) -> color
//                                 -> wet -> busWet[tr] -> hall -> master -> tone -> limiter
//   Three panners to a channel: left, centre, right. Unison voices are spread across
//   them - that is the width a single point cannot give.
// ---------------------------------------------------------------------------
let AC = null, master = null, color = null, hall = null, hallRet = null;

function distCurve(k){
  const n = 1024, c = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = i / n * 2 - 1; c[i] = (1 + k) * x / (1 + k * Math.abs(x)); }

function makeIR(sec, decay, damp){
  const len = (AC.sampleRate * sec) | 0, b = AC.createBuffer(2, len, AC.sampleRate);
  const pre = (AC.sampleRate * .028) | 0;
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c);
    let lp = 0;
    for (let i = pre; i < len; i++) {
      const x = (i - pre) / (len - pre);
      const n = (Math.random() * 2 - 1) * Math.pow(1 - x, decay);
      lp += (n - lp) * damp;
      d[i] = lp * (i - pre < 400 ? (i - pre) / 400 : 1);
    }
  }
  return b;
}

  limiter.attack.value = .006; limiter.release.value = .32;

    stopAt = t0 + hold + rec.r + .05;
  } else {
    g.gain.exponentialRampToValueAtTime(.0001, t0 + rec.a + rec.d);
    stopAt = t0 + rec.a + rec.d + .05;
  }

  const o = AC.createOscillator();
  const w = WAVE[rec.w];
  if (Array.isArray(w)) o.setPeriodicWave(w[bandOf(midi)]);
  else if (w) o.setPeriodicWave(w);
  else o.type = 'sawtooth';
  o.frequency.setValueAtTime(f, t0);
  if (cents) o.detune.setValueAtTime(cents, t0);
  o.connect(g); o.start(t0); o.stop(stopAt); reg(o, stopAt, t0);

  if (rec.sub) {                                 // low end under the bass
    const s2 = AC.createOscillator(); s2.type = 'sine';
    s2.frequency.setValueAtTime(f / 2, t0);
    const sg = AC.createGain(); sg.gain.value = rec.sub;
    s2.connect(sg); sg.connect(g);
    s2.start(t0); s2.stop(stopAt); reg(s2, stopAt, t0);
  }
  if (rec.fm && quality) {
    const m = AC.createOscillator(); m.type = 'sine';
    m.frequency.setValueAtTime(f * rec.fm[0], t0);
    const mg = AC.createGain();
    mg.gain.setValueAtTime(f * rec.fm[1], t0);
    mg.gain.exponentialRampToValueAtTime(f * .02, t0 + Math.min(1.4, dur + .3));
    m.connect(mg); mg.connect(o.frequency);
    m.start(t0); m.stop(stopAt); reg(m, stopAt, t0);
  }
  if (rec.vib && quality) {
    const l = AC.createOscillator(); l.type = 'sine';
    l.frequency.value = rec.vib[0] * (.9 + Math.random() * .2);  // each one its own
    const lg = AC.createGain();
    lg.gain.setValueAtTime(0, t0);
    lg.gain.linearRampToValueAtTime(rec.vib[1], t0 + rec.vib[2] + .4);
    l.connect(lg); lg.connect(o.detune);
    l.start(t0); l.stop(stopAt); reg(l, stopAt, t0);
  }
  if (rec.trem && quality) {
    const l = AC.createOscillator(); l.type = 'sine'; l.frequency.value = rec.trem[0];
    const lg = AC.createGain(); lg.gain.value = peak * rec.trem[1];
    l.connect(lg); lg.connect(g.gain);
    l.start(t0); l.stop(stopAt); reg(l, stopAt, t0);
  }
  if (rec.air && quality) noiseAt(t0, Math.min(dur, .8), f * 2.6, 1.4, peak * rec.air, out);
}

function voice(t0, f, dur, rec, tr, ch, amp, midi){
  const uni = quality ? rec.uni : 1;
  const idx = UNI_IDX[uni], det = UNI_DET[uni];
  const a = amp / Math.sqrt(uni);
  for (let k = 0; k < uni; k++)
    sub(t0 + k * .006, f, dur, rec, pan[tr][ch][idx[k]], a, det[k] * rec.det, midi);
}

function noiseAt(t0, dur, bp, q, vol, out, sweepTo){
  const len = Math.max(1, (dur * AC.sampleRate) | 0);
  const b = AC.createBuffer(1, len, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = b;
  const f = AC.createBiquadFilter();
  f.type = 'bandpass'; f.Q.value = q;
  f.frequency.setValueAtTime(bp, t0);
  if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(out);
  src.start(t0); src.stop(t0 + dur + .02); reg(src, t0 + dur + .02, t0);
}

function drum(t0, note, amp, tr, ch, style){
  const st = style === undefined ? tr : style;
  const out = pan[tr][ch][1], soft = st === 0, heavy = st === 2;
  const tone = (fa, fb, t, vol, type) => {
    const o = AC.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(fa, t0);
    if (fb) o.frequency.exponentialRampToValueAtTime(fb, t0 + t * .5);
    const g = AC.createGain();
    g.gain.setValueAtTime(Math.max(.0002, vol), t0);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + t);
    o.connect(g); g.connect(out); o.start(t0); o.stop(t0 + t + .04);
    reg(o, t0 + t + .04, t0);
  };
  if (note === 36) {
    tone(heavy ? 155 : 118, heavy ? 41 : 49, heavy ? .42 : .3, amp * (heavy ? .9 : soft ? .48 : .74));
    noiseAt(t0, .02, 2400, .8, amp * .1, out);
  } else if (note === 38 || note === 40 || note === 37) {
    noiseAt(t0, soft ? .17 : .12, soft ? 3400 : 1800, soft ? .55 : .85,
            amp * (soft ? .28 : heavy ? .72 : .55), out);
    if (!soft) tone(190, 150, .09, amp * .26, 'triangle');
  } else if (note === 42 || note === 44) {
    noiseAt(t0, .04, 7400, 1.4, amp * (soft ? .12 : .22), out);
  } else if (note === 46) {
    noiseAt(t0, .26, 6800, 1.1, amp * .2, out);
  } else if (note === 49 || note === 57) {
    noiseAt(t0, heavy ? 1.7 : 1.2, 4000, .4, amp * (soft ? .15 : .28), out, 1500);
  } else if (note === 51 || note === 53 || note === 59) {
    noiseAt(t0, .34, 6200, 1.5, amp * (soft ? .09 : .15), out);
    if (note === 53) tone(1180, 0, .38, amp * .1);
  } else if (note === 54) {
    noiseAt(t0, .14, 8600, 2, amp * .14, out);
  } else {
    const f = 92 * Math.pow(2, (note - 41) / 14);
    tone(f * 1.35, f, .34, amp * (heavy ? .72 : .5));
    noiseAt(t0, .05, f * 6, 1.2, amp * .1, out);
  }
}

// ---------------------------------------------------------------------------
// 4. Suspicion -> mix
// ---------------------------------------------------------------------------
let suspicion = 0, solo = -1;
const busTarget = [1, 0, 0];
// Heaven takes the first ~25 of the scale, hell everything from ~75. All the ground
// between them is carried by the middle layer: it is what should be playing most of a run.
// Moved with the meter tiers (GDD 1.5, 7.1): heaven now owns 0-20 and hell 60-100, because at the
// old 0-25 / 75-100 split the hell arrangement never played in a run the player was winning.
function busWeights(v){
  const h = 1 - smoothstep(v, 10, 22);
  const m = smoothstep(v, 8, 20) * (1 - smoothstep(v, 59, 74));
  const l = smoothstep(v, 58, 72);
  const s = Math.max(1, (h + m + l) * .85);
  return [h / s, m / s, l / s];
}
function applySuspicion(){
  if (!AC) return;
  const t = AC.currentTime, w = busWeights(suspicion);
  for (let i = 0; i < 3; i++) {
    busTarget[i] = solo >= 0 ? (solo === i ? 1 : 0) : w[i];
    bus[i].gain.setTargetAtTime(busTarget[i], t, .9);
    busWet[i].gain.setTargetAtTime(reverbOn ? busTarget[i] : 0, t, .9);
  }
  color.frequency.setTargetAtTime(11000 * Math.pow(2600 / 11000, suspicion / 100), t, .9);
  shaper.curve = distCurve(1 + smoothstep(suspicion, 70, 100) * 3);
}
function setSuspicion(v){ suspicion = clamp(v, 0, 100); applySuspicion(); }

// ---------------------------------------------------------------------------
// 5. Scheduler (lookahead - the timing does not drift the way setTimeout does)
// ---------------------------------------------------------------------------
const AHEAD = .14, TICK_MS = 25;
// live counts NODES, not notes: one voice is 2 to 5 nodes
const CAP_SOFT = 200, CAP_HARD = 300;
let running = false, startT = 0, timer = null;
const cur = [new Int32Array(16), new Int32Array(16), new Int32Array(16)];
const chLevel = new Float32Array(16), chMute = new Uint8Array(16);
let liveCount = 0;

function resetCursors(fromU){
  for (let tr = 0; tr < 3; tr++)
    for (let ch = 0; ch < 16; ch++) {
      const c = DATA[tr][ch]; let i = 0;
      while (i < c.n && c.t[i] < fromU) i++;
      cur[tr][ch] = i;
    }
}

function pump(){
  const now = AC.currentTime;
  live = live.filter(L => L.e > now);
  liveCount = live.length;

  let hSec = now - startT + AHEAD;
  if (hSec >= TOTAL_SEC) {          // first run the tail out to the end of the loop,
    emit(LOOP_U, now);              // and only then wrap round - with no gap
    startT += TOTAL_SEC;
    resetCursors(0);
    hSec -= TOTAL_SEC;
  }
  emit(secToU(Math.max(0, hSec)), now);
  timer = setTimeout(pump, TICK_MS);
}

let dropped = 0;
function emit(hU, now){
  const minPrio = liveCount > CAP_HARD ? 8 : liveCount > CAP_SOFT ? 5 : 0;
  const lowQ = !quality;
  for (let tr = 0; tr < 3; tr++) {
    const audible = busTarget[tr] > .05;
    const rset = REC[tr];
    for (let ch = 0; ch < 16; ch++) {
      const c = DATA[tr][ch];
      let i = cur[tr][ch];
      if (!audible || chMute[ch]) {               // the cursor always moves, or the parts drift apart
        while (i < c.n && c.t[i] < hU) i++;
        cur[tr][ch] = i; continue;
      }
      const role = ROLE[ch];
      const rec = ch === 9 ? null : rset[role];
      while (i < c.n && c.t[i] < hU) {
        const u = c.t[i], t0 = startT + uToSec(u);
        if (t0 > now - .02) {
          if (PRIO[ch] >= minPrio && !(lowQ && PRIO[ch] <= 3)) {
            const amp = (c.v[i] / 127) * VOL[ch] * dynAt(u, tr, role);
            const durS = Math.max(.04, uToSec(u + c.d[i]) - uToSec(u));
            if (ch === 9) drum(t0, c.p[i], amp * 1.15, tr, ch);
            else if (rec) voice(t0, hz(c.p[i]), durS, rec, tr, ch, amp, c.p[i]);
            else noiseAt(t0, Math.min(durS, 2.6), 380, .55, amp * .45,
                         pan[tr][ch][1], 6800);
            if (amp > chLevel[ch]) chLevel[ch] = Math.min(1, amp * 3.2);
          } else dropped++;
        }
        i++;
      }
      cur[tr][ch] = i;
    }
  }
}

function play(fromSec){
  ctx();
  if (running) { running = false; clearTimeout(timer); }
  if (themeId >= 0) { themeId = -1; clearTimeout(themeTimer); }
  killAll();
  applySuspicion();
  const from = fromSec || 0;
  startT = AC.currentTime + .08 - from;
  resetCursors(secToU(from));
  running = true;
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setValueAtTime(.0001, AC.currentTime);
  master.gain.linearRampToValueAtTime(.5, AC.currentTime + .35);
  pump();
}
function stop(fade){
  running = false; clearTimeout(timer);
  if (!AC) return;
  const q = AC.currentTime + (fade === undefined ? .4 : fade) + .05;
  for (const L of live) if (L.e > q) { try { L.n.stop(Math.max(q, L.s)); } catch (e) {} }
  const t = AC.currentTime, f = fade === undefined ? .4 : fade;
  master.gain.cancelScheduledValues(t);
  master.gain.setValueAtTime(master.gain.value, t);
  master.gain.linearRampToValueAtTime(.0001, t + f);
}
function posSec(){ return running && AC ? clamp(AC.currentTime - startT, 0, TOTAL_SEC) : 0; }


// ---------------------------------------------------------------------------
// 6. Sound effects.
//    Each cue is one gesture: the same rhythm and the same contour IN SCALE DEGREES,
//    with the mode and the timbre taken from the current variant. So a cue is
//    recognised instantly, but you can still hear where you are.
//    Inside the crossfade zone the versions sound at once, weighted like the buses.
//
//    Twenty-two cues since the sound pass. Seven of them are new and one - `checkin` -
//    was rewritten, and all eight arrived as MIDI authored against the table below:
//    the pack's tracks are named for the roles in SR, so importing a cue is reading
//    its notes back out as degrees. That is also why the bank in 6c can stand in for
//    this section note for note - it is a render of the same data.
// ---------------------------------------------------------------------------
const SMODE = [[0,2,4,5,7,9,11], [0,2,3,5,7,9,10], [0,1,3,5,7,8,10]];
const SREV  = [.42, .34, .55];

// role -> envelope + wave in each of the three modes
const SR = {
  bell:  { a:.003, d:1.5, sus:false, g:.20, w:['glass','glass','metal'] },
  spark: { a:.002, d:.9,  sus:false, g:.13, w:['glass','glass','glass'] },
  thud:  { a:.002, d:.4,  sus:false, g:.55, w:['soft','soft','soft'], drop:.42 },
  click: { a:.001, d:.08, sus:false, g:.22, w:['pluck','pluck','metal'], f:3000 },
  pad:   { a:.35,  d:.5, s:.82, r:.8, g:.17, w:['strings','strings','metal'], f:2000 },
  choir: { a:.5,   d:.5, s:.9,  r:1.1, g:.30, w:['ah','oo','synth'], f:3600 },
  brass: { a:.02,  d:.35, s:.8, r:.55, g:.21, w:['brass','brass','brass'], f:2200 },
  low:   { a:.012, d:.7, s:.5,  r:.45, g:.30, w:['soft','soft','organ'], f:900 },
  str:   { a:.06,  d:.5, s:.85, r:.9, g:.16, w:['strings','strings','strings'], f:2200 },
  noise: { noise:[2600, 1.0] },
  sweep: { noise:[420, .55], up:5600 },
};
// n: [role, beat, degree, octave, velocity, length in beats]
// bend: [role, cents down]   drum: [beat, note, velocity]   duck: [depth, seconds]
const SCUE = {
  checkin:  { n:[['low',0,1,-2,58,.4],['click',0,5,1,84,.1],['bell',.05,5,0,94,.55],
                 ['bell',.24,1,1,104,1],['spark',.24,1,2,52,.8]],
              drum:[[0,37,56]], duck:[.3,.2] },
  reassign: { n:[['click',0,1,1,102,.2],['low',.2,1,-1,90,1.2]],
              bend:[['low',900]], drum:[[0,42,62]], duck:[.2,.25] },
  deny:     { n:Array.from({length:14},(_,k)=>['noise',.07*k,1+(k%3)*2,-1,92-k*3,.09])
                 .concat([['sweep',1.05,1,0,88,.9]]),
              drum:[[0,42,70],[1.05,49,86]], duck:[.35,.5] },
  elevator: { n:[['pad',0,1,0,88,3.2],['low',0,1,-2,94,3.2],['str',0,5,-1,62,3.0]],
              bend:[['pad',700],['low',700],['str',700]], drum:[[3.3,35,78]], duck:[.25,1.7] },
  purchase: { n:[['bell',0,5,0,100,1],['bell',.25,1,1,92,1],['bell',.5,3,1,84,1.4],
                 ['spark',.5,1,2,62,1.6]], duck:[.2,.2] },
  nofunds:  { n:[['low',0,5,-1,92,.35],['low',.22,4,-1,76,.5]] },
  snap:     { n:[['spark',0,1,2,94,.9],['spark',.13,5,2,64,.8]] },
  soul:     { n:[['spark',0,1,1,64,.9],['spark',.18,5,1,48,.8]] },
  dayStart: { n:[['bell',0,1,0,96,3],['choir',.3,1,0,58,2.8],['choir',.3,3,0,54,2.8],
                 ['choir',.3,5,0,50,2.8]], duck:[.2,.5] },
  quotaMet: { n:[['bell',0,1,0,96,.9],['bell',.18,3,0,90,.9],['bell',.36,5,0,84,.9],
                 ['bell',.54,1,1,92,1.6],['choir',.5,1,0,60,2],['choir',.5,5,0,56,2],
                 ['choir',.5,3,1,52,2]], duck:[.2,.35] },
  susp40:   { n:[['str',0,1,0,86,1],['str',0,3,0,82,1],['str',0,7,0,78,1],
                 ['low',0,1,-2,90,2.2]], duck:[.3,.5] },
  susp75:   { n:[['sweep',0,1,0,96,2],['low',2,1,-2,96,2.4],['low',2,5,-2,88,2.4],

  riot:     { n:Array.from({length:12},(_,k)=>['thud',.33*k,k%2?1:5,-2,58+k*5,.3])

                          ['brass',4,5,-1,100,2],['brass',4,1,0,96,2],
                          ['str',4,1,0,84,2.4]]),
              drum:[[4,49,112],[4,36,118]], duck:[.55,1.6] },
  quotaFail:{ n:[5,4,3,1].map((d,k)=>['brass',.5*k,d,-1,100-k*6,.9])
                 .concat([5,4,3,1].map((d,k)=>['low',.5*k,d,-2,92-k*6,.9]))
                 .concat([['str',2,1,-1,86,3.5],['str',2,5,-1,80,3.5]]),
              drum:[[2,49,106],[2,36,100]], duck:[.45,1.8] },
  goodPerson:{n:[['choir',0,1,0,78,6],['choir',0,3,0,74,6],['choir',0,5,0,70,6],
                 ['choir',0,1,1,66,6],['bell',3,1,1,66,3.5],['str',0,1,-1,56,6]],
              duck:[.25,3] },
  // The seven added in the sound pass. Every one of them answers an event the game was already
  // firing into silence, so they are all small on purpose: `scroll` and `processed` can happen

  processed:{ n:[['click',0,1,1,50,.07],['bell',.03,3,0,72,.35],['bell',.17,5,0,66,.55]] },

  expire:   { n:[['pad',0,1,-1,34,.75],['spark',0,5,0,58,.4],['spark',.15,1,0,46,.65]] },
  shop:     { n:[['sweep',0,1,0,60,.45],['pad',.05,1,0,58,.9],['pad',.05,5,0,52,.9],

  // The pair that reports the meter moving. Up is a second degree leaning on the first - the one

  suspicion:{ n:[['low',0,1,-2,60,.45],['str',0,1,0,68,.28],['str',.07,2,0,76,.38]] },
  relief:   { n:[['bell',0,5,0,70,.5],['choir',.1,1,0,40,1.3],['bell',.17,3,0,62,.6],
                 ['bell',.34,1,0,56,1.1]] },

  lose:     { n:[['low',0,1,-2,110,1.7],['brass',0,1,-1,108,1.3],['brass',0,2,-1,100,1.3],
                 ['str',0,1,0,84,1.7]],
              drum:[[0,36,112],[0,49,104]], duck:[.45,1.2] },
};

function renderCue(cue, m, t0, gain){
  const dm = m === 2 ? 1.25 : 1, tr = m === 2 ? -12 : 0, spb = .5 * dm;
  const bendFor = {};
  for (const [role, c] of (cue.bend || [])) bendFor[role] = c;
  for (const ev of (cue.n || [])) {
    const [role, tb, deg, oct, vel, dur] = ev;
    const r = SR[role]; if (!r) continue;
    const t = t0 + tb * spb;
    const oc = Math.floor((deg - 1) / 7), ix = (deg - 1) % 7;
    const midi = 62 + SMODE[m][ix] + 12 * (oct + oc) + tr;
    const amp = (vel / 127) * gain;
    if (r.noise) {
      const f = r.noise[0] * Math.pow(2, (midi - 62) / 12);
      noiseAt(t, dur * spb, f, r.noise[1], amp * .3, sfxBus,
              r.up ? r.up : (bendFor[role] ? f * .35 : 0));
      continue;
    }
    const rec = { a:r.a, d:r.d, s:r.s === undefined ? .7 : r.s, r:r.r === undefined ? .3 : r.r,
                  g:r.g, sus:!!r.s, q:1, uni:1, det:0, w:r.w[m], f:r.f };
    sub(t, hz(midi), dur * spb, rec, sfxBus, amp, 0, midi);
    if (r.drop) sT(t, hz(midi) * 1.6, r.d * .6, { to: hz(midi) * .5, v: amp * .3 });
    if (bendFor[role]) {
      // the fall is done as a second layer: the target is lower by the given cents
      sT(t, hz(midi), dur * spb, { to: hz(midi) * Math.pow(2, -bendFor[role] / 1200),
                                   gl: dur * spb * .9, v: amp * r.g * .9,
                                   w: r.w[m], midi, a: r.a, f: r.f });
    }
  }
  for (const [tb, note, vel] of (cue.drum || []))
    drum(t0 + tb * spb, note, (vel / 127) * gain * .9, m, 9, m);
}

function sT(t0, f, dur, o){
  o = o || {};
  const osc = AC.createOscillator();
  const w = WAVE[o.w];
  if (Array.isArray(w)) osc.setPeriodicWave(w[bandOf(o.midi || 62)]);
  else if (w) osc.setPeriodicWave(w);
  else osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f, t0);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + (o.gl || dur));
  const g = AC.createGain();
  g.gain.setValueAtTime(.0001, t0);
  g.gain.linearRampToValueAtTime(Math.max(.0002, o.v || .15), t0 + (o.a || .005));
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  let node = g;
  if (o.f) { const flt = AC.createBiquadFilter();
    flt.type = 'lowpass'; flt.frequency.value = o.f; g.connect(flt); node = flt; }
  node.connect(o.out || sfxBus);
  osc.connect(g); osc.start(t0); osc.stop(t0 + dur + .05); reg(osc, t0 + dur + .05, t0);
}

function duck(amount, dur){
  if (!AC) return;
  const t = AC.currentTime;
  musicGain.gain.cancelScheduledValues(t);
  musicGain.gain.setValueAtTime(musicGain.gain.value, t);
  musicGain.gain.linearRampToValueAtTime(Math.max(.15, 1 - amount), t + .04);
  musicGain.gain.linearRampToValueAtTime(1, t + .04 + dur);
}

// ---------------------------------------------------------------------------
// 6c. The sample bank - the same twenty-two cues in the same three modes, rendered
//     offline into one file and played back as slices of it.
//
//     It exists to be compared against section 6, not to replace it: the synthesised
//     cues are what the build ships with, and this is the A/B. So it borrows
//     everything it can from the path beside it - the same mode weights, the same
//     crossfade rule, the same duck out of SCUE - and the only thing that differs
//     between the two is where the waveform came from.
//
//     Three consequences of that are worth naming. It is one file and one decode:
//     sixty-six separate files would be sixty-six requests and the same bytes with
//     more headers on them. It is optional: the load is fire and forget, and every
//     failure - no file, a browser that will not fetch over file://, a decode that
//     throws - leaves `bankLoad` at 'failed' and playSfx on the synthesised path,
//     which is the fallback the GDD asked for. And it is not free: a three-minute
//     stereo file is tens of megabytes of decoded float, which is the argument
//     against shipping it as the default rather than against having it.
// ---------------------------------------------------------------------------
// id -> [heaven start, length, middle start, length, hell start, length], all seconds.
// Taken from the pack's own map file; the gap between segments is 0.12 s.
const BANK = {
  checkin:    [  0.000,1.641,    1.761,1.592,    3.473,1.903],
  reassign:   [  5.496,1.575,    7.191,1.533,    8.844,1.842],
  deny:       [ 10.806,2.288,   13.214,2.224,   15.558,2.669],
  scroll:     [ 18.347,0.351,   18.818,0.335,   19.273,0.392],
  shop:       [ 19.785,1.642,   21.547,1.586,   23.253,1.883],
  purchase:   [ 25.256,2.509,   27.885,2.438,   30.443,2.924],
  nofunds:    [ 33.487,0.944,   34.551,0.915,   35.586,1.095],
  soul:       [ 36.801,1.803,   38.724,1.739,   40.583,2.063],
  expire:     [ 42.766,1.421,   44.307,1.372,   45.799,1.628],
  processed:  [ 47.547,1.162,   48.829,1.124,   50.073,1.336],
  snap:       [ 51.529,1.778,   53.427,1.714,   55.261,2.032],
  quotaMet:   [ 57.413,3.292,   60.825,3.194,   64.139,3.819],
  quotaFail:  [ 68.078,5.376,   73.574,5.249,   78.943,6.339],
  dayStart:   [ 85.402,3.884,   89.406,3.771,   93.297,4.516],
  elevator:   [ 97.933,3.059,  101.112,2.988,  104.220,3.612],
  suspicion:  [107.952,0.954,  109.026,0.919,  110.065,1.087],
  relief:     [111.272,2.325,  113.717,2.247,  116.084,2.673],
  susp40:     [118.877,2.559,  121.556,2.488,  124.164,2.987],
  susp75:     [127.271,4.534,  131.925,4.421,  136.466,5.329],
  riot:       [141.915,5.534,  147.569,5.421,  153.110,6.579],
  goodPerson: [159.809,5.584,  165.513,5.471,  171.104,6.641],
  lose:       [177.865,3.768,  181.753,3.626,  185.499,4.286],
};
// One trim for all sixty-six slices, and it cannot be right for all of them, because the two
// paths do not have the same dynamics. The synthesised cues keep the range their note data
// asks for - a peak of about .08 into sfxBus for `scroll`, about .8 for `riot`, a factor of
// ten between the smallest cue and the largest. The bank was mastered flat: measured off the
// file, `scroll` peaks at -3.5 dBFS and `riot` at +1.2, a factor of under two. So matching the
// quiet end wants a gain near .21 and the loud end near .70, and this is the middle of those.
// The consequence is audible and worth knowing before listening: on the bank the small cues
// that fire constantly sit louder than they do on the synth, and the rare big ones sit softer.
// This is the one number to turn if the comparison is being made by ear.
const BANK_GAIN = .38;
const BANK_FADE = .012;      // in and out, so a slice never starts or stops on a step

let bankBuf = null;
let bankLoad = 'idle';       // idle | loading | ready | failed
let sfxMode = 'synth';       // 'synth' | 'sample'

function loadBank(url){
  if (bankLoad === 'loading' || bankLoad === 'ready') return;
  bankLoad = 'loading';
  // Needs a context to decode into, so this has to be called from the same gesture that
  // creates one. Everything after the fetch runs later, by which time AC is long since up.
  const ac = ctx();
  fetch(url).then(function (r) {
    if (!r.ok) throw new Error('bank ' + r.status);
    return r.arrayBuffer();
  }).then(function (data) {
    // The callback form, not the promise one: older mobile Safari only has this signature,
    // and the two-argument call works on every engine that has either.
    ac.decodeAudioData(data, function (buf) {
      bankBuf = buf; bankLoad = 'ready';
    }, function () { bankLoad = 'failed'; });
  }).catch(function () { bankLoad = 'failed'; });
}

// One slice, gated so it cannot run past the end of the buffer. The pack's file is a little
// shorter than its own map - the tail of the last cue was trimmed off the render - so the
// clamp is load-bearing for exactly one segment and free insurance for the other sixty-five.
function playSlice(t, off, len, gain){
  const dur = Math.min(len, bankBuf.duration - off);
  if (dur <= .02) return;
  const src = AC.createBufferSource();
  src.buffer = bankBuf;
  const g = AC.createGain();
  const v = Math.max(.0002, gain * BANK_GAIN);
  const fade = Math.min(BANK_FADE, dur / 3);
  g.gain.setValueAtTime(.0001, t);
  g.gain.linearRampToValueAtTime(v, t + fade);
  g.gain.setValueAtTime(v, t + dur - fade);
  g.gain.linearRampToValueAtTime(.0001, t + dur);
  src.connect(g); g.connect(sfxBus);
  src.start(t, off, dur);
  src.stop(t + dur + .02);
  reg(src, t + dur + .02, t);
}

// The same rule the synthesised path uses: every mode above the audibility floor sounds at
// once, at the weight its bus is carrying. Returns false when it cannot, so playSfx can fall
// through to section 6 rather than dropping the cue.
function playBank(id, w, t){
  const seg = BANK[id];
  if (!seg || !bankBuf) return false;
  for (let m = 0; m < 3; m++) if (w[m] > .18) playSlice(t, seg[m * 2], seg[m * 2 + 1], w[m]);
  return true;
}

function playSfx(id){
  ctx();
  const cue = SCUE[id]; if (!cue) return;
  const w = solo >= 0 ? [0, 1, 2].map(i => (i === solo ? 1 : 0)) : busWeights(suspicion);
  const t = AC.currentTime + .03;
  const sampled = sfxMode === 'sample' && bankLoad === 'ready' && playBank(id, w, t);
  if (!sampled) for (let m = 0; m < 3; m++) if (w[m] > .18) renderCue(cue, m, t, w[m]);
  // Ducking is a property of the cue, not of how it was made, so it happens either way.
  if (cue.duck) duck(cue.duck[0], cue.duck[1]);
}

// ---------------------------------------------------------------------------
// 6b. Victory and defeat themes - the same note data, their own tempo, their own
//     palette (REC[3] and REC[4]) and a motif shared with the soundtrack.
// ---------------------------------------------------------------------------
let themeId = -1, themeStart = 0, themeTimer = null;
const themeCur = new Int32Array(16);
const themeSpu = i => (THEMES[i].tempo / 1e6) / (PPQ / DIV);

function playTheme(i){
  ctx();
  running = false; clearTimeout(timer); clearTimeout(themeTimer);
  killAll();
  themeId = i; themeCur.fill(0);
  themeStart = AC.currentTime + .2;
  for (let b = 0; b < 3; b++) {
    bus[b].gain.cancelScheduledValues(AC.currentTime);
    bus[b].gain.setTargetAtTime(b === 0 ? 1 : 0, AC.currentTime, .05);
    busWet[b].gain.setTargetAtTime(b === 0 && reverbOn ? 1 : 0, AC.currentTime, .05);
  }
  color.frequency.setTargetAtTime(11000, AC.currentTime, .2);
  musicGain.gain.cancelScheduledValues(AC.currentTime);
  musicGain.gain.setValueAtTime(1, AC.currentTime);
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setValueAtTime(.5, AC.currentTime);
  if (i === 1) {                                   // defeat gets a long exit
    const t = themeStart + THEMES[1].sec - 5;
    musicGain.gain.setValueAtTime(1, t);
    musicGain.gain.linearRampToValueAtTime(.12, t + 4.6);
  }
  pumpTheme();
}
function pumpTheme(){
  if (themeId < 0) return;
  const now = AC.currentTime;
  live = live.filter(L => L.e > now);
  liveCount = live.length;
  const spu = themeSpu(themeId), set = REC[3 + themeId], base = 3 + themeId;
  const hU = (now - themeStart + AHEAD) / spu;
  for (let ch = 0; ch < 16; ch++) {
    const c = DATA[base][ch];
    let i = themeCur[ch];
    if (chMute[ch]) { while (i < c.n && c.t[i] < hU) i++; themeCur[ch] = i; continue; }
    const role = ROLE[ch], rec = ch === 9 ? null : set[role];
    while (i < c.n && c.t[i] < hU) {
      const t0 = themeStart + c.t[i] * spu;
      if (t0 > now - .02) {
        const amp = (c.v[i] / 127) * VOL[ch] * .85;
        const durS = Math.max(.05, c.d[i] * spu);
        if (ch === 9) drum(t0, c.p[i], amp * 1.1, 0, ch, 2);
        else if (rec) voice(t0, hz(c.p[i]), durS, rec, 0, ch, amp, c.p[i]);
        else noiseAt(t0, Math.min(durS, 2.6), 380, .55, amp * .45, pan[0][ch][1], 6800);
        if (amp > chLevel[ch]) chLevel[ch] = Math.min(1, amp * 3.2);
      }
      i++;
    }
    themeCur[ch] = i;
  }
  if (now - themeStart > THEMES[themeId].sec + 5) { themeId = -1; applySuspicion(); return; }
  themeTimer = setTimeout(pumpTheme, TICK_MS);
}


// ---------------------------------------------------------------------------
// 7. Public interface. Everything the game needs.
// ---------------------------------------------------------------------------
const NAMES = ['victory', 'defeat'];
return {
  /** Create the AudioContext. Call FROM A TAP HANDLER - otherwise the browser will
   *  not allow sound. Repeat calls are safe. */
  init(){ ctx(); return this; },

  /** Start the soundtrack loop. fromSec is an optional starting point. */
  play(fromSec){ play(fromSec || 0); return this; },

  /** Stop with a fade (0.4 s by default). */
  stop(fade){ stop(fade); return this; },

  /** Suspicion 0..100. Call whenever state.suspicion changes. The crossfade is smooth
   *  on its own, so calling it every frame is fine. */
  setSuspicion(v){ setSuspicion(v); return this; },

  /** A sound effect. Takes the mode and the timbre of the current variant by itself,
   *  and inside the transition zone sounds in both. */
  sfx(id){ playSfx(id); return this; },

  /** Start loading the rendered sample bank from a relative path. Call FROM A TAP
   *  HANDLER, like init - it needs a context to decode into. Fire and forget: nothing
   *  waits on it, and a failure just leaves every cue on the synthesised path. */
  bank(url){ loadBank(url); return this; },

  /** Where sound effects come from. 'synth' renders each cue from the note data,
   *  'sample' plays it out of the bank. Pass nothing to read the current setting.
   *  Switching to 'sample' before the bank is ready is not an error - cues stay
   *  synthesised until the decode lands. */
  sfxSource(mode){ if (mode) sfxMode = mode === 'sample' ? 'sample' : 'synth'; return sfxMode; },

  /** 'idle', 'loading', 'ready' or 'failed'. */
  bankState(){ return bankLoad; },

  /** Ending theme: 'victory' (day 10 survived) or 'defeat' (Suspicion 100).
   *  Stops the loop by itself. */
  theme(which){
    const i = NAMES.indexOf(which);
    if (i >= 0) playTheme(i);
    return this;
  },

  /** Volume 0..1. */
  volume(v){
    if (AC) userVol.gain.setTargetAtTime(Math.pow(clamp(v, 0, 1), 1.6), AC.currentTime, .05);
    return this;
  },

  /** 'high' - full unison and vibrato; 'low' - half the cost, for weak phones.
   *  Can be switched while playing. */
  quality(mode){ quality = mode === 'low' ? 0 : 1; return this; },

  /** Reverb on or off. */
  reverb(on){ reverbOn = !!on; applySuspicion(); return this; },

  /** Mute one role by channel number 0..15 (see ROLES). */
  mute(ch, on){ chMute[ch] = on ? 1 : 0; return this; },

  /** Current state, for debugging and the HUD. */
  state(){
    return {
      playing: running, theme: themeId >= 0 ? NAMES[themeId] : null,
      pos: posSec(), total: TOTAL_SEC,
      bar: running ? Math.floor(secToU(posSec()) / BAR_U) + 1 : 0,
      suspicion, voices: liveCount,
      buses: AC ? bus.map(b => b.gain.value) : [1, 0, 0],
      levels: Array.from(chLevel),
    };
  },

  /** Reference tables. */
  SFX_IDS: Object.keys(SCUE),
  ROLES: ROLE.slice(),
  BARS: TOTAL_BARS,
  DURATION: TOTAL_SEC,
};

})();

// ==========================================================================
// 99_main.js
// ==========================================================================

// Entry point: fixed-timestep loop (GDD 1.3) and the boot sequence.

let acc = 0;
let lastTime = 0;
let fpsFrames = 0, fpsTime = 0, fps = 0;

function update(dt) {
  for (const g of Input.gestures) handleGesture(g);
  Input.gestures.length = 0;

  updateGame(dt);
  updateFx(dt);
}

function render() {
  const s = Display.scale;


  // Repaint the whole backing store first: the shake translate would otherwise smear the edges.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.bgDeep;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.setTransform(s, 0, 0, s, Fx.offsetX * s, Fx.offsetY * s);
  renderScene(ctx);
  renderUI(ctx);
  if (DEBUG) renderDebug(ctx, fps);
}

function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!(dt > 0)) dt = 0;
  if (dt > MAX_FRAME_DELTA) dt = MAX_FRAME_DELTA;   // a backgrounded tab must not burn the day

  // A sideways device pauses the day rather than running it where the player cannot read it.
  if (Display.landscape) {
    Input.gestures.length = 0;
    acc = 0;
    renderRotateNotice(ctx);
    requestAnimationFrame(frame);
    return;
  }

  acc += dt;
  let steps = 0;
  while (acc >= SIM_DT && steps < 8) {
    update(SIM_DT);
    acc -= SIM_DT;
    steps++;
  }
  if (acc > SIM_DT * 8) acc = 0;

  fpsFrames++;
  fpsTime += dt;
  if (fpsTime >= 0.5) { fps = Math.round(fpsFrames / fpsTime); fpsFrames = 0; fpsTime = 0; }

  render();
  requestAnimationFrame(frame);
}

function boot() {
  resizeDisplay();
  initInput();
  // No sprite loading step: every sprite in this build is a character grid in the source, baked
  // into an offscreen canvas the first time it is drawn (15_sprites.js).
  resetGame();
  initScene();
  gotoTitle();

  window.addEventListener('resize', resizeDisplay);
  window.addEventListener('orientationchange', resizeDisplay);

  lastTime = performance.now();
  requestAnimationFrame(frame);
}

boot();

})();
</script>
