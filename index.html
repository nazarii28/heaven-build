<script>
(function () {
'use strict';
// ==========================================================================
// 01_config.js
// ==========================================================================

// Every tunable number lives here. The balance pass (build step 9) edits this file and nothing else.

const DEBUG = false;              // true adds an on-screen diagnostics line; must be false in a release build
const RNG_SEED = 0;               // 0 = seed from the clock, any other value = reproducible run

// --- Virtual screen (GDD 1.2) -------------------------------------------------
const VIEW_W = 216;               // fixed virtual width, everything is authored against it
const VIEW_H_MIN = 384;           // shortest supported view; all layout must fit here
const VIEW_H_MAX = 480;           // tallest supported view, 20:9 phones
const CROP_TOLERANCE = 1.045;     // allow the next integer scale to overflow width by this factor
const EDGE_MARGIN = 6;            // nothing interactive closer than this to a canvas edge
                                  // The two move together: the crop is 216 * (1 - 1/tolerance)
                                  // virtual px across both edges, so 1.025 cut 2.6 px per side and
                                  // 1.045 cuts 4.7. Widening one without the other would push the
                                  // edge chevron under the crop on the phones the wider tolerance
                                  // was for (GDD 1.2).
const NOTICE_W = 150;             // layout box the rotate notice is scaled to fit
const NOTICE_H = 88;

// --- Simulation (GDD 1.3) -----------------------------------------------------
const SIM_DT = 1 / 60;            // fixed timestep, seconds
const MAX_FRAME_DELTA = 0.1;      // clamp so a backgrounded tab cannot burn every contract at once

// --- Input (GDD 1.4) ----------------------------------------------------------
const SWIPE_THRESHOLD = 28;       // virtual px before a drag counts as a swipe
const TAP_SLOP = 7;               // a release under this distance is a tap
const HIT_MIN = 38;               // minimum hit box for a tappable target

// --- Palette (GDD 12.1) -------------------------------------------------------
// Two blocks. The first is what the primitives were drawn in; the second is what the art pack
// names its colours, and every grid in the build resolves against it by name, so a colour edit
// here reaches every sprite without touching a single row of pixels.
//
// Two entries moved when the pack arrived: `monitor` and `opsBg` existed in both and disagreed in
// the last two digits. The pack's values win, because they are the ones the cubicle sprite was
// shaded against, and the drift is invisible either way.
const C = {
  bgDeep:      '#100e18',   // canvas letterbox and work zone
  hudBg:       '#0b0a12',
  ink:         '#f2ead2',   // warm white, primary text
  inkDim:      '#8a8a9a',
  inkFaint:    '#5a5f80',
  panel:       '#2a2438',
  aura:        '#4be0e0',
  credits:     '#e8c44a',
  suspicion:   '#e0484b',
  suspAmber:   '#e8a33a',
  good:        '#3f8f4f',
  skyHigh:     '#6fa8cf',   // fake paradise: a five-step ramp, dithered into a gradient
  skyMid2:     '#7db2d6',
  skyMid:      '#8fc0dc',
  skyMid3:     '#a3cce3',
  skyLow:      '#b6d9ea',
  cloud:       '#f2f4f8',
  cloudShade:  '#d8e2ee',
  slotEmpty:   '#5a6480',   // dashed outline of an unoccupied heaven slot, has to read against cloud
  guest:       '#7a6fa8',   // the soul violet the primitives were drawn in. The roster carries its
  guestGone:   '#8a8a9a',   // own colours now, so these two survive only in the shop icons: state
                            // is the halo, never the body (GDD 6.1a).
  opsBg:       '#232030',
  opsFloor:    '#1a1824',
  cubicle:     '#3a3746',
  cubicleTop:  '#4a4658',
  monitor:     '#2a6b62',

  // --- Named by the sprite grids ---------------------------------------------
  // Ramps, darkest first. A sprite legend cites these names, never a hex.
  outline:     '#16131f',   // cold near-black, the outline every Operations sprite is drawn with
  inkText:     '#2b2418',   // the near-black ink a printed form is set in, warmer than an outline

  guestDark:   '#3e3557',   // soul violet, four steps: shadow, mid, body (`guest` above), rim
  guestMid:    '#5a5080',
  guestRim:    '#a89adb',
  goneDark:    '#55535e',   // the same figure once it has stopped paying, three steps
  gone:        '#7d7b87',
  goneLit:     '#a8a6b0',

  // The rock the office is bolted into, three steps, and the heat coming up through it, three more.
  // Warm where the fit-out is cold: that difference is the whole reading of the floor. The heat
  // ramp is shared by the glow rising off the level below Operations and by the light in the
  // fissures, because it is meant to be the same light arriving two ways.
  rockDeep:    '#1a141c',
  rock:        '#2b2029',
  rockLit:     '#3d2c33',
  emberDeep:   '#3b2b38',
  emberDim:    '#5c2f3a',
  ember:       '#7a2f3c',

  opsDeep:     '#14121c',   // Operations, six steps from the floor strip up to the strip light
  opsMid:      '#363247',
  opsHi:       '#4d4863',
  opsLit:      '#6b6480',
  fluoro:      '#a8a4bd',   // the fluorescent tube itself
  monitorLit:  '#4aa393',   // what a monitor puts on a face

  cloudDeep:   '#b9c8dc',   // cloud underside, below `cloudShade`

  steelDark:   '#4e5064',   // elevator, shredder, headset
  steel:       '#8e91a8',
  steelLit:    '#c2c4d4',

  gold:        '#e8c44a',   // the pack's name for `credits`; both are here because the grids say
  goldDark:    '#a07c22',   // gold and the HUD says Credits, and neither reads right as the other
  goldLit:     '#f7e08f',
  // The halo's own four tones, read pixel for pixel off the reference drawing rather than mixed by
  // eye. Four steps rather than three because the drawing has four, and they are not a band's
  // inside, middle and outside: they are a lit ring seen at an angle, so the light lies along the
  // top of the far side and along the front of the near one, and the darkest tone marks the two
  // places where the ring turns away from the viewer. Which pixel is which tone is the drawing's
  // business, not a formula's - see HALO_GRID.
  //
  // Three of the four are the same values as `goldLit`, `gold` and `goldDark`: the final reference
  // came back drawn in the build's own gold ramp, which settles an argument two sessions of this
  // log had with themselves about the halo needing a more saturated gold of its own than the HUD's.
  // It does not - at 25 px across, with the deepest tone on the two sides where the ring stands
  // against the brightest part of the cloud, the ramp the rest of the art uses holds the crest.
  //
  // They keep their own names anyway, and the duplicated hex is deliberate. `gold`, `goldLit` and
  // `goldDark` are cited by half a dozen sprite palettes; a tweak made for a pastry or a lanyard
  // must not be able to move the one timer the whole lounge is read by.
  //
  // `haloFade` is the step the arc passes through on its way out. There is no matching "hole"
  // colour: a destroyed pixel is not drawn at all, so what shows through a broken halo is the sky.
  // It is kept clear of all four so a decaying pixel cannot be mistaken for a healthy one.
  haloLit:     '#f7e08f',
  haloGold:    '#e8c44a',
  haloDeep:    '#c4a231',
  haloDark:    '#a07c22',
  haloFade:    '#8a6408',
  // The same four steps in red, plus its own fade. `suspShade` and the lowered `suspFade` are new
  // with the fourth step: the red ramp had three tones and a fade, and the drawing asks for four.
  suspLit:     '#f07a7c',   // the lit side of a red halo, as haloLit is of a gold one
  suspShade:   '#7f2529',
  suspFade:    '#5c1a1d',

  auraDark:    '#1f8f96',
  auraLit:     '#a8f7f4',
  suspDark:    '#9c2e33',

  paper:       '#f2ead2',   // the pack's name for `ink` when it is a surface rather than a mark
  paperShade:  '#d6cbab',
  paperLine:   '#a3937a',

  skinDark:    '#a8794f',   // warm tan: pastry, wicker, wood. Not a face - see the face ramp below
  skin:        '#d9a877',
  skinLit:     '#f2d3a8',

  // The Associate's face, lit from below. The pack shipped this as a second `skin` ramp, which
  // collided with the tan above in two of the shop icons; renamed here rather than in the icons,
  // because a pie crust is not skin and one of the two names had to say what it actually is.
  faceShade:   '#8a6a64',
  face:        '#e2c9b4',
  faceLit:     '#f8efe2',
  hairBlk:     '#2e2a3e',
  hairBlkLit:  '#4c4664',
  hornDark:    '#181420',
  horn:        '#463a54',
  hornLit:     '#7d6c8e',
  uniShade:    '#311f7a',   // the uniform: hue 252, the one accent family nothing else uses
  uni:         '#3d19cc',
  uniLit:      '#8b74e7'
};

// One big cloud is the whole of paradise: its bumpy top edge sits high in the sky, the guest
// slots are seated inside it, and its underside is lit red from the floor below. Colour depends
// on the absolute row, not on where a given column of cloud begins, so the red band stays level.
// Noise icons rising out of operations cross this band - a hard line would make that a binary
// before/after, the ramp makes it a seep, which is what Noise is.
// Warm at the crest, cool at the base. The old ramp was four cold blue-whites, which is what a
// cloud looks like from underneath on an overcast day and not what one looks like lit from above.
// Index 0 is both the FRONT and the TOP of the ramp - cloudColor() walks it with depth and with
// row at once - so one warm-to-cool run buys the light from above and the depth cue together.
//
// Second thing it buys, unplanned: SPR_SLOT_HEAVEN is drawn in the warm tan ramp (skinDark ->
// paper), and against cold blue-white it was the loudest colour in the zone, so the eye went to
// the EMPTY suites first. A cream cloud puts the niche in the same family and that inversion goes.
// SIX steps, not four, and that is a fix rather than a flourish. cloudColor() walks this ramp with
// `shade + t * (1 - shade) * 0.5`, and there are now three layers walking it: front, mass, far. On
// four steps the mass landed on 2.0-2.5 and the far bank on 2.6-2.8, so the two of them came out as
// the same colour and the bank behind read as part of the mass. Six steps gives each layer a band
// of its own - at any given row they sit on indices 0, 2.7 and 4.5.
const CLOUD_BODY = ['#fffdf6', '#faf3e6', '#f0ecdf', '#e4e5ee', '#d3daec', '#c0cbe8', '#adbce1', '#98add6'];
const CLOUD_GLOW = ['#e3d9df', '#e8d2cf', '#eaa48c', '#e0684f', '#bf4048', '#7a2f3c', '#3b2b38', '#23212e'];
const FADE_H = 40;                // how far below the horizon the underlight runs before ops dark

// The heaven floor is built from three pieces of cloud, and the slots sit in the gaps between
// them: a big mass hanging above the row, a fluffy pillar in every gap between two slots, and a
// bed the slots rest on. The pillars are what make a slot read as a niche in something soft, so
// they are drawn in front and are allowed to overlap the slot edges.
// The three crests, and they are ONE budget rather than three numbers. Above the suite tops there
// are 68 rows at the 384 view and 106 at 480, and all three layers plus a strip of sky come out of
// that. The order below is the order they are read in, top to bottom, and each has to leave the
// next one something: mass crest 54, front crest 40, arch crown 26.
//
// CLOUD_FRONT_H > CLOUD_ARCH_RISE is not a preference, it is the condition under which the front
// layer exists at all. The front plane is filled from its crest DOWN to the intrados, so a crown
// that rises above the crest inverts the two and the loop writes nothing: at 30 against 36 the
// arcade vanished everywhere except a stub beside each pier, and the sky went back to two layers.
// The difference between them is the spandrel - the cloud left over the crown of each arch.
const CLOUD_MASS_H = 54;          // how far the crest of the mass rises above the slot tops
const CLOUD_MASS_PITCH = 83;      // heap spacing of the mass, deliberately not the slot pitch
const CLOUD_MASS_SPREAD = 1.35;   // heap width as a multiple of the pitch. Over 1 so the heaps run
                                  // into each other and the mass is one rolling crest, not a row
const CLOUD_MASS_DIM = 0.40;      // its shading, further along the body ramp: it sits behind
const CLOUD_ARCH_R = 5;           // lit edge along the underside of the arch
const CLOUD_ARCH_PUFF = 7;        // radius of the puffs the arch underside is scalloped with. The
                                  // curve is the LOWER envelope of a chain of these, so the opening
                                  // is billowed cloud rather than a drawn line
const CLOUD_FRONT_H = 40;         // crest of the front plane above the slot tops. Lower than
                                  // CLOUD_MASS_H on purpose: the difference is the band of mid
                                  // cloud that shows above the arcade, and without it the front
                                  // covers the mass from the crest down and there are two layers
                                  // on screen where the design says three
const CLOUD_FRONT_PITCH = 61;     // and a fourth pitch, so its bumps do not stack on the mass
const CLOUD_FRONT_SPREAD = 1.5;
const CLOUD_PIER_FLAT = 12;       // width of the pier top the arch springs from, so it has parallel sides
const CLOUD_SOFFIT_DIM = 0.58;    // the shaded underside of a span: what actually makes it an arch
const CLOUD_SOFFIT_H = 5;         // and how deep that shade runs. It is a lip, not a fill - see the
                                  // note at the draw site. Below it the opening is empty and the
                                  // mid layer shows through, which is the opening
const CLOUD_ARCH_RISE = 26;       // crown of the opening above the suite tops. Over a half-span of
                                  // 23 that is very nearly a semicircle, which is what an opening
                                  // in a wall wants; the earlier 36 was drawn when the arch was a
                                  // thin stroke standing in front of the mass and needed to be tall
                                  // and narrow to read as a line rather than as a lump. It is a
                                  // filled wall now and the geometry inverted with it. Floored near
                                  // 20 by the contract halo, which owns the 16 rows directly above
                                  // the suite edge and is the one readout nothing may crowd
const CLOUD_PILLAR_DIM = 0.05;    // in front of the mass, behind the lip. It was dimmed to 0.28 when
                                  // the piers were free-standing columns and the point was to stop
                                  // them reading as objects at all; now they close into an arcade
                                  // and the arcade has to read, so the value comes back up
const CLOUD_BED = 12;             // how far the bed covers the foot of a slot
const CLOUD_LIP = 8;              // how far the foreground lip climbs up the slot
const CLOUD_LIP_DROP = 6;         // and how far it hangs below it
const CLOUD_STEP = 3;             // silhouettes are quantised to this, no single-pixel teeth. 4
                                  // was too coarse once the shapes became round - a 30 px heap
                                  // has ten steps in it and came out as a stepped pyramid

// A second bank standing BEHIND the mass, which is what turns one cloud into weather: the mass
// alone reads as a bank of fog with slots cut in it, and the reference language for this is stacked
// cumulus at two distances. It lives in the headroom between the crest and the HUD, and there is
// not much - 16 px at the 384 view against 54 at 480 - so it is clamped to the top of the heaven
// zone rather than given a fixed height, and on a short view it is a ridge instead of a tower.
const CLOUD_FAR_PITCH = 118;       // a third pitch again: not the slot pitch and not CLOUD_MASS_PITCH
const CLOUD_FAR_H = 30;           // how far its heaps reach above the mass crest, before clamping
const CLOUD_FAR_SPREAD = 0.78;    // under 1, so the heaps stand apart and the gaps between them are
                                  // sky. This is the whole difference between a bank of cloud and a
                                  // wall with a bumpy top
const CLOUD_FAR_DIM = 0.72;       // furthest along the body ramp of the three layers
const CLOUD_RIM = 3;              // rows of lit edge along the top of a silhouette
const CLOUD_RIM_LIFT = 0.22;      // how far back up the body ramp that edge is pulled

// --- Zone layout (GDD 3). Heights are given for the 384 px view; the extra
// rows of a taller view are handed out with the weights below.
const ZONE_BASE = { hud: 40, heaven: 116, ground: 8, ops: 80, work: 140 };
const ZONE_GROW = { hud: 6, heaven: 38, ground: 0, ops: 26, work: 26 };  // sums to 96 = 480 - 384

// --- Slots (GDD 3) ------------------------------------------------------------
const HEAVEN_SLOT = { w: 40, h: 48, gap: 18 };  // gap widened from 5: a cloud pillar has to fit between two slots
const CUBICLE = { w: 52, h: 36, gap: 5 };
const OPS_FLOOR_H = 6;            // dark strip the cubicles stand on
const OPS_GLOW_H = 34;            // how far the light from the floor BELOW Operations rises
const OPS_BACK_PITCH = 41;        // partitions of the floor behind, deliberately not the desk pitch of 57
const OPS_TUBE_PITCH = 73;        // and the tubes over them, on a third pitch again

// The ceiling and what is behind it (GDD 12.4). Operations is an office fit-out bolted into rock,
// and the one place both halves of that are visible at once is the ceiling line: a suspended grid
// with tiles missing, and the cave it was hung inside showing through the gaps. Everything below
// is the same joke continued - partitions and strip lights standing against a wall of bedding
// planes, with the heat from the level below coming up through the cracks in it.
//
// Every number here is spent out of a band that is 32 rows at the 480 view and SIX at the 384 one,
// because the cloud's underlight tail paints over the top 32 rows of this layer whatever the view
// height. So the assembly is anchored to the top of that band and every piece below the ceiling is
// guarded on there being room for it; at 384 the ceiling is all that survives, which is the right
// thing to keep.
const OPS_CEIL_PITCH = 17;        // ceiling bay: the T-bar spacing
const OPS_CEIL_GAP = 4;           // one bay in this many has lost its tile. Fewer and deeper
                                  // beats more and shallower: a 17 px gap with a 3 px tooth in it
                                  // is noise along the ceiling line, and the rock has to be the
                                  // thing that is noticed rather than the damage
const OPS_TOOTH_MAX = 9;          // how far rock hangs into the room through a gap
const OPS_FISSURE_PITCH = 57;     // cracks in the back wall, on a pitch of their own again
const OPS_FISSURE_MIN = 12;       // no crack unless the wall is at least this tall - under that it
                                  // is a red dash rather than a crack, which reads as a defect
const OPS_STRATA_MAX = 5;         // thickest bedding plane, in rows
const OPS_BACK_PARALLAX = 0.5;    // the room moves at half the speed of the desks standing in it
const CARD = { w: 196, h: 72 };

// --- Floor strips (GDD 3.1) ---------------------------------------------------
// Slots grow sideways rather than into a second row, so a floor becomes a strip wider than the
// screen as soon as it is bought up. The chevrons are the safety rule of that design: nothing
// important may die out of sight.
const SCROLL_AXIS_LOCK = 6;       // px of movement before a drag over a floor commits to an axis
const SCROLL_SNAP = 0.22;         // seconds a chevron autoscroll takes
const CHEVRON = { w: 7, h: 13 };  // the arrow itself; it sits on a plate, like the swipe labels
const CHEVRON_PULSE = 2;          // Hz a red chevron flashes at
const CHEVRON_PLATE = 3;          // padding between the arrow and the edge of its plate

// --- Souls, the queue and the card (GDD 5) ------------------------------------
const QUEUE_MAX = 8;              // waiting souls; a further arrival turns away (GDD 5.4)
const FIRST_ARRIVAL = 1.2;        // grace before the first soul of a day
const LATE_DAY = 6;               // from here the weight of souls with Sanctity >= 4 doubles
const GOOD_PERSON_DAY = 3;        // the rarest archetype only starts appearing this late

const CARD_IN = 0.14;             // seconds the card takes to rise into the work zone
const CARD_TILT = 3;              // px the top edge of the card leads the bottom at a full drag
const CARD_SPRING = 0.16;         // spring-back after a refused or cancelled drag
const CARD_DRAG_MAX = 46;         // the card stops following the finger past this
const FLY_TIME = 0.4;             // a filed card travelling to its slot (GDD 5.3)
const FULL_FLASH = 0.5;           // how long FULL sits over a floor with no free slot
const TURN_AWAY_FLASH = 0.7;      // the silhouette that arrived to a full queue and left

const GUEST = { w: 22, h: 38 };         // the roster figure, same box in a lounge slot and at a desk
// The docket used to show the same drawing cut at the waist on a plate the layout drew itself. The
// card blank cuts a 32x40 well instead, which is two rows taller than a soul, so the docket shows
// the whole person and the crop is gone. The row map the crop was measured against - hair 0-7,
// face 8-14, torso 15-26, legs 27-34, shoes 35-37 - is still what the desk cut below uses.
// At a desk the same figure is cut higher and stands behind the furniture. A cubicle is 36 px tall
// against a 38 px soul, so a full-length figure had nowhere to go but over the desk's top edge -
// which is where the processing bar lives, the one part of a desk that carries information.
//
// The three numbers are read off the desk sprite rather than chosen. It leaves a well open over
// columns 14-37 and closes it again with the front of the desk at row 30, so a 22 px figure is
// centred in the well at column 15, dropped four rows to clear the strip light at the top, and cut
// at 26 - which puts the cut on row 30 exactly, behind the desk front, where it is never seen.
const DESK_BUST_ROWS = 26;
const DESK_BUST_DROP = 4;
const DESK_BUST_X = 15;
const QUEUE_FIGURE = { w: 10, h: 14, gap: 2 };

// --- Production and feedback (GDD 4, 5.5, 10) ---------------------------------
const AURA_PER_G = 0.4;           // Aura per second per point of Gullibility, upstairs only
const CREDITS_PER_CUBICLE = 1.5;  // Credits per second from one soul in operations
const DENY_COST = 4;              // Credits burned turning a soul away, clamped at zero

const SNAP_TIME = 1.5;            // decide faster than this and the soul is worth more, forever
const SNAP_BONUS = 1.1;
const SNAP_FROM_DAY = 2;          // day 1 is for reading the card, punishing that would be unfair
const SNAP_FLASH = 0.9;           // how long the bonus announces itself

const POPUP_EVERY = 2;            // production is banked this long, then floats up as one number
const POPUP_LIFE = 0.8;
const POPUP_LIFE_LONG = 2;        // for the few events the player must not blink past
const POPUP_RISE = 18;
const MAX_POPUPS = 24;            // a hard cap: 14 producers on a bad frame must not become a wall

// --- The contract (GDD 6) -----------------------------------------------------
const CONTRACT_TIME = 90;         // seconds a checked-in guest keeps producing (100 years, in-fiction)
const CONTRACT_WARN = 10;         // the ring pulses red for this long before it runs out
const CONTRACT_PULSE = 1.5;       // Hz
// Operations is a pipeline, not a landfill. A soul at a desk is filed away after this and the desk
// comes back: with a permanent sink the basement fills by day 3 and every expiry after that has
// nowhere to go, which the balance runs at step 9 showed turns the back half of a session into a
// queue of riots no coefficient can price.
const DESK_TIME = 85;             // seconds a soul spends at a desk before it is processed and gone
const RIOT_DELAY = 16;            // an expired guest with nowhere to go riots after this
const RIOT_BLINK = 3;             // Hz the halo of a rioting guest flashes at - it used to be the
                                  // figure itself, which a roster of thirteen people cannot do
const PANIC_TIME = 5;             // neighbours of a riot produce less for this long
const PANIC_FACTOR = 0.5;
const ELEVATOR_TIME = 0.8;        // the service lift down to operations
const NUDGE_TIME = 0.25;          // a tap on a guest who is not expired: busy, nothing happens
// The contract timer is a halo, not a ring around the body (GDD 6.1a): lifted clear of the figure,
// because gold ring over gold figure was the one timer on screen that had to be looked for, and
// legibility is the floor this project does not go below.
//
// It hangs off the SLOT rather than off the head. Eight pixels over a guest's hair put a row of
// halos at a row of different heights the moment anything moved, and the thing being read across
// the whole lounge is a row of timers - so it is pinned to the one line every slot shares, just
// clear of the dashed frame, and the guest can shake underneath it.
//
// The halo is now a DRAWING, not a computed ellipse: a 14x10 grid of pixels transcribed from a
// reference, in four tones, kept in HALO_GRID next to the code that walks it. Everything the
// previous version derived - the flattening, the three-pixel thickness, the shading across the
// band - was an attempt to compute what a drawing states outright, and the attempt cost a wedge at
// the ends the distance formula had to be written to correct. What the grid buys on top of that is
// the shading a formula could not reach at all: the light on this ring lies along the top of the
// far side and along the front of the near one, which is a ring seen at an angle rather than a
// flattened band, and no function of the distance to an ellipse produces it.
//
// It is 25 px of ink across a 40 px slot, in a 27x11 grid with a clear column down each side, and
// 11 rows tall against the old band's 15. The arc is 119 pixels instead of about 200, so a point
// is ~0.8% of a contract rather than 0.5%. What it costs is the marker: the hole down the middle
// is six rows, the `?` glyph is seven and takes nine with an outline, so the font version does not
// fit inside the drawing at any lift (see renderContracts).
//

// ==========================================================================
// 03_font.js
// ==========================================================================

// Bitmap text renderer. Reads FONT / FONT_W / FONT_H / FONT_X / FONT_BASE from the glyph table.
// No canvas font API is used anywhere in the game: at a 216 px buffer a vector font antialiases
// into grey mush and the integer upscale turns that mush into fringing.

// x is the left edge, y is the TOP row of the glyph box (a line occupies FONT_H rows downward).
// px is the pixel size: 1 for body text, 2 for headings. Returns the advanced width.
function drawText(ctx, text, x, y, color, px) {
  px = px || 1;
  ctx.fillStyle = color;
  let cx = x;
  for (const ch of text) {
    const g = FONT[ch] || FONT['?'];
    for (let r = 0; r < FONT_H; r++) {
      const bits = g[r + 1];
      if (!bits) continue;
      for (let c = 0; c < FONT_W; c++) {
        if (bits & (1 << (FONT_W - 1 - c))) ctx.fillRect(cx + (c + FONT_X) * px, y + r * px, px, px);
      }
    }
    cx += g[0] * px;
  }
  return cx - x;
}

// Advances are proportional, so every fixed-position string has to be measured, not counted.
function textWidth(text, px) {
  px = px || 1;
  let w = 0;
  for (const ch of text) w += (FONT[ch] || FONT['?'])[0] * px;
  return w;
}

function drawTextCentered(ctx, text, cx, y, color, px) {
  const x = Math.round(cx - textWidth(text, px) / 2);
  return drawText(ctx, text, x, y, color, px);
}

function drawTextRight(ctx, text, right, y, color, px) {
  return drawText(ctx, text, Math.round(right - textWidth(text, px)), y, color, px);
}

// Greedy word wrap. Returns an array of lines that each fit inside maxWidth.
function wrapText(text, maxWidth, px) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const candidate = line ? line + ' ' + w : w;
    if (line && textWidth(candidate, px) > maxWidth) {
      lines.push(line);
      line = w;
    } else {
      line = candidate;
    }
  }
  if (line) lines.push(line);
  return lines;
}

// ==========================================================================
// 04_util.js
// ==========================================================================

// Small helpers shared by every module. No game rules live here.

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOut(t) { return 1 - (1 - t) * (1 - t); }

// One seeded generator for the whole game so a balance run can be replayed exactly.
let rngState = (RNG_SEED || (Date.now() & 0x7fffffff)) >>> 0;   // seeded from the clock unless RNG_SEED is set
function rng() {
  rngState = (rngState + 0x6d2b79f5) >>> 0;
  let t = rngState;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rngInt(n) { return Math.floor(rng() * n); }
function rngRange(lo, hi) { return lo + rng() * (hi - lo); }
function pick(arr) { return arr[rngInt(arr.length)]; }

// Weighted pick over objects carrying a numeric `weight` field.
function pickWeighted(items, weightOf) {
  let total = 0;
  for (const it of items) total += weightOf(it);
  let r = rng() * total;
  for (const it of items) {
    r -= weightOf(it);
    if (r <= 0) return it;
  }
  return items[items.length - 1];
}

function fillRect(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function strokeRect(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  ctx.fillRect(x, y, w, 1);
  ctx.fillRect(x, y + h - 1, w, 1);
  ctx.fillRect(x, y + 1, 1, h - 2);
  ctx.fillRect(x + w - 1, y + 1, 1, h - 2);
}

// Dashed outline for an empty slot. `phase` shifts the dashes so the caller can animate them.
function dashedRect(ctx, x, y, w, h, color, dash, gap, phase) {
  ctx.fillStyle = color;
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  const step = dash + gap;
  phase = ((phase || 0) % step + step) % step;
  for (let i = -phase; i < w; i += step) {
    const a = Math.max(i, 0), b = Math.min(i + dash, w);
    if (b > a) { ctx.fillRect(x + a, y, b - a, 1); ctx.fillRect(x + a, y + h - 1, b - a, 1); }
  }
  for (let i = -phase; i < h; i += step) {
    const a = Math.max(i, 0), b = Math.min(i + dash, h);
    if (b > a) { ctx.fillRect(x, y + a, 1, b - a); ctx.fillRect(x + w - 1, y + a, 1, b - a); }
  }
}

// Seconds to M:SS for the day timer.
function formatTime(seconds) {
  const s = Math.max(0, Math.ceil(seconds));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function pointInRect(px, py, r) {
  return px >= r.x && px < r.x + r.w && py >= r.y && py < r.y + r.h;
}

// Grows a rect to the minimum comfortable touch target, keeping it centred.
function hitRect(r) {
  const w = Math.max(r.w, HIT_MIN), h = Math.max(r.h, HIT_MIN);
  return { x: r.x + (r.w - w) / 2, y: r.y + (r.h - h) / 2, w: w, h: h };
}

// ==========================================================================
// 05_display.js
// ==========================================================================

// Canvas sizing and zone layout. Scale is computed in PHYSICAL pixels (CSS x devicePixelRatio),
// which is what keeps the pixel grid exact on high-DPI phones; the CSS size may be fractional.
// All drawing happens in virtual pixels through a scale transform, so no module ever sees `scale`.

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false });

const Display = {
  scale: 1,
  viewW: VIEW_W,
  viewH: VIEW_H_MIN,
  zones: null,        // { hud, heaven, ground, ops, work }, each { y, h }
  cssScale: 1,        // CSS px per virtual px, used to convert pointer coordinates
  landscape: false,   // true while the device is held sideways, see landscapeBlocked()
  noticeScale: 2      // pixel size of the rotate notice, which has its own layout
};

// Horizontal scroll of each floor (GDD 3.1). `scroll` is the strip's own offset in virtual px:
// 0 is its left end, negative means scrolled towards the right end. `from/to/t` carry a chevron
// autoscroll, the only thing that ever moves a strip without a finger on it. The cloud reads the
// heaven value too, because the slots are set into it and the two cannot come apart.
const Strip = {
  heaven: { scroll: 0, from: 0, to: 0, t: 1 },
  ops:    { scroll: 0, from: 0, to: 0, t: 1 }
};

// Orientation cannot be locked from a web page: screen.orientation.lock() only works in
// fullscreen and does not exist on iOS, and a manifest orientation only applies to an installed
// app. So a sideways device gets a notice and a paused game instead. The check is deliberately
// narrower than "wider than tall": a desktop browser window is nearly always wider than tall and
// plays perfectly well, so the coarse-pointer test keeps the notice on touch devices only.
function landscapeBlocked() {
  const coarse = window.matchMedia ? window.matchMedia('(pointer: coarse)').matches : false;
  return coarse && window.innerWidth > window.innerHeight;
}

function resizeDisplay() {
  const dpr = window.devicePixelRatio || 1;
  const cssW = window.innerWidth;
  const cssH = window.innerHeight;
  const physW = cssW * dpr;
  const physH = cssH * dpr;

  Display.landscape = landscapeBlocked();
  if (Display.landscape) {
    // The notice fills the whole viewport: drawn inside the small portrait canvas it would be
    // exactly as unreadable as the problem it is reporting.
    canvas.width = Math.round(physW);
    canvas.height = Math.round(physH);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    Display.noticeScale = Math.max(2, Math.floor(Math.min(physW / NOTICE_W, physH / NOTICE_H)));
    ctx.imageSmoothingEnabled = false;
    return;
  }

  let scale = Math.max(1, Math.floor(Math.min(physW / VIEW_W, physH / VIEW_H_MIN)));

  // Crop tolerance (GDD 1.2): if the next integer scale overflows the width by no more than
  // 2.5% and still leaves a legal view height, take it and let a few physical pixels fall off
  // the sides. This is what fills the screen on the tallest phones.
  const next = scale + 1;
  if (VIEW_W * next <= physW * CROP_TOLERANCE && Math.floor(physH / next) >= VIEW_H_MIN) scale = next;

  const viewH = clamp(Math.floor(physH / scale), VIEW_H_MIN, VIEW_H_MAX);

  Display.scale = scale;
  Display.viewH = viewH;
  Display.zones = computeZones(viewH);

  canvas.width = VIEW_W * scale;
  canvas.height = viewH * scale;
  canvas.style.width = (VIEW_W * scale / dpr) + 'px';
  canvas.style.height = (viewH * scale / dpr) + 'px';
  Display.cssScale = (VIEW_W * scale / dpr) / VIEW_W;

  ctx.imageSmoothingEnabled = false;
}

// Zone heights are authored for the 384 px view; a taller view hands the extra rows out by weight.
function computeZones(viewH) {
  const extra = viewH - VIEW_H_MIN;
  let growTotal = 0;
  for (const k in ZONE_GROW) growTotal += ZONE_GROW[k];

  const order = ['hud', 'heaven', 'ground', 'ops', 'work'];
  const h = {};
  let used = 0;
  for (const k of order) {
    h[k] = ZONE_BASE[k] + Math.floor(extra * ZONE_GROW[k] / growTotal);
    used += h[k];
  }
  h.work += viewH - used;          // the work zone absorbs the rounding remainder

  const zones = {};
  let y = 0;
  for (const k of order) {
    zones[k] = { y: y, h: h[k] };
    y += h[k];
  }
  return zones;
}

// --- Slot geometry ------------------------------------------------------------
// A floor is a horizontal strip of slots. Everything below takes the floor by name rather than by
// its arrays and sizes, because every call site used to fetch the same two counts before it could
// ask for a rectangle, and half the scroll bugs available were in that repetition.

function stripSlots(kind) { return kind === 'heaven' ? state.heavenSlots : state.cubicles; }
function stripSize(kind) { return kind === 'heaven' ? HEAVEN_SLOT : CUBICLE; }

// Everything drawn on a floor: the unlocked slots plus the next locked one, which is always shown
// as an invitation to buy and to scroll (GDD 3.1).
function stripWidth(kind) {
  const s = stripSize(kind);
  const n = visibleSlotCount(stripSlots(kind));
  return n * s.w + (n - 1) * s.gap;
}

// Where slot 0 sits before scrolling: the row is centred while it fits on screen and pinned to the
// edge margin once it does not. At four lounge slots the last one already overhangs by two pixels
// with the locked teaser fully outside - that overhang is the cue that the floor is a strip.
function stripOrigin(kind) {
  const full = stripWidth(kind);
  return full <= VIEW_W ? Math.floor((VIEW_W - full) / 2) : EDGE_MARGIN;
}

// The far end of the strip stops at the same margin the near end starts from. A floor that fits
// gets a range of zero, which is what makes it undraggable without a separate flag.
function stripMinScroll(kind) {
  return Math.min(0, VIEW_W - EDGE_MARGIN * 2 - stripWidth(kind));
}

function slotX(kind, i) {
  const s = stripSize(kind);
  return stripOrigin(kind) + Math.round(Strip[kind].scroll) + i * (s.w + s.gap);
}

// Guests stand ON the lounge floor, so the slot row is anchored to the ground line, not centred
// in its zone: the sky fills whatever space is left above it.
function heavenSlotRect(i) {
  return {
    x: slotX('heaven', i),
    y: Display.zones.ground.y - HEAVEN_SLOT.h,
    w: HEAVEN_SLOT.w,
    h: HEAVEN_SLOT.h
  };
}

function cubicleRect(i) {
  const z = Display.zones.ops;
  return {
    x: slotX('ops', i),
    y: z.y + z.h - OPS_FLOOR_H - CUBICLE.h,
    w: CUBICLE.w,
    h: CUBICLE.h
  };
}

function cardRect() {
  const z = Display.zones.work;
  return {
    x: Math.floor((VIEW_W - CARD.w) / 2),
    y: z.y + Math.floor((z.h - CARD.h) / 2) - 6,
    w: CARD.w,
    h: CARD.h
  };
}

// ==========================================================================
// 06_input.js
// ==========================================================================

// Pointer handling. Raw events only translate screen coordinates into virtual pixels and classify
// the gesture; nothing here knows about game rules. Recognised gestures are queued and drained by
// the fixed-step update, so input is processed at the same rate as the simulation.

const Input = {
  gestures: [],                  // { type: 'tap'|'swipe', x, y, dir }
  drag: { active: false, startX: 0, startY: 0, x: 0, y: 0, dx: 0, dy: 0, time: 0 },
  pointerId: null
};

function toVirtualX(clientX) {
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) / (rect.width / VIEW_W);
}
function toVirtualY(clientY) {
  const rect = canvas.getBoundingClientRect();
  return (clientY - rect.top) / (rect.height / Display.viewH);
}

function onPointerDown(e) {
  // Before anything else, and outside the multitouch guard: this is the only code in the game
  // that runs inside a real gesture handler, and the AudioContext can be created nowhere else
  // (see unlockAudio in 07_audio.js). A second finger is still a gesture.
  unlockAudio();
  if (Input.pointerId !== null) return;          // single touch only, no multitouch anywhere
  Input.pointerId = e.pointerId;
  canvas.setPointerCapture(e.pointerId);
  const x = toVirtualX(e.clientX), y = toVirtualY(e.clientY);
  const d = Input.drag;
  d.active = true;
  d.startX = d.x = x;
  d.startY = d.y = y;
  d.dx = d.dy = 0;
  d.time = 0;
  e.preventDefault();
}

function onPointerMove(e) {
  if (e.pointerId !== Input.pointerId) return;
  const d = Input.drag;
  d.x = toVirtualX(e.clientX);
  d.y = toVirtualY(e.clientY);
  d.dx = d.x - d.startX;
  d.dy = d.y - d.startY;
  e.preventDefault();
}

function onPointerUp(e) {
  if (e.pointerId !== Input.pointerId) return;
  const d = Input.drag;
  d.x = toVirtualX(e.clientX);
  d.y = toVirtualY(e.clientY);
  d.dx = d.x - d.startX;
  d.dy = d.y - d.startY;

  const adx = Math.abs(d.dx), ady = Math.abs(d.dy);
  const dist = Math.max(adx, ady);
  if (dist >= SWIPE_THRESHOLD) {
    const dir = adx > ady ? (d.dx > 0 ? 'right' : 'left') : (d.dy > 0 ? 'down' : 'up');
    Input.gestures.push({ type: 'swipe', dir: dir, x: d.startX, y: d.startY });
  } else if (dist <= TAP_SLOP) {
    Input.gestures.push({ type: 'tap', x: d.x, y: d.y });
  }
  // Anything in between is a cancelled drag: the card springs back, nothing is queued.

  d.active = false;
  Input.pointerId = null;
  e.preventDefault();
}

function onPointerCancel(e) {
  if (e.pointerId !== Input.pointerId) return;
  Input.drag.active = false;
  Input.pointerId = null;
}

function initInput() {
  canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  canvas.addEventListener('pointermove', onPointerMove, { passive: false });
  canvas.addEventListener('pointerup', onPointerUp, { passive: false });
  canvas.addEventListener('pointercancel', onPointerCancel, { passive: false });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}

// Helper for screen code: was this tap inside a button rect (grown to a comfortable target)?
function tapHit(g, rect) {
  return g.type === 'tap' && pointInRect(g.x, g.y, hitRect(rect));
}

// ==========================================================================
// 07_audio.js
// ==========================================================================

// The audio layer (GDD 1.5). The game speaks its own event names - `checkIn`, `refused`, `riot` -
// and this file is the only place that knows they are cues in the engine (98_audio_engine.js).
// That is why `sfx()` was written as a stub at step 1 and left alone for ten steps: every call
// site was already in its final form, so switching the sound on is one translation table and no
// edits to the game.

// The engine shipped fifteen cues to start with, and seven of our events had no cue that meant
// them - `processed`, `expire`, `scroll`, `shop`, `suspicion`, `relief` and `lose`. They stayed
// silent rather than borrowing one that meant something else: `arrive` already plays the soul cue,
// so a desk discharge playing it too would have announced an arrival at the moment of a departure.
// The sound pass wrote the seven, so the table is one to one now and nothing here is silent.
const SFX_MAP = {
  checkIn:    'checkin',
  reassign:   'reassign',
  deny:       'deny',
  elevator:   'elevator',
  buy:        'purchase',
  snap:       'snap',
  arrive:     'soul',
  goodPerson: 'goodPerson',
  start:      'dayStart',
  dayEnd:     'quotaMet',
  quotaMiss:  'quotaFail',
  riot:       'riot',
  processed:  'processed',
  expire:     'expire',
  scroll:     'scroll',
  shop:       'shop',
  suspicion:  'suspicion',
  relief:     'relief',
  lose:       'lose',
  // Three different ways of being told no, and one sound for all three: a swipe onto a full
  // floor, a purchase that cannot be made, and a tap on a guest who is not going anywhere.
  refused:    'nofunds',
  turnAway:   'nofunds',
  busy:       'nofunds'
};

let audioReady = false;
let audioTier = 0;          // which Suspicion thresholds have already announced themselves

// The mute toggle (GDD 1.5). Deliberately not part of `state`: PLAY AGAIN resets the run, not the
// fact that the player is sitting in an open office. Nothing is persisted either - there is no
// localStorage anywhere in this build, and a session is one sitting.
//
// It moves the engine's master gain, so effects go quiet with the music. Half a mute - a silent
// soundtrack still punctuated by stamps and riots - is not what anyone means by the button.
let soundOn = true;

function soundEnabled() { return soundOn; }

function toggleSound() {
  soundOn = !soundOn;
  if (audioReady) WTHAudio.volume(soundOn ? MUSIC_VOLUME : 0);
}

// The browser will not create an AudioContext outside a real user gesture, and our own input
// layer is no help: it queues gestures and drains them inside the fixed-step update, which runs
// from requestAnimationFrame. Chrome would forgive that - its activation flag is sticky for the
// page - but iOS Safari wants the call inside the handler itself. So the unlock hangs off the raw
// pointerdown in 06_input.js and off nothing else.
function unlockAudio() {
  if (audioReady) return;
  audioReady = true;
  WTHAudio.init();
  // Muted before the context existed is still muted: the toggle can be pressed on the title screen,
  // where the first tap creates the context and this runs immediately afterwards.
  WTHAudio.volume(soundOn ? MUSIC_VOLUME : 0);
  WTHAudio.quality(AUDIO_QUALITY);
  WTHAudio.sfxSource(SFX_SOURCE);
  // Only fetched if it is going to be played. A build set to 'synth' never asks for the file at
  // all, which is the point of that being the default: no download, no decode, and none of the
  // tens of megabytes a three-minute stereo buffer occupies once it is resident. Asked for here
  // rather than later because the decode needs a context, and this is the tap that made one.
  // Nothing waits on it: cues stay synthesised until it lands, and if it never lands, for ever.
  if (SFX_SOURCE === 'sample') WTHAudio.bank(SFX_BANK);
}

// One continuous piece of music from the first day to the end of the run: the days, the end-of-day
// plate and the shop are all inside it, and only the two ending themes stop it - which they do
// themselves. Started from CLOCK IN, which happens once per run.
function startMusic() {
  unlockAudio();
  WTHAudio.play();
}

function sfx(name) {
  if (!audioReady) return;
  const cue = SFX_MAP[name];
  if (cue) WTHAudio.sfx(cue);
}

// The engine wants the meter whenever it moves and says every frame is fine: the crossfade between
// its three mixes is its own smoothing. The two tier crossings get a sting on the way up only -
// going back down is relief, and relief that announces itself is just another alarm.
function audioSuspicion(v) {
  if (!audioReady) return;
  WTHAudio.setSuspicion(v);
  const tier = v >= SUSP_ALARM ? 2 : (v >= SUSP_AMBER ? 1 : 0);
  if (tier > audioTier) WTHAudio.sfx(tier === 2 ? 'susp75' : 'susp40');
  audioTier = tier;
}

// 'victory' or 'defeat'. Each stops the loop on its own, so there is nothing to stop here.
function audioTheme(which) {
  if (!audioReady) return;
  WTHAudio.theme(which);
}

// PLAY AGAIN: the meter starts at zero again, so the crossings have to be allowed to fire again.
// The loop itself is restarted by the next CLOCK IN, and `play()` clears any ending theme.
function resetAudio() {
  audioTier = 0;
}

// ==========================================================================
// 08_data.js
// ==========================================================================

// All player-facing text and content tables. Kept apart from logic so a wording pass never
// touches game code. Archetypes, deny stamps and shop entries join this file at steps 2, 6 and 8.

// Souls (GDD 5.2). g = Gullibility (Aura output), s = Sanctity (Suspicion risk), both 0-5.
// `weight` is the relative chance of drawing this archetype; `fromDay` withholds one until the
// session has taught the player what the stats mean. Invented job titles only - no real people.
//
// Thirteen, because the art pack is a roster of thirteen and an archetype without a drawing is a
// gap on the docket. The Hospice Nurse went (nothing was drawn for her) and the Contract Ninja
// took her place in the table: worth nothing upstairs and expensive to keep there, which is the
// shape the pool needs at that end. `tools/check.mjs` fails the build if a name here has no
// sprite, so the two lists cannot drift apart quietly.
//
// The three new stat lines are not free invention - they are solved. Changing the dictionary moves
// the whole game, because every soul in a session is drawn from it: the first attempt raised the
// weighted average Gullibility by 6% and dropped the average Sanctity by 6%, and the balanced style
// went from 56% wins to 71%. These three are set so the pool's weighted averages land back on the
// old ones, 2.50 Gullibility and 1.50 Sanctity, to two decimal places.
const ARCHETYPES = [

  // The shift associate (GDD 9.3): who is on shift, which three are on the table tonight, and one
  // line reporting what last night's settlement did about the wage. One slot, and that is the whole
  // of the roster - the modifiers read off `hired` where they apply, like everything else here.
  staff: { hired: null, offer: [], note: '', desk: -1 },

  // The night contract (GDD 8.3): the deck it is drawn from, the card on the table, and what the
  // last answer did to the coming day. `pact` is cleared when the next card is dealt, not at the
  // start of a day - the shop sits between the two, and the discount has to survive it.
  night: { deck: [], card: null, in: 0, choice: -1, flash: 0 },
  pact: neutralPact(),

  auditTime: 0,         // the collapse before a loss counts down here
  endTime: 0,           // seconds the ending screen has been up, so the last word can be spoken
  loseReason: 'audit',  // which of LOSE_TEXT the lose screen shows

  // The onboarding beats (GDD 8.4): which have already been said, which are waiting their turn, and
  // the one on screen. In here rather than in a module of its own so PLAY AGAIN teaches from
  // scratch - a second judge on the same tab must get the same first run as the first one.
  tutorial: { seen: {}, queue: [], id: null, line: null, hold: false, t: 0, life: TUTORIAL_LIFE },

  // `denied`, `toOps` and `suspPeak` exist for the verdict on the ending screen (GDD 11) and for
  // nothing else: the title is read off how the run was played, so the run has to have been counted.
  stats: { soulsProcessed: 0, auraTotal: 0, creditsTotal: 0, daysSurvived: 0, riots: 0, processed: 0,
           denied: 0, toOps: 0, suspPeak: 0, turnedAway: 0, completed: 0 }
};

function makeSlots(total, unlocked) {
  const arr = [];
  for (let i = 0; i < total; i++) arr.push({ unlocked: i < unlocked, guest: null });
  return arr;
}

function resetGame() {
  state.screen = SCREEN.BOOT;
  state.day = 1;
  state.dayTime = 0;
  state.dayLen = 0;
  state.dayHold = false;
  state.plateTime = 0;

  state.aura = START.aura;
  state.credits = START.credits;
  state.suspicion = START.suspicion;
  state.reputation = START.reputation;
  state.buzz = buzzTarget();

  state.heavenSlots = makeSlots(MAX_HEAVEN_SLOTS, START.heavenSlots);
  state.cubicles = makeSlots(MAX_CUBICLES, START.cubicles);

  state.queue.length = 0;
  state.card = null;
  state.arrivalTimer = 0;
  state.flyers.length = 0;
  state.fullFlash.heaven = 0;
  state.fullFlash.ops = 0;
  state.turnAway = 0;
  state.popups.length = 0;
  state.snapFlash = 0;

  state.notes.length = 0;
  state.noteTimer = 0;
  state.suspFlash = 0;
  state.suspPop.n = 0;
  state.suspPop.t = 0;

  state.upgrades = {};
  state.supplies = [];
  for (let i = 0; i < SUPPLY_SLOTS; i++) state.supplies.push(null);
  state.active.id = null;
  state.active.t = 0;
  state.active.dur = 0;
  state.active.arm = false;
  state.quotaMisses = 0;
  state.dayResult = { quota: 0, aura: 0, state: 'met' };
  state.shopIn = 0;
  state.shopPage = 0;
  state.shopFlash.index = -1;
  state.shopFlash.t = 0;
  state.shopFlash.ok = false;

  state.staff.hired = null;
  state.staff.offer.length = 0;
  state.staff.note = '';
  state.staff.desk = -1;

  state.night.deck.length = 0;
  state.night.card = null;
  state.night.in = 0;
  state.night.choice = -1;
  state.night.flash = 0;
  state.pact = neutralPact();

  state.auditTime = 0;
  state.endTime = 0;
  state.loseReason = 'audit';
  state.tutorial.seen = {};
  state.tutorial.queue.length = 0;
  state.tutorial.id = null;
  state.tutorial.line = null;
  state.tutorial.hold = false;
  state.tutorial.t = 0;
  state.tutorial.life = TUTORIAL_LIFE;
  resetStrips();
  resetFx();
  resetAudio();

  state.stats = { soulsProcessed: 0, auraTotal: 0, creditsTotal: 0, daysSurvived: 0, riots: 0, processed: 0,
                  denied: 0, toOps: 0, suspPeak: 0, turnedAway: 0, completed: 0 };
}

// The deck is shuffled on the first night rather than in resetGame, and that is not tidiness: the
// balance harness seeds the generator AFTER resetting the game, so a shuffle done during the reset
// would be drawn from whatever state the previous run left behind and the seed would not reproduce
// the run. Dealt from the top, so no contract is offered twice in one session - eleven cards
// against seven nights is thin enough that a repeat would be noticed.
function shufflePactDeck() {
  const deck = state.night.deck;
  deck.length = 0;
  for (const p of PACTS) deck.push(p.id);
  for (let i = deck.length - 1; i > 0; i--) {
    const j = rngInt(i + 1);
    const t = deck[i]; deck[i] = deck[j]; deck[j] = t;
  }
}

// How many slots are currently visible on a floor: the unlocked ones plus the next locked one,
// which is always shown as an invitation to buy (GDD 3.1).
function unlockedSlotCount(slots) {
  let n = 0;
  for (const s of slots) if (s.unlocked) n++;
  return n;
}

function visibleSlotCount(slots) {
  return Math.min(slots.length, unlockedSlotCount(slots) + 1);
}

function dayConfig(day) {
  return DAYS[clamp(day, 1, LAST_DAY) - 1];
}

// ==========================================================================
// 10_souls.js
// ==========================================================================

// Arrivals, the queue, the soul card and the three sorting swipes (GDD 5). Build step 2.
// This module owns the primary action of the game: every soul that arrives leaves through one of
// exactly three gestures. Resource effects are deliberately absent - the swipes place souls and
// nothing else until step 3 turns Aura and Credits on.

// --- Arrivals -----------------------------------------------------------------

// Weighted draw over the archetype dictionary. Two rules bend the weights: the rarest archetype
// is withheld until the player has learned to read the stats, and from the late days onward the
// dangerous souls (Sanctity 4+) get twice their weight, which is what makes the late days feel
// different without adding a single new mechanic.
function pickArchetype(day) {
  const pool = [];
  for (const a of ARCHETYPES) if (!a.fromDay || day >= a.fromDay) pool.push(a);
  return pickWeighted(pool, function (a) {
    return (day >= LATE_DAY && a.s >= 4) ? a.weight * 2 : a.weight;
  });
}

// A soul is a flat copy of its archetype, never a reference: from step 3 a soul carries per-soul
// modifiers (the snap bonus) and must not write them back into the dictionary.
function makeSoul(day) {
  const a = pickArchetype(day);
  return { name: a.name, g: a.g, s: a.s, glow: !!a.glow };
}

function arriveSoul() {
  // A full queue turns the arrival away at the door (GDD 5.4), and a soul sent back from the gates
  // of paradise tells people. Cheap per head, but it is a leak that only opens when the player has
  // already lost control of the floor, which is when it is hardest to pay.
  if (state.queue.length >= QUEUE_MAX) {
    state.turnAway = TURN_AWAY_FLASH;
    sfx('turnAway');
    // The Complaints Box (GDD 8.3) takes the talking out of it: they still leave, and the slot is
    // still lost, but nobody upstairs hears about it. Reputation is charged either way - the box
    // stops Head Office hearing about it, not the queue outside (GDD 4.1).
    state.stats.turnedAway++;
    addReputation(-REP_TURN_AWAY);
    if (!state.pact.noOverflow) addSuspicion(SUSP_TURN_AWAY);
    return;
  }
  // The Intern loses one now and then (GDD 9.3), and it happens at the door: a soul the player had
  // already seen standing in the queue vanishing would read as a bug rather than as an Intern.
  if (staffDropsArrival()) return;
  const soul = makeSoul(state.day);
  state.queue.push(soul);
  // The Genuinely Good Person gets announced. It is the rarest archetype in the game and the one
  // whose arrival is a decision rather than a card, so it is worth hearing before it is read.
  sfx(soul.glow ? 'goodPerson' : 'arrive');
}

// --- The card -----------------------------------------------------------------

function takeNextCard() {
  if (state.card || !state.queue.length) return;
  state.card = {
    soul: state.queue.shift(),
    in: 0,            // 0 to 1 while the card rises into the work zone
    age: 0,           // seconds since it finished arriving; the snap bonus reads this at step 3
    ox: 0, oy: 0,     // where the card is drawn relative to its rest position
    dragging: false,
    springX: 0, springY: 0, springT: 0
  };
}

// The whole work zone is the swipe field, not just the card: at 196x72 in a 216 px view there is
// no room to demand precision, and a swipe that starts an inch below the card is the same intent.
function workZoneRect() {
  const z = Display.zones.work;
  return { x: 0, y: z.y, w: VIEW_W, h: z.h };
}

function cardIsLive() {
  return state.screen === SCREEN.DAY_ACTIVE && state.card !== null;
}

// True while the player is dragging the card itself, which is what the renderer needs in order to
// follow the finger. The test is on where the drag STARTED, so a swipe stays owned by the card
// even after the finger has left the work zone.
function draggingCard() {
  return cardIsLive() && Input.drag.active &&
         pointInRect(Input.drag.startX, Input.drag.startY, workZoneRect());
}

// Which way a live drag is currently leaning, or null below the threshold. The renderer lights up
// the matching hint and target zone from this - the player sees the verdict before releasing.
function dragDirection() {
  if (!draggingCard() || state.card.in < 1) return null;
  const dx = Input.drag.dx, dy = Input.drag.dy;
  const adx = Math.abs(dx), ady = Math.abs(dy);
  if (Math.max(adx, ady) < SWIPE_THRESHOLD) return null;
  if (adx > ady) return dx > 0 ? 'right' : 'left';
  return dy > 0 ? 'down' : 'up';
}

// --- Placement ----------------------------------------------------------------

// A slot shut for maintenance (the Renovation contract, GDD 8.3) is unlocked and still owned, it
// just cannot be filled today. Checked here and in freeSlotCount, which between them are every
// place in the game that asks whether there is room.
function firstFreeSlot(slots) {
  for (let i = 0; i < slots.length; i++) {
    if (slots[i].unlocked && !slots[i].maint && !slots[i].guest) return i;
  }
  return -1;
}

// Past the limit the offset grows at a fraction of the finger movement, so the card never leaves
// the work zone but the gesture still reads as continuous.
function damp(v, limit) {
  const a = Math.abs(v);
  if (a <= limit) return v;
  return (v < 0 ? -1 : 1) * (limit + (a - limit) * 0.2);
}

// A card that has been dealt with flies to where it ended up. The flyer is a copy rather than the
// card itself, so the next soul can be dealt with immediately: at a 1.1 s arrival interval a 0.4 s
// animation sitting in the input path would cap throughput below the arrival rate on its own.
function addFlyer(to, color) {
  const from = cardRect();
  state.flyers.push({
    x0: from.x + state.card.ox, y0: from.y + state.card.oy, w0: from.w, h0: from.h,
    x1: to.x, y1: to.y, w1: to.w, h1: to.h,
    t: 0, dur: FLY_TIME, color: color
  });
}

// One guest record, wherever it is standing. The emit clock starts at a random phase so a row of
// guests does not fire its popups in lockstep, which reads as one flashing block rather than as
// several souls earning. The contract only counts for anything upstairs (GDD 6).
function newGuest(soul) {
  return {
    soul: soul,
    t: 0,
    acc: 0,
    emit: rngRange(0.4, POPUP_EVERY),
    contract: contractTime(),
    contractMax: contractTime(),
    desk: deskTime(),         // only counts down while this guest is at a desk downstairs
    deskMax: deskTime(),      // and the bar above the desk is read against the length it started with
    expired: false,
    riot: 0,
    lift: 0,
    panic: 0,
    nudge: 0
  };
}

function placeGuest(slots, index, soul) {
  slots[index].guest = newGuest(soul);
  state.stats.soulsProcessed++;
}

// Deciding fast is worth a permanent 10% on that soul (GDD 5.5). It is off on day 1: the first day
// is when the player is still reading the card, and charging for that would teach the wrong thing.
// Deny is neutral to it - there is nothing to be faster about when refusing.
function claimSnapBonus(soul) {
  if (state.day < SNAP_FROM_DAY || state.card.age > SNAP_TIME) return;
  soul.bonus = SNAP_BONUS;
  state.snapFlash = SNAP_FLASH;
  sfx('snap');
}

function refuse(zone) {
  const card = state.card;
  card.springX = card.ox;
  card.springY = card.oy;
  card.springT = CARD_SPRING;
  state.fullFlash[zone] = FULL_FLASH;
  addShake(2, 0.18);
  sfx('refused');
}

function springBack() {
  const card = state.card;
  card.springX = card.ox;
  card.springY = card.oy;
  card.springT = CARD_SPRING;
}

function checkIn() {
  const i = firstFreeSlot(state.heavenSlots);
  if (i < 0) { refuse('heaven'); return; }
  const soul = state.card.soul;
  claimSnapBonus(soul);
  addFlyer(heavenSlotRect(i), C.aura);
  placeGuest(state.heavenSlots, i, soul);
  state.card = null;
  // The stamp is cyan because CHECK IN is: the swipe hint, the action label, the popup and the
  // verdict are one colour from finger to slot, and the player never has to learn a second code.
  addStamp('APPROVED', C.aura);
  addShake(3, 0.1);
  haptic(HAPTIC.checkIn);
  sfx('checkIn');
}

function reassign() {
  const i = firstFreeSlot(state.cubicles);
  if (i < 0) { refuse('ops'); return; }
  const soul = state.card.soul;
  claimSnapBonus(soul);
  addFlyer(cubicleRect(i), C.monitor);
  placeGuest(state.cubicles, i, soul);
  state.stats.toOps++;
  state.card = null;
  // Grey: the basement is neither a reward nor a punishment, it is where the paperwork goes.
  addStamp('REASSIGNED', C.inkDim);
  addShake(3, 0.1);
  haptic(HAPTIC.reassign);
  sfx('reassign');
}

// Deny is the one action that is never refused - it is the pressure valve when both floors are
// full. It costs Credits, so the valve has a price and spamming it is not a strategy.
function deny() {
  const from = cardRect();
  addFlyer({ x: -CARD.w, y: from.y + 10, w: CARD.w, h: CARD.h }, C.suspicion);
  spendCredits(DENY_COST);
  // Turning one away at the door is the cheapest action in the game and now has a second price:
  // word gets back, and tomorrow's queue is shorter for it (GDD 4.1).
  addReputation(-REP_DENY);
  // At the top of the work zone, not just above the card: everything in the band right above the
  // card is already spoken for by the swipe hints, and a cost printed across one of them is noise.
  addPopup(VIEW_W / 2, Display.zones.work.y + 12, '-' + DENY_COST + ' ◈', C.suspicion);
  state.stats.soulsProcessed++;
  state.stats.denied++;
  state.card = null;
  addStamp(pick(DENY_STAMPS), C.suspicion);
  addShake(4, 0.12);
  haptic(HAPTIC.deny);
  sfx('deny');
}

function sortCard(dir) {
  // The first assigned swipe of day one starts the day (GDD 2). Right is not one of them: it is
  // the direction that means nothing, and a stray flick must not start the clock.
  if (dir !== 'right') state.dayHold = false;
  if (dir === 'up') checkIn();
  else if (dir === 'down') reassign();
  else if (dir === 'left') deny();
  else springBack();      // right is deliberately unassigned, so a stray flick costs nothing
}

// Called from the state machine when a swipe lands anywhere in the work zone.
function handleCardSwipe(dir) {
  if (!cardIsLive() || state.card.in < 1) return;
  sortCard(dir);
}

// --- Update -------------------------------------------------------------------

function updateArrivals(dt) {
  state.arrivalTimer -= dt;
  if (state.arrivalTimer <= 0) {
    arriveSoul();
    state.arrivalTimer = arrivalInterval();
  }
}

function updateCard(dt) {
  takeNextCard();
  const card = state.card;
  if (!card) return;

  if (card.in < 1) card.in = Math.min(1, card.in + dt / CARD_IN);
  else card.age += dt;

  // The card follows the finger, damped past CARD_DRAG_MAX; otherwise it is easing back from
  // wherever it was let go.
  const dragging = draggingCard();
  // A drag let go between the tap slop and the swipe threshold queues no gesture at all, so
  // nothing else would ever start its spring and the card would snap home in one frame.
  if (card.dragging && !dragging && card.springT <= 0) springBack();
  card.dragging = dragging;

  if (dragging) {
    card.springT = 0;
    card.ox = damp(Input.drag.dx, CARD_DRAG_MAX);
    card.oy = damp(Input.drag.dy, CARD_DRAG_MAX);
  } else if (card.springT > 0) {
    card.springT = Math.max(0, card.springT - dt);
    const k = card.springT / CARD_SPRING;
    card.ox = card.springX * k * k;
    card.oy = card.springY * k * k;
  } else {
    card.ox = 0;
    card.oy = 0;
  }
}

// Purely visual timers. They keep running while the end-of-day plate is up so an animation started
// on the last second of a day finishes instead of freezing mid-air.
function updateSoulFx(dt) {
  for (let i = state.flyers.length - 1; i >= 0; i--) {
    const f = state.flyers[i];
    f.t += dt / (f.dur || FLY_TIME);
    if (f.t >= 1) state.flyers.splice(i, 1);
  }
  if (state.turnAway > 0) state.turnAway = Math.max(0, state.turnAway - dt);
  for (const k in state.fullFlash) {
    if (state.fullFlash[k] > 0) state.fullFlash[k] = Math.max(0, state.fullFlash[k] - dt);
  }
  for (const s of state.heavenSlots) if (s.guest) s.guest.t += dt;
  for (const s of state.cubicles) if (s.guest) s.guest.t += dt;
  updatePopups(dt);
}

function updateSouls(dt) {
  updateArrivals(dt);
  updateCard(dt);
}

// ==========================================================================
// 11_floors.js
// ==========================================================================

// Guests, contract rings, expiry, the tap-to-relocate elevator and riots (GDD 6). Build step 4.
// This is the mechanism the whole game turns on: a checked-in soul stops being an asset on a
// timer, and the player has to have somewhere to put it before that happens.

function freeSlotCount(slots) {
  let n = 0;
  for (const s of slots) if (s.unlocked && !s.maint && !s.guest) n++;
  return n;
}

// The last stretch of a contract pulses, and an expired one is solid red. The player has to read
// "this one is about to go wrong" from across the screen without focusing on any single timer.
function contractState(guest) {
  if (guest.expired) return 'expired';
  if (guest.contract <= CONTRACT_WARN) return 'warning';
  return 'active';
}

// An expired guest produces nothing. That is the real cost of ignoring one - the Suspicion drip
// for leaving it up there joins at step 5.
function guestProduces(guest) {
  return !guest.expired;
}

function panicFactor(guest) {
  return guest.panic > 0 ? PANIC_FACTOR : 1;
}

// --- Relocation ---------------------------------------------------------------

// The service lift. The guest leaves the lounge slot at once and appears downstairs at once - the
// 0.8 s ride is a travelling outline, the same trick the filed card uses, because a second copy
// of the figure in transit reads as two souls rather than one moving.
function relocateGuest(heavenIndex) {
  const slot = state.heavenSlots[heavenIndex];
  const target = firstFreeSlot(state.cubicles);
  if (target < 0) return false;

  const from = heavenSlotRect(heavenIndex);
  const to = cubicleRect(target);
  state.flyers.push({
    x0: from.x, y0: from.y, w0: from.w, h0: from.h,
    x1: to.x, y1: to.y, w1: to.w, h1: to.h,
    t: 0, dur: ELEVATOR_TIME, color: C.ink
  });

  state.cubicles[target].guest = newGuest(slot.guest.soul);
  state.stats.toOps++;
  // A contract that ran its course and left without a scene is the one thing that builds
  // Reputation (GDD 4.1), and it is banked here rather than at the moment of expiry: a guest who
  // is still standing upstairs has not left quietly yet, and may not.
  if (slot.guest.expired) { state.stats.completed++; addReputation(REP_CONTRACT); }
  slot.guest = null;
  sfx('elevator');
  return true;
}

// A soul that has been processed leaves, and its desk comes back. This is the only thing that
// makes the basement a rate rather than a total: six desks that never empty can absorb six expiries
// in a whole session, and everything after that is a riot by arithmetic.
function dischargeGuest(index) {
  const r = cubicleRect(index);
  addPopup(r.x + r.w / 2, r.y - 2, 'PROCESSED', C.inkDim);
  state.cubicles[index].guest = null;
  state.stats.processed++;
  sfx('processed');
}

// A guest whose contract ran out with no desk free downstairs eventually walks off in disgust.
// The neighbours see it happen and slow down - the loss is never just the one slot.
function riot(index) {
  state.heavenSlots[index].guest = null;
  for (const j of [index - 1, index + 1]) {
    const n = state.heavenSlots[j];
    if (n && n.guest) n.guest.panic = PANIC_TIME;
  }
  state.stats.riots++;
  // The most expensive event in the game, and wave C made it more so: a slot, five points of the
  // meter, and the intake for the days after it.
  addReputation(-REP_RIOT);
  addShake(5, 0.25);
  haptic(HAPTIC.riot);
  // Over the slot that just emptied, not at the top of the zone: that band belongs to the waiting
  // queue, and it marks which slot the player just lost.
  const r = heavenSlotRect(index);
  addPopup(r.x + r.w / 2, r.y - 8, 'WALKED OUT', C.suspicion, POPUP_LIFE_LONG);
  sfx('riot');
  // Fired from here rather than from a condition: by the time a riot is visible in the state, the
  // guest that caused it has already gone (GDD 8.4).
  tutorialSay('riot');
  // By far the most expensive thing that can happen in a day, and the only one that costs a slot
  // and the meter at the same time.
  addSuspicion(SUSP_RIOT);
}

// --- The strip: scrolling and edge chevrons (GDD 3.1) -------------------------
// Slots grow sideways, so from the first purchase onwards a floor is wider than the screen and
// part of it is out of sight. That is only acceptable because of the rule the chevrons enforce:
// nothing important is allowed to die off-screen quietly.

const stripDrag = { kind: null, start: 0, locked: false, dead: false, was: false };

function scrollStripTo(kind, value) {
  const s = Strip[kind];
  s.from = s.scroll;
  s.to = clamp(value, stripMinScroll(kind), 0);
  s.t = 0;
}

// Brings one slot to the middle of the screen. Centring rather than nudging it just past the
// margin: a chevron tap is a request to look at something, and a guest pinned to the edge it was
// hiding behind still reads as off-screen.
function scrollStripToSlot(kind, i) {
  const size = stripSize(kind);
  scrollStripTo(kind, VIEW_W / 2 - (stripOrigin(kind) + i * (size.w + size.gap) + size.w / 2));
}

function resetStrips() {
  for (const kind of ['heaven', 'ops']) {
    const s = Strip[kind];
    s.scroll = 0;
    s.from = 0;
    s.to = 0;
    s.t = 1;
  }
  stripDrag.kind = null;
  stripDrag.was = false;
}

// Which floor a pointer landed on. The lounge owns everything down to the top of the operations
// zone, because its slots hang off the ground line and the underlight below them is still cloud.
function stripAt(y) {
  const z = Display.zones;
  if (y >= z.heaven.y && y < z.ops.y) return 'heaven';
  if (y >= z.ops.y && y < z.work.y) return 'ops';
  return null;
}

// Dragging a floor is a live gesture, not a recognised one: the strip has to follow the finger, so
// this reads Input.drag directly instead of waiting for the release. The axis is committed once,
// after a few pixels of travel - without that, a vertical swipe that starts over a floor drags the
// strip sideways on its way past.
function updateStripDrag() {
  const d = Input.drag;
  if (!d.active) { stripDrag.kind = null; stripDrag.was = false; return; }

  if (!stripDrag.was) {
    stripDrag.was = true;
    stripDrag.kind = stripAt(d.startY);
    stripDrag.locked = false;
    stripDrag.dead = false;
    if (stripDrag.kind) stripDrag.start = Strip[stripDrag.kind].scroll;
  }
  const kind = stripDrag.kind;
  if (!kind || stripDrag.dead) return;

  if (!stripDrag.locked) {
    if (Math.max(Math.abs(d.dx), Math.abs(d.dy)) < SCROLL_AXIS_LOCK) return;
    stripDrag.locked = true;
    stripDrag.dead = Math.abs(d.dx) <= Math.abs(d.dy);
    if (stripDrag.dead) return;
  }

  Strip[kind].t = 1;                     // a finger on the strip outranks an autoscroll in flight
  Strip[kind].scroll = clamp(stripDrag.start + d.dx, stripMinScroll(kind), 0);
}

function updateStrips(dt) {
  updateStripDrag();
  for (const kind of ['heaven', 'ops']) {
    const s = Strip[kind];
    if (s.t < 1) {
      s.t = Math.min(1, s.t + dt / SCROLL_SNAP);
      s.scroll = lerp(s.from, s.to, easeOut(s.t));
    }
    // Re-clamped every frame rather than on purchase: a bought slot lengthens the strip, and the
    // shop is not the only thing that can change what a legal scroll is.
    s.scroll = clamp(s.scroll, stripMinScroll(kind), 0);
  }
}

function expiredGuestCount() {
  let n = 0;
  for (const s of state.heavenSlots) if (s.guest && s.guest.expired) n++;
  return n;
}

// Half a slot on screen still counts as on screen: the guest inside it is centred, so it is fully
// visible long before its slot is, and a chevron pointing at something the player can already see
// is a chevron they learn to ignore.
function slotSide(kind, i) {
  const c = slotX(kind, i) + stripSize(kind).w / 2;
  if (c < 0) return -1;
  if (c > VIEW_W) return 1;
  return 0;
}

// What is out past one edge of one floor, in priority order: an expired contract first, then a
// free slot with something waiting to fill it. Returns null when that edge has nothing to say.
// `index` is the nearest such slot, which is where a tap on the chevron scrolls to.
function edgeReport(kind, side) {
  const slots = stripSlots(kind);
  const count = visibleSlotCount(slots);
  // The lounge only matters while there is a soul to place; downstairs also matters while there is
  // an expired guest upstairs, because a free desk is the only thing that stops that guest rioting.
  const wants = kind === 'heaven'
    ? (state.card !== null || state.queue.length > 0)
    : (state.card !== null || expiredGuestCount() > 0);

  let alerts = 0, alertIndex = -1, freeIndex = -1;
  for (let n = 0; n < count; n++) {
    const i = side > 0 ? n : count - 1 - n;      // nearest to that edge first
    const slot = slots[i];
    if (!slot.unlocked || slotSide(kind, i) !== side) continue;
    if (slot.guest) {
      if (slot.guest.expired) {
        alerts++;
        if (alertIndex < 0) alertIndex = i;
      }
    } else if (freeIndex < 0) freeIndex = i;
  }
  if (alerts > 0) return { alert: true, count: alerts, index: alertIndex };
  if (wants && freeIndex >= 0) return { alert: false, count: 0, index: freeIndex };
  return null;
}

// One chevron is an arrow and its count on a dark plate, vertically centred on the slot row of its
// floor and one edge margin in from the canvas edge, which keeps it inside the crop tolerance
// (GDD 1.2) on the phones that lose pixels off the sides. It is plated for the same reason the
// swipe labels are: it lands on top of a guest standing at the edge of the screen, and a red arrow
// on a white cloud behind a violet figure is exactly the collision it exists to prevent.
function chevronBadge(kind, side, report) {
  const size = stripSize(kind);
  const label = report.alert ? String(report.count) : '';
  const inner = CHEVRON.w + (label ? 2 + textWidth(label, 1) : 0);
  const w = inner + CHEVRON_PLATE * 2;
  const h = CHEVRON.h + CHEVRON_PLATE * 2;
  const mid = kind === 'heaven'
    ? Display.zones.ground.y - size.h / 2
    : cubicleRect(0).y + size.h / 2;
  const x = side > 0 ? VIEW_W - EDGE_MARGIN - w : EDGE_MARGIN;
  const y = Math.round(mid - h / 2);
  return {
    x: x, y: y, w: w, h: h, label: label,
    tri: {
      x: side > 0 ? x + w - CHEVRON_PLATE - CHEVRON.w : x + CHEVRON_PLATE,
      y: y + CHEVRON_PLATE,
      w: CHEVRON.w,
      h: CHEVRON.h
    }
  };
}

// The badge is twenty pixels wide, so it takes the standard hit box a button gets - which is wider
// than the badge and can therefore reach a guest standing at the edge of the screen. `alerts` is
// which kind of chevron this pass is looking for, and it is what resolves that overlap: see
// handleFloorTap.
function handleChevronTap(g, alerts) {
  for (const kind of ['heaven', 'ops']) {
    for (const side of [-1, 1]) {
      const report = edgeReport(kind, side);
      if (!report || report.alert !== alerts) continue;
      if (!tapHit(g, chevronBadge(kind, side, report))) continue;
      scrollStripToSlot(kind, report.index);
      sfx('scroll');
      return true;
    }
  }
  return false;
}

// Three things can be under one finger at the edge of the screen, so they are tried in the order
// of what the player most likely meant. A red chevron is an emergency out of sight and wins. A
// guest that is on screen beats a white chevron, because a visible expired contract is worth more
// than the free slot the white one is pointing at - and the white one is still there afterwards.
function handleFloorTap(g) {
  if (handleChevronTap(g, true)) return;
  if (handleSlotTap(g)) return;
  handleChevronTap(g, false);
}

// --- Input --------------------------------------------------------------------

// A tap on an expired guest sends it downstairs. A tap on a working one gets a shrug: there is no
// early eviction in this game, and planning the buffer downstairs ahead of time is the strategy.
function handleSlotTap(g) {
  const count = visibleSlotCount(state.heavenSlots);
  for (let i = 0; i < count; i++) {
    const slot = state.heavenSlots[i];
    if (!slot.guest) continue;
    if (!pointInRect(g.x, g.y, heavenSlotRect(i))) continue;

    // An armed Contract Termination (GDD 9.1) outranks both of the answers below: the player has
    // already paid for this tap and is being asked which suite, so a working contract must not
    // reply with a shrug.
    if (supplyRunning('terminate') && state.active.arm) return terminateGuest(i);

    if (!slot.guest.expired) {
      slot.guest.nudge = NUDGE_TIME;
      sfx('busy');
    } else if (!relocateGuest(i)) {
      state.fullFlash.ops = FULL_FLASH;   // nowhere to put it, which is exactly the riot's cause
      addShake(2, 0.18);
      sfx('refused');
    }
    return true;
  }
  return false;
}

// --- Update -------------------------------------------------------------------

function updateFloors(dt) {
  for (let i = 0; i < state.heavenSlots.length; i++) {
    const guest = state.heavenSlots[i].guest;
    if (!guest) continue;

    if (guest.panic > 0) guest.panic = Math.max(0, guest.panic - dt);
    if (guest.nudge > 0) guest.nudge = Math.max(0, guest.nudge - dt);

    if (!guest.expired) {
      guest.contract -= dt;
      if (guest.contract <= 0) {
        guest.contract = 0;
        guest.expired = true;
        sfx('expire');
      }
      continue;
    }

    // Asked per guest rather than once for the whole floor: the express lift can take the last
