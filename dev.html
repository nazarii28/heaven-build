  // arrows are the same ones the swipe hints use, so the line reads as two options and not as two
  // facts. Doing this arithmetic in the player's head is not the interesting part of the game.
  //
  // The line is split across two colours, and the split is the whole point. Aura cyan and Credits
  // gold were picked to carry against the near-black of the tower; measured against the cream
  // footer of this form they come out at 1.0:1, which is not dim, it is invisible. The deep end of
  // each ramp only reaches 2.4:1. So the number - the part that has to be read - is printed in the
  // form's own ink at 9.5:1, and the colour is spent on the arrow and the unit mark, which are
  // shapes the player already knows from the HUD and only have to be recognised.
  const aura = soul.s > 0 ? C.auraDark : C.inkDim;

  drawWorth(g, '+' + soulAura(soul).toFixed(1), '↑', '✦/s', CARD_WORTH.x, aura);
  const down = '+' + soulCredits(soul).toFixed(1);
  drawWorth(g, down, '↓', '◈/s', CARD_WORTH.right - worthWidth(down, '↓', '◈/s'), C.goldDark);
}

// One side of the worth line: a coloured arrow, the value in ink, a coloured unit. Kept next to
// its own measuring function so the right-hand side can be right-aligned without either of them
// drifting from the other.
function worthWidth(value, arrow, unit) {
  return textWidth(arrow + ' ', 1) + textWidth(value, 1) + textWidth(' ' + unit, 1);
}

function drawWorth(g, value, arrow, unit, x, color) {
  drawText(g, arrow, x, CARD_WORTH.y, color, 1);
  const vx = x + textWidth(arrow + ' ', 1);
  drawText(g, value, vx, CARD_WORTH.y, C.inkText, 1);
  drawText(g, ' ' + unit, vx + textWidth(value, 1), CARD_WORTH.y, color, 1);
}

// A pixel-exact tilt: the card is blitted one row at a time with an integer horizontal offset.
// ctx.rotate would antialias every edge into grey fringes, which the integer upscale then makes
// four times as obvious. `lead` is how far the top row runs ahead of the middle one.
function blitTilted(ctx, layer, x, y, lead) {
  if (!lead) { ctx.drawImage(layer, x, y); return; }
  const h = layer.height;
  const half = (h - 1) / 2;
  for (let r = 0; r < h; r++) {
    const dx = Math.round(-lead * (r - half) / half);
    ctx.drawImage(layer, 0, r, layer.width, 1, x + dx, y + r, layer.width, 1);
  }
}

function renderCard(ctx) {
  const card = state.card;
  const rest = cardRect();

  if (!card) {
    // While a verdict is still on the desk the placeholder stays away: RECEPTION CLEAR printed
    // under a stamp that has just landed contradicts the stamp.
    if (Fx.stamp) return;
    dashedRect(ctx, rest.x, rest.y, rest.w, rest.h, C.panel, 3, 5, 0);
    drawTextCentered(ctx, 'RECEPTION CLEAR', VIEW_W / 2, rest.y + rest.h / 2 - 4, C.inkFaint, 1);
    return;
  }

  if (!cardLayer) cardLayer = makeLayer(CARD.w, CARD.h);
  const g = cardLayer.getContext('2d');
  paintCard(g, card.soul);

  const rise = Math.round((1 - easeOut(card.in)) * 24);
  const lead = Math.round(CARD_TILT * clamp(card.ox / CARD_DRAG_MAX, -1, 1));
  blitTilted(ctx, cardLayer, Math.round(rest.x + card.ox), Math.round(rest.y + card.oy + rise), lead);
}

let stampLayer = null;

// The verdict, slammed onto the docket that just left (GDD 10). Drawn into its own layer and
// blitted with the same integer shear as the card, because a rubber stamp lands askew and
// ctx.rotate would fringe every edge of it on the way.
function renderStamp(ctx) {
  const s = Fx.stamp;
  if (!s) return;

  // As large as it fits. The one-word verdicts read right across the desk; a deny stamp that is a
  // whole sentence steps down to body size rather than being cropped or wrapped - a stamp with two
  // lines on it is a memo.
  const px = textWidth(s.text, 2) + 16 <= CARD.w ? 2 : 1;
  const w = textWidth(s.text, px) + 16;
  const h = FONT_H * px + 12;

  if (!stampLayer) stampLayer = makeLayer(CARD.w, FONT_H * 2 + 12 + STAMP_OVERSHOOT * 2);
  const g = stampLayer.getContext('2d');
  g.clearRect(0, 0, stampLayer.width, stampLayer.height);

  // The impact is the plate closing onto the words: it comes down oversized and shrinks to fit.
  // The text itself never scales - a bitmap font moved by a fraction of a pixel is mush, and this
  // is the largest thing on screen at the moment it lands.
  const slam = clamp(s.t / STAMP_SLAM, 0, 1);
  const grow = Math.round(STAMP_OVERSHOOT * (1 - easeOut(slam)));
  const x = Math.floor((stampLayer.width - w) / 2);
  const y = Math.floor((stampLayer.height - h) / 2);

  fillRect(g, x - grow, y - grow, w + grow * 2, h + grow * 2, C.bgDeep);
  strokeRect(g, x - grow, y - grow, w + grow * 2, h + grow * 2, s.color);
  strokeRect(g, x - grow + 1, y - grow + 1, w + grow * 2 - 2, h + grow * 2 - 2, s.color);
  drawTextCentered(g, s.text, stampLayer.width / 2, y + 6, s.color, px);

  const fade = s.t - STAMP_SLAM - STAMP_HOLD;
  ctx.globalAlpha = fade > 0 ? Math.max(0, 1 - fade / STAMP_FADE) : 1;
  blitTilted(ctx, stampLayer,
             Math.round(cardRect().x + (CARD.w - stampLayer.width) / 2),
             Math.round(cardRect().y + (CARD.h - stampLayer.height) / 2), s.tilt);
  ctx.globalAlpha = 1;
}

// The three affordances sit in the free field around the card at rest. They are drawn UNDER the
// card on purpose: a dragged card slides over the space they occupy, and a label printed across
// the soul's own name was the first thing the screenshot pass caught.
function renderSwipeHints(ctx) {
  if (!cardIsLive()) return;
  const rest = cardRect();

  // The snap flash lands in the same band; two lines of text stacked there read as one smeared
  // block, and the bonus is the more important of the two messages while it is up.
  if (state.snapFlash <= 0) drawTextCentered(ctx, SWIPE_HINT.up, VIEW_W / 2, rest.y - 12, C.inkFaint, 1);
  const belowY = rest.y + rest.h + 6;
  drawText(ctx, SWIPE_HINT.left, EDGE_MARGIN + 4, belowY, C.inkFaint, 1);
  drawTextRight(ctx, SWIPE_HINT.down, VIEW_W - EDGE_MARGIN - 4, belowY, C.inkFaint, 1);
}

function labelPlate(ctx, text, cx, y, color) {
  const w = textWidth(text, 1) + 10;
  const x = Math.round(cx - w / 2);
  fillRect(ctx, x, y - 3, w, 15, C.bgDeep);
  strokeRect(ctx, x, y - 3, w, 15, color);
  drawTextCentered(ctx, text, cx, y, color, 1);
}

// Once the drag passes the threshold the action announces itself over the place the soul is
// about to go, not next to the card: the card is already covering everything around itself, and
// the target zone is where the player is looking anyway.
function renderActionLabel(ctx) {
  const dir = dragDirection();
  if (!dir || dir === 'right') return;
  const cx = VIEW_W / 2;
  const soul = state.card.soul;
  if (dir === 'up') {
    labelPlate(ctx, 'CHECK IN  +' + soulAura(soul).toFixed(1) + ' ✦/s', cx, Display.zones.heaven.y + 14, C.aura);
  } else if (dir === 'down') {
    labelPlate(ctx, 'REASSIGN  +' + soulCredits(soul).toFixed(1) + ' ◈/s', cx, Display.zones.ops.y + 10, C.ink);
  } else {
    // The price the swipe would actually charge, not the cheap one. The two prices are the whole
    // of GDD 6's "refusing with room costs more", and a hint that always quoted the lower one
    // would be teaching the opposite of the rule at the exact moment the player is deciding.
    labelPlate(ctx, 'DENY  -' + (denyHadRoom() ? DENY_COST_ROOM : DENY_COST) + ' ◈', cx,
               Display.zones.work.y + 10, C.suspicion);

  }
}

// Production floating off a soul. Outlined rather than plated: a dark box over the cloud would
// read as an object in the scene, and cyan on white cloud has no contrast without the outline.
function drawTextOutlined(ctx, text, cx, y, color, outline, px) {
  px = px || 1;
  const x = Math.round(cx - textWidth(text, px) / 2);
  drawText(ctx, text, x - 1, y, outline, px);
  drawText(ctx, text, x + 1, y, outline, px);
  drawText(ctx, text, x, y - 1, outline, px);
  drawText(ctx, text, x, y + 1, outline, px);
  drawText(ctx, text, x, y, color, px);
}

function renderPopups(ctx) {
  for (const p of state.popups) {
    const t = clamp(p.t, 0, 1);
    const y = Math.round(p.y - POPUP_RISE * easeOut(t));
    ctx.globalAlpha = t > 0.6 ? (1 - t) / 0.4 : 1;
    // Kept inside the canvas. Every popup until now was three or four characters wide over a slot
    // that is never within half of that of an edge, so centring on the slot was enough; a word over
    // the leftmost suite is not, and half of it went off the screen. Clamped rather than moved to
    // the middle of the row: which slot a popup belongs to is the whole of what it is saying.
    const half = textWidth(p.text, 1) / 2;
    const x = clamp(p.x, EDGE_MARGIN + half, VIEW_W - EDGE_MARGIN - half);
    drawTextOutlined(ctx, p.text, x, y, p.color, C.bgDeep);
    ctx.globalAlpha = 1;
  }
}

// The snap bonus does not exist unless it is announced: it is a permanent 10% on one soul, and a
// silent one would just be a number the player never learns to chase.
function renderSnapFlash(ctx) {
  if (state.snapFlash <= 0) return;
  const t = 1 - state.snapFlash / SNAP_FLASH;
  const y = Math.round(cardRect().y - 14 - 10 * easeOut(t));
  ctx.globalAlpha = t > 0.6 ? (1 - t) / 0.4 : 1;
  drawTextOutlined(ctx, 'SNAP DECISION +10%', VIEW_W / 2, y, C.credits, C.bgDeep);
  ctx.globalAlpha = 1;
}

// FULL over a floor that had no room. This replaces a greyed-out button: the player finds out why
// the swipe failed, at the place where the failure is.
function renderFullFlash(ctx) {
  for (const zone of ['heaven', 'ops']) {
    const t = state.fullFlash[zone];
    if (t <= 0) continue;
    const z = zone === 'heaven' ? Display.zones.heaven : Display.zones.ops;
    const y = z.y + Math.floor(z.h / 2) - 8;
    const w = textWidth('FULL', 2) + 12;
    const x = Math.floor((VIEW_W - w) / 2);
    fillRect(ctx, x, y - 3, w, 20, C.bgDeep);
    strokeRect(ctx, x, y - 3, w, 20, C.suspicion);
    drawTextCentered(ctx, 'FULL', VIEW_W / 2, y, C.suspicion, 2);
  }
}

// A filed card shrinking into the slot it went to, or sliding off the left edge when denied.
// Outline only: a shrinking copy of the docket would sit on top of the guest that has already
// been placed there and read as two souls in one slot.
function renderFlyers(ctx) {
  for (const f of state.flyers) {
    const t = easeOut(clamp(f.t, 0, 1));
    const x = lerp(f.x0, f.x1, t);
    const y = lerp(f.y0, f.y1, t);
    const w = lerp(f.w0, f.w1, t);
    const h = lerp(f.h0, f.h1, t);
    ctx.globalAlpha = 1 - t * 0.7;
    strokeRect(ctx, x, y, w, h, f.color);
    ctx.globalAlpha = 1;
  }
}

function renderWorkZone(ctx) {
  renderSwipeHints(ctx);
  renderCard(ctx);
  renderActionLabel(ctx);
  renderFlyers(ctx);
  renderStamp(ctx);
  renderSnapFlash(ctx);
  renderFullFlash(ctx);
}

// ==========================================================================
// 19_tutorial.js
// ==========================================================================

// The onboarding beats and the Associate who delivers them (GDD 8.4). Plan v3, wave A.
//
// Playability is a quarter of the score and this build had no teaching in it at all: a judge opened
// the game, saw a docket carrying two unexplained stats, and had to guess that it wanted to be
// swiped. Six lines answer that, delivered by one speaker, each fired by the state that makes it
// mean something, each shown once per run.
//
// The beats live in `state` rather than in a module variable of their own, for the reason the whole
// state object exists: PLAY AGAIN is one call, and a run that remembered the last run's lessons
// would teach the second judge nothing.

function tutorialActive() { return state.tutorial.line !== null; }

// A holding beat has stopped the day and is waiting to be tapped away. Two places outside this
// module ask: the state machine, which freezes everything behind it, and the balance harness, which
// has to tap it away like a player would.
function tutorialHolding() { return tutorialActive() && state.tutorial.hold; }

// The acting beat on the plate, or null: a beat that waits for a gesture instead of for a tap
// (TUTORIAL_ACTS in 08_data.js). Worth a named predicate rather than an inline field read because
// four places outside this file ask the question - the state machine, to decide what still runs
// behind the plate; the gesture handler, to decide that a tap is not the answer; the repair
// gesture, to let itself through a holding beat; and the plate, to print the right instruction.
function tutorialAct() {
  const beat = TUTORIAL[state.tutorial.id];
  return (state.tutorial.line && beat && beat.act) ? TUTORIAL_ACTS[beat.act] : null;
}

function tutorialActing() { return !!tutorialAct(); }

// Queued rather than shown: two beats can become true in the same frame - the quota clock and a
// lounge that just filled - and the second one would otherwise overwrite the first before it had
// been read. Marking it seen at the moment it is queued is what keeps it to once per run.
function tutorialSay(id) {
  const t = state.tutorial;
  if (t.seen[id]) return;
  t.seen[id] = true;
  t.queue.push(id);
}

// The shop beats skip the queue and take the plate immediately. Nothing else can be speaking on
// the night panel - `tutorialCheck` only runs inside a day - so the reason the queue exists is not
// present here, and going through it would mean a beat that arrives one frame late on the one
// screen where the player is already looking at the thing being explained.
function tutorialSayNow(id) {
  const t = state.tutorial;
  if (t.seen[id]) return;
  const beat = TUTORIAL[id];
  t.seen[id] = true;
  t.id = id;
  t.line = beat.text;
  t.hold = beat.hold;
  t.life = beat.life || TUTORIAL_LIFE;
  t.t = 0;
}

// Which beat is on the plate, so the two screens that draw one can tell each other's beats apart.
// A day beat still fading when the clock ran out rides through the night in state - it is dismissed
// at START DAY, not at the shop - and without this it would be drawn over the prices.
function tutorialOnShop() {
  const id = state.tutorial.id;
  return !!id && !!TUTORIAL[id] && !!TUTORIAL[id].shop;
}

function tutorialDismiss() {
  const t = state.tutorial;
  t.id = null;
  t.line = null;
  t.hold = false;
  t.t = 0;
  t.life = TUTORIAL_LIFE;
}

// The staged unlock, spoken instead of captioned (GDD 9). Called once the panel has finished
// sliding up: the tab arrives, the grid settles, and then he says what it is for. `tutorialSayNow`
// is idempotent through `seen`, so this can be asked on every frame of the shop.
function shopPageBeat() {
  const i = newShopPage();
  const page = i >= 0 ? SHOP_PAGES[i] : null;
  if (page && page.beat) tutorialSayNow(page.beat);
}

// Conditions, not a script: each beat is the answer to a question the player is being asked for the
// first time. The riot beat is fired from riot() instead, because a riot is an event and by the
// time it can be seen in the state the guest is already gone.
function tutorialCheck() {
  // Ahead of everything else, and on an empty screen. Both hold, and a holding beat stops arrivals
  // as well as the clock, so the first soul waits until the player has been told what the two
  // floors are. Asking these of the day rather than of the card is the whole point: they are about
  // the building, and the building is the one thing on screen before a docket lands on the desk.
  if (state.day === 1) {
    tutorialSay('floorHeaven');
    tutorialSay('floorOps');
  }
  if (state.card && state.card.in >= 1) {
    tutorialSay('firstCard');
    // Queued in the same frame as the beat above and read after it. The order is what to do with
    // the object, then what the numbers on it mean: a player who has not yet been told the docket
    // is swipeable has no question that SANCTITY is the answer to. All three hold, so the day is
    // still stopped and the card the last two point at is still on the desk.
    tutorialSay('statSanctity');
    tutorialSay('statSkepticism');
    // A full lounge is the moment the second swipe becomes the answer, and a full lounge over a
    // full basement is the moment the third one does. They are the same question twice.
    if (firstFreeSlot(state.heavenSlots) < 0) {
      tutorialSay(freeSlotCount(state.cubicles) > 0 ? 'deskSwipe' : 'denySwipe');
    }
  }
  if (expiredGuestCount() > 0) tutorialSay('expiry');

  // The repair (GDD 6.5), on the first wreck the player ever has. No day gate is needed and none is
  // wanted: the beat cannot fire before there is a wreck, a wreck cannot happen before a riot, and
  // a riot on day one is very nearly impossible with a 70 s contract inside a 55 s day. The game
  // decides when to teach this, and it decides by the player having got something wrong - which is
  // the same sentence as the mechanic itself.
  // Asked after the expiry beat rather than before it: an expired contract is the emergency and has
  // to keep the front of the queue, and a wreck is still there a few seconds later. It is, in fact,
  // still there tomorrow, which is the point of it.
  for (const slot of state.heavenSlots) {
    if (slot.wrecked) { tutorialSay('repair'); break; }
  }

  // The floor below Operations, paid off the first time a desk clears itself (GDD 8.4). Asked of
  // the counter rather than fired from `dischargeGuest`, the way `riot` is fired from `riot()`:
  // a discharge is an event too, but it is also what firing an associate does to their desk, and
  // that one happens on the night panel where a day beat has no plate to be drawn on. Reading the
  // counter from inside the day keeps the beat on the screen it is about.
  //
  // Last of the day beats, and deliberately behind the expiry and the wreck: it is the only beat
  // in the game that is flavour rather than instruction, and it must never sit in front of an
  // emergency in the queue. The desk it is about is empty either way.
  if (state.stats.processed > 0) tutorialSay('processed');


  // The turn, and the last day (GDD 8, 8.4). Both are checked before the day-one beats below have
  // any chance of being true again, and both fire in the first frames of their day - the Associate
  // arrives before the first card does, which is the only quiet moment a day has.
  if (state.day >= APOCALYPSE_DAY) tutorialSay('apocalypse');
  if (state.day >= LAST_DAY) tutorialSay('lastDay');

  // The first consumable carried into a day (GDD 9.1). Fired off the slot rather than off the
  // purchase, because the purchase happened on a screen where the slot was not usable yet.
  if (state.supplies[0] || state.supplies[1]) tutorialSay('supply');

  // The starvation zone (GDD 4.1, 7.1). Not on day one, and not in the first seconds of a day: the
  // meter is legitimately low at the top of the morning, and a warning fired then would be about
  // the clock rather than about how the player is playing.
  if (state.day >= 2 && state.suspicion < SUSP_STARVE && state.dayLen - state.dayTime >= 12) {
    tutorialSay('starved');
  }

  // Late enough into day one that the player has sorted a few souls and can see the Aura counter
  // moving, which is what the line is about.
  if (state.day === 1 && !state.dayHold && state.dayLen - state.dayTime >= TUTORIAL_QUOTA_AT) {
    tutorialSay('quota');
  }
}

// The clock on whichever beat is up. `tutorialCheck` is NOT called from here: it reads the card,
// the lounge and the day timer, and the shop ticks this same function on a screen where all three
// belong to a day that is already over. The day calls the check itself, one line above this one.
function updateTutorial(dt) {
  const t = state.tutorial;
  if (!t.line && t.queue.length) {
    const id = t.queue.shift();
    const beat = TUTORIAL[id];
    t.id = id;
    t.line = beat.text;
    t.hold = beat.hold;
    // A beat that will not go away until a suite has been dealt with has to be able to reach that
    // suite. A riot can wreck one that is off the end of a scrolled strip, and a gate demanding a
    // gesture on something the player cannot see is not a gate, it is a lock with no key. Centred
    // through the same autoscroll a chevron tap uses, so there is one way a strip ever moves on
    // its own.
    if (beat.act === 'repair' && firstWreckedSlot() >= 0) scrollStripToSlot('heaven', firstWreckedSlot());
    // A beat that tells a story rather than an instruction is given longer to be read: three lines
    // at the arrival rate of day eight are not five seconds of reading.
    t.life = beat.life || TUTORIAL_LIFE;
    t.t = 0;
  }
  if (!t.line) return;
  // An acting beat is dismissed by the world changing and never by input: the condition that ends
  // it is the thing it asked for, checked every frame, which is the rule every beat in this file
  // is fired by read backwards. It is also why the gate cannot strand a run - the moment the wreck
  // is gone the plate is gone, whatever made it so.
  const act = tutorialAct();
  if (act && act.done()) { tutorialDismiss(); return; }
  t.t += dt;
  if (!t.hold && t.t >= t.life) tutorialDismiss();
}

// --- The plate ----------------------------------------------------------------

// Fades in, and fades out again on its own if it is not the kind that waits to be tapped.
function tutorialAlpha() {
  const t = state.tutorial;
  const arriving = clamp(t.t / TUTORIAL_FADE, 0, 1);
  if (t.hold) return arriving;
  return Math.min(arriving, clamp((t.life - t.t) / TUTORIAL_FADE, 0, 1));
}

// The speaker, 32x40, at the anchor wave A reserved for exactly this. The primitive that stood
// here - a dark suit, a tie and a headset drawn out of five rectangles - is now the sprite it was
// a placeholder for, and the anchor and size did not have to move, which was the point of fixing
// them at step 1.
//
// The sprite carries four mouth shapes and nothing else: rows 0-22 are identical across all four,
// so the head cannot shimmer, and only the mouth box moves. The cycle below is fixed rather than
// random because a random mouth at nine shapes a second reads as a glitch, while a repeating
// pattern with rests in it reads as speech. Frame 0 is the closed mouth, which is why it appears
// inside the cycle as well as at the end of it.
const VISEME_CYCLE = [1, 2, 0, 3, 2, 1, 0, 3];
const VISEME_RATE = 9;            // mouth shapes per second
const TALK_CPS = 17;              // characters per second, the speed the line is "read" at

// He talks while he is delivering a line and rests once it has been said, which is the difference
// the plate already draws with TAP TO CONTINUE. `talkT` is seconds since this plate went up, and
// the line takes as long to say as it takes to read at TALK_CPS.
//
// Delivering is NOT the same as "the screen is still running", and getting those two confused is
// what kept the mouth shut on two thirds of the beats in the game. A holding beat is waiting on a
// tap from its very first frame, so gating the animation on the wait meant eight of the thirteen
// beats - every swipe lesson, the expiry, the turn on day four and all three shop tabs - showed a
// closed mouth for the whole of a line the player had not read yet. It is not looped instead: a
// mouth that keeps moving after the words have run out reads as a stuck animation, and it argues
// with TAP TO CONTINUE, which is the plate saying he has finished and it is the player's turn.
function speakerViseme(text, talkT) {
  if (talkT === undefined || talkT === null) return 0;
  if (talkT > text.length / TALK_CPS) return 0;
  return VISEME_CYCLE[Math.floor(talkT * VISEME_RATE) % VISEME_CYCLE.length];
}

function drawSpeakerPortrait(ctx, x, y, frame) {
  drawSprite(ctx, SPR_ASSOCIATE_ONBOARDING, x, y, frame);
}

// The two currencies are five pixels of near-identical diamond at body size - ✦ is the filled one
// and ◈ the hollow one - and every other place the game prints them tells them apart by colour:
// the HUD counters, the worth line on the docket, the production popups floating off a guest. Body
// text was the one place both came out in the same warm white, which is exactly where it hurts,
// because the plate is where the player is told what each symbol means. Two beats name a currency
// while pointing at the floor that pays it, and they were saying "it pays in a small shape" twice.
//
// Matched to the HUD readouts rather than picked: ✦ is `C.aura` because that is the colour of the
// quota counter it is counted in, ◈ is `C.credits` for the same reason. The gold also lands on the
// plate's own accent, which is not a clash - it is the credit colour agreeing with itself.
const CURRENCY_INK = { '✦': C.aura, '◈': C.credits };

// One plate, used by the day-one beats and by the last word on all three ending screens. Its height
// is fixed at three lines whether it holds one or three, so a run of beats never makes the layout
// jump - and the ending screens can reserve the space for it before they know which text they have.
function renderSpeakerPlate(ctx, y, text, accent, waiting, talkT) {
  const x = EDGE_MARGIN;
  const w = VIEW_W - EDGE_MARGIN * 2;
  fillRect(ctx, x, y, w, SPEAKER.h, C.hudBg);
  strokeRect(ctx, x, y, w, SPEAKER.h, accent);
  drawSpeakerPortrait(ctx, x + SPEAKER.pad, y + SPEAKER.pad, speakerViseme(text, talkT));

  const tx = x + SPEAKER.pad + SPEAKER.pw + SPEAKER.gap;
  const tw = x + w - SPEAKER.pad - tx;
  drawText(ctx, SPEAKER_NAME, tx, y + 4, C.inkFaint, 1);
  const lines = wrapText(text, tw, 1);
  for (let i = 0; i < lines.length && i < SPEAKER_LINES; i++) {
    drawTextTinted(ctx, lines[i], tx, y + 14 + i * 9, C.ink, 1, CURRENCY_INK);
  }
  // Only a beat that stopped the clock says this, and it says it inside the plate: the row below
  // the plate is the top of the lounge slots, where the halos are.
  //
  // `waiting` is `true` for a beat that a tap puts away, or the instruction an acting beat is
  // waiting on. Two different sentences in one corner, because a gate that prints TAP TO CONTINUE
  // while refusing to be tapped away is worse than a gate that prints nothing at all.
  if (waiting) {
    drawTextRight(ctx, waiting === true ? 'TAP TO CONTINUE' : waiting,
                  x + w - SPEAKER.pad, y + 41, C.credits, 1);
  }
}

// Parked in the sky, under the queue row and above the lounge slots. The GDD drew it at the bottom
// of the screen; measured against the 384 px view there are 27 free pixels down there, under the
// card and its three swipe labels, and 52 up here - and covering the card while telling the player
// what to do with the card is the one placement that cannot work.
//
// Once the halos moved off the guests' heads and up over the slot frames they landed in the bottom
// of that band, and on the shortest supported view there is no arrangement where the plate, the
// queue row and a row of halos all fit. The plate rides up until it clears the halos, which on a
// 384 px view pins it under the HUD and covers the queue. That is the right thing to lose: the
// queue is frozen while a beat holds the day and is read as a length rather than as individuals,
// whereas the beat that says "tap them" is pointing at the halos.
//
// The clearance is computed from the halo rather than written down as a number. It was 18, which
// was the halo of the day - lift 9, half-height 7, a shadow row and one clear row - and a constant
// that silently encodes another constant is wrong the first time either moves. It has moved three
// times since: the halo was redrawn smaller, thickened into a band and back to its old height, and
// then replaced by a drawing four rows shorter than the band was. None of the three needed an edit
// here, which is the point of writing it as the sum it is.
function tutorialPlateY() {
  const z = Display.zones.heaven;
  const slotTop = Display.zones.ground.y - HEAVEN_SLOT.h;
  // The drawing reaches half its height above the centre, and one more row of daylight over it.
  const clear = HALO_LIFT + (HALO_H - 1) / 2 + 1;
  return Math.max(z.y, Math.min(z.y + 17, slotTop - SPEAKER.h - clear));
}

// Where a beat is pointing, if it points anywhere. A beat names a target rather than a rectangle,
// because the rectangle is wherever that target happens to be drawn this frame - the docket the two
// stat beats point at moves with the finger and rises on arrival.
//
// A null here is not an error and is not guarded against elsewhere: it means the thing being talked
// about is not on screen, and the plate falls back to dimming everything, which is what it did
// before any beat pointed at anything.
function tutorialFocusRect() {
  const beat = TUTORIAL[state.tutorial.id];
  if (!beat || !beat.focus) return null;
  if (beat.focus === 'floorHeaven') return heavenFloorRect();
  if (beat.focus === 'floorOps') return opsFloorRect();
  if (beat.focus === 'statSanctity') return cardStatRect(0);
  // Cause and effect, lit together. The line says the red row feeds Suspicion; the meter it feeds
  // is at the other end of the screen and is the one thing on the HUD the player has no reason to
  // have looked at yet.
  if (beat.focus === 'statSkepticism') return [cardStatRect(1), suspicionRowRect()];
  // The suite the gate is about. Read every frame off the slot rather than remembered, like every
  // other target here, so it follows the strip if the player drags it while the plate is up.
  if (beat.focus === 'wreck') {
    const i = firstWreckedSlot();
    return i < 0 ? null : heavenSlotRect(i);
  }
  return null;
}

function renderTutorial(ctx, y) {
  const t = state.tutorial;
  if (!t.line) return;
  // A held beat dims the scene behind it, so a stopped clock reads as waiting rather than as stuck.
  // A beat that points leaves its target out of the veil and dims harder around it: at 0.5 the rest
  // of the card is still perfectly readable and the eye has no reason to go to the one row being
  // named, which is the whole of what the beat is for.
  //
  // The frame is drawn in the plate's own accent rather than in the stat's colour. Green and red
  // are what the two rows already say about themselves; a third meaning laid over that would be one
  // colour too many, whereas gold on both says only "he is pointing here", which is true of both.
  if (t.hold) {
    const focus = tutorialFocusRect();
    dimExcept(ctx, focus ? TUTORIAL_DIM_FOCUS : TUTORIAL_DIM, focus);
    for (const r of [].concat(focus || [])) {
      if (r) strokeRect(ctx, r.x - 1, r.y - 1, r.w + 2, r.h + 2, C.credits);
    }
  }
  ctx.globalAlpha = tutorialAlpha();
  const act = tutorialAct();
  renderSpeakerPlate(ctx, y === undefined ? tutorialPlateY() : y,
                     t.line, C.credits, act ? act.label : t.hold, t.t);
  ctx.globalAlpha = 1;
}

const BANK_FADE = .012;      // in and out, so a slice never starts or stops on a step

const STEMS = ['heaven', 'middle', 'hell'];

// The output buffer, in seconds, and the reasoning is the engine's: left to itself the API picks
// 'interactive', which asks for the smallest buffer the device will give, and on Android that can
// be 256 frames. 2048 frames is 43 ms, under what a hand reads as lag on a stamp, and the one
// number hits it at both 48 kHz and 44.1 kHz. Kept even though the file player asks the audio
// thread for a fraction of what the synthesiser did - the buffer costs nothing but delay, and the
// cues are still scheduled against it.
const OUT_LATENCY = 2048 / 48000;

// How the three stems are kept together. They are three independent media elements and therefore
// three independent clocks: they start in the same task and stay locked while nothing stalls, but
// one decode underrun on a phone is a permanent offset, and an offset between two arrangements of
// the same bars is a flam on every hit they share.
//
// So the leader is stem 0 and the other two are pulled to it. Under DRIFT_DEAD nothing happens -
// `currentTime` on a media element is not reported finely enough for corrections that small to be
// anything but noise. Between there and DRIFT_HARD the correction is a playbackRate nudge, capped
// at DRIFT_RATE; 0.3 % is about five cents, which is inaudible on one layer of three and takes
// under seven seconds to absorb the largest drift it is allowed to see. Past DRIFT_HARD the stem
// is too far out to walk back and gets a seek, which is a click if it is audible - so an audible
// stem is only ever seeked as a last resort, and a silent one is always seeked, because on a
// stem nobody can hear a seek costs nothing.
const DRIFT_MS   = 2000;     // how often the check runs
const DRIFT_DEAD = .015;
const DRIFT_HARD = .120;
const DRIFT_RATE = .003;

const SILENCE_CAP = 480;

// first sound effect of the run 18 seconds after CLOCK IN; at 1.6 Mbit, 43 seconds. Loaded alone
// and first, it lands in a fraction of that, and the music - which streams, and needs only a lead -
// follows behind it without anyone noticing.
//
// After the bank: heaven, because it is the only stem audible at Suspicion 0; then middle, which
// the meter reaches within a day or two; then hell, which most runs reach late or not at all; then
// the two endings, which cannot be needed before minute eight.
const STAGES = [['heaven'], ['middle'], ['hell'], ['victory', 'defeat']];

// some of them are slow to give it; this is the guarantee that a quiet estimate cannot stall the
// chain behind it for ever.
const STAGE_CAP = 8000;

let AC = null;
let master = null, userVol = null, sfxBus = null, themeGain = null;
let color = null, musicDuck = null, musicOut = null;
const stemEl = [], stemGain = [];
const themeEl = {};
let started = false;          // the elements have been created and blessed by a gesture
let running = false;          // the loop is playing
let themeName = null;

let bankBuf = null;
let bankLoad = 'idle';        // idle | loading | ready | failed
let bankGot = 0, bankTotal = 0;
let stageIdx = -1, stageTimer = null;
let failed = false;
let failCb = null;
let failReason = null;

// ---------------------------------------------------------------------------
// 1. Whether this build can use files at all.
// ---------------------------------------------------------------------------
// Two ways it cannot, and both are decided before a single byte is fetched.
//
// The codec, because Ogg Opus is not universal: WebKit only gained it in Safari 18.4, so an older
// iPhone can be handed these files and will play none of them.
//
// And the protocol, which is the one that would otherwise be found the hard way. A page opened by
// double-clicking index.html runs on an opaque origin, and a media element loaded from there
// reaches a MediaElementAudioSourceNode as silence rather than as an error - `fetch` for the bank
// does not even get that far. The zip is meant to be served, and the verification ritual serves
// it, but a judge who opens the file directly should get the synthesiser rather than nothing.
function supported() {
  if (typeof Audio === 'undefined') return false;
  if (location.protocol === 'file:') return false;
  const probe = new Audio();
  return !!(probe.canPlayType && probe.canPlayType('audio/ogg; codecs=opus').replace('no', ''));
}

// One shot, and it is how the file path admits defeat after it has already been chosen: a stem
// that will not load, a bank that will not decode, or a graph that turns out to be silent. The
// callback in 07_audio.js tears this down and starts the engine in its place.
function fail(why) {
  if (failed) return;
  failed = true;
  failReason = why || 'unknown';
  if (failCb) failCb(failReason);
}

// ---------------------------------------------------------------------------
// 2. The graph.
// ---------------------------------------------------------------------------
//                        stemGain[0..2] -> color -> musicDuck -> musicOut -.
//                                 themeGain --------------------------------+-> master -> userVol -> limiter
//                                    sfxBus --------------------------------'
//
// Four gains where the engine had two, and each of them is moved by something different at a
// different time: `musicDuck` by a cue, `musicOut` by the loop starting and stopping, `themeGain`
// by an ending, `master` by nothing at all. Sharing one would mean a cancelScheduledValues meant
// for a duck wiping a fade that was still running.
//
// What is NOT here is as deliberate as what is. No convolver: the renders were mixed with their
// own space and a second hall on top is both wrong and, by the session 43 measurements, the most
// expensive node the old graph had. No waveshaper on the hell stem: that shaped a synthesised bus
// into something damaged, and the hell render already arrived that way. No master EQ curve: the
// engine's -3 dB at 3.1 kHz and its high shelf were tuned against oscillators and would only dull
// a finished master.
function initAudio() {
  if (AC) return;
  const Ctor = window.AudioContext || window.webkitAudioContext;
  try { AC = new Ctor({ latencyHint: OUT_LATENCY }); }
  catch (e) { AC = new Ctor(); }        // Safari before 14 has no option bag

  // Insurance, not a sound. Three files at -18 LUFS through these trims sit near -8 dBFS, so this
  // should be asleep except where a cue lands on the loudest bar of the hell mix.
  const limiter = AC.createDynamicsCompressor();
  limiter.threshold.value = -4; limiter.knee.value = 14; limiter.ratio.value = 4;
  limiter.attack.value = .006; limiter.release.value = .32;
  limiter.connect(AC.destination);

  userVol = AC.createGain(); userVol.gain.value = .7;
  userVol.connect(limiter);

  master = AC.createGain(); master.gain.value = AUDIO_MASTER;
  master.connect(userVol);

  sfxBus = AC.createGain(); sfxBus.gain.value = BANK_GAIN;
  sfxBus.connect(master);

  themeGain = AC.createGain(); themeGain.gain.value = 0;
  themeGain.connect(master);

  musicOut = AC.createGain(); musicOut.gain.value = .0001;
  musicOut.connect(master);

  musicDuck = AC.createGain(); musicDuck.gain.value = 1;
  musicDuck.connect(musicOut);

  // The one piece of modulation that survived, and the reason it did is that it is a mix move
  // rather than a synthesis one: it works on any source. 11 kHz open at Suspicion 0 down to
  // 2.6 kHz at 100, on the same 0.9 s ramp as the crossfade under it.
  color = AC.createBiquadFilter();
  color.type = 'lowpass'; color.frequency.value = 11000;
  color.connect(musicDuck);

  for (let i = 0; i < 3; i++) {
    const g = AC.createGain();
    g.gain.value = (i === 0 ? 1 : 0) * MUSIC_TRIM;
    g.connect(color);
    stemGain.push(g);
  }
}

function ctx() { initAudio(); if (AC.state === 'suspended') AC.resume(); return AC; }

// ---------------------------------------------------------------------------
// 3. The elements.
// ---------------------------------------------------------------------------
// All five are created and played inside the gesture that creates the context, because a media
// element is blessed by a real tap once and may then be started from anywhere. The two themes are
// paused again a moment later - they exist at this point only so that a win eight minutes from now
// can start one without asking the autoplay policy for permission it will not give.
//
// The three stems are left running from here to the end of the session. Pausing the silent ones
// would save a little decoding and cost the thing the whole file player is built around: coming
// back needs a seek, an Opus seek lands on a 20 ms frame boundary, and 20 ms against the two stems
// still playing is exactly the flam this avoids. Three streaming Opus decoders is a rounding error
// next to what the synthesiser was doing.
function makeEl(loop) {
  const el = new Audio();
  el.loop = !!loop;
  el.preload = 'auto';
  // A drift correction is a resample, not a time-stretch. At 0.3 % the difference is academic, but
  // stretching is the more expensive of the two and there is no reason to ask for it.
  if ('preservesPitch' in el) el.preservesPitch = false;
  else if ('mozPreservesPitch' in el) el.mozPreservesPitch = false;
  else if ('webkitPreservesPitch' in el) el.webkitPreservesPitch = false;
  el.addEventListener('error', function () { fail('load ' + (el.currentSrc || el.src || '?')); });
  // A stem that has only just become playable has to be let into the mix, and the mix is only
  // recomputed when the meter moves - which it may not do for a while. So readiness re-applies it.
  el.addEventListener('canplay', function () { applySuspicion(true); });
  return el;
}

// Everything exists from the start and nothing has a `src` yet, which is the whole trick: an
// element with no source downloads nothing, and one that already exists can be wired into the
// graph and blessed by the first tap whether or not its turn has come. Giving them their sources
// later is what staggers the downloads without risking an element that the autoplay policy has
// never seen a gesture for.
const SRC_OF = {};
function srcFor(name) {
  return MUSIC_FILES[name] || THEME_FILES[name];
}

// A stem that is handed its source while the loop is already running must not start at zero: it
// would be minutes out of step with the others and the watchdog would drag it back with seeks -
// harmless, because the meter has not asked for it yet and nobody can hear it, but it reads in the
// diagnostics as twelve seconds of drift and three seeks, which is a fault report for something
// that is not a fault. Putting it where the leader is, the moment it knows its own length, is the
// same result with nothing to explain.
function syncNewStem(el) {
  if (!running || stemEl.indexOf(el) < 1) return;
  const go = function () { try { el.currentTime = stemEl[0].currentTime; } catch (e) {} };
  if (el.readyState >= 1) go();
  else el.addEventListener('loadedmetadata', go, { once: true });
}

function beginStage(i) {
  clearTimeout(stageTimer);
  stageIdx = i;
  if (i >= STAGES.length) return;
  const names = STAGES[i];
  for (const name of names) {
    const el = elByName[name];
    if (!el || SRC_OF[name]) continue;
    SRC_OF[name] = srcFor(name);
    el.src = SRC_OF[name];
    // Blessed here rather than at unlock when the tap came first, which is the usual order: the
    // gate holds CLOCK IN until the bank has landed, and the bank landing is what starts this.
    if (started) { el.play().catch(function () {}); syncNewStem(el); }
  }
  const lead = elByName[names[0]];
  const done = function () { if (stageIdx === i) beginStage(i + 1); };
  if (lead && lead.readyState >= 4) { done(); return; }
  if (lead) lead.addEventListener('canplaythrough', done, { once: true });
  stageTimer = setTimeout(done, STAGE_CAP);
}

// Creating the elements is the download, and it needs no context and no gesture, so it happens at
// boot. That is the whole point of the split: before it, the fifteen megabytes of music and the
// bank all started arriving on the tap that starts day one, and the first cue of the game - the
// one CLOCK IN plays - was reliably silent because it fired while its own file was still in
// flight. A title screen is several seconds of somebody reading a button, and this spends them.
const elByName = {};
function createElements() {
  if (stemEl.length) return;
  for (let i = 0; i < 3; i++) { const el = makeEl(true); stemEl.push(el); elByName[STEMS[i]] = el; }
  for (const name of ['victory', 'defeat']) { const el = makeEl(false); themeEl[name] = el; elByName[name] = el; }
}

function startElements() {
  if (started) return;
  started = true;
  createElements();
  // Wired whether or not the file has been asked for yet - a source node on a sourceless element
  // is silent and costs nothing, and doing it now means a stage that starts later has nothing left
  // to arrange.
  for (let i = 0; i < 3; i++) {
    AC.createMediaElementSource(stemEl[i]).connect(stemGain[i]);
    // Started here and not at CLOCK IN. It costs nothing while musicOut is at zero, and it means
    // the decoders are warm and the heads are buffered by the time the loop is actually wanted.
    if (SRC_OF[STEMS[i]]) stemEl[i].play().catch(function () {});
  }
  for (const name of ['victory', 'defeat']) {
    const el = themeEl[name];
    AC.createMediaElementSource(el).connect(themeGain);
    // Play then pause: the play is the blessing, the pause is because nobody has won yet.
    if (SRC_OF[name]) el.play().then(function () { el.pause(); el.currentTime = 0; })
                               .catch(function () { try { el.pause(); } catch (e) {} });
  }
}

// ---------------------------------------------------------------------------
// 4. The Suspicion crossfade. The engine's, unedited.
// ---------------------------------------------------------------------------
let suspicion = 0, solo = -1;
const busTarget = [1, 0, 0];
// Heaven takes the first ~20 of the scale, hell everything from ~60. All the ground between them
// is carried by the middle stem: it is what should be playing most of a run.
function busWeights(v) {
  const h = 1 - smoothstep(v, 10, 22);
  const m = smoothstep(v, 8, 20) * (1 - smoothstep(v, 59, 74));
  const l = smoothstep(v, 58, 72);
  const s = Math.max(1, (h + m + l) * .85);
  return [h / s, m / s, l / s];
}

// Called from the game sixty times a second, and doing the work only when the meter has actually
// moved is the engine's rule kept for the engine's reason: a quarter of a point is far under what
// a 0.9 s ramp can render, and the drip takes whole seconds to cross it. There is no distortion
// table to rebuild here any more, but four AudioParam events a frame across the thread boundary
// are still four more than the mix can express.
let lastApplied = -1;
function applySuspicion(force) {
  if (!AC) return;
  if (!force && Math.abs(suspicion - lastApplied) < .25) return;
  lastApplied = suspicion;
  const t = AC.currentTime, w = readyWeights(busWeights(suspicion));
  for (let i = 0; i < 3; i++) {
    busTarget[i] = solo >= 0 ? (solo === i ? 1 : 0) : w[i];
    stemGain[i].gain.setTargetAtTime(busTarget[i] * MUSIC_TRIM, t, .9);
  }
  color.frequency.setTargetAtTime(11000 * Math.pow(2600 / 11000, suspicion / 100), t, .9);
}
// A stem that is still downloading cannot carry its share of the mix, and handing it that share
// anyway is a hole in the music - at Suspicion 30 the whole weight is on middle, so a middle that
// has not arrived is silence. Its share goes to whichever stems can play instead, which on the way
// up means the previous arrangement simply stays put until its successor is there. When the
// successor arrives its `canplay` re-applies this and the ordinary 0.9 s crossfade takes over.
//
// If nothing at all can play - the first seconds of a slow connection - the weights are left alone
// rather than zeroed, because zeroing them is the same silence with a fade on it.
function readyWeights(w) {
  let want = 0, have = 0;
  for (let i = 0; i < 3; i++) { want += w[i]; if (stemEl[i] && stemEl[i].readyState >= 3) have += w[i]; }
  if (have < .001) return w;
  if (have >= want - .001) return w;
  const k = want / have;
  return [0, 1, 2].map(i => (stemEl[i] && stemEl[i].readyState >= 3 ? w[i] * k : 0));
}

function setSuspicion(v) { suspicion = clamp(v, 0, 100); applySuspicion(); }

// ---------------------------------------------------------------------------
// 5. Transport.
// ---------------------------------------------------------------------------
let driftTimer = null, silenceProbe = null;

// Seeking three elements at once is the one moment in a session where they can end up on
// different frames, so it waits for all three to report the seek before any of them is told to
// play. The cap is there because a browser that has not buffered the head yet will not report
// anything: four seconds late is a worse start than a start that is slightly out, and the drift
// watchdog closes a slight one within a couple of ticks anyway.
function seekAll(from, done) {
  // Only the stems that have been handed a source. Staged loading means the other two may not have
  // one yet at CLOCK IN, and waiting on a `seeked` that cannot fire is how the music came to start
  // on the four-second cap every time instead of straight away. The ones that arrive later are put
  // where the leader is by `syncNewStem`, which is the same job done at the right moment.
  const wait = stemEl.filter(el => el.src);
  let left = wait.length, fired = false;
  const finish = function () { if (!fired) { fired = true; done(); } };
  if (!left) { finish(); return; }
  const cap = setTimeout(finish, 4000);
  const one = function (el) {
    const ok = function () { if (--left === 0) { clearTimeout(cap); finish(); } };
    if (el.readyState < 1) {
      el.addEventListener('loadedmetadata', function () { try { el.currentTime = from; } catch (e) {} }, { once: true });
      el.addEventListener('seeked', ok, { once: true });
      return;
    }
    if (Math.abs(el.currentTime - from) < .01) { ok(); return; }
    el.addEventListener('seeked', ok, { once: true });
    try { el.currentTime = from; } catch (e) { ok(); }
  };
  for (const el of wait) { el.pause(); one(el); }
}

function play(fromSec) {
  ctx();
  startElements();
  stopTheme(.25);
  // Clamped against the render rather than a constant, and a second short of its end so that a
  // start point handed in by a harness cannot land inside the wrap.
  const dur = stemEl.length && stemEl[0].duration ? stemEl[0].duration : 480;
  const from = clamp(fromSec || 0, 0, Math.max(0, dur - 1));
  driftWorst = 0; driftSeeks = 0;
  running = true;
  seekAll(from, function () {
    if (!running) return;                       // a theme or a stop landed while the seek was out
    for (const el of stemEl) if (el.src) { el.playbackRate = 1; el.play().catch(function () {}); }
    const t = AC.currentTime;
    musicOut.gain.cancelScheduledValues(t);
    musicOut.gain.setValueAtTime(.0001, t);
    musicOut.gain.linearRampToValueAtTime(1, t + .35);
    startDrift();
    armSilenceProbe();
  });
  applySuspicion(true);
}

function stop(fade) {
  running = false;
  if (!AC) return;
  const f = fade === undefined ? .4 : fade, t = AC.currentTime;
  musicOut.gain.cancelScheduledValues(t);
  musicOut.gain.setValueAtTime(Math.max(.0001, musicOut.gain.value), t);
  musicOut.gain.linearRampToValueAtTime(.0001, t + f);
  stopDrift();
  // Paused after the fade rather than with it: pausing a sounding element is a click, and the
  // decoders are cheap enough that half a second of them running into silence is not worth
  // guarding against.
  setTimeout(function () { if (!running) for (const el of stemEl) el.pause(); }, (f + .1) * 1000);
}

function posSec() { return stemEl.length ? stemEl[0].currentTime : 0; }

// ---------------------------------------------------------------------------
// 5b. The drift watchdog. See DRIFT_* above for the thresholds and why they are those.
// ---------------------------------------------------------------------------
let driftWorst = 0, driftSeeks = 0;

function startDrift() {
  if (driftTimer) return;
  driftTimer = setInterval(checkDrift, DRIFT_MS);
}
function stopDrift() {
  clearInterval(driftTimer); driftTimer = null;
  for (const el of stemEl) el.playbackRate = 1;
}

function checkDrift() {
  if (!running || stemEl.length < 3 || stemEl[0].paused) return;
  const dur = stemEl[0].duration;
  const lead = stemEl[0].currentTime;
  for (let i = 1; i < 3; i++) {
    const el = stemEl[i];
    if (!el.src || el.paused || !el.duration) continue;
    // One stem can wrap a tick before another, which reads as eight minutes of drift rather than
    // the few milliseconds it is. Folded into the half-loop either side of zero before it is
    // judged, so a wrap costs nothing.
    let d = el.currentTime - lead;
    if (dur > 1) { while (d > dur / 2) d -= dur; while (d < -dur / 2) d += dur; }
    const mag = Math.abs(d);
    // Counted only while the meter is actually asking for this stem. A stem still downloading
    // behind the one that is playing falls arbitrarily far behind and is put back with a free
    // seek, and reporting that as drift would make an ordinary slow connection read like a fault
    // in the crossfade. The number is meant to answer "are the arrangements anyone can hear still
    // one piece of music", so that is what it measures.
    const audible = busTarget[i] >= .02;
    if (audible && mag > driftWorst) driftWorst = mag;
    if (mag < DRIFT_DEAD) { el.playbackRate = 1; continue; }
    if (mag > DRIFT_HARD || !audible) {
      el.playbackRate = 1;
      try { el.currentTime = lead; if (audible) driftSeeks++; } catch (e) {}
      continue;
    }
    el.playbackRate = 1 - clamp(d / 4, -DRIFT_RATE, DRIFT_RATE);
  }
}

// ---------------------------------------------------------------------------
// 5c. The silence probe.
// ---------------------------------------------------------------------------
// The one failure this path has that reports itself as success. A media element whose origin the
// graph will not accept plays perfectly - `currentTime` advances, no error fires - and arrives at
// the destination as zeroes. `supported()` rules out the case that causes it, and this catches
// whatever else does the same thing.
//
// It reads the music bus ahead of the mute, so a player who muted before CLOCK IN is not mistaken
// for a broken graph, and it runs once: it is looking for a graph that was never going to work,
// not for a quiet bar.
function armSilenceProbe() {
  if (silenceProbe || failed) return;
  const an = AC.createAnalyser();
  an.fftSize = 512;
  musicDuck.connect(an);
  const buf = new Float32Array(an.fftSize);
  let peak = 0, sounded = 0, ticks = 0;
  const stop = function () {
    clearInterval(silenceProbe); silenceProbe = null;
    try { musicDuck.disconnect(an); } catch (e) {}
  };
  silenceProbe = setInterval(function () {
    // Only a tick where a stem the meter is asking for could actually be producing sound counts.
    // Without that test the probe reads a slow connection as a broken graph: on a 400 kbit link
    // the loading gate lets the player in before the music has arrived, the analyser sees exactly
    // the zeroes it is looking for, and a build that was thirty seconds from playing perfectly
    // gives up and hands the session to the synthesiser. It is looking for a graph that was never
    // going to work, not for a file that has not landed yet.
    let live = false;
    for (let i = 0; i < 3; i++) {
      const el = stemEl[i];
      if (busTarget[i] >= .02 && el && el.src && el.readyState >= 3 && !el.paused) live = true;
    }
    if (live) {
      an.getFloatTimeDomainData(buf);
      for (let i = 0; i < buf.length; i++) { const v = Math.abs(buf[i]); if (v > peak) peak = v; }
      sounded++;
    }
    // Two seconds of a mix that ought to be audible, gathered whenever they happen. The outer cap
    // is there so the analyser does not sit in the graph for the length of a run on a connection
    // that never delivers - and it ends the probe without a verdict, because no verdict is the
    // honest answer to never having heard anything.
    if (sounded < 8) { if (++ticks > SILENCE_CAP) stop(); return; }
    stop();
    if (peak < 1e-4) fail('silent graph');
  }, 250);
}

// ---------------------------------------------------------------------------
// 6. Cues.
// ---------------------------------------------------------------------------
// Decoded into an OfflineAudioContext rather than into the playing one, which is what lets this
// run at boot instead of on the first tap: `decodeAudioData` needs a context to decode into, but
// not a live one, and an offline context is not subject to the autoplay policy. The buffer it
// produces plays in the real context whatever the two sample rates turn out to be - a source node
// resamples a buffer that does not match.
//
// Which matters because the bank is 187 seconds of stereo and its decode is not instant. Doing it
// while the title screen is being read means the first stamp of the run has a buffer to read from.
function decodeCtx() {
  if (AC) return AC;
  const Off = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!Off) return ctx();
  try { return new Off(2, 1, 48000); } catch (e) { return ctx(); }
}

function loadBank(url) {
  if (bankLoad === 'loading' || bankLoad === 'ready') return;
  bankLoad = 'loading';
  const ac = decodeCtx();
  fetch(url).then(function (r) {
    if (!r.ok) throw new Error('bank ' + r.status);
    bankTotal = Number(r.headers.get('content-length')) || SFX_BANK_BYTES || 0;
    // Read in chunks rather than straight to an ArrayBuffer, purely so the title screen can say
    // how far along it is. A bar that moves is the difference between a wait and a hang, and on a
    // slow connection this is the wait the whole loading gate exists for.
    if (!r.body || !bankTotal) return r.arrayBuffer();
    const reader = r.body.getReader(), parts = [];
    return (function pump() {
      return reader.read().then(function (res) {
        if (res.done) {
          const out = new Uint8Array(bankGot);
          let at = 0;
          for (const p of parts) { out.set(p, at); at += p.length; }
          return out.buffer;
        }
        parts.push(res.value); bankGot += res.value.length;
        return pump();
      });
    })();
  }).then(function (data) {
    // The callback form, not the promise one: older mobile Safari only has this signature, and the
    // two-argument call works on every engine that has either.
    ac.decodeAudioData(data, function (buf) {
      bankBuf = buf; bankLoad = 'ready'; bankGot = bankTotal;
      beginStage(0);                     // the music only starts downloading once the cues are in
    }, function () { bankLoad = 'failed'; fail('bank decode'); beginStage(0); });
  }).catch(function () { bankLoad = 'failed'; fail('bank fetch'); beginStage(0); });
}

// One slice, gated so it cannot run past the end of the buffer. The render is a little shorter
// than its own map - the tail of the last cue was trimmed - so the clamp is load-bearing for
// exactly one segment and free insurance for the other sixty-five.
function playSlice(t, off, len, gain) {
  const dur = Math.min(len, bankBuf.duration - off);
  if (dur <= .02) return;
  const src = AC.createBufferSource();
  src.buffer = bankBuf;
  const g = AC.createGain();
  const v = Math.max(.0002, gain);
  const fade = Math.min(BANK_FADE, dur / 3);
  g.gain.setValueAtTime(.0001, t);
  g.gain.linearRampToValueAtTime(v, t + fade);
  g.gain.setValueAtTime(v, t + dur - fade);
  g.gain.linearRampToValueAtTime(.0001, t + dur);
  src.connect(g); g.connect(sfxBus);
  src.start(t, off, dur);
  src.stop(t + dur + .02);
  // A buffer source disconnects itself on ended; the gain in front of it does not, and sixty of
  // them an hour left connected is how the old engine leaked its graph.
  src.onended = function () { try { src.disconnect(); g.disconnect(); } catch (e) {} };
}

// The rule the crossfade uses, applied to the cue: every mode above the audibility floor sounds at
// once, at the weight its stem is carrying, so a cue heard during a transition is in both timbres
// exactly as the music under it is.
function playSfx(id) {
  if (!AC || bankLoad !== 'ready') return;
  const seg = BANK[id];
  if (!seg) return;
  if (AC.state === 'suspended') AC.resume();
  const w = solo >= 0 ? [0, 1, 2].map(i => (i === solo ? 1 : 0)) : busWeights(suspicion);
  const t = AC.currentTime + .03;
  for (let m = 0; m < 3; m++) if (w[m] > BUS_AUDIBLE) playSlice(t, seg[m * 2], seg[m * 2 + 1], w[m]);
  // Ducking is a property of the cue and not of how it was made, so it is read off the engine's
  // table rather than copied into a second one. That table is a plain object built at load; the
  // lookup does not create a context or start anything.
  const d = WTHAudio.cueDuck(id);
  if (d) duck(d[0], d[1]);
}

function duck(amount, dur) {
  if (!AC) return;
  const t = AC.currentTime;
  musicDuck.gain.cancelScheduledValues(t);
  musicDuck.gain.setValueAtTime(musicDuck.gain.value, t);
  musicDuck.gain.linearRampToValueAtTime(Math.max(.15, 1 - amount), t + .04);
  musicDuck.gain.linearRampToValueAtTime(1, t + .04 + dur);
}

// ---------------------------------------------------------------------------
// 7. The two endings.
// ---------------------------------------------------------------------------
// The loop goes out under the theme rather than before it: a run that ends in silence and then
// starts a piece of music reads as a load, not as an ending. Half a second of overlap is enough
// for one to hand over to the other.
//
// Nothing here fades the theme out at its own end. `defeat` is rendered with its exit already in
// it - the last three seconds run -24, -30, -41 dBFS - and doubling that with a ramp would only
// make it disappear early. `victory` ends where it ends.
function playTheme(which) {
  const el = themeEl[which];
  if (!el) return;
  ctx();
  stop(.5);
  themeName = which;
  const t = AC.currentTime;
  try { el.currentTime = 0; } catch (e) {}
  el.play().catch(function () {});
  themeGain.gain.cancelScheduledValues(t);
  themeGain.gain.setValueAtTime(.0001, t);
  themeGain.gain.setValueAtTime(.0001, t + .15);
  themeGain.gain.linearRampToValueAtTime(1, t + .5);
}

function stopTheme(fade) {
  if (!themeName || !AC) return;
  const el = themeEl[themeName], f = fade === undefined ? .3 : fade, t = AC.currentTime;
  themeName = null;
  themeGain.gain.cancelScheduledValues(t);
  themeGain.gain.setValueAtTime(Math.max(.0001, themeGain.gain.value), t);
  themeGain.gain.linearRampToValueAtTime(.0001, t + f);
  setTimeout(function () { try { el.pause(); el.currentTime = 0; } catch (e) {} }, (f + .1) * 1000);
}

// ---------------------------------------------------------------------------
// 8. Public interface. The engine's names, so 07_audio.js can hold either.
// ---------------------------------------------------------------------------
return {
  /** Whether this browser and this protocol can play the bundled files at all. Checked before
   *  anything is fetched; see the comment on supported(). */
  supported: supported,

  /** Called if the file path gives up after it has already been chosen - a file that will not
   *  load, a bank that will not decode, a graph that turns out to be silent. One argument, a
   *  short reason, and it fires at most once. */
  //
  //  A failure can land BEFORE anyone has registered for it: the downloads start at boot and the
  //  callback is wired on the first tap, so a stem that 404s has already given up by the time
  //  there is anybody to tell. Hence the replay - and deferred rather than immediate, because the
  //  caller is mid-way through choosing a backend and is not ready to be told it chose wrong.
  onFail(fn) {
    failCb = fn;
    if (failed && fn) setTimeout(function () { fn(failReason); }, 0);
    return this;
  },

  /** Start loading, and nothing else. No context, no gesture, no sound - safe to call at boot.
   *  Only the cue bank actually starts here; the five media elements are created empty and are
   *  given their sources a stage at a time behind it. See STAGES. */
  preload(bankUrl) { createElements(); if (bankUrl) loadBank(bankUrl); else beginStage(0); return this; },

  /** How far the load has got, 0..1, and whether the run may start.
   *
   *  Two things are waited for and the second is nearly free. The cue bank, because a cue is
   *  instant feedback on a tap and cannot be late, and it is one fetch that is worth nothing until
   *  it is whole. And the heaven stem at `readyState` 4 - the browser's own promise that it can
   *  play the file to the end without stalling, not merely start it. That promise arrives about
   *  half a second after the stem begins downloading, at every link speed measured, because the
   *  renders are 71 kbit content and any connection at all can carry them in real time; what the
   *  browser is waiting for is a lead and a rate, not the file.
   *
   *  The other two stems are not waited for. They are minutes away at the meter's fastest, and
   *  `readyWeights` holds the previous arrangement up if one of them is somehow still missing.
   *
   *  A failure opens the gate at once rather than holding it to the timeout: the fallback has the
   *  session by then and there is nothing left to arrive. */

    return {
      ready: failed || bankLoad === 'failed' || (bankLoad === 'ready' && !!heaven && heaven.readyState >= 4),
      bank: bankLoad,
      // Two thirds of the bar is the bank, because that is the part that takes the time; the last
      // third is the stem getting its lead, so the bar does not sit full while nothing can play.

  /** Create the AudioContext and bless the five media elements. Call FROM A TAP HANDLER. */
  init() { ctx(); startElements(); return this; },

  /** Start the soundtrack loop. fromSec is an optional starting point. */
  play(fromSec) { play(fromSec || 0); return this; },

  /** Stop with a fade (0.4 s by default). */
  stop(fade) { stop(fade); return this; },

  /** Suspicion 0..100. Safe to call every frame; the ramp is smooth on its own. */
  setSuspicion(v) { setSuspicion(v); return this; },

  /** A cue. Takes the weight of the current mix by itself, and inside a transition sounds in
   *  both timbres. Silent until the bank has decoded, and never an error before then. */

  /** Start loading the cue bank. Call FROM A TAP HANDLER, like init - it needs a context to
   *  decode into. Fire and forget. */
  bank(url) { loadBank(url); return this; },

  /** 'idle', 'loading', 'ready' or 'failed'. */
  bankState() { return bankLoad; },

  /** `readyState` per file, by name. 0 is nothing, 3 is "can start", 4 is "can play to the end
   *  without stalling" - the browser's own estimate, and the one the loading gate reads. */
  readyStates() {
    const o = {};
    for (let i = 0; i < stemEl.length; i++) o[STEMS[i]] = stemEl[i].readyState;
    for (const n in themeEl) o[n] = themeEl[n].readyState;
    return o;
  },

  /** Ending theme: 'victory' or 'defeat'. Takes the loop down under itself. */
  theme(which) { playTheme(which); return this; },

  /** Volume 0..1. */
  volume(v) {
    if (AC) userVol.gain.setTargetAtTime(Math.pow(clamp(v, 0, 1), 1.6), AC.currentTime, .05);
    return this;
  },

  /** Play one mode alone, 0..2, or -1 for the meter's own mix. The dev panel's A/B for the
   *  crossfade: it is the only way to hear a stem the meter is not currently asking for. */
  solo(i) { solo = (i === undefined || i === null) ? -1 : (i | 0); applySuspicion(true); return this; },

  /** Present so that a caller holding either player can call them without asking which it is.
   *  Nothing in the file path has tiers, a hall or a channel count to cull. */
  quality() { return this; },
  reverb() { return this; },
  cull() { return this; },
  mute() { return this; },

  /** Current state, for the dev panel. */
  state() {
    return {
      backend: 'files', playing: running, theme: themeName,
      pos: posSec(), total: stemEl.length && stemEl[0].duration ? stemEl[0].duration : 0,
      suspicion, bank: bankLoad, failed: failed, failReason: failReason,
      stage: stageIdx,
      // The two numbers that say whether the three elements are still one piece of music: the
      // worst offset seen since the loop started, in ms, and how many times a stem had to be
      // seeked back rather than walked back.
      drift: Math.round(driftWorst * 1000), seeks: driftSeeks,
      solo: solo,
      gains: stemGain.map(g => g.gain.value),
      sampleRate: AC ? AC.sampleRate : 0,
      baseLatency: AC ? (AC.baseLatency || 0) : 0,
      outputLatency: AC ? (AC.outputLatency || 0) : 0,
    };
  },

  /** Reference tables. */
  SFX_IDS: Object.keys(BANK),
  STEMS: STEMS.slice(),
};

})();

  // the hell mix. It is a luxury: on the low tier the shaper runs at rate and the aliasing it
  // lets through lands in a bus that is already meant to sound damaged.
  buildDistTable();
  distIdx = 0; shaper.curve = distTable[0];
  shaper.oversample = qLevel ? '2x' : 'none';
  shaper.connect(color);

  for (let tr = 0; tr < 3; tr++) {
    const g = AC.createGain(); g.gain.value = tr === 0 ? 1 : 0;
    g.connect(tr === 2 ? shaper : color); bus.push(g);
    const w = AC.createGain(); w.gain.value = tr === 0 ? 1 : 0;
    w.connect(hall); busWet.push(w);
    for (let ch = 0; ch < 16; ch++) {
      const dg = AC.createGain(); dg.gain.value = 1; dg.connect(g);
      const wg = AC.createGain(); wg.gain.value = WET[tr][ch]; wg.connect(w);
      const trio = [];
      for (let s = -1; s <= 1; s++) {
        const p = AC.createStereoPanner ? AC.createStereoPanner() : AC.createGain();
        if (p.pan) p.pan.value = clamp(PAN[ch] + s * SPREAD, -1, 1);
        p.connect(dg); p.connect(wg); trio.push(p);
      }

    }
