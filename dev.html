// running - happens here and now. What belongs to tomorrow is written into `state.pact` and read
// at the point it applies, so nothing has to be undone when the day is over.

function pactCard(id) {
  for (const p of PACTS) if (p.id === id) return p;
  return null;
}

// Draws the next contract, clearing the last one's effects first. That is the moment the day it
// paid for is over - not the start of a day, because the shop stands between the two and the
// staff discount has to survive it.
function dealPact() {
  state.pact = neutralPact();
  if (!state.night.deck.length) shufflePactDeck();
  state.night.card = pactCard(state.night.deck.shift());
  state.night.in = 0;
  state.night.choice = -1;
  state.night.flash = 0;
}

function applyPact(id, accepted) {
  const p = state.pact;

  if (id === 'bulk') {
    if (accepted) p.preFill = PACT.bulk;

  } else if (id === 'extend') {
    // Immediate, and it is the clearest case of a label that is true and a consequence that is
    // not obvious: every contract upstairs now runs out at roughly the same moment.
    if (accepted) {
      for (const slot of state.heavenSlots) {
        const guest = slot.guest;
        if (!guest || guest.expired) continue;
        guest.contract *= 2;
        guest.contractMax = Math.max(guest.contractMax, guest.contract);
      }
    }

  } else if (id === 'quiet') {
    if (accepted) {
      p.arrivalMult = 1 / PACT.quietArrivals;
      addSuspicion(-PACT.quietRelief);
    }

  } else if (id === 'donor') {
    if (accepted) {
      state.credits += PACT.donorCredits;
      state.stats.creditsTotal += PACT.donorCredits;
      p.suspDrip = PACT.donorDrip;
    }

  } else if (id === 'overtime') {
    if (accepted) {
      p.dayBonus = PACT.overtimeSeconds;
      p.quotaMult = PACT.overtimeQuota;
    }

  } else if (id === 'choir') {
    if (accepted) {
      p.noiseMult = PACT.choirNoise;
      p.auraMult = PACT.choirAura;
    }

  } else if (id === 'renovation') {
    if (accepted) {
      state.credits += PACT.renovationCredits;
      state.stats.creditsTotal += PACT.renovationCredits;
      p.maint = true;
    }

  } else if (id === 'discount') {
    if (accepted) p.priceMult = PACT.discount;
    else addSuspicion(PACT.declineSuspicion);

  } else if (id === 'rehearsal') {
    if (accepted) {
      addSuspicion(-PACT.rehearsalRelief);
      p.quotaMult = PACT.rehearsalQuota;
    }

  } else if (id === 'paperwork') {
    if (accepted) {
      p.deskMult = PACT.deskSpeed;
      p.contractMult = PACT.contractShort;
    }

  } else if (id === 'complaints') {
    // The GDD charged for declining and left accepting free, which is not a card at all - one
    // button was strictly better and nobody would ever press the other. The joke survives on the
    // decline label; the cost moved to the side that buys something.
    if (accepted) {
      spendCredits(PACT.complaintsCredits);
      p.noOverflow = true;
    }
  }
}

// --- The verdict (GDD 11) -----------------------------------------------------
// One title over the statistics, read off numbers that were already being collected. Checked from
// the top down: the first description that fits is the one the run gets, so a slumlord who also
// never denied anybody is still a slumlord.
function runVerdict() {
  const st = state.stats;
  const sorted = st.soulsProcessed;
  const sampled = sorted >= VERDICT_MIN_SOULS;
  if (sampled && st.toOps > sorted / 2) return VERDICTS.slumlord;
  if (sampled && st.denied < sorted * 0.1) return VERDICTS.saint;
  if (st.suspPeak >= 90) return VERDICTS.nightmare;
  if (state.quotaMisses === 0 && st.daysSurvived > 0) return VERDICTS.closer;
  return VERDICTS.middle;
}

// ==========================================================================
// 13_fsm.js
// ==========================================================================

// Screen flow and the day clock (GDD 2). The shop, the quota settlement and both lose screens
// are added at build steps 5 and 6; the transitions they hook into already exist here.

function gotoTitle() {
  state.screen = SCREEN.TITLE;
}

function startDay(day) {
  const cfg = dayConfig(day);
  state.day = day;
  // Overtime is the one contract that buys time rather than spending it (GDD 8.3), and it is added
  // here so the clock, the arrival budget and the quota all agree about how long the day is.
  state.dayLen = cfg.len + state.pact.dayBonus;
  state.dayTime = state.dayLen;
  // The queue and the card carry over between days (GDD 5.4): a night does not clear the backlog,
  // it only pauses it. Only the arrival clock restarts, with a grace period at the top of the day.
  state.arrivalTimer = FIRST_ARRIVAL;
  // Day one holds until the player's first swipe (GDD 2). It is the day that exists to be read -
  // the memo, two unfamiliar stats, the arrows around the card - and a clock running through that
  // punishes the player for doing what the game just asked. From day two the clock runs from
  // START DAY, because by then a pause before swiping is strategy rather than onboarding.
  state.dayHold = day === 1;
  // Both floors open at their left end. Souls fill the leftmost free slot, so that is where the
  // day starts from however far the player had scrolled when the last one ended.
  resetStrips();
  // The morning Reputation payment was removed on 2 September with the two attractions that made
  // it: nothing in the shop gives Reputation any more, so the call had nothing left to add. The
  // meter moves on events alone now - a contract carried to term, a riot, a refusal, a guest
  // turned away at the door - which is what it always meant.
  applyPactToDay();
  // A beat that was still on screen when the clock ran out does not survive the night: it is drawn
  // only during a day, so it would otherwise sit frozen in state and reappear half faded on the
  // next one. Only a beat that does not hold can get here - a holding one has stopped the clock,
  // so the day it belongs to cannot end underneath it.
  tutorialDismiss();
  state.screen = SCREEN.DAY_ACTIVE;
}

// The day is over and the bill comes first: the plate exists to report the settlement, so the
// settlement has to have happened before it goes up. The second missed quota is recorded here but
// acted on after the plate, so the player gets to read the number that ended the run.
function endDay() {
  state.stats.daysSurvived = state.day;
  // The wage first, so the Credits the shop opens with are the Credits the player actually has,
  // and so an associate who could not be paid has already gone before the plate reports the day.
  payStaff();
  settleQuota();
  if (state.screen !== SCREEN.DAY_ACTIVE) return;   // the penalty itself filled the meter

  state.plateTime = DAY_END_PLATE;
  state.screen = SCREEN.DAY_END;
  sfx(state.dayResult.state === 'met' ? 'dayEnd' : 'quotaMiss');
}

// The night contract (GDD 8.3). What the last one did to the day just played is cleared as the
// next card is dealt, so the shop that follows still sees tonight's discount.
function openNight() {
  dealStaff();
  dealPact();
  if (!state.night.card) { openShop(); return; }
  state.screen = SCREEN.NIGHT_CARD;
  sfx('shop');
}

// Everything a signed contract owes the coming day and could not do the night before: a pre-filled
// queue needs a day to arrive into, and a suite cannot go under scaffolding while the day it
// belongs to is still being played.
function applyPactToDay() {
  for (const slot of state.heavenSlots) slot.maint = false;
  if (state.pact.maint) {
    // The highest slot the player owns, occupied or not. An occupied one keeps its guest and keeps
    // paying - it simply cannot be filled again once it empties, which is the whole cost.
    let last = -1;
    for (let i = 0; i < state.heavenSlots.length; i++) if (state.heavenSlots[i].unlocked) last = i;
    if (last >= 0) state.heavenSlots[last].maint = true;
  }
  for (let i = 0; i < state.pact.preFill; i++) {
    if (state.queue.length < QUEUE_MAX) state.queue.push(makeSoul(state.day));
  }
}

function answerPact(accepted) {
  const card = state.night.card;
  if (!card || state.night.choice >= 0) return;
  state.night.choice = accepted ? 0 : 1;
  state.night.flash = SHOP_FLASH;
  applyPact(card.id, accepted);
  sfx(accepted ? 'buy' : 'deny');
}

function openShop() {
  if (!state.staff.offer.length) dealStaff();
  state.shopIn = 0;
  // Every night opens on BUILD, so the panel is never where the last night left it - except on the
  // one night a page arrives, which opens on that page. That is the whole of the staged unlock
  // (GDD 9): a system the player never taps is worth less than no system at all, and hoping they
  // poke an unfamiliar word is not a plan.
  const fresh = newShopPage();
  state.shopPage = fresh > 0 ? fresh : 0;
  state.shopFlash.index = -1;
  state.shopFlash.t = 0;
  state.screen = SCREEN.SHOP;
  sfx('shop');
}

// Leaving the end-of-day plate: out of the run, into the last screen, or into the shop. The last
// day is won by surviving it - two missed quotas end the run on any day, including that one, and
// one missed quota on the last day is a bad merger rather than a failed one.
function afterDayEnd() {
  if (state.quotaMisses >= QUOTA_MAX_MISSES) {
    loseGame('quota');
  } else if (state.day >= LAST_DAY) {
    state.endTime = 0;
    state.screen = SCREEN.WIN;
    audioTheme('victory');
  } else {
    openNight();
  }
}

// A loss can land in the middle of any day, so it is a call rather than a transition out of a
// screen. The audit is a three-second beat before the numbers: an ending that cuts straight to a
// statistics table reads as a crash. `daysSurvived` is not touched here - it already holds the
// last day that was actually finished, and the one being played does not count.
function loseGame(reason) {
  if (state.screen === SCREEN.AUDIT || state.screen === SCREEN.LOSE) return;
  state.loseReason = reason;
  state.auditTime = AUDIT_TIME;
  state.screen = SCREEN.AUDIT;
  addShake(6, 0.4);
  haptic(HAPTIC.lose);
  // The theme starts with the beam, not with the statistics screen three seconds later: the
  // collapse is the ending, and the numbers afterwards are the receipt.
  audioTheme('defeat');
}

function updateGame(dt) {
  switch (state.screen) {
    case SCREEN.DAY_ACTIVE:
      // Onboarding runs ahead of the day and can stop everything behind it (GDD 8.4): a beat that
      // asks the player to do something holds the clock, the arrivals and the contracts until it
      // has been tapped away. It is checked before the day-one hold because the first beat fires
      // during that hold, off the card it is talking about.
      tutorialCheck();
      updateTutorial(dt);
      // The onboarding gate (GDD 6.5, 8.4). It stops the day exactly as any other holding beat
      // does - no clock, no arrivals, no contracts, no production - and then hands back the two
      // systems the gesture it is waiting for cannot do without: the strip, so the suite under the
      // spotlight can be reached and so the autoscroll that centred it lands, and the hold itself,
      // which is the only way out of the plate.
      if (tutorialActing()) { updateStrips(dt); updateServiceHold(dt); break; }
      if (state.tutorial.hold) break;

      // The held first day: the clock, the drip and the floors all wait, and arrivals run only
      // until the first soul is on the desk. That soul is what the hold is waiting to be swiped,
      // so its card still has to rise; everything else has nothing to do yet anyway, because
      // nothing has been placed. Any of the three assigned swipes releases it (sortCard).
      if (state.dayHold) {
        if (!state.card) updateArrivals(dt);
        updateCard(dt);
        break;
      }
      state.dayTime -= dt;
      // Ahead of everything that reads it: the arrival clock, the Suspicion drip and the queue all
      // price themselves off Buzz, and they should all price themselves off the same value.
      updateBuzz(dt);
      updateSouls(dt);
      updateStrips(dt);
      updateFloors(dt);
      updateEconomy(dt);
      updateSupplies(dt);
      updateSuspicion(dt);
      // The day can only end if the audit has not already ended it.
      if (state.screen !== SCREEN.DAY_ACTIVE) break;
      if (state.dayTime <= 0) {
        state.dayTime = 0;
        endDay();
      }
      break;

    case SCREEN.DAY_END:
      state.plateTime -= dt;
      if (state.plateTime <= 0) afterDayEnd();
      break;

    case SCREEN.NIGHT_CARD:
      updateNight(dt);
      break;

    case SCREEN.SHOP:
      updateShop(dt);
      // The staged unlock explains itself through the Associate rather than through a caption over
      // the grid (GDD 9). Fired once the panel has finished sliding up, because the beat is about
      // the tab row and the tab row is still moving until then.
      if (state.shopIn >= 1) shopPageBeat();
      if (tutorialOnShop()) updateTutorial(dt);
      break;

    case SCREEN.AUDIT:
      state.auditTime -= dt;
      if (state.auditTime <= 0) {
        state.auditTime = 0;
        state.endTime = 0;
        state.screen = SCREEN.LOSE;
        sfx('lose');
      }
      break;

    // The ending screens have no simulation left to run and one thing that still moves: the
    // Associate saying the line that was written for this particular run (GDD 8.4). It is a fresh
    // line on a screen the player has never seen, so he says it rather than being found having
    // already said it.
    case SCREEN.WIN:
    case SCREEN.LOSE:
      state.endTime += dt;
      break;
  }

  // Visual timers run on every screen so an animation started on the last second of a day plays
  // out over the plate rather than freezing in mid-air.
  updateSoulFx(dt);
  updateNotes(dt);
}

function handleGesture(g) {
  // The sound toggle outranks every screen: it is drawn on all of them, and the corner of the HUD
  // it occupies is a target for nothing else, so it is answered before the screen is consulted.
  if (soundButtonVisible() && tapHit(g, soundButtonRect())) { toggleSound(); return; }

  switch (state.screen) {
    case SCREEN.TITLE:
      // The button is drawn as a progress bar while the cue bank is still arriving and a tap on it
      // is swallowed rather than queued. The raw pointerdown behind this has already unlocked the
      // audio (06_input.js), so tapping the shut button is not wasted - it is what creates the
      // context the bank will be played through.
      if (tapHit(g, clockInButtonRect()) && !audioGated()) {
        startMusic();
        sfx('start');
        startDay(1);
      }
      break;

    case SCREEN.DAY_ACTIVE:
      // The gate is asked about first, because it is a holding beat that must NOT be dismissed by
      // the line below: it is waiting for a gesture named in its own text and a tap is not that
      // gesture. The one tap it answers is a tap on the suite it is pointing at, which gets the
      // same "not like that" shake a wreck has always given - the answer that sends the finger
      // back down to rest instead of away.
      if (tutorialActing()) { if (g.type === 'tap') tapWreck(g); break; }

      // A holding beat eats whatever gesture dismisses it, swipes included. Letting one through
      // would file the soul the beat is still explaining, which is the single outcome that makes
      // the lesson worthless - and it costs the player one flick, once in a run.
      if (tutorialHolding()) { tutorialDismiss(); break; }

      // The two consumable slots sit in the HUD, which is the one zone that scrolls nothing and
      // owns no gesture of its own - which is exactly why they were put there (GDD 9.1). Answered
      // before the floors, because the HUD is above them and nothing else is up there.
      if (g.type === 'tap' && handleSupplyTap(g)) break;

      // The work zone is the sorting field. A swipe that starts outside the work zone belongs to a floor strip, which follows the
      // finger live in updateStripDrag and has nothing left to do on release.
      if (g.type === 'swipe' && pointInRect(g.x, g.y, workZoneRect())) handleCardSwipe(g.dir);
      else if (g.type === 'tap') handleFloorTap(g);
      break;

    case SCREEN.DAY_END:
      if (g.type === 'tap') afterDayEnd();     // the plate is skippable, it is not a gate
      break;

    // Two buttons and no clock. Once an answer is given the card reports what it did and the same
    // tap area becomes the way on, so the player is never told the consequence and then hurried
    // past it.
    case SCREEN.NIGHT_CARD:
      if (g.type !== 'tap' || state.night.in < 1) break;
      if (state.night.choice >= 0) {
        if (tapHit(g, nightContinueRect())) openShop();
      } else if (tapHit(g, nightButtonRect(0))) {
        answerPact(true);
      } else if (tapHit(g, nightButtonRect(1))) {
        answerPact(false);
      }
      break;

    // The shop is the one screen with no clock on it. Nothing here is skippable and nothing
    // expires: the player leaves it by pressing START DAY and not before.
    case SCREEN.SHOP:
      // A beat introducing a tab eats the gesture that dismisses it, exactly as the day beats do:
      // the tap that puts the plate away must not also buy the item underneath it.
      if (tutorialOnShop() && tutorialHolding()) { tutorialDismiss(); break; }
      if (g.type === 'tap') handleShopTap(g);
      break;

    // The audit itself takes no input: three seconds is short enough to sit through, and a tap
    // that skipped it would usually be the tap the player was already making when it started.
    case SCREEN.LOSE:
    case SCREEN.WIN:
      if (tapHit(g, playAgainButtonRect())) {
        resetGame();
        gotoTitle();
      }
      break;
  }
}

// A tap on a filled slot spends it; a tap on the banner of an armed Contract Termination puts the
// question away again. An armed consumable that could not be cancelled would be a state the player
// can walk into and not out of, which is worse than the deadlock it exists to solve.
function handleSupplyTap(g) {
  if (state.active.arm && tapHit(g, supplyBannerRect())) {
    state.supplies[freeSupplySlot() >= 0 ? freeSupplySlot() : 0] = state.active.id;
    clearSupply();
    sfx('refused');
    return true;
  }
  // Nearest centre rather than first hit. The slots are 18 px wide and 3 apart, and tapHit grows
  // every target to HIT_MIN (38), so the two boxes overlap by 17 px whatever the layout does - two
  // targets 21 px apart cannot both have a 38 px box and not meet. First-hit-wins hands that whole
  // strip to the left slot, which eats the left third of the right slot's own drawing. Splitting it
  // by distance puts the boundary where the finger means it: halfway between the two.
  let best = -1, bestD = Infinity;
  for (let i = 0; i < SUPPLY_SLOTS; i++) {
    const r = supplySlotRect(i);
    if (!tapHit(g, r)) continue;
    const d = Math.abs(g.x - (r.x + r.w / 2));
    if (d < bestD) { bestD = d; best = i; }
  }
  if (best < 0) return false;
  if (!state.supplies[best]) return false;     // an empty slot is not a target, it is decoration
  useSupply(best);
  return true;
}

function handleShopTap(g) {
  // Nothing is buyable while the panel is still sliding: the plate before it auto-advances, so a
  // tap aimed at skipping the plate can still be in flight when the shop arrives under it.
  if (state.shopIn < 1) return;

  if (tapHit(g, startDayButtonRect())) {
    startDay(state.day + 1);
    sfx('start');
    return;
  }
  for (const i of unlockedShopPages()) {
    if (tapHit(g, shopTabRect(i))) { selectShopPage(i); return; }
  }
  // Only the page on screen is buyable. A cell the player cannot see must not be reachable by a
  // hit box that grew to HIT_MIN over the top of it.
  if (currentShopPage() === 'staff') {
    if (state.staff.hired && tapHit(g, staffFireRect())) { fireStaff(); return; }
    for (let i = 0; i < state.staff.offer.length; i++) {
      if (!tapHit(g, staffCellRect(i))) continue;
      // Negative flash indices belong to the staff grid, so a hired candidate and a bought item
      // never claim the same cell highlight.
      if (hireStaff(state.staff.offer[i])) flashShopCell(-1 - i, true);
      return;
    }
    return;
  }
  for (const i of shopPageItems(currentShopPage())) {
    if (tapHit(g, shopCellRect(i))) { buyItem(i); return; }
  }
}

// ==========================================================================
// 14_fx.js
// ==========================================================================

// Feedback effects (GDD 10): the camera shake, the verdict stamp and the haptics. Floating
// numbers live with the souls that emit them; everything here is global to the frame.

const Fx = {
  time: 0,          // seconds since boot, the clock every free-running animation reads
  shakeMag: 0,
  shakeTime: 0,
  shakeDur: 0,
  offsetX: 0,
  offsetY: 0,
  stamp: null       // the verdict on the docket that just left, see addStamp
};

// --- Stamps -------------------------------------------------------------------
// One at a time. Two verdicts on the desk at once would overlap into an unreadable block, so a new
// stamp replaces the one before it - which is what the desk itself does with the docket.
function addStamp(text, color) {
  Fx.stamp = { text: text, color: color, t: 0, tilt: rng() < 0.5 ? -STAMP_TILT : STAMP_TILT };
}

function stampLife() {
  return STAMP_SLAM + STAMP_HOLD + STAMP_FADE;
}

// --- Haptics ------------------------------------------------------------------
// Guarded rather than assumed: iOS Safari has no vibration API at all, and a desktop browser
// reports one and then does nothing with it. Both are silent no-ops, which is the correct
// behaviour - haptics are a bonus channel, never the only report of an event.
const CAN_VIBRATE = typeof navigator !== 'undefined' && 'vibrate' in navigator;

function haptic(pattern) {
  if (!CAN_VIBRATE) return;
  // Some browsers throw rather than returning false when the page has no gesture behind the call.
  try { navigator.vibrate(pattern); } catch (e) { void e; }
}

// PLAY AGAIN must not inherit the shake or the stamp of the run that just ended.
function resetFx() {
  Fx.stamp = null;
  Fx.shakeMag = 0;
  Fx.shakeTime = 0;
  Fx.offsetX = 0;
  Fx.offsetY = 0;
}

// Amplitudes never stack: the strongest active shake wins (GDD 10).
function addShake(magnitude, duration) {
  if (magnitude >= Fx.shakeMag || Fx.shakeTime <= 0) {
    Fx.shakeMag = magnitude;
    Fx.shakeDur = duration;
    Fx.shakeTime = duration;
  }
}

function updateFx(dt) {
  Fx.time += dt;
  if (Fx.stamp) {
    Fx.stamp.t += dt;
    if (Fx.stamp.t >= stampLife()) Fx.stamp = null;
  }
  if (Fx.shakeTime > 0) {
    Fx.shakeTime -= dt;
    const k = Math.max(0, Fx.shakeTime / Fx.shakeDur);
    const amp = Fx.shakeMag * k;
    Fx.offsetX = Math.round(rngRange(-amp, amp));
    Fx.offsetY = Math.round(rngRange(-amp, amp));
    if (Fx.shakeTime <= 0) { Fx.shakeMag = 0; Fx.offsetX = 0; Fx.offsetY = 0; }
  }
}

// ==========================================================================
// 15_sprites.js
// ==========================================================================

// Sprites (GDD 12.2, 12.5). Build step 11, wave B.
//
// A sprite is a character grid: one character per pixel, `.` transparent, and a `pal` object that
// maps each character to a colour. It is the format sandbox/sprite-editor.html reads and writes,
// which is the point of it - the grid can be edited by hand, in the editor, or by a model reading
// the file, and all three produce the same thing.
//
// A `pal` value is either a name in the game palette `C` or a hex string. Both, because the two
// sources of art in this build need different things: the Associate is drawn out of the game's own
// palette, so a palette edit reaches it, while the guest roster was authored as thirteen separate
// people whose role names (skin, hair, coat) mean a different colour in every one of them.
//
// The grids are baked into offscreen canvases once, on first draw, and blitted after that. The GDD
// called for a PNG atlas loaded through an <img>; the grid is the authoring format either way, and
// at this size converting it to a PNG buys nothing and costs a build step, a second file in the zip
// and an asynchronous load that can fail on file://.
//
// A grid carries its pixels in one of two shapes. `rows` is a single frame and is what the roster
// uses; `frames` is an array of them, which is what the art pack ships, and the two mean different
// things in different sprites: the cubicle's are an animation, the queue soul's are three builds of
// person picked by index. Both bake the same way, one canvas per frame, so nothing downstream has
// to know which kind it is holding.
//
// `anchor` travels with the pack's grids and is deliberately not used by the drawing code here:
// everything in this build positions from the top-left corner. It is kept because it is the art's
// own record of where the sprite's feet are, and dropping it would lose that on the next import.

const Sprites = { cache: {} };

// A palette value resolved to its three bytes, remembered. Every value in this build is `#rrggbb` -
// the game palette `C` and the art packs' own literals both - so the parse is three slices, and the
// cache means it happens once per colour in the game rather than once per pixel drawn.
const SpriteRGB = {};
function spriteRGB(value) {
  let v = SpriteRGB[value];
  if (v) return v;
  const hex = value.charAt(0) === '#' ? value : C[value];
  v = SpriteRGB[value] = [parseInt(hex.slice(1, 3), 16),
                          parseInt(hex.slice(3, 5), 16),
                          parseInt(hex.slice(5, 7), 16)];
  return v;
}

// One `putImageData` per frame, where this used to issue a `fillRect` per PIXEL. The card blank is
// 196x72, so its bake was fourteen thousand canvas draw calls in the single frame where the card
// first appears - and since bakes are lazy, every one of them lands during play, on whatever frame
// first shows that sprite. On a phone that was showing up as ~100 ms stalls of the main thread,
// which on four cores is enough to take the audio thread's slice away with it: the "occasional"
// crackle that survived every audio-side fix arrived when a new sprite did.
//
// The output is identical. `createImageData` hands back zeroed bytes, so a '.' left alone is
// already a transparent pixel, and the canvas is w x h with no transform, so raw pixels land
// exactly where the 1x1 rectangles did.
function bakeSprite(def, frame) {
  const i = frame || 0;
  const key = def.key + ':' + i;
  const cached = Sprites.cache[key];
  if (cached) return cached;

  const rows = def.frames ? def.frames[i] : def.rows;
  const layer = makeLayer(def.w, def.h);
  const g = layer.getContext('2d');
  const img = g.createImageData(def.w, def.h);
  const d = img.data;
  let p = 0;
  for (let y = 0; y < def.h; y++) {
    const row = rows[y];
    for (let x = 0; x < def.w; x++, p += 4) {
      const ch = row[x];
      if (ch === '.') continue;
      const rgb = spriteRGB(def.pal[ch]);
      d[p] = rgb[0]; d[p + 1] = rgb[1]; d[p + 2] = rgb[2]; d[p + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  Sprites.cache[key] = layer;
  return layer;
}

function frameCount(def) {
  return def.frames ? def.frames.length : 1;
}

// The same grid as a flat silhouette in one colour. Exactly one thing needs it - the soul that
// arrived to a full queue and turns around, which blinks red - and the alternative was a second
// hand-authored grid of the same figure that could drift from the first one. Baked and cached like
// any other frame, so the tint costs one canvas the first time it is asked for and nothing after.
function bakeSilhouette(def, frame, color) {
  const key = def.key + ':' + (frame || 0) + ':' + color;
  const cached = Sprites.cache[key];
  if (cached) return cached;

  const layer = makeLayer(def.w, def.h);
  const g = layer.getContext('2d');
  g.drawImage(bakeSprite(def, frame), 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = color;
  g.fillRect(0, 0, def.w, def.h);
  Sprites.cache[key] = layer;
  return layer;
}

function drawSilhouette(ctx, def, x, y, frame, color) {
  ctx.drawImage(bakeSilhouette(def, frame, color), Math.round(x), Math.round(y));
}

function drawSprite(ctx, def, x, y, frame) {
  ctx.drawImage(bakeSprite(def, frame), Math.round(x), Math.round(y));
}

// A vertical slice of a sprite, for the docket, which shows a guest cropped at the waist rather
// than the whole figure standing in its shoes.
function drawSpriteRows(ctx, def, x, y, rows) {
  ctx.drawImage(bakeSprite(def, 0), 0, 0, def.w, rows, Math.round(x), Math.round(y), def.w, rows);
}

// Looked up by archetype name, because that is what a soul carries. A name with no sprite would be
// a gap on the docket, so the lookup is checked by tools/check.mjs against ARCHETYPES rather than
// papered over with a fallback at runtime.
function soulSprite(soul) {
  return GUEST_SPRITES[soul.name];
}

// ==========================================================================
// 15a_art_guests.js
// ==========================================================================

// The guest roster (GDD 12.2, 12.5). Thirteen people at 22x38, one static frame each, drawn full
// length in a lounge slot or at a desk and cropped to the waist on the docket.
//
// Format is the project's own character grid - one character per pixel, `.` transparent - with one
// difference from every other sprite here: `pal` carries hex rather than a name out of `C`. It has
// to. These were authored as thirteen separate people, so the same role name (skin, hair, coat)
// means a different colour in every one of them, and a shared palette would have to invent a
// hundred entries to say so. The role name survives in the legend, where it is documentation.
//
// Row map, shared by the whole roster and relied on by the docket crop: hair 0-7, face 8-14,
// torso 15-26, legs 27-34, shoes 35-37.
//
// Nothing here is recoloured or animated. A soul looks the same on the card, in the lounge and at
// a desk, which is the entire point of a roster: the person the player read about is the person
// standing in the slot.

// SPR_GUEST_BAKER  22x38  Retired Baker
// the widest silhouette in the deck: a flared apron and a tall white toque
const SPR_GUEST_BAKER = {
  key: 'g_baker', w: 22, h: 38,
  // legend, darkest first (role name from the art pack, then the colour):
  //   x = outline      #140e1e
  //   t = skirtShade   #26263c
  //   n = hairShade    #2c2636
  //   z = shoeShade    #2c2638
  //   w = blouseShade  #262838
  //   k = skinDeep     #34243a
  //   c = crustShade   #2c2832
  //   r = apronDeep    #362440
  //   Z = shoe         #464056
  //   R = apronShade   #8e3418
  //   j = skinShade    #6b4a34
  //   T = skirt        #4e5070
  //   G = apron        #b8481e
  //   s = skin         #86603f
  //   h = hairMid      #6e6a7c
  //   W = blouse       #6a708e
  //   A = apronLit     #ea7c3c
  //   S = skinLit      #c99468
  //   L = blouseLit    #a8a49c
  //   B = crust        #b0a898
  //   H = hairHi       #b0acbc
  //   Q = hairLit      #e8e4ee
  //   F = crustLit     #f2ecdc
  //   . = transparent

// The Associate who does the onboarding (GDD 8.4, 12.2), from the second art pack. 32x40, four
// visemes, colours named out of `C` so a palette edit reaches the host's face.
//
// Two things about this sprite are deliberate and read as mistakes if they are not written down.
// The face is lit FROM BELOW - every other sprite in the game is lit from the upper left, and the
// inversion is what makes a man who is only ever seen in a plate look like he is lit by the
// monitor he is reading the script off. And the frames touch the mouth box alone: rows 0-22 are
// identical in all four, so a talking loop cannot make the head shimmer.
//
// The pack shipped the face ramp under the name `skin`, which already meant the warm tan the pie
// and the basket are drawn in. Renamed to `face` here rather than in the icons: a pie crust is
// not skin, and one of the two names had to say what it actually is.

// The Operations desk (GDD 6.2, 12.2), 52x36, re-cut. One desk, L-shaped.
//
// Hell in this game is an open-plan floor, so the desk is drawn as an office that is only slightly
// wrong, and every choice below is a legibility fix first and a joke second:
//
//   THE RAMP. The old cut was `opsMid` from the ceiling to the floor with `opsBg` in the well -
//   two steps, both of them within 1.5:1 of the zone behind them, which is why a row of desks
//   measured at a mean luminance of 0.005-0.05 and read as three grey boxes on black. The wall now
//   falls off from the tube through opsHi -> opsMid, the desk top is opsLit and its front opsHi,
//   so the desk reads as a lit horizontal plane instead of a rectangle.
//
//   THE TUBE. It is the only light source down here and it is failing. That is the animation: two
//   frames lit, one dim, plus the line crawling down the monitor. The old pair of frames differed
//   by a single scan line and nothing else, which is an animation that exists in the code and not
//   on the screen. Three frames rather than two, so a desk goes dark one beat in three rather than
//   strobing at 1 Hz; 16_render_scene.js offsets by desk index, so the row still reads as several
//   machines left on overnight and not as one broken light.
//
//   THE INBOX. Stacked over the rim and still going up. It is the one object on this floor that
//   states what the floor is without a caption, and it replaces the flat block of `paper` that was
//   there before.
//
//   THE LINE AT THE FOOT. One pixel of `suspDark` under the desk front. Operations is the middle
//   floor, not the bottom one. It is also the only warm pixel in the basement, and it answers the
//   red horizon band the lounge sits on.
//
// Three things here are a contract with 16_render_scene.js rather than decoration, and
// tools/check.mjs asserts all three:
//
//   - The occupant is blitted OVER this sprite, 22 wide at cols 15-36, rows 4-29, cut at the
//     waist. What swallows that cut is ROW 30 being one unbroken lit edge across the full width.
//     Break it and every occupied desk grows a visible seam.
//   - Rows 31-32 carry the desk progress bar in `monitorLit`, so they stay a flat `opsMid` from
//     col 2 to col 49. No detail in that strip.
//   - A locked desk puts the 12x12 lock at 20,12, and an unoccupied one is where the bin and the
//     floor seam show. Both are covered the moment somebody is at the desk, which is why the
//     empty-desk detail costs nothing.

// is why nothing here is red or amber. Red is a wreck and amber is the meter, and a maintenance

// can do nothing about today.

// Replaces the primitive chain in 17_render_ui.js. Same signature, same call site: the slot still
// decides the colour, which is the whole of the live/dead report.
// Takes the slot rect and centres the mark in it, rather than a corner and a fixed inset. The box
// has changed size once already, and +4,+1 was measured against the old one - it would have left
// every mark two pixels above its middle without anything failing loudly enough to notice. The mark
// reports its own size, so nothing here has to be told it.
function drawSupplyIcon(ctx, id, r, color) {
  const mark = SUPPLY_MARK_SPRITES[id];
  if (!mark) return;
  const x = r.x + Math.floor((r.w - mark.w) / 2);
  const y = r.y + Math.floor((r.h - mark.h) / 2);
  drawSilhouette(ctx, mark, x, y, 0, color);
  // The strike is charged in Suspicion, so it is drawn in Suspicion whether or not the slot is
  // live. Dimming it with the rest would hide the price of the only consumable that has one.
  if (id === 'terminate') drawSilhouette(ctx, SPR_SUP_M_TERMINATE_X, x, y, 0, C.suspicion);
}

// ==========================================================================
// 16_render_scene.js
// ==========================================================================

// The tower itself: the sky, the cloud the slots are set into, the two floors and the desk.
// Everything is a flat primitive at the exact size and anchor of its future sprite.

let sky = null;            // cached sky ramp, full view width
let cloudBack = null;      // the mass hanging above the row, plus the bed the slots rest on
let cloudFront = null;     // the pillars between slots and the lip over each slot foot
let cloudX = 0;            // where the cloud layers are drawn, screen x
let cloudKey = '';         // rebuild guard: view height plus slot count
let opsBack = null;        // the room the desks stand in, baked at strip width
let opsBackX = 0;
let opsBackKey = -1;

// --- Dither -------------------------------------------------------------------
// Ordered 4x4 dither between neighbouring palette colours. The layers are baked into offscreen
// canvases through ImageData: per frame this would be some 200 000 pixel writes, as cached images
// it is three drawImage calls.
const BAYER4 = [
  0, 8, 2, 10,
  12, 4, 14, 6,
  3, 11, 1, 9,
  15, 7, 13, 5
];

function hexRgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}

function ditherPick(rgbs, t, x, y) {
  const steps = rgbs.length - 1;
  const f = clamp(t, 0, 1) * steps;
  const i = Math.min(Math.floor(f), steps - 1);
  const threshold = (BAYER4[(y % 4) * 4 + (x % 4)] + 0.5) / 16;
  return (f - i) > threshold ? rgbs[i + 1] : rgbs[i];
}

function putPixel(data, w, x, y, rgb) {
  const o = (y * w + x) * 4;
  data[o] = rgb[0];
  data[o + 1] = rgb[1];
  data[o + 2] = rgb[2];
  data[o + 3] = 255;
}

function makeLayer(w, h) {
  const cv = document.createElement('canvas');
  cv.width = w;
  cv.height = h;
  return cv;
}

// --- Sky ----------------------------------------------------------------------
function buildSky() {
  const h = Display.zones.ground.y + FADE_H;
  sky = makeLayer(VIEW_W, h);
  const g = sky.getContext('2d');
  const img = g.createImageData(VIEW_W, h);
  const ramp = [C.skyHigh, C.skyMid2, C.skyMid, C.skyMid3, C.skyLow].map(hexRgb);
  for (let y = 0; y < h; y++) {
    const t = y / Math.max(1, Display.zones.ground.y - 1);
    for (let x = 0; x < VIEW_W; x++) putPixel(img.data, VIEW_W, x, y, ditherPick(ramp, t, x, y));
  }
  g.putImageData(img, 0, 0);
}

// --- Cloud --------------------------------------------------------------------
// Cloud colour is a function of the absolute row, never of where a given piece of cloud begins,
// which is what keeps the red underlight level while the silhouettes above it wander. `shade`
// pushes a piece further along the body ramp: the mass behind the slots is dimmer than the
// pillars in front of them, and that difference is the whole depth cue.
function cloudColor(body, glow, horizon, top, shade, x, y) {
  if (y >= horizon) return ditherPick(glow, (y - horizon) / FADE_H, x, y);
  const t = (y - top) / Math.max(1, horizon - top);
  return ditherPick(body, shade + t * (1 - shade) * 0.5, x, y);
}

// Silhouettes are unions of ellipses. Circles cannot do this job: a circle descends at most its
// own radius over its own radius of width, while these shapes have to fall further than they are
// wide. Ellipses separate the two radii.
function ellipseTop(discs, x, base) {
  let top = base;
  for (const d of discs) {
    const dx = (x - d.x) / d.rx;
    if (dx > -1 && dx < 1) {
      const t = d.y - d.ry * Math.sqrt(1 - dx * dx);
      if (t < top) top = t;
    }
  }
  return top;
}

function ellipseBottom(discs, x, base) {
  let bottom = base;
  for (const d of discs) {
    const dx = (x - d.x) / d.rx;
    if (dx > -1 && dx < 1) {
      const t = d.y + d.ry * Math.sqrt(1 - dx * dx);
      if (t > bottom) bottom = t;
    }
  }
  return bottom;
}

function quantise(v) {
  return Math.round(v / CLOUD_STEP) * CLOUD_STEP;
}

// Deterministic jitter, so a heap looks hand-placed and comes back identical on every rebuild.
// The layers are re-baked on a resize and on every slot purchase; a random cloud would reshuffle
// the sky under the player each time they bought a suite.
function puffJitter(n, k) {
  const h = Math.sin(n * 127.1 + k * 311.7) * 43758.5453;
  return h - Math.floor(h);
}

// ONE CUMULUS HEAP: eight ellipses, five on the baseline and three riding above them.
//
// This replaces two ellipses per lobe - a wide one and a narrow half-offset one - which is what
// made the old sky read as random. `ellipseTop` takes the upper envelope, so a narrow tall ellipse
// beside a wide short one produces a spike leaning off a dome: a tent. Repeat it at a fixed pitch
// and the horizon becomes a row of tents, which is exactly what was on screen.
//
// THE NUMBER THAT DECIDES WHETHER THIS IS A CLOUD IS rx AGAINST ry, PER LOBE. The first cut of the
// heap kept every centre on the baseline and gave the middle lobe most of the heap's height, which
// on a 67-wide, 30-tall heap is rx 13 against ry 25 - and an ellipse twice as tall as it is wide is
// a cone whatever you cluster around it. It went back to being tents. Each lobe is now about as
// wide as it is tall or wider; the lobes overlap heavily and that overlap is the cloud.
//
// The second storey does NOT get its height by being taller. It gets it by sitting higher: its
// centres are lifted off the baseline and its ellipses stay round. That is also how a real cumulus
// grows - a smaller bubble boiling up out of the valley where two lower lobes meet.
//
// The lower row's centres stay ON the baseline so the underside is flat. That is not a shortcut: a
// cumulus has a flat bottom because that is where the air reaches its condensation level, and a
// cloud drawn with a rounded bottom reads as a balloon.
const CUMULUS_LOWER = [
  // [ x/w, rx/w, ry/h ]
  [-0.47, 0.25, 0.38],
  [-0.25, 0.30, 0.62],
  [ 0.02, 0.32, 0.72],
  [ 0.26, 0.29, 0.58],
  [ 0.48, 0.24, 0.36]
];
const CUMULUS_UPPER = [
  // [ x/w, rx/w, ry/h, lift/h ] - lift raises the centre off the baseline
  [-0.30, 0.20, 0.36, 0.30],
  [-0.02, 0.26, 0.66, 0.34],
  [ 0.29, 0.19, 0.34, 0.28]
];

function cumulusDiscs(cx, baseY, w, h, n) {
  const out = [];
  for (let i = 0; i < CUMULUS_LOWER.length; i++) {
    const d = CUMULUS_LOWER[i];
    out.push({
      x: cx + d[0] * w,
      y: baseY,
      rx: w * d[1] * (0.88 + 0.24 * puffJitter(n, i)),
      ry: h * d[2] * (0.86 + 0.28 * puffJitter(n, i + 8))
    });
  }
  for (let i = 0; i < CUMULUS_UPPER.length; i++) {
    const d = CUMULUS_UPPER[i];
    out.push({
      x: cx + d[0] * w,
      y: baseY - h * d[3],
      rx: w * d[1] * (0.88 + 0.24 * puffJitter(n, i + 16)),
      ry: h * d[2] * (0.88 + 0.24 * puffJitter(n, i + 24))
    });
  }
  return out;
}

// A run of heaps across the whole strip, at `pitch`, each `pitch * spread` wide. Spread over 1
// merges them into a continuous crest; under 1 leaves sky between them.
// A run of heaps across the whole strip, at `pitch`, each `pitch * spread` wide. Spread over 1
// merges them into a continuous crest; under 1 leaves sky between them.
//
// `vary` is how much heap-to-heap height wander the run is allowed, and it is not the same for all
// three layers. The front plane gets very little: its crest has to stay under the mid band that is
// the whole point of having a mid band, and at +-22% a tall heap of front cloud climbs over a short
// heap of mass and the two swap places. The layers behind it can wander freely - that is weather.
function cumulusRun(width, baseY, pitch, spread, h, seed, vary) {
  const discs = [];
  const v = vary === undefined ? 0.22 : vary;
  for (let cx = -pitch, n = 0; cx < width + pitch; cx += pitch, n++) {
    const scale = (1 - v) + 2 * v * puffJitter(seed + n, 5);
    for (const d of cumulusDiscs(cx, baseY, pitch * spread, h * scale, seed + n)) discs.push(d);
  }
  return discs;
}

function buildCloud() {
  const z = Display.zones;
  const count = visibleSlotCount(state.heavenSlots);
  const first = heavenSlotRect(0);

  const pitch = HEAVEN_SLOT.w + HEAVEN_SLOT.gap;
  const content = count * HEAVEN_SLOT.w + (count - 1) * HEAVEN_SLOT.gap;
  const width = content + VIEW_W * 2;          // a screen of cloud past each end, so no edge shows
  const height = z.ground.y + FADE_H;
  const horizon = z.ground.y;

  // Deliberately the unscrolled origin: the render adds the scroll offset to this, and taking it
  // from the slot rect would apply the same offset twice.
  cloudX = stripOrigin('heaven') - VIEW_W;

  const slotTop = first.y;
  const footY = first.y + first.h;
  const massTop = slotTop - CLOUD_MASS_H;
  const bedTop = footY - CLOUD_BED;

  const body = CLOUD_BODY.map(hexRgb);
  const glow = CLOUD_GLOW.map(hexRgb);

  // THE MIDDLE LAYER. Solid from its crest all the way down: the slots are set INTO the cloud, so
  // there is no sky behind them - an earlier version left the mass hanging above a separate bed and
  // every slot turned into a blue window.
  //
  // Heaps rather than lobes now (see cumulusDiscs), spread past their own pitch so they run into
  // one another and the crest rolls instead of repeating. The pitch is not the slot pitch on
  // purpose: matched to it, the crest reads as a second row of slots rather than as weather.
  const massCrest = cumulusRun(width, slotTop, CLOUD_MASS_PITCH, CLOUD_MASS_SPREAD, CLOUD_MASS_H, 3);

  // THE BACK LAYER, and the one that was wrong twice.
  //
  // Built as TWO runs unioned: a continuous ridge, and separate heads standing on it.
  //
  // The first cut made it one run of heaps with gaps between them, on the reasoning that a bank of
  // cloud needs sky between its parts. It does - but the gaps ran all the way down to the crest of
  // the mass, and a gap between two round heaps closes to a point at the bottom, so the sky came
  // through as a row of tall blue TRIANGLES sitting on a horizontal line. It read as a mountain
  // range, which is the same failure as the tents it replaced, arriving from the other side.
  //
  // A real bank has a continuous base and individual heads: the base is where the whole layer sits,
  // the heads are where it is boiling. So the ridge is spread past its own pitch and kept low, the
  // heads are narrower and taller, and the sky shows between the HEADS only - shallow, wide gaps
  // near the top instead of deep wedges reaching the horizon.
  //
  // Its height scales with the headroom that actually exists rather than being a constant: the gap
  // between the mass and the HUD is 16 px at the 384 view and 52 at 480, so a fixed height clamped
  // flat against the ceiling on every short screen and turned the bank back into a wall.
  const skyCeil = Display.zones.heaven.y + 2;
  const headroom = Math.max(0, massTop - skyCeil);
  const farH = Math.min(CLOUD_FAR_H, headroom * 0.72);
  const farBase = massTop + 6;
  const farCrest = cumulusRun(width, farBase, CLOUD_FAR_PITCH * 0.62, 1.25, farH * 0.38, 41)
    .concat(cumulusRun(width, farBase, CLOUD_FAR_PITCH, CLOUD_FAR_SPREAD, farH, 11));

  cloudBack = makeLayer(width, height);
  const gb = cloudBack.getContext('2d');
  const back = gb.createImageData(width, height);
  for (let x = 0; x < width; x++) {
    // `massTop + 6` is the far bank's own baseline, so where no heap covers this column ellipseTop
    // returns it unchanged and the loop below draws nothing: that column is sky. The old version
    // based the bank on the mass crest and filled from it whatever happened, which is why it could
    // never have gaps however narrow the lobes were made.
    const far = Math.max(skyCeil, quantise(ellipseTop(farCrest, x, farBase)));
    const crest = quantise(ellipseTop(massCrest, x, slotTop));
    // A lit band along the top edge of each silhouette, and it is the whole of the terraced look:
    // the body stays a function of the absolute row - which is the rule that keeps the underlight
    // level while the crests wander - and only this strip follows the SHAPE. So the lobes get
    // contours without the shading of the mass depending on where any piece of it happens to begin.
    // No lit rim on this one, unlike the two in front of it. Aerial perspective is a loss of
    // CONTRAST with distance, and a crisp bright edge is the single thing most able to pull a shape
    // forward: with the rim on, the far bank's heads came out the same cream as the mass and the
    // three layers collapsed into one texture. Flat and blue is what reads as far away.
    for (let y = Math.max(0, far); y < crest; y++) {
      putPixel(back.data, width, x, y, cloudColor(body, glow, horizon, massTop, CLOUD_FAR_DIM, x, y));
    }
    for (let y = Math.max(0, crest); y < height; y++) {
      const lift = (y - crest) < CLOUD_RIM ? CLOUD_RIM_LIFT : 0;
      putPixel(back.data, width, x, y, cloudColor(body, glow, horizon, massTop, CLOUD_MASS_DIM - lift, x, y));
    }
  }
  gb.putImageData(back, 0, 0);

  // Front layer: a pillar in every gap, then the lip across the foot of every slot. Both are
  // brighter than the mass behind them, which is what places them in front of the slots.
  cloudFront = makeLayer(width, height);
  const gf = cloudFront.getContext('2d');
  const front = gf.createImageData(width, height);

  // THE FRONT LAYER: THE ARCADE, as one solid face rather than as a line.
  //
  // An arch drawn as a stroke is not an arcade. An arcade is a WALL with holes cut in it, so the
  // front plane is filled - from its own crest down to the curve - and the curve is the intrados.
  // Above it is solid cloud, piers and spandrels together, one continuous body. Below it, over each
  // suite, is the recess, and the mid layer showing through the recess is what makes the opening
  // an opening.
  //
  // Its crest is its OWN cumulus run at its own pitch and a lower height than the mass, and that
  // difference is load-bearing. It used to start at the mass crest, which meant the front covered
  // the mass from the crest down and the mid layer only ever appeared inside the arches - two
  // layers on screen where the design calls for three. Starting it CLOUD_MASS_H - CLOUD_FRONT_H
  // lower leaves a band of mid cloud rolling along above the arcade.
  const frontCrest = cumulusRun(width, slotTop, CLOUD_FRONT_PITCH, CLOUD_FRONT_SPREAD, CLOUD_FRONT_H, 29, 0.09);

  // The intrados, as the LOWER envelope of a chain of puffs laid along the arch line rather than as
  // the arch line itself. A clean curve reads as masonry; the point of this pass is that the front
  // plane is cloud, so the opening has to be scalloped by the same puffs everything else is built
  // from. `ellipseBottom` earns its keep here - it was written for this shape and had gone unused.
  //
  // The spine under the puffs is piecewise, and that part is unchanged: a single sine across the
  // pitch has its zero exactly at the pier centre, so the pier came to a POINT downwards - a row of
  // wedges, not a row of columns. A pier has parallel sides and the arch springs from the top of
  // it, so the spine is flat across CLOUD_PIER_FLAT and only then turns.
  //
  // CLOUD_ARCH_RISE has a floor as well as a look: the contract halo owns the 16 rows directly
  // above the suite edge and is the one readout in the lounge nothing may crowd. Under about 20
  // the crown starts cutting into it.
  const pierBase = VIEW_W - pitch - HEAVEN_SLOT.gap / 2;
  const archSpine = function (x) {
    let u = (x - pierBase) % pitch;
    if (u < 0) u += pitch;
    const d = Math.abs(u > pitch / 2 ? pitch - u : u);      // distance from the nearest pier centre
    const flat = CLOUD_PIER_FLAT / 2;
    if (d <= flat) return slotTop - 2;
    const t = (d - flat) / (pitch / 2 - flat);
    return slotTop - 2 - CLOUD_ARCH_RISE * Math.sin(Math.PI / 2 * t);
  };
  const archPuffs = [];
  for (let x = -CLOUD_ARCH_PUFF; x < width + CLOUD_ARCH_PUFF; x += CLOUD_ARCH_PUFF) {
    archPuffs.push({
      x: x,
      y: archSpine(x) - CLOUD_ARCH_PUFF * 0.5,
      rx: CLOUD_ARCH_PUFF * (1.05 + 0.35 * puffJitter(x, 2)),
      ry: CLOUD_ARCH_PUFF * (0.85 + 0.45 * puffJitter(x, 7))
    });
  }

  for (let x = 0; x < width; x++) {
    const crest = quantise(ellipseTop(frontCrest, x, slotTop));
    const intrados = quantise(Math.min(slotTop - 2, ellipseBottom(archPuffs, x, -1e6)));

    for (let y = Math.max(0, crest); y < intrados; y++) {
      const lift = (y - crest) < CLOUD_RIM ? CLOUD_RIM_LIFT : 0;
      putPixel(front.data, width, x, y, cloudColor(body, glow, horizon, slotTop - CLOUD_FRONT_H, CLOUD_PILLAR_DIM - lift, x, y));
    }
    // The shaded underside of the span: a LIP a few rows deep, not a fill.
    //
    // This used to run from the intrados all the way down to the suite tops, painting the whole
    // recess in CLOUD_SOFFIT_DIM - which is the bluest shade in the ramp. The result was a solid
    // blue arch-shaped slab standing over every suite, and at a glance it read as a row of blue
    // tents wedged between the cream cloud and the arcade rather than as a shadow inside an
    // opening. A shadow has an edge; a shadow that fills the whole hole is just an object.
    //
    // Only the lip is drawn now, and what shows in the rest of the opening is the mid layer behind
    // - which is the thing that makes an opening an opening, and the reason the mass is drawn solid
    // from its crest down in the first place.
    const lipEnd = Math.min(slotTop, intrados + CLOUD_SOFFIT_H);
    for (let y = Math.max(0, intrados); y < lipEnd; y++) {
      const lift = (y - intrados) < CLOUD_ARCH_R ? CLOUD_RIM_LIFT : 0;
      putPixel(front.data, width, x, y, cloudColor(body, glow, horizon, slotTop - CLOUD_FRONT_H, CLOUD_SOFFIT_DIM - lift, x, y));
    }
  }

  for (let i = 0; i < count; i++) {
    const sx = VIEW_W + i * pitch;
    const x0 = sx - 5;
    const x1 = sx + HEAVEN_SLOT.w + 5;
    for (let x = Math.max(0, x0); x < Math.min(width, x1); x++) {
      const swell = Math.sin((x - x0) / (x1 - x0) * Math.PI);
      const top = footY - quantise(swell * CLOUD_LIP);
      for (let y = top; y < footY + CLOUD_LIP_DROP; y++) {
        putPixel(front.data, width, x, y, cloudColor(body, glow, horizon, bedTop, 0, x, y));
      }
    }
  }
  gf.putImageData(front, 0, 0);

  cloudKey = Display.viewH + ':' + count;
}

// --- The room downstairs -------------------------------------------------------
// Built exactly the way the cloud is, and for the same reason. A tiling sprite would repeat, and
// the repeat is the thing you cannot unsee once the floor is wide enough to scroll; this is one
// baked image the width of the whole strip, so there is no repeat to find at any width.
//
// Colour is a function of the ABSOLUTE row, never of where a piece of structure begins - the same
// rule cloudColor() keeps, and for the same reason: the glow has to stay level while the things
// standing in it scroll past.
//
// The glow at the bottom is the LAST FOUR STEPS OF CLOUD_GLOW, run backwards. The lounge sits on a
// red horizon because there is a floor under it; Operations sits on the same red because there is a
// floor under Operations too, and it is the same fire. Reusing the ramp rather than picking a new
// red is the whole statement, and it costs nothing.
//
// Two pitches, and neither is the desk pitch (52 + 5 = 57). Matched to it, the partitions behind
// the desks line up with the desks in front and the floor reads as one flat wall - the same trap
// CLOUD_MASS_PITCH is set to 64 against a 58 slot pitch to avoid.
// One deterministic value per integer, for everything that wants to look unplanned: the rock on
// this floor, and the crumbling edge of a halo upstairs.
// Not rng(): that generator is the seeded one the balance harness reproduces runs with, and a bake
// drawing from it would make a simulation depend on how many times the view happened to resize.
// Not Math.random() either - the ops layer is rebuilt on a resize and on every desk bought, and a
// wall that reshuffles itself when the player buys a desk is a bug the player can see; the halo
// would be worse, because it is redrawn every frame and would boil.
function pixelHash(n) {
  let h = (n | 0) * 374761393 + 668265263;
  h = (h ^ (h >>> 13)) * 1274126177;
  return (h ^ (h >>> 16)) >>> 0;
}

// Where to start a repeating row so that its items land on the same WORLD positions whatever the
// layer's left edge happens to be. Keying an item's appearance on its world x is only half of it -
// if the loop still steps from the layer's own zero, the items themselves shift and take their
// appearance with them.
function opsPhase(seed, pitch, offset) {
  return ((((offset || 0) - seed) % pitch) + pitch) % pitch;
}

// The back wall: rock in bedding planes rather than a smooth vertical gradient. A gradient reads as
// a painted surface, which is exactly what this floor is pretending not to be, and horizontal
// banding is the one cue that says "cut into" rather than "built".
//
// The planes are laid out once as a per-row tone offset, so a band is several rows that share a
// tone and the boundary between two of them is a line across the whole floor. Their thickness and
// their offset both come off pixelHash, and the offset is small - a tenth of the ramp - because the
// wall has to stay the quietest thing on a floor that also holds six desks, a guest at each of
// them, rising noise icons and two progress bars.
function buildStrata(height) {
  const strata = new Float32Array(height);
  for (let y = 0, band = 0; y < height; band++) {
    const thick = 2 + (pixelHash(band) % (OPS_STRATA_MAX - 1));
    const off = ((pixelHash(band + 97) % 7) - 3) / 30;
    for (let k = 0; k < thick && y < height; k++, y++) strata[y] = off;
  }
  return strata;
}

// The suspended ceiling, and the cave it was hung inside showing through where a tile is missing.
// This is the whole idea of the floor in three rows: a corporate grid, and behind it the thing the
// corporation moved into. Neither is a decoration on the other - the gap is what makes both read.
//
// The rail runs the full width so the grid is continuous, and a missing bay takes the rail with it:
// a gap with a rail still across it is a hole in a ceiling, not a tile out of one.
function drawOpsCeiling(img, width, seed, ceilY, floorTop) {
  if (ceilY < 0 || ceilY + 2 >= floorTop) return;
  // Two rows, and both of them matter. The rail is the lightest thing on this floor apart from a
  // strip light, because a ceiling that is not lighter than the wall under it is a line on a wall;
  // the row beneath it is the shadow the tile casts into the room, and it is what makes the grid
  // sit in FRONT of the rock rather than be painted on it.
  const rail = hexRgb(C.opsHi), bar = hexRgb(C.opsLit), under = hexRgb(C.rockDeep);
  const tooth = hexRgb(C.rockDeep), toothLit = hexRgb(C.rock);
  for (let x0 = opsPhase(seed, OPS_CEIL_PITCH); x0 < width; x0 += OPS_CEIL_PITCH) {
    const x1 = Math.min(width, x0 + OPS_CEIL_PITCH);
    if (pixelHash(seed + x0) % OPS_CEIL_GAP === 0) {
      // A lost tile. Rock hangs into the room by a few rows, lit on its left edge only - a tooth
      // shaded from both sides reads as a stalactite in a diagram, and from neither as a smear.
      for (let x = x0; x < x1; x++) {
        const drop = 2 + (pixelHash((seed + x) * 13) % OPS_TOOTH_MAX);
        for (let y = ceilY; y < Math.min(floorTop, ceilY + drop); y++) {
          putPixel(img.data, width, x, y, (pixelHash((seed + x) * 5) & 3) === 0 ? toothLit : tooth);
        }
      }
      continue;
    }
    for (let x = x0; x < x1; x++) {
      putPixel(img.data, width, x, ceilY, rail);
      if (ceilY + 1 < floorTop) putPixel(img.data, width, x, ceilY + 1, under);
    }
    // The cross member at the near end of the bay, dropped one row so the grid has a direction.
    if (ceilY + 1 < floorTop) putPixel(img.data, width, x0, ceilY + 1, bar);
  }
}

// Cracks in the back wall with the light from the level below coming up them. The same ramp the
// floor glow uses, on purpose: one light source arriving two ways is a room, two light sources of
// different colours is a set. Brightest at the bottom where they meet the glow and gone before the
// ceiling, because a crack that reaches the ceiling is a structural drawing rather than a room.
//
// One pixel wide for most of their length, two where they widen, and they wander by at most one
// pixel a row - a crack that wanders freely is a river, and a straight one is a cable duct.
function drawOpsFissures(img, width, seed, top, bottom) {
  if (bottom - top < OPS_FISSURE_MIN) return;
  // Starts at emberDeep, not at rock: a crack with light behind it is BRIGHTER than the wall it is
  // in at every point along it. Run from the wall tone the first cut came out as a dark hairline,
  // which reads as a scratch on the rock rather than as a way through it.
  const ramp = [C.emberDeep, C.emberDim, C.ember].map(hexRgb);
  const span = bottom - top;
  const half = Math.floor(OPS_FISSURE_PITCH / 2);
  for (let cx = opsPhase(seed, OPS_FISSURE_PITCH, half); cx < width; cx += OPS_FISSURE_PITCH) {
    // Keyed on where the crack is in the WORLD, so it stays in the rock it was cut into.
    const f = seed + Math.round(cx);
    let x = Math.round(cx + (pixelHash(f * 31) % 21) - 10);
    // Each crack starts somewhere in the upper third and runs to the floor, so they are different
    // lengths without any of them being a stub.
    const start = top + (pixelHash(f * 17) % Math.max(1, Math.floor(span / 3)));
    for (let y = start; y < bottom; y++) {
      x += (pixelHash(f * 101 + y) % 3) - 1;
      if (x < 1 || x >= width - 1) break;
      const t = (y - start) / Math.max(1, bottom - start);
      putPixel(img.data, width, x, y, ditherPick(ramp, t, x, y));
      // The second pixel is the crack opening as it goes down, not a second crack beside it.
      if (t > 0.55 && (pixelHash(f * 53 + y) & 3) !== 0)
        putPixel(img.data, width, x + 1, y, ditherPick(ramp, t * 0.7, x + 1, y));
    }
  }
}

function buildOpsBack() {
  const z = Display.zones.ops;
  const width = stripWidth('ops') + VIEW_W * 2;
  const height = z.h;
  opsBackX = stripOrigin('ops') - VIEW_W;

  opsBack = makeLayer(width, height);
  const g = opsBack.getContext('2d');
  const img = g.createImageData(width, height);

  // The wall is rock now rather than office grey: warm where the fit-out standing against it is
  // cold, which is the difference the floor is made of.
  const wall = [C.rockLit, C.rock, C.rockDeep].map(hexRgb);
  const up = [C.opsDeep, C.emberDeep, C.emberDim, C.ember].map(hexRgb);
  const rise = OPS_GLOW_H;
  const glowTop = height - rise;
  const strata = buildStrata(height);

  // The tail of CLOUD_GLOW runs FADE_H rows below the horizon and Operations starts 8 of them down,
  // so the first (FADE_H - 8) rows of this layer are painted over by the lounge. That row is the
  // top of everything visible on this floor, which is why the ceiling is hung from it rather than
  // from row zero - and why the wall ramp starts there too. Run from row zero it spent its light
  // half on rows nobody sees and put only its dark tail on screen, which is how a wall with three
  // tones in it came out as one flat near-black.
  const floorTop = height - OPS_FLOOR_H - CUBICLE.h;
  const ceilY = FADE_H - (Display.zones.ops.y - Display.zones.ground.y);
  const wallSpan = Math.max(1, glowTop - ceilY);

  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const rgb = (y >= glowTop)
        ? ditherPick(up, (y - glowTop) / rise, x, y)
        : ditherPick(wall, clamp((y - ceilY) / wallSpan + strata[y], 0, 1), x, y);
      putPixel(img.data, width, x, y, rgb);
    }
  }

  // Everything textured on this floor is placed AND keyed in world coordinates, not in the layer's.
  // The layer is rebuilt whenever a desk is bought, and buying one changes both its width and where
  // its left edge sits, so anything stepping from the layer's own zero would slide across the room
  // every time the row grew. The player is in the shop when that happens and would never catch it
  // moving - but they would come back to a different wall, which is the same defect with a delay
  // on it. opsPhase is what puts the loops back on the world grid; keying the appearance on world x
  // without that is half a fix, because the items shift and carry their appearance with them.
  const seed = Math.round(opsBackX);
  drawOpsFissures(img, width, seed, ceilY + 3, floorTop);
  drawOpsCeiling(img, width, seed, ceilY, floorTop);

  // Partitions of the floor that carries on past this one, and the tubes over them. Both stop
  // above the desks: at the 384 view the desks and the glow tail leave six bare rows, so anything
  // drawn low here is furniture nobody will ever see. Drawn after the rock so the office reads as
  // standing in front of it, which is the order it was installed in.
  const deep = hexRgb(C.opsDeep);
  const mid = hexRgb(C.opsMid);
  const hi = hexRgb(C.opsHi);
  for (let cx = opsPhase(seed, OPS_BACK_PITCH); cx < width; cx += OPS_BACK_PITCH) {
    const n = Math.round((seed + cx) / OPS_BACK_PITCH);
    const w = 2 + (((n % 3) + 3) % 3 - 1);
    const top = ceilY + 1 + (((n % 4) + 4) % 4 - 1);
    for (let x = cx; x < Math.min(width, cx + w); x++) {
      for (let y = Math.max(0, top); y < height - OPS_FLOOR_H; y++) putPixel(img.data, width, x, y, deep);
    }
  }
  // Guarded, not assumed: on a view short enough that the band between the cloud tail and the
  // desks closes up, there is no row for a tube and none is drawn. Without this the loop wrote
  // outside the layer, which the balance harness caught the moment it ran headless.
  const tubeY = ceilY + 3;
  if (tubeY >= 0 && tubeY + 2 < floorTop) {
    for (let cx = opsPhase(seed, OPS_TUBE_PITCH, 12); cx < width; cx += OPS_TUBE_PITCH) {
      const n = Math.round((seed + cx - 12) / OPS_TUBE_PITCH);
      const y = tubeY + (((n % 2) + 2) % 2);
      const len = 14 + (((n % 3) + 3) % 3 - 1) * 4;
      for (let x = cx; x < Math.min(width, cx + len); x++) {
        putPixel(img.data, width, x, y, hi);
        putPixel(img.data, width, x, y + 1, mid);
      }
    }
  }

  g.putImageData(img, 0, 0);
}

function initScene() {
  buildSky();
  buildCloud();
  buildOpsBack();
  opsBackKey = visibleSlotCount(state.cubicles);
}

// Rebuilt when the view resizes or a slot is bought; both are rare, and the bake is not cheap.
function refreshScene() {
  if (!sky || cloudKey !== Display.viewH + ':' + visibleSlotCount(state.heavenSlots)) initScene();
  else if (!opsBack || opsBackKey !== visibleSlotCount(state.cubicles)) { buildOpsBack(); opsBackKey = visibleSlotCount(state.cubicles); }
}

// --- Props --------------------------------------------------------------------

// A soul at full length, 22x38, drawn from its top-left corner (GDD 12.2). Whichever of the
// thirteen the player read on the docket is the one standing here: same sprite, same colours, no
// recolouring and no frames.
//
// That is a deliberate trade against what this drawing used to do. The body carried two states in
// its colour - grey once a contract lapsed, blinking red while a riot clock ran - and a roster of
// thirteen people cannot: a Middle Manager in a grey suit and a guest whose contract has lapsed
// would be the same picture, and the nervous glance at high Suspicion was three frames of a figure
// that now has one. Both states moved onto the halo, which is the timer they belong to and which is
// the one thing above the lounge allowed to change colour. The readout is reported in one place
// instead of two rather than reduced.
function drawGuest(ctx, x, y, soul) {
  const spr = soulSprite(soul);
  if (spr) drawSprite(ctx, spr, x, y);
}

// The same soul at a desk, cut off under the ledge it is standing behind.
function drawGuestAtDesk(ctx, x, y, soul) {
  const spr = soulSprite(soul);
  if (spr) drawSpriteRows(ctx, spr, x, y, DESK_BUST_ROWS);
}

// A waiting soul at the top of the sky, 10x14, and deliberately the darkest thing on the screen:
// the queue is read as a length, not as individuals, so it has to separate from cloud and sky
// alike (GDD 12.4).
//
// Three builds of person, picked by position in the queue rather than by time. Eight copies of one
// silhouette read as a bar chart, and the length of this row IS a mechanic - past eight, arrivals
// turn around and cost Suspicion (GDD 5.4) - so it has to read as people. The variant is a
// function of the index alone, which keeps a given place in the queue looking like itself while
// the line shortens ahead of it.
function drawQueueFigure(ctx, x, y, i) {
  drawSprite(ctx, SPR_QUEUE_SOUL, x, y, i % frameCount(SPR_QUEUE_SOUL));
}

// The halo is a drawing, not a stroked arc: ctx.arc antialiases into grey and the integer upscale
// magnifies that into a smear. It is not a computed ellipse either, which is what it was until
// this pass - see the note at HALO_W for why the formula lost.
//
// One character per pixel, the format the rest of the art is authored in (see 15_sprites.js),
// transcribed from a reference a pixel at a time rather than matched by eye. Four tones: L is the
// light, which runs along the top of the far side and along the front of the near one; G is the
// body of the gold; D is its shaded side; K marks the two points where the ring turns edge-on to
// the viewer and goes darkest. The hole in the middle is not a colour - it is the sky, and a
// missing pixel anywhere else is the sky too.
const HALO_GRID = [
  '........LLLLLLLLLLL........',
  '....LLLGGGGGGGGGGGGGLLL....',
  '...LGGG.............GGGL...',
  '..LD...................DL..',
  '.LDG...................GDL.',
  '.GLG...................GLG.',
  '.KGD...................DGK.',
  '..KKLL...............LLKK..',
  '...KGGLLLLLLLLLLLLLLLGGK...',
  '....KKKKGGGGGGGGGGGKKKK....',
  '........KKKKKKKKKKK........',
];
const HALO_TONE = { L: 0, G: 1, D: 2, K: 3 };

// The drawing, flattened into one list of points in the order the timer fills them.
//
// Each pixel keeps its offset from the halo's centre and its tone. It is sorted by its angle,
// measured from twelve o'clock clockwise, so that filling the first n of the list IS the remaining
// time - which is what it has been since the ring was one pixel thick. The angle is taken in
// NORMALISED coordinates, x over half the width and y over half the height, because the shape is
// nearly twice as wide as it is tall: measured on the raw pixels the arc would crawl along the top
// and race down the sides, and the ring would stop reading as a clock.
let ringBand = null;
function buildHaloBand() {
  const hx = (HALO_W - 1) / 2, hy = (HALO_H - 1) / 2, pts = [];
  for (let y = 0; y < HALO_H; y++) {
    for (let x = 0; x < HALO_W; x++) {
      const ch = HALO_GRID[y].charAt(x);
      if (ch === '.') continue;
      const u = (x - hx) / hx, v = (y - hy) / hy;
      let a = Math.atan2(u, -v);               // 0 at twelve o'clock, increasing clockwise
      if (a < 0) a += Math.PI * 2;
      // Offsets from the centre, so the call site can go on handing this a centre point. Both
      // dimensions are odd, so the centre is a pixel and not a crack between two: the halo, the
      // figure under it and the marker inside it all sit on one column.
      pts.push({ x: x - hx, y: y - hy, a: a, s: HALO_TONE[ch] });
    }
  }
  pts.sort(function (p, q) { return p.a - q.a; });
  const out = new Int16Array(pts.length * 3);
  for (let i = 0; i < pts.length; i++) {
    out[i * 3] = pts[i].x; out[i * 3 + 1] = pts[i].y; out[i * 3 + 2] = pts[i].s;
  }
  return out;
}

// The arc alone carries the time, with no track behind it: how much halo there is IS how much
// contract there is, and a full dark ring around every guest turned the row into a row of bubbles.
//
// No outline. It had one for two revisions - first in the near-black the Operations sprites use,
// then in a darker tone of the same hue - and both times it carried more weight than the arc it
// was outlining. What replaces it is what a ring of metal has instead of a border: four tones
// across the drawing, arranged as light rather than as edges, which is what makes a loop of gold
// read as a ring seen at an angle instead of as a flat outline of one.
//
// The cost of having no outline is real and worth naming: gold on the cream crest of the cloud is
// about a fifth of the luminance range apart, where gold against a black border was most of it.
// What pays that back is the drawing's own darkest tone, which lands exactly on the two sides
// where the ring stands against the brightest part of the cloud.
//
// The crumble is what the leading edge does instead of stopping. Over the last stretch the band
// goes to a tone dimmer than any of its three and then to gaps, and a gap is a pixel NOT DRAWN -
// so what shows through a failing halo is the sky behind it. An earlier cut painted the gaps in a
// dark tone, which is a pitted ring rather than a broken one; a hole you can see through is the
// difference between a halo that is wearing out and one that is coming apart.
function paintHalo(ctx, cx, cy, fraction, tone) {
  if (!ringBand) ringBand = buildHaloBand();
  const total = ringBand.length / 3;
  const n = Math.ceil(total * clamp(fraction, 0, 1));

  // How much of the leading end has come apart. Bounded by the GAP as well as by the arc, so a
  // halo with nothing missing has nothing wrong with it: at fraction 1 the two ends meet and the
  // decay length is zero, and it opens up as the contract runs down. Without that bound a fresh
  // check-in would arrive with a hole already eaten out of it just short of twelve o'clock, which
  // is the same picture as a contract about to expire and would make the whole readout a lie.
  // Bounded by a fraction of the arc too, so a short one keeps a solid core to be read as a length.
  const decay = Math.min(HALO_DECAY, Math.floor(n * HALO_DECAY_CAP), total - n);
  const solid = n - decay;

  // One pass per tone rather than a fillStyle change per pixel. Four passes over the arc is more
  // iterations and far fewer state changes, and iterations are the cheap half - the more so now
  // that an arc is 74 pixels and not 200.
  for (let s = 0; s < 4; s++) {
    ctx.fillStyle = tone[s];
    for (let i = 0; i < solid; i++)
      if (ringBand[i * 3 + 2] === s)
        ctx.fillRect(cx + ringBand[i * 3], cy + ringBand[i * 3 + 1], 1, 1);
  }
  if (decay <= 0) return;
  // (paintHalo is only ever called by the cache below, once per distinct picture.)

  // The last stretch, running back from the leading edge. `d` is 0 at the tip and 1 where the band
  // is whole again, so the colour and the gaps are both functions of one number: its own shade,
  // then the fade tone, then holes in it, then nothing. It runs all the way to the final pixel -
  // the tip is not cut off and handed a clean edge, it thins out until there is nothing left.
  //
  // The hash is keyed on the band PIXEL, not on how far it currently is from the tip. That is the
  // whole trick. A given pixel is always the same pixel, so over the life of a contract it goes
  // gold, then fade, then gone - the band erodes in place, instead of shimmering while a moving
  // pattern slides through it. It also means two halos at the same fraction erode identically,
  // which is what keeps a row of them readable as a row rather than as noise.
  for (let i = solid; i < n; i++) {
    const d = (n - i) / decay;
    if (pixelHash(i * 2654) % 1000 < (1 - d) * HALO_DECAY_HOLES * 1000) continue;
    ctx.fillStyle = d > HALO_DECAY_DIM ? tone[ringBand[i * 3 + 2]] : tone[4];
    ctx.fillRect(cx + ringBand[i * 3], cy + ringBand[i * 3 + 1], 1, 1);
  }
}

// The desk timer: a recessed track with what is left of the processing in it. Drawn dark first and
// bright second, so the boundary between them is the readout and neither end needs a label.
function deskBar(ctx, x, y, w, h, fraction) {
  fillRect(ctx, x, y, w, h, C.opsDeep);
  fillRect(ctx, x, y, Math.round(w * fraction), h, C.monitorLit);
}

// The repair hold filling under the finger (GDD 6.5). A PERIMETER rather than a bar, and for the

// reason the desk bar comment works out the hard way: a straight line of some length is not a
// fraction of anything unless something says how long it would have been. A closed shape says it
// for free - the eye knows where the rest of the rectangle is - which is the same property the
// halo relies on, and it costs no track and no second colour.
//
// It starts at the bottom left corner and runs clockwise, so the first thing that moves is the
// floor of the suite, under the guest, where the finger already is.
// The other half of the same readout: the suite visibly coming back. A band of the clean cloud
// light rising off the floor of the niche, level with how much of the hold has been paid, and a
// solid line at its surface so the edge that moves is the brightest thing in the drawing.
//
// It exists because the ring alone starts too slowly to answer the only question a resting finger
// asks. The ring's first run is along the floor, one pixel at a time from the left corner, so a
// tenth of a second in there are four pixels of it in a corner of a 40x48 niche, and the honest
// reading of that screen is that nothing is happening. The band is 40 pixels wide from the first
// frame and it only has to move a row to be seen moving.
function drawHoldFill(ctx, x, y, w, h, fraction) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  // Inset by the one pixel the outline and the ring stand on, so the band fills the room rather
  // than the frame around it.
  const inner = h - 2;
  const level = Math.round(inner * clamp(fraction, 0, 1));
  if (level <= 0) return;
  const top = y + 1 + inner - level;
  ctx.globalAlpha = HOLD_FILL_ALPHA;
  fillRect(ctx, x + 1, top, w - 2, level, C.aura);
  ctx.globalAlpha = 1;
  fillRect(ctx, x + 1, top, w - 2, 1, C.aura);
}

function drawHoldRing(ctx, x, y, w, h, fraction) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  const total = 2 * (w + h) - 4;
  let left = Math.round(total * clamp(fraction, 0, 1));
  ctx.fillStyle = C.aura;
  // Four runs, in order: floor left-to-right, right wall up, ceiling right-to-left, left wall down.
  const runs = [
    [x, y + h - 1, 1, 0, w],
    [x + w - 1, y + h - 2, 0, -1, h - 2],
    [x + w - 1, y, -1, 0, w],
    [x, y + 1, 0, 1, h - 2]
  ];
  for (const [sx, sy, dx, dy, len] of runs) {
    const n = Math.min(left, len);
    for (let i = 0; i < n; i++) ctx.fillRect(sx + dx * i, sy + dy * i, 1, 1);
    left -= n;
    if (left <= 0) return;
  }
}


// The marker an expired contract puts inside its halo, and the reason it is drawn here rather than
// set in the font.
//
// It goes INSIDE the ring rather than above it. Above it was the first version and it does not
// survive the shortest supported view: at 384 rows the band over the lounge is where the onboarding
// plate sits, so a beat saying "tap them" would have been covering the only thing on screen that
// says which of them.
//
// Inside is what costs the font glyph. The `?` is 5x7 and takes 9 rows with its outline; the hole
// in the middle of the drawing is five rows, so the font version does not fit in it - and drawn
// anyway it covered the front of the ring, which is the half of the halo the light is on. So the
// marker is a 5x6 mark of its own, sized to the hole it lives in: six rows is exactly what the
// drawing leaves clear down its middle, and five columns sit well inside the thirteen the narrowest
// of those rows has. It is the font's question mark with one of its two diagonal rows taken out,
// which is the row a 7-high glyph has and a 6-high hole does not.
//
// It is drawn in the near-black of the Operations sprites rather than in gold with an outline,
