<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#100e18">
<!-- Only fires when the page has been added to the home screen, where iOS drops the address bar
     and the toolbar and hands the page the whole display. It does nothing in an ordinary Safari
     tab, and nothing at all anywhere else, which is why it is two lines rather than a decision:
     there is no API that hides Safari's chrome, so this is the only route to a full screen on an
     iPhone and it costs nothing to leave open. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Heaven">
<link rel="icon" href="data:,">
<title>Welcome to Heaven</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #100e18;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
(function () {
'use strict';
// ==========================================================================
// 01_config.js
// ==========================================================================

// Every tunable number lives here. The balance pass (build step 9) edits this file and nothing else.

const DEBUG = false;              // true adds an on-screen diagnostics line; must be false in a release build
const RNG_SEED = 0;               // 0 = seed from the clock, any other value = reproducible run

// --- Virtual screen (GDD 1.2) -------------------------------------------------
const VIEW_W = 216;               // fixed virtual width, everything is authored against it
// The layout is AUTHORED at 384 (ZONE_H below) and that has not changed. What changed on
// 5 September is the shortest view it is allowed to be squeezed into, and the reason is iOS.
//
// Safari's own chrome - address bar above, toolbar below - cannot be hidden from a normal tab by
// any API, and on three of six iPhone profiles it costs exactly one integer scale step. Measured:
// an iPhone XR at 414x715 CSS gets x3 and 45 CSS px of black down each side, a fifth of the width;
// the same phone with no chrome gets x4 and fills it. The blocker is not the width - 216x4 = 864
// against 828 physical px is inside CROP_TOLERANCE - it is this constant, because floor(1430/4) is
// 357 rows and the crop test refused anything under 384.
//
// So 357, which is what that phone actually offers, and which also unlocks the step on an SE
// (80 px of bar down to 26) and on both Pro Maxes. Below 384 every zone gives rows back by
// ZONE_SHRINK; nothing about the 384 layout moved.
const VIEW_H_MIN = 357;           // shortest supported view, see ZONE_SHRINK
const VIEW_H_MAX = 480;           // tallest supported view, 20:9 phones
const CROP_TOLERANCE = 1.045;     // allow the next integer scale to overflow width by this factor
const EDGE_MARGIN = 6;            // nothing interactive closer than this to a canvas edge
                                  // The two move together: the crop is 216 * (1 - 1/tolerance)
                                  // virtual px across both edges, so 1.025 cut 2.6 px per side and
                                  // 1.045 cuts 4.7. Widening one without the other would push the
                                  // edge chevron under the crop on the phones the wider tolerance
                                  // was for (GDD 1.2).
const NOTICE_W = 150;             // layout box the rotate notice is scaled to fit
const NOTICE_H = 88;

// --- Simulation (GDD 1.3) -----------------------------------------------------
const SIM_DT = 1 / 60;            // fixed timestep, seconds
const MAX_FRAME_DELTA = 0.1;      // clamp so a backgrounded tab cannot burn every contract at once

// --- Input (GDD 1.4) ----------------------------------------------------------
const SWIPE_THRESHOLD = 28;       // virtual px before a drag counts as a swipe
const TAP_SLOP = 7;               // a release under this distance is a tap
const INPUT_STALE = 6;            // seconds after which a pointer that never released is abandoned

const HIT_MIN = 38;               // minimum hit box for a tappable target

// --- Palette (GDD 12.1) -------------------------------------------------------
// Two blocks. The first is what the primitives were drawn in; the second is what the art pack
// names its colours, and every grid in the build resolves against it by name, so a colour edit
// here reaches every sprite without touching a single row of pixels.
//
// Two entries moved when the pack arrived: `monitor` and `opsBg` existed in both and disagreed in
// the last two digits. The pack's values win, because they are the ones the cubicle sprite was
// shaded against, and the drift is invisible either way.
const C = {
  bgDeep:      '#100e18',   // canvas letterbox and work zone
  hudBg:       '#0b0a12',
  ink:         '#f2ead2',   // warm white, primary text
  inkDim:      '#8a8a9a',
  inkFaint:    '#5a5f80',
  panel:       '#2a2438',
  aura:        '#4be0e0',
  credits:     '#e8c44a',
  suspicion:   '#e0484b',
  suspAmber:   '#e8a33a',
  good:        '#3f8f4f',
  skyHigh:     '#6fa8cf',   // fake paradise: a five-step ramp, dithered into a gradient
  skyMid2:     '#7db2d6',
  skyMid:      '#8fc0dc',
  skyMid3:     '#a3cce3',
  skyLow:      '#b6d9ea',
  cloud:       '#f2f4f8',
  cloudShade:  '#d8e2ee',
  slotEmpty:   '#5a6480',   // dashed outline of an unoccupied heaven slot, has to read against cloud
  guest:       '#7a6fa8',   // the soul violet the primitives were drawn in. The roster carries its
  guestGone:   '#8a8a9a',   // own colours now, so these two survive only in the shop icons: state
                            // is the halo, never the body (GDD 6.1a).
  opsBg:       '#232030',
  opsFloor:    '#1a1824',
  cubicle:     '#3a3746',
  cubicleTop:  '#4a4658',
  monitor:     '#2a6b62',

  // --- Named by the sprite grids ---------------------------------------------
  // Ramps, darkest first. A sprite legend cites these names, never a hex.
  outline:     '#16131f',   // cold near-black, the outline every Operations sprite is drawn with
  inkText:     '#2b2418',   // the near-black ink a printed form is set in, warmer than an outline

  guestDark:   '#3e3557',   // soul violet, four steps: shadow, mid, body (`guest` above), rim
  guestMid:    '#5a5080',
  guestRim:    '#a89adb',
  goneDark:    '#55535e',   // the same figure once it has stopped paying, three steps
  gone:        '#7d7b87',
  goneLit:     '#a8a6b0',

  // The rock the office is bolted into, three steps, and the heat coming up through it, three more.
  // Warm where the fit-out is cold: that difference is the whole reading of the floor. The heat
  // ramp is shared by the glow rising off the level below Operations and by the light in the
  // fissures, because it is meant to be the same light arriving two ways.
  rockDeep:    '#1a141c',
  rock:        '#2b2029',
  rockLit:     '#3d2c33',
  emberDeep:   '#3b2b38',
  emberDim:    '#5c2f3a',
  ember:       '#7a2f3c',

  opsDeep:     '#14121c',   // Operations, six steps from the floor strip up to the strip light
  opsMid:      '#363247',
  opsHi:       '#4d4863',
  opsLit:      '#6b6480',
  fluoro:      '#a8a4bd',   // the fluorescent tube itself
  monitorLit:  '#4aa393',   // what a monitor puts on a face

  cloudDeep:   '#b9c8dc',   // cloud underside, below `cloudShade`

  steelDark:   '#4e5064',   // elevator, shredder, headset
  steel:       '#8e91a8',
  steelLit:    '#c2c4d4',

  gold:        '#e8c44a',   // the pack's name for `credits`; both are here because the grids say
  goldDark:    '#a07c22',   // gold and the HUD says Credits, and neither reads right as the other
  goldLit:     '#f7e08f',
  // The halo's own four tones, read pixel for pixel off the reference drawing rather than mixed by
  // eye. Four steps rather than three because the drawing has four, and they are not a band's
  // inside, middle and outside: they are a lit ring seen at an angle, so the light lies along the
  // top of the far side and along the front of the near one, and the darkest tone marks the two
  // places where the ring turns away from the viewer. Which pixel is which tone is the drawing's
  // business, not a formula's - see HALO_GRID.
  //
  // Three of the four are the same values as `goldLit`, `gold` and `goldDark`: the final reference
  // came back drawn in the build's own gold ramp, which settles an argument two sessions of this
  // log had with themselves about the halo needing a more saturated gold of its own than the HUD's.
  // It does not - at 25 px across, with the deepest tone on the two sides where the ring stands
  // against the brightest part of the cloud, the ramp the rest of the art uses holds the crest.
  //
  // They keep their own names anyway, and the duplicated hex is deliberate. `gold`, `goldLit` and
  // `goldDark` are cited by half a dozen sprite palettes; a tweak made for a pastry or a lanyard
  // must not be able to move the one timer the whole lounge is read by.
  //
  // `haloFade` is the step the arc passes through on its way out. There is no matching "hole"
  // colour: a destroyed pixel is not drawn at all, so what shows through a broken halo is the sky.
  // It is kept clear of all four so a decaying pixel cannot be mistaken for a healthy one.
  haloLit:     '#f7e08f',
  haloGold:    '#e8c44a',
  haloDeep:    '#c4a231',
  haloDark:    '#a07c22',
  haloFade:    '#8a6408',
  // The same four steps in red, plus its own fade. `suspShade` and the lowered `suspFade` are new
  // with the fourth step: the red ramp had three tones and a fade, and the drawing asks for four.
  suspLit:     '#f07a7c',   // the lit side of a red halo, as haloLit is of a gold one
  suspShade:   '#7f2529',
  suspFade:    '#5c1a1d',

  auraDark:    '#1f8f96',
  auraLit:     '#a8f7f4',
  suspDark:    '#9c2e33',

  paper:       '#f2ead2',   // the pack's name for `ink` when it is a surface rather than a mark
  paperShade:  '#d6cbab',
  paperLine:   '#a3937a',

  skinDark:    '#a8794f',   // warm tan: pastry, wicker, wood. Not a face - see the face ramp below
  skin:        '#d9a877',
  skinLit:     '#f2d3a8',

  // The Associate's face, lit from below. The pack shipped this as a second `skin` ramp, which
  // collided with the tan above in two of the shop icons; renamed here rather than in the icons,
  // because a pie crust is not skin and one of the two names had to say what it actually is.
  faceShade:   '#8a6a64',
  face:        '#e2c9b4',
  faceLit:     '#f8efe2',
  hairBlk:     '#2e2a3e',
  hairBlkLit:  '#4c4664',
  hornDark:    '#181420',
  horn:        '#463a54',
  hornLit:     '#7d6c8e',
  uniShade:    '#311f7a',   // the uniform: hue 252, the one accent family nothing else uses
  uni:         '#3d19cc',
  uniLit:      '#8b74e7'
};

// One big cloud is the whole of paradise: its bumpy top edge sits high in the sky, the guest
// slots are seated inside it, and its underside is lit red from the floor below. Colour depends
// on the absolute row, not on where a given column of cloud begins, so the red band stays level.
// Noise icons rising out of operations cross this band - a hard line would make that a binary
// before/after, the ramp makes it a seep, which is what Noise is.
// Warm at the crest, cool at the base. The old ramp was four cold blue-whites, which is what a
// cloud looks like from underneath on an overcast day and not what one looks like lit from above.
// Index 0 is both the FRONT and the TOP of the ramp - cloudColor() walks it with depth and with
// row at once - so one warm-to-cool run buys the light from above and the depth cue together.
//
// Second thing it buys, unplanned: SPR_SLOT_HEAVEN is drawn in the warm tan ramp (skinDark ->
// paper), and against cold blue-white it was the loudest colour in the zone, so the eye went to
// the EMPTY suites first. A cream cloud puts the niche in the same family and that inversion goes.
// SIX steps, not four, and that is a fix rather than a flourish. cloudColor() walks this ramp with
// `shade + t * (1 - shade) * 0.5`, and there are now three layers walking it: front, mass, far. On
// four steps the mass landed on 2.0-2.5 and the far bank on 2.6-2.8, so the two of them came out as
// the same colour and the bank behind read as part of the mass. Six steps gives each layer a band
// of its own - at any given row they sit on indices 0, 2.7 and 4.5.
const CLOUD_BODY = ['#fffdf6', '#faf3e6', '#f0ecdf', '#e4e5ee', '#d3daec', '#c0cbe8', '#adbce1', '#98add6'];
const CLOUD_GLOW = ['#e3d9df', '#e8d2cf', '#eaa48c', '#e0684f', '#bf4048', '#7a2f3c', '#3b2b38', '#23212e'];
const FADE_H = 40;                // how far below the horizon the underlight runs before ops dark

// The heaven floor is built from three pieces of cloud, and the slots sit in the gaps between
// them: a big mass hanging above the row, a fluffy pillar in every gap between two slots, and a
// bed the slots rest on. The pillars are what make a slot read as a niche in something soft, so
// they are drawn in front and are allowed to overlap the slot edges.
// The three crests, and they are ONE budget rather than three numbers. Above the suite tops there
// are 68 rows at the 384 view and 106 at 480, and all three layers plus a strip of sky come out of
// that. The order below is the order they are read in, top to bottom, and each has to leave the
// next one something: mass crest 54, front crest 40, arch crown 26.
//
// CLOUD_FRONT_H > CLOUD_ARCH_RISE is not a preference, it is the condition under which the front
// layer exists at all. The front plane is filled from its crest DOWN to the intrados, so a crown
// that rises above the crest inverts the two and the loop writes nothing: at 30 against 36 the
// arcade vanished everywhere except a stub beside each pier, and the sky went back to two layers.
// The difference between them is the spandrel - the cloud left over the crown of each arch.
const CLOUD_MASS_H = 54;          // how far the crest of the mass rises above the slot tops
const CLOUD_MASS_PITCH = 83;      // heap spacing of the mass, deliberately not the slot pitch
const CLOUD_MASS_SPREAD = 1.35;   // heap width as a multiple of the pitch. Over 1 so the heaps run
                                  // into each other and the mass is one rolling crest, not a row
const CLOUD_MASS_DIM = 0.40;      // its shading, further along the body ramp: it sits behind
const CLOUD_ARCH_R = 5;           // lit edge along the underside of the arch
const CLOUD_ARCH_PUFF = 7;        // radius of the puffs the arch underside is scalloped with. The
                                  // curve is the LOWER envelope of a chain of these, so the opening
                                  // is billowed cloud rather than a drawn line
const CLOUD_FRONT_H = 40;         // crest of the front plane above the slot tops. Lower than
                                  // CLOUD_MASS_H on purpose: the difference is the band of mid
                                  // cloud that shows above the arcade, and without it the front
                                  // covers the mass from the crest down and there are two layers
                                  // on screen where the design says three
const CLOUD_FRONT_PITCH = 61;     // and a fourth pitch, so its bumps do not stack on the mass
const CLOUD_FRONT_SPREAD = 1.5;
const CLOUD_PIER_FLAT = 12;       // width of the pier top the arch springs from, so it has parallel sides
const CLOUD_SOFFIT_DIM = 0.58;    // the shaded underside of a span: what actually makes it an arch
const CLOUD_SOFFIT_H = 5;         // and how deep that shade runs. It is a lip, not a fill - see the
                                  // note at the draw site. Below it the opening is empty and the
                                  // mid layer shows through, which is the opening
const CLOUD_ARCH_RISE = 26;       // crown of the opening above the suite tops. Over a half-span of
                                  // 23 that is very nearly a semicircle, which is what an opening
                                  // in a wall wants; the earlier 36 was drawn when the arch was a
                                  // thin stroke standing in front of the mass and needed to be tall
                                  // and narrow to read as a line rather than as a lump. It is a
                                  // filled wall now and the geometry inverted with it. Floored near
                                  // 20 by the contract halo, which owns the 16 rows directly above
                                  // the suite edge and is the one readout nothing may crowd
const CLOUD_PILLAR_DIM = 0.05;    // in front of the mass, behind the lip. It was dimmed to 0.28 when
                                  // the piers were free-standing columns and the point was to stop
                                  // them reading as objects at all; now they close into an arcade
                                  // and the arcade has to read, so the value comes back up
const CLOUD_BED = 12;             // how far the bed covers the foot of a slot
const CLOUD_LIP = 8;              // how far the foreground lip climbs up the slot
const CLOUD_LIP_DROP = 6;         // and how far it hangs below it
const CLOUD_STEP = 3;             // silhouettes are quantised to this, no single-pixel teeth. 4
                                  // was too coarse once the shapes became round - a 30 px heap
                                  // has ten steps in it and came out as a stepped pyramid

// A second bank standing BEHIND the mass, which is what turns one cloud into weather: the mass
// alone reads as a bank of fog with slots cut in it, and the reference language for this is stacked
// cumulus at two distances. It lives in the headroom between the crest and the HUD, and there is
// not much - 16 px at the 384 view against 54 at 480 - so it is clamped to the top of the heaven
// zone rather than given a fixed height, and on a short view it is a ridge instead of a tower.
const CLOUD_FAR_PITCH = 118;       // a third pitch again: not the slot pitch and not CLOUD_MASS_PITCH
const CLOUD_FAR_H = 30;           // how far its heaps reach above the mass crest, before clamping
const CLOUD_FAR_SPREAD = 0.78;    // under 1, so the heaps stand apart and the gaps between them are
                                  // sky. This is the whole difference between a bank of cloud and a
                                  // wall with a bumpy top
const CLOUD_FAR_DIM = 0.72;       // furthest along the body ramp of the three layers
const CLOUD_RIM = 3;              // rows of lit edge along the top of a silhouette
const CLOUD_RIM_LIFT = 0.22;      // how far back up the body ramp that edge is pulled

// --- Zone layout (GDD 3). Heights are given for the 384 px view; the extra
// rows of a taller view are handed out with the weights below.
const ZONE_BASE = { hud: 40, heaven: 116, ground: 8, ops: 80, work: 140 };
const ZONE_H = 384;               // what ZONE_BASE sums to: the height the layout is authored at
const ZONE_GROW = { hud: 6, heaven: 38, ground: 0, ops: 26, work: 26 };  // sums to 96 = 480 - 384
// And the other direction, for the views shorter than the layout was authored for (VIEW_H_MIN).
// The HUD is not on this list and cannot be: its four rows are drawn at fixed offsets - the clock
// at +4, the two currencies at +15, the Suspicion label at h-15 and its bar at h-6 - so at 38 rows
// the label lands on top of the currencies. It is the one zone in the game with no slack at all.
// The ground line does not shrink for the same reason it does not grow: it is eight rows of
// horizon and there is nothing in it to give.
const ZONE_SHRINK = { hud: 0, heaven: 38, ground: 0, ops: 26, work: 26 };

// --- Slots (GDD 3) ------------------------------------------------------------
const HEAVEN_SLOT = { w: 40, h: 48, gap: 18 };  // gap widened from 5: a cloud pillar has to fit between two slots
const CUBICLE = { w: 52, h: 36, gap: 5 };
const OPS_FLOOR_H = 6;            // dark strip the cubicles stand on
const OPS_GLOW_H = 34;            // how far the light from the floor BELOW Operations rises
const OPS_BACK_PITCH = 41;        // partitions of the floor behind, deliberately not the desk pitch of 57
const OPS_TUBE_PITCH = 73;        // and the tubes over them, on a third pitch again

// The ceiling and what is behind it (GDD 12.4). Operations is an office fit-out bolted into rock,
// and the one place both halves of that are visible at once is the ceiling line: a suspended grid
// with tiles missing, and the cave it was hung inside showing through the gaps. Everything below
// is the same joke continued - partitions and strip lights standing against a wall of bedding
// planes, with the heat from the level below coming up through the cracks in it.
//
// Every number here is spent out of a band that is 32 rows at the 480 view and SIX at the 384 one,
// because the cloud's underlight tail paints over the top 32 rows of this layer whatever the view
// height. So the assembly is anchored to the top of that band and every piece below the ceiling is
// guarded on there being room for it; at 384 the ceiling is all that survives, which is the right
// thing to keep.
const OPS_CEIL_PITCH = 17;        // ceiling bay: the T-bar spacing
const OPS_CEIL_GAP = 4;           // one bay in this many has lost its tile. Fewer and deeper
                                  // beats more and shallower: a 17 px gap with a 3 px tooth in it
                                  // is noise along the ceiling line, and the rock has to be the
                                  // thing that is noticed rather than the damage
const OPS_TOOTH_MAX = 9;          // how far rock hangs into the room through a gap
const OPS_FISSURE_PITCH = 57;     // cracks in the back wall, on a pitch of their own again
const OPS_FISSURE_MIN = 12;       // no crack unless the wall is at least this tall - under that it
                                  // is a red dash rather than a crack, which reads as a defect
const OPS_STRATA_MAX = 5;         // thickest bedding plane, in rows
const OPS_BACK_PARALLAX = 0.5;    // the room moves at half the speed of the desks standing in it
const CARD = { w: 196, h: 72 };

// --- Floor strips (GDD 3.1) ---------------------------------------------------
// Slots grow sideways rather than into a second row, so a floor becomes a strip wider than the
// screen as soon as it is bought up. The chevrons are the safety rule of that design: nothing
// important may die out of sight.
const SCROLL_AXIS_LOCK = 6;       // px of movement before a drag over a floor commits to an axis
const SCROLL_SNAP = 0.22;         // seconds a chevron autoscroll takes
const CHEVRON = { w: 7, h: 13 };  // the arrow itself; it sits on a plate, like the swipe labels
const CHEVRON_PULSE = 2;          // Hz a red chevron flashes at
const CHEVRON_PLATE = 3;          // padding between the arrow and the edge of its plate

// The ghost hand that teaches the drag (GDD 3.1). A chevron says WHERE something is and never
// says HOW to get to it: it is a button, it is tapped, and a player who only ever taps it never
// finds out that the floor under it moves. So the gesture is demonstrated once, wordlessly, over
// the row it belongs to, and the player's own first drag is what turns it off for good.
const HINT_SWEEP = 34;            // px the hand travels, above SWIPE_THRESHOLD so it reads as a real drag
const HINT_NUDGE = 7;             // px the strip follows it before springing back
const HINT_HAND_Y = 20;           // fingertip above the ground line: over the guests, clear of their heads
const HINT_HAND_TIP = 5;          // column of the sprite the fingertip is in
const HINT_PRESS = 0.35;          // seconds the hand fades in and rests before it moves
const HINT_TRAVEL = 0.75;         // seconds the sweep takes
const HINT_LIFT = 0.45;           // seconds it fades out over, and the strip springs back in
const HINT_GAP = 0.8;             // dead time between two loops
const HINT_ALPHA = 0.6;           // the hand at its most opaque; it is a ghost, not a sprite
const HINT_TRAIL = 3;             // dots left behind the fingertip, so the sweep reads as travel
const HINT_TRAIL_GAP = 6;         // px between them
const HINT_PLAYS_OPEN = 3;        // loops on the opening burst
const HINT_PLAYS_ALERT = 2;       // and on the one the first chevron buys

// --- Souls, the queue and the card (GDD 5) ------------------------------------
const QUEUE_MAX = 8;              // waiting souls; a further arrival turns away (GDD 5.4)
const FIRST_ARRIVAL = 1.2;        // grace before the first soul of a day
const LATE_DAY = 6;               // from here the weight of souls with Skepticism >= 4 doubles
const LATE_SKEPTIC = 4;           // what counts as dangerous for that rule, in pips of Skepticism

const GOOD_PERSON_DAY = 3;        // the rarest archetype only starts appearing this late

const CARD_IN = 0.14;             // seconds the card takes to rise into the work zone
const CARD_TILT = 3;              // px the top edge of the card leads the bottom at a full drag
const CARD_SPRING = 0.16;         // spring-back after a refused or cancelled drag
const CARD_DRAG_MAX = 46;         // the card stops following the finger past this
const FLY_TIME = 0.4;             // a filed card travelling to its slot (GDD 5.3)
const FULL_FLASH = 0.5;           // how long FULL sits over a floor with no free slot
const TURN_AWAY_FLASH = 0.7;      // the silhouette that arrived to a full queue and left

const GUEST = { w: 22, h: 38 };         // the roster figure, same box in a lounge slot and at a desk
// The docket used to show the same drawing cut at the waist on a plate the layout drew itself. The
// card blank cuts a 32x40 well instead, which is two rows taller than a soul, so the docket shows
// the whole person and the crop is gone. The row map the crop was measured against - hair 0-7,
// face 8-14, torso 15-26, legs 27-34, shoes 35-37 - is still what the desk cut below uses.
// At a desk the same figure is cut higher and stands behind the furniture. A cubicle is 36 px tall
// against a 38 px soul, so a full-length figure had nowhere to go but over the desk's top edge -
// which is where the processing bar lives, the one part of a desk that carries information.
//
// The three numbers are read off the desk sprite rather than chosen. It leaves a well open over
// columns 14-37 and closes it again with the front of the desk at row 30, so a 22 px figure is
// centred in the well at column 15, dropped four rows to clear the strip light at the top, and cut
// at 26 - which puts the cut on row 30 exactly, behind the desk front, where it is never seen.
const DESK_BUST_ROWS = 26;
const DESK_BUST_DROP = 4;
const DESK_BUST_X = 15;

// about a third at the same nominal rate, and the quota column had to follow it down rather than
// the rate up. 0.70 is where a full lounge of what actually turns up covers a day.
// 0.78 after the concierge came out (2 September). Its floor was the game's only Aura source that

// The contract timer is a halo, not a ring around the body (GDD 6.1a): lifted clear of the figure,
// because gold ring over gold figure was the one timer on screen that had to be looked for, and
// legibility is the floor this project does not go below.
//
// It hangs off the SLOT rather than off the head. Eight pixels over a guest's hair put a row of
// halos at a row of different heights the moment anything moved, and the thing being read across
// the whole lounge is a row of timers - so it is pinned to the one line every slot shares, just
// clear of the dashed frame, and the guest can shake underneath it.
//
// The halo is now a DRAWING, not a computed ellipse: a 14x10 grid of pixels transcribed from a
// reference, in four tones, kept in HALO_GRID next to the code that walks it. Everything the
// previous version derived - the flattening, the three-pixel thickness, the shading across the
// band - was an attempt to compute what a drawing states outright, and the attempt cost a wedge at
// the ends the distance formula had to be written to correct. What the grid buys on top of that is
// the shading a formula could not reach at all: the light on this ring lies along the top of the
// far side and along the front of the near one, which is a ring seen at an angle rather than a
// flattened band, and no function of the distance to an ellipse produces it.
//
// It is 25 px of ink across a 40 px slot, in a 27x11 grid with a clear column down each side, and
// 11 rows tall against the old band's 15. The arc is 119 pixels instead of about 200, so a point
// is ~0.8% of a contract rather than 0.5%. What it costs is the marker: the hole down the middle
// is six rows, the `?` glyph is seven and takes nine with an outline, so the font version does not
// fit inside the drawing at any lift (see renderContracts).
//
// No outline. It was tried twice on the old band, near-black and then a darker tone of the same
// hue, and both times it carried more weight than the arc it was outlining. The tones across the
// drawing replace it: see drawHalo.
// The leading edge does not stop, it comes apart: over the last stretch of the arc the gold goes
// to its dimmer tone and then to nothing, so a contract running out looks like the halo failing
// rather than like a bar emptying. The length is in ring points, not pixels or degrees - the ring
// is one point per pixel of the drawing, so points ARE the unit the arc is counted in and a decay
// measured in them is the same length wherever it lands on the ellipse.
const HALO_DECAY = 24;            // ring pixels the crumble runs back over, of 119 - the same fifth

const HALO_DECAY_DIM = 0.55;      // the fraction of that length which has gone to the dimmer tone
const HALO_DECAY_HOLES = 0.95;    // hole density at the very tip, falling to none at the far end.

// 03_font.js
// ==========================================================================

// Bitmap text renderer. Reads FONT / FONT_W / FONT_H / FONT_X / FONT_BASE from the glyph table.
// No canvas font API is used anywhere in the game: at a 216 px buffer a vector font antialiases
// into grey mush and the integer upscale turns that mush into fringing.

// A glyph baked into its own small canvas, one per character, colour and size, and kept.
//
// The table is bitmasks, and painting one meant a `fillRect` PER LIT PIXEL - a 7x9 box is up to 63
// of them for one character. A screen of this game carries a few hundred characters between the
// HUD, the card, the floor labels and the popups, and every one of them was rebuilt from its
// bitmask on every frame: a hundred thousand canvas draw calls a second to redraw text that had
// not changed since the game booted. On a desktop that is invisible. On a four-core phone it is a
// slice the audio thread needed, which is what came back as crackle whenever the screen got busy.
//
// Bounded in practice: every colour handed to this comes from the palette in `C`, so the set of
// keys is the alphabet times a dozen colours times two sizes. The cap is a guard against a caller
// that one day computes a colour, not a real limit - past it, drawing falls back to the old path
// rather than failing or growing without end.
const glyphCache = {};
let glyphCount = 0;
const GLYPH_CACHE_MAX = 4000;

function glyphCanvas(ch, color, px) {
  const key = px + color + ch;      // px is a digit, colour a fixed-length hex, ch one character
  const hit = glyphCache[key];
  if (hit !== undefined) return hit;
  if (glyphCount >= GLYPH_CACHE_MAX) return null;
  const g = FONT[ch] || FONT['?'];
  const cv = makeLayer((FONT_W + FONT_X) * px, FONT_H * px);
  const gc = cv.getContext('2d');
  gc.fillStyle = color;
  for (let r = 0; r < FONT_H; r++) {
    const bits = g[r + 1];
    if (!bits) continue;
    for (let c = 0; c < FONT_W; c++)
      if (bits & (1 << (FONT_W - 1 - c))) gc.fillRect((c + FONT_X) * px, r * px, px, px);
  }
  glyphCache[key] = cv; glyphCount++;
  return cv;
}

// x is the left edge, y is the TOP row of the glyph box (a line occupies FONT_H rows downward).
// px is the pixel size: 1 for body text, 2 for headings. Returns the advanced width.
//
// The blit is rounded. Advances are whole pixels, so a run started on an integer stays on one, and
// a caller that hands this a fraction was asking a pixel font to land between pixels - which the
// old path answered with an antialiased smear, and this one answers by putting it on the grid.
function drawText(ctx, text, x, y, color, px) {
  px = px || 1;
  let cx = x;
  const gy = Math.round(y);
  for (const ch of text) {
    const g = FONT[ch] || FONT['?'];
    const cv = glyphCanvas(ch, color, px);
    if (cv) ctx.drawImage(cv, Math.round(cx), gy);
    else {
      ctx.fillStyle = color;
      for (let r = 0; r < FONT_H; r++) {
        const bits = g[r + 1];
        if (!bits) continue;
        for (let c = 0; c < FONT_W; c++)
          if (bits & (1 << (FONT_W - 1 - c))) ctx.fillRect(cx + (c + FONT_X) * px, y + r * px, px, px);
      }
    }
    cx += g[0] * px;
  }
  return cx - x;
}

// One line, one colour, except for the characters named in `tint` - each of those is drawn in its
// own. Written as runs rather than per character so a line of body text is still the same handful of
// `drawText` calls it always was, and the advance is untouched: a tinted character is the same glyph
// at the same width, so `wrapText` measured the line correctly before anything was coloured.
function drawTextTinted(ctx, text, x, y, color, px, tint) {
  let cx = x;
  let run = '';
  for (const ch of text) {
    const c = tint[ch];
    if (!c) { run += ch; continue; }
    if (run) { cx += drawText(ctx, run, cx, y, color, px); run = ''; }
    cx += drawText(ctx, ch, cx, y, c, px);
  }
  if (run) cx += drawText(ctx, run, cx, y, color, px);
  return cx - x;
}

// Advances are proportional, so every fixed-position string has to be measured, not counted.
function textWidth(text, px) {
  px = px || 1;
  let w = 0;
  for (const ch of text) w += (FONT[ch] || FONT['?'])[0] * px;
  return w;
}

function drawTextCentered(ctx, text, cx, y, color, px) {
  const x = Math.round(cx - textWidth(text, px) / 2);
  return drawText(ctx, text, x, y, color, px);
}

function drawTextRight(ctx, text, right, y, color, px) {
  return drawText(ctx, text, Math.round(right - textWidth(text, px)), y, color, px);
}

// Greedy word wrap. Returns an array of lines that each fit inside maxWidth.
function wrapText(text, maxWidth, px) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const candidate = line ? line + ' ' + w : w;
    if (line && textWidth(candidate, px) > maxWidth) {
      lines.push(line);
      line = w;
    } else {
      line = candidate;
    }
  }
  if (line) lines.push(line);
  return lines;
}

// Small helpers shared by every module. No game rules live here.

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOut(t) { return 1 - (1 - t) * (1 - t); }
// Slow at both ends. The ghost hand is the only thing in the game that has to imitate a
// gesture rather than respond to one, and a hand that starts at full speed reads as a slide
// rather than as a finger that pressed, moved and let go.
function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t); }

// One seeded generator for the whole game so a balance run can be replayed exactly.
let rngState = (RNG_SEED || (Date.now() & 0x7fffffff)) >>> 0;   // seeded from the clock unless RNG_SEED is set
function rng() {
  rngState = (rngState + 0x6d2b79f5) >>> 0;
  let t = rngState;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rngInt(n) { return Math.floor(rng() * n); }
function rngRange(lo, hi) { return lo + rng() * (hi - lo); }
function pick(arr) { return arr[rngInt(arr.length)]; }

// Weighted pick over objects carrying a numeric `weight` field.
function pickWeighted(items, weightOf) {
  let total = 0;
  for (const it of items) total += weightOf(it);
  let r = rng() * total;
  for (const it of items) {
    r -= weightOf(it);
    if (r <= 0) return it;
  }
  return items[items.length - 1];
}

function fillRect(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function strokeRect(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  ctx.fillRect(x, y, w, 1);
  ctx.fillRect(x, y + h - 1, w, 1);
  ctx.fillRect(x, y + 1, 1, h - 2);
  ctx.fillRect(x + w - 1, y + 1, 1, h - 2);
}

// Dashed outline for an empty slot. `phase` shifts the dashes so the caller can animate them.
function dashedRect(ctx, x, y, w, h, color, dash, gap, phase) {
  ctx.fillStyle = color;
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  const step = dash + gap;
  phase = ((phase || 0) % step + step) % step;
  for (let i = -phase; i < w; i += step) {
    const a = Math.max(i, 0), b = Math.min(i + dash, w);
    if (b > a) { ctx.fillRect(x + a, y, b - a, 1); ctx.fillRect(x + a, y + h - 1, b - a, 1); }
  }
  for (let i = -phase; i < h; i += step) {
    const a = Math.max(i, 0), b = Math.min(i + dash, h);
    if (b > a) { ctx.fillRect(x, y + a, 1, b - a); ctx.fillRect(x + w - 1, y + a, 1, b - a); }
  }
}

// Seconds to M:SS for the day timer.
function formatTime(seconds) {
  const s = Math.max(0, Math.ceil(seconds));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function pointInRect(px, py, r) {
  return px >= r.x && px < r.x + r.w && py >= r.y && py < r.y + r.h;
}

// Grows a rect to the minimum comfortable touch target, keeping it centred.
function hitRect(r) {
  const w = Math.max(r.w, HIT_MIN), h = Math.max(r.h, HIT_MIN);
  return { x: r.x + (r.w - w) / 2, y: r.y + (r.h - h) / 2, w: w, h: h };
}

// ==========================================================================
// 05_display.js
// ==========================================================================

// Canvas sizing and zone layout. Scale is computed in PHYSICAL pixels (CSS x devicePixelRatio),
// which is what keeps the pixel grid exact on high-DPI phones; the CSS size may be fractional.
// All drawing happens in virtual pixels through a scale transform, so no module ever sees `scale`.

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false });

const Display = {
  scale: 1,
  viewW: VIEW_W,
  viewH: VIEW_H_MIN,
  zones: null,        // { hud, heaven, ground, ops, work }, each { y, h }
  cssScale: 1,        // CSS px per virtual px, used to convert pointer coordinates
  landscape: false,   // true while the device is held sideways, see landscapeBlocked()
  noticeScale: 2      // pixel size of the rotate notice, which has its own layout
};

// Horizontal scroll of each floor (GDD 3.1). `scroll` is the strip's own offset in virtual px:
// 0 is its left end, negative means scrolled towards the right end. `from/to/t` carry a chevron
// autoscroll, the only thing that ever moves a strip without a finger on it. The cloud reads the
// heaven value too, because the slots are set into it and the two cannot come apart.
const Strip = {
  heaven: { scroll: 0, from: 0, to: 0, t: 1 },
  ops:    { scroll: 0, from: 0, to: 0, t: 1 }
};

// Orientation cannot be locked from a web page: screen.orientation.lock() only works in
// fullscreen and does not exist on iOS, and a manifest orientation only applies to an installed
// app. So a sideways device gets a notice and a paused game instead. The check is deliberately
// narrower than "wider than tall": a desktop browser window is nearly always wider than tall and
// plays perfectly well, so the coarse-pointer test keeps the notice on touch devices only.
function landscapeBlocked() {
  const coarse = window.matchMedia ? window.matchMedia('(pointer: coarse)').matches : false;
  return coarse && window.innerWidth > window.innerHeight;
}

function resizeDisplay() {
  const dpr = window.devicePixelRatio || 1;
  const cssW = window.innerWidth;
  const cssH = window.innerHeight;
  const physW = cssW * dpr;
  const physH = cssH * dpr;

  Display.landscape = landscapeBlocked();
  if (Display.landscape) {
    // The notice fills the whole viewport: drawn inside the small portrait canvas it would be
    // exactly as unreadable as the problem it is reporting.
    canvas.width = Math.round(physW);
    canvas.height = Math.round(physH);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    Display.noticeScale = Math.max(2, Math.floor(Math.min(physW / NOTICE_W, physH / NOTICE_H)));
    ctx.imageSmoothingEnabled = false;
    return;
  }

  let scale = Math.max(1, Math.floor(Math.min(physW / VIEW_W, physH / VIEW_H_MIN)));

  // Crop tolerance (GDD 1.2): if the next integer scale overflows the width by no more than
  // 2.5% and still leaves a legal view height, take it and let a few physical pixels fall off
  // the sides. This is what fills the screen on the tallest phones.
  const next = scale + 1;
  if (VIEW_W * next <= physW * CROP_TOLERANCE && Math.floor(physH / next) >= VIEW_H_MIN) scale = next;

  const viewH = clamp(Math.floor(physH / scale), VIEW_H_MIN, VIEW_H_MAX);

  Display.scale = scale;
  Display.viewH = viewH;
  Display.zones = computeZones(viewH);

  canvas.width = VIEW_W * scale;
  canvas.height = viewH * scale;
  canvas.style.width = (VIEW_W * scale / dpr) + 'px';
  canvas.style.height = (viewH * scale / dpr) + 'px';
  Display.cssScale = (VIEW_W * scale / dpr) / VIEW_W;

  ctx.imageSmoothingEnabled = false;
}

// Zone heights are authored for the 384 px view; a taller view hands the extra rows out by weight,
// and a shorter one takes them back the same way.
//
// `extra` is measured from ZONE_H and not from VIEW_H_MIN, which is the whole of what let the
// minimum move without touching a single number in the layout: the distance from the authored
// height is what the weights are about, and VIEW_H_MIN is only the shortest view the scale picker
// will accept. They were the same number until 5 September and reading one for the other would
// have quietly redistributed the tall-phone layout the moment they stopped being.
function computeZones(viewH) {
  const extra = viewH - ZONE_H;
  const weights = extra < 0 ? ZONE_SHRINK : ZONE_GROW;
  let growTotal = 0;
  for (const k in weights) growTotal += weights[k];

  const order = ['hud', 'heaven', 'ground', 'ops', 'work'];
  const h = {};
  let used = 0;
  for (const k of order) {
    h[k] = ZONE_BASE[k] + Math.floor(extra * weights[k] / growTotal);
    used += h[k];
  }
  h.work += viewH - used;          // the work zone absorbs the rounding remainder

  const zones = {};
  let y = 0;
  for (const k of order) {
    zones[k] = { y: y, h: h[k] };
    y += h[k];
  }
  return zones;
}

// --- Slot geometry ------------------------------------------------------------
// A floor is a horizontal strip of slots. Everything below takes the floor by name rather than by
// its arrays and sizes, because every call site used to fetch the same two counts before it could
// ask for a rectangle, and half the scroll bugs available were in that repetition.

function stripSlots(kind) { return kind === 'heaven' ? state.heavenSlots : state.cubicles; }
function stripSize(kind) { return kind === 'heaven' ? HEAVEN_SLOT : CUBICLE; }

// Everything drawn on a floor: the unlocked slots plus the next locked one, which is always shown
// as an invitation to buy and to scroll (GDD 3.1).
function stripWidth(kind) {
  const s = stripSize(kind);
  const n = visibleSlotCount(stripSlots(kind));
  return n * s.w + (n - 1) * s.gap;
}

// Where slot 0 sits before scrolling: the row is centred while it fits on screen and pinned to the
// edge margin once it does not. At four lounge slots the last one already overhangs by two pixels
// with the locked teaser fully outside - that overhang is the cue that the floor is a strip.
function stripOrigin(kind) {
  const full = stripWidth(kind);
  return full <= VIEW_W ? Math.floor((VIEW_W - full) / 2) : EDGE_MARGIN;
}

// The far end of the strip stops at the same margin the near end starts from. A floor that fits
// gets a range of zero, which is what makes it undraggable without a separate flag.
function stripMinScroll(kind) {
  return Math.min(0, VIEW_W - EDGE_MARGIN * 2 - stripWidth(kind));
}

function slotX(kind, i) {
  const s = stripSize(kind);
  return stripOrigin(kind) + Math.round(Strip[kind].scroll) + i * (s.w + s.gap);
}

// Guests stand ON the lounge floor, so the slot row is anchored to the ground line, not centred
// in its zone: the sky fills whatever space is left above it.
function heavenSlotRect(i) {
  return {
    x: slotX('heaven', i),
    y: Display.zones.ground.y - HEAVEN_SLOT.h,
    w: HEAVEN_SLOT.w,
    h: HEAVEN_SLOT.h
  };
}

function cubicleRect(i) {
  const z = Display.zones.ops;
  return {
    x: slotX('ops', i),
    y: z.y + z.h - OPS_FLOOR_H - CUBICLE.h,
    w: CUBICLE.w,
    h: CUBICLE.h
  };
}

// The two floors as bands, for the onboarding beats that name them (GDD 8.4). Full width because
// both strips scroll and neither has an end that is on screen; the lounge is the row of suites
// rather than the whole sky above it, because the sky is weather and the suites are the floor.
// Cut off the same numbers the slots are placed with, so a re-laid-out floor takes its spotlight
// with it.
function heavenFloorRect() {
  const r = heavenSlotRect(0);
  return { x: 0, y: r.y, w: VIEW_W, h: r.h };
}

function opsFloorRect() {
  const z = Display.zones.ops;
  return { x: 0, y: z.y, w: VIEW_W, h: z.h };
}

function cardRect() {
  const z = Display.zones.work;
  return {
    x: Math.floor((VIEW_W - CARD.w) / 2),
    y: z.y + Math.floor((z.h - CARD.h) / 2) - 6,
    w: CARD.w,
    h: CARD.h
  };
}

// ==========================================================================
// 06_input.js
// ==========================================================================

// Pointer handling. Raw events only translate screen coordinates into virtual pixels and classify
// the gesture; nothing here knows about game rules. Recognised gestures are queued and drained by
// the fixed-step update, so input is processed at the same rate as the simulation.

const Input = {
  gestures: [],                  // { type: 'tap'|'swipe', x, y, dir }
  drag: { active: false, startX: 0, startY: 0, x: 0, y: 0, dx: 0, dy: 0, time: 0 },
  pointerId: null
};

function toVirtualX(clientX) {
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) / (rect.width / VIEW_W);
}
function toVirtualY(clientY) {
  const rect = canvas.getBoundingClientRect();
  return (clientY - rect.top) / (rect.height / Display.viewH);
}

function onPointerDown(e) {
  // Before anything else, and outside the multitouch guard: this is the only code in the game
  // that runs inside a real gesture handler, and the AudioContext can be created nowhere else
  // (see unlockAudio in 07_audio.js). A second finger is still a gesture.
  unlockAudio();
  // Single touch only, no multitouch anywhere - unless the pointer holding the lock is stale, in
  // which case it never released and this one takes over (see releaseStalePointer).
  if (Input.pointerId !== null && !releaseStalePointer()) return;

  // Capture is an optimisation, not a requirement - it keeps the move and up events coming when a
  // finger slides off the canvas mid-swipe - so it is attempted, allowed to fail, and never allowed
  // to take the gesture down with it.
  //
  // It used to be called AFTER the id was claimed and without a guard, and setPointerCapture throws
  // NotFoundError whenever the pointer is no longer active by the time the handler runs. One throw
  // left Input.pointerId set for good: every later pointerdown hit the multitouch guard above and
  // returned, so the game went on animating - clouds drifting, contracts ticking, halos blinking -
  // while every tap and every swipe did nothing at all. A dead input layer that looks like a
  // running game is the worst failure this file can have, and it cost one line to make impossible.
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* proceed uncaptured */ }
  Input.pointerId = e.pointerId;

  const x = toVirtualX(e.clientX), y = toVirtualY(e.clientY);
  const d = Input.drag;
  d.active = true;
  d.startX = d.x = x;
  d.startY = d.y = y;
  d.dx = d.dy = 0;
  d.time = 0;
  e.preventDefault();
}

function onPointerMove(e) {
  if (e.pointerId !== Input.pointerId) return;
  const d = Input.drag;
  d.x = toVirtualX(e.clientX);
  d.y = toVirtualY(e.clientY);
  d.dx = d.x - d.startX;
  d.dy = d.y - d.startY;
  e.preventDefault();
}

function onPointerUp(e) {
  if (e.pointerId !== Input.pointerId) return;
  const d = Input.drag;
  d.x = toVirtualX(e.clientX);
  d.y = toVirtualY(e.clientY);
  d.dx = d.x - d.startX;
  d.dy = d.y - d.startY;

  const adx = Math.abs(d.dx), ady = Math.abs(d.dy);
  const dist = Math.max(adx, ady);
  if (dist >= SWIPE_THRESHOLD) {
    const dir = adx > ady ? (d.dx > 0 ? 'right' : 'left') : (d.dy > 0 ? 'down' : 'up');
    Input.gestures.push({ type: 'swipe', dir: dir, x: d.startX, y: d.startY });
  } else if (dist <= TAP_SLOP) {
    Input.gestures.push({ type: 'tap', x: d.x, y: d.y });
  }
  // Anything in between is a cancelled drag: the card springs back, nothing is queued.

  d.active = false;
  Input.pointerId = null;
  e.preventDefault();
}

// The single-touch guard above needs a way out, because it is the one piece of state in the game
// that a browser can strand. If a pointerup never arrives - the tab is backgrounded mid-touch, the
// OS takes the gesture for its own edge swipe, the event is simply lost, all of which happen on
// real phones - then Input.pointerId stays claimed and every later pointerdown returns at the
// guard. The game goes on animating: clouds drift, contracts tick, halos blink, and nothing the
// player does has any effect ever again. There is no way for them to recover it short of a reload,
// and nothing on screen says so.
//
// pointercancel covers most of those cases and is not guaranteed to. So the drag is also given an
// age, and a pointerdown arriving while the previous one is older than any real gesture takes over
// instead of being refused. The threshold is far beyond anything a hand does - the longest
// deliberate gesture in the game is the 1.2 s repair hold, and a lounge drag-scroll is under a
// second - so this can only ever fire on a pointer that is genuinely gone.
function updateInput(dt) {
  if (Input.pointerId !== null) Input.drag.time += dt;
}

function releaseStalePointer() {
  if (Input.pointerId === null || Input.drag.time <= INPUT_STALE) return false;
  Input.drag.active = false;
  Input.pointerId = null;
  return true;
}

function onPointerCancel(e) {

  if (e.pointerId !== Input.pointerId) return;
  Input.drag.active = false;
  Input.pointerId = null;
}

function initInput() {
  canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  canvas.addEventListener('pointermove', onPointerMove, { passive: false });
  canvas.addEventListener('pointerup', onPointerUp, { passive: false });
  canvas.addEventListener('pointercancel', onPointerCancel, { passive: false });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}

// Helper for screen code: was this tap inside a button rect (grown to a comfortable target)?
function tapHit(g, rect) {
  return g.type === 'tap' && pointInRect(g.x, g.y, hitRect(rect));
}

// ==========================================================================
// 07_audio.js
// ==========================================================================

// The audio layer (GDD 1.5). The game speaks its own event names - `checkIn`, `refused`, `riot` -
// and this file is the only place that knows they are cues in a player. That is why `sfx()` was
// written as a stub at step 1 and left alone for ten steps: every call site was already in its
// final form, so switching the sound on is one translation table and no edits to the game.
//
// There are two players behind it now and the game cannot tell them apart. 97_audio_files.js plays
// the six bundled .opus renders and is what ships; 98_audio_engine.js synthesises the same music
// and cues from note data and is the fallback. `A` is whichever one answered, and everything below
// this line calls through it.

// The engine shipped fifteen cues to start with, and seven of our events had no cue that meant
// them - `processed`, `expire`, `scroll`, `shop`, `suspicion`, `relief` and `lose`. They stayed
// silent rather than borrowing one that meant something else: `arrive` already plays the soul cue,
// so a desk discharge playing it too would have announced an arrival at the moment of a departure.
// The sound pass wrote the seven, so the table is one to one now and nothing here is silent.
const SFX_MAP = {
  checkIn:    'checkin',
  reassign:   'reassign',
  deny:       'deny',
  elevator:   'elevator',
  buy:        'purchase',
  snap:       'snap',
  arrive:     'soul',
  goodPerson: 'goodPerson',
  start:      'dayStart',
  dayEnd:     'quotaMet',
  quotaMiss:  'quotaFail',
  riot:       'riot',
  processed:  'processed',
  expire:     'expire',
  scroll:     'scroll',
  shop:       'shop',
  suspicion:  'suspicion',
  relief:     'relief',
  // The repair shares the relief cue rather than adding a twenty-third: both are "the resort

  // just got easier", the bank is already baked, and a cue of its own is a sound-pass decision
  // rather than a mechanic one.
  serve:      'relief',
  lose:       'lose',
  // Three different ways of being told no, and one sound for all three: a swipe onto a full
  // floor, a purchase that cannot be made, and a tap on a guest who is not going anywhere.
  refused:    'nofunds',
  turnAway:   'nofunds',
  busy:       'nofunds'
};

let audioReady = false;
let audioTier = 0;          // which Suspicion thresholds have already announced themselves
let A = null;               // the player that answered. Null until the first tap.

// The mute toggle (GDD 1.5). Deliberately not part of `state`: PLAY AGAIN resets the run, not the
// fact that the player is sitting in an open office. Nothing is persisted either - there is no
// localStorage anywhere in this build, and a session is one sitting.
//
// It moves the player's master gain, so effects go quiet with the music. Half a mute - a silent
// soundtrack still punctuated by stamps and riots - is not what anyone means by the button.
let soundOn = true;

function soundEnabled() { return soundOn; }

function toggleSound() {
  soundOn = !soundOn;
  if (A) A.volume(soundOn ? MUSIC_VOLUME : 0);
}

// 'low' on touch, and it is the measured answer rather than the cautious one. Reaches the fallback
// engine only: the file player has one media element per stem and no tiers to give it.
//
// `pointer: coarse` is the test rather than a user-agent string: it asks what the device is being
// driven with, which is the thing that correlates with a small battery-powered chip, and it does
// not need a list of phone names kept up to date. A desktop with a touchscreen would be caught by
// it wrongly - and would lose one of three detuned copies for it, which is the harmless direction.
function detectAudioQuality() {
  if (AUDIO_QUALITY !== 'auto') return AUDIO_QUALITY;
  const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  const cores = navigator.hardwareConcurrency || 8;
  return (coarse || cores <= 4) ? 'low' : 'high';
}

// Which player, and it is decided once, on the first tap, before either has been asked for
// anything. `AUDIO_SOURCE` says what the build wants; `WTHFiles.supported()` says whether this
// browser on this protocol can deliver it - see the comment on that function for the two cases
// that say no, both of which are decided without fetching a byte.
//
// The answer can still be wrong, because a file can fail after it has been chosen. `onFail` is the
// second chance: a stem that will not load, a bank that will not decode, or a graph that plays
// perfectly and arrives silent hands the session back here and the engine takes over mid-run.
// Nothing about that is graceful, and it is not meant to be - it is the difference between a judge
// hearing a beat of nothing and a judge hearing nothing at all.
function pickAudioBackend() {
  if (AUDIO_SOURCE === 'files' && WTHFiles.supported()) {
    WTHFiles.onFail(function () { switchToSynth(); });
    return WTHFiles;
  }
  return startSynth();
}

function startSynth() {
  // Before init(), not after. Most of what the tier does moves at runtime, but whether the
  // distortion shaper oversamples is decided when the context is built and cannot be changed
  // afterwards - so a tier chosen after that call would be a tier missing a piece.
  WTHAudio.quality(detectAudioQuality());
  WTHAudio.init();
  return WTHAudio;
}

// Only ever runs once, because `onFail` only fires once. `wasPlaying` is read before the swap: a
// failure on the title screen should leave the engine silent until CLOCK IN, and a failure in the
// middle of day six should start the music.
let audioSwitched = false;
function switchToSynth() {
  if (audioSwitched || A !== WTHFiles) return;
  audioSwitched = true;
  const wasPlaying = WTHFiles.state().playing;
  WTHFiles.stop(0.2);
  A = startSynth();
  A.volume(soundOn ? MUSIC_VOLUME : 0);
  A.setSuspicion(state.suspicion || 0);
  if (wasPlaying) A.play();
}

// Called from boot, before anything has been tapped and before a backend has been chosen. It only
// starts downloads: no AudioContext, no sound, and nothing here decides anything, so a build that
// later falls back to the engine has wasted a fetch and no more.
//
// Worth the call because of what the alternative sounded like. Every one of these files used to
// begin arriving on the tap that starts day one - the same tap that plays the day's first cue and
// starts the music - so the first cue was silent and the music came in late, on every run, over
// any connection slower than a local disk. A title screen is somebody reading a button, and this
// is what that time is for.
let audioBootAt = 0;
function preloadAudio() {
  audioBootAt = performance.now();
  if (usingFiles()) WTHFiles.preload(SFX_BANK);
}

function usingFiles() { return AUDIO_SOURCE === 'files' && WTHFiles.supported(); }

// Whether CLOCK IN should still be shut. What is waited for is decided in WTHFiles.loadProgress:
// the cue bank, and the heaven stem's own promise that it will play through. A run therefore never
// starts before the sound it opens with. The other two stems are minutes away and are not waited
// for, and a load that has failed opens the gate at once rather than holding it to the timeout.
function audioGated() {
  if (!usingFiles() || audioSwitched) return false;
  if (WTHFiles.loadProgress().ready) return false;
  return (performance.now() - audioBootAt) / 1000 < AUDIO_GATE_MAX;
}

// 0..1, for the bar on the title screen.
function audioLoadProgress() {
  return usingFiles() ? WTHFiles.loadProgress().value : 1;
}

// The browser will not create an AudioContext outside a real user gesture, and our own input
// layer is no help: it queues gestures and drains them inside the fixed-step update, which runs
// from requestAnimationFrame. Chrome would forgive that - its activation flag is sticky for the
// page - but iOS Safari wants the call inside the handler itself. So the unlock hangs off the raw
// pointerdown in 06_input.js and off nothing else.
//
// The file player needs the same gesture twice over: once for the context, and once to bless five
// media elements, because an element that has been played from a real tap may be started from
// anywhere afterwards and one that has not may not be started at all. Both happen inside `init`.
function unlockAudio() {
  if (audioReady) return;
  audioReady = true;
  A = pickAudioBackend();
  A.init();
  // Muted before the context existed is still muted: the toggle can be pressed on the title
  // screen, where the first tap creates the context and this runs immediately afterwards.
  A.volume(soundOn ? MUSIC_VOLUME : 0);
  // Asked for here rather than later because the decode needs a context, and this is the tap that
  // made one. Nothing waits on it: cues are silent until it lands, which is a second or two of a
  // title screen. A no-op on the engine, which has nothing to fetch.
  A.bank(SFX_BANK);
}

// One continuous piece of music from the first day to the end of the run: the days, the end-of-day
// plate and the shop are all inside it, and only the two ending themes stop it - which they do
// themselves. Started from CLOCK IN, which happens once per run.
function startMusic() {
  unlockAudio();
  A.play();
}

function sfx(name) {
  if (!audioReady) return;
  const cue = SFX_MAP[name];
  if (cue) A.sfx(cue);
}

// Called every simulation step, which is 60 times a second. Both players drop a call whose meter
// has not moved a quarter of a point, so this stays a plain "tell it whenever it changes" and the
// throttling lives where the cost is. The two tier crossings get a sting on the way up only -
// going back down is relief, and relief that announces itself is just another alarm.
function audioSuspicion(v) {
  if (!audioReady) return;
  A.setSuspicion(v);
  const tier = v >= SUSP_ALARM ? 2 : (v >= SUSP_AMBER ? 1 : 0);
  if (tier > audioTier) A.sfx(tier === 2 ? 'susp75' : 'susp40');
  audioTier = tier;
}

// 'victory' or 'defeat'. Each takes the loop down under itself, so there is nothing to stop here.
function audioTheme(which) {
  if (!audioReady) return;
  A.theme(which);
}

// PLAY AGAIN: the meter starts at zero again, so the crossings have to be allowed to fire again.
// The loop itself is restarted by the next CLOCK IN, and `play()` clears any ending theme.
function resetAudio() {
  audioTier = 0;
}

// The dev panel talks to whichever player is running rather than to a named one, and needs to be
// able to say which that is. Never called from the game.
function audioBackend() { return A; }

// ==========================================================================
// 08_data.js
// ==========================================================================

// All player-facing text and content tables. Kept apart from logic so a wording pass never
// touches game code. Archetypes, deny stamps and shop entries join this file at steps 2, 6 and 8.

// Souls (GDD 5.2). Each archetype is authored as a person and not as a pair of outputs: `g` is how
// credulous it is and `s` is how holy, both 0-5. What those two facts DO is decided in

// earner - it is what Head Office's instruments read in the lounge - and the card's red row is
// Skepticism, which is `STAT_MAX - g` and is what feeds Suspicion. Gullibility itself is therefore
// never displayed; it survives here because a person is more legible as "credulous 5" than as
// "skeptical 0", and because the weighted averages the whole balance model is quoted against were
// measured on it.

// Six beats, each shown once per run, each fired by the state that makes it mean something rather
// than by a step counter. `hold` stops the day until the beat is tapped away, and it is set by one
// rule: a beat that asks for an action holds, a beat that reports a fact does not. That is not the
// same as "day one only", and it cannot be - a contract runs 90 seconds and day one is 55, so the
// first expiry always lands on day two, and the beat teaching the second half of the core loop
// would have been the one beat nobody was ever made to read.
//
// `riot` is the one exception, and it is an exception to the rule's UNIT rather than to the rule.
// It reports a fact, and it is the first half of a two-part gate whose second half asks for the
// hardest gesture in the game: what a riot sounds like, and then what to do about what it left
// behind. Every riot wrecks a suite - `riot()` sets `wrecked` unconditionally - so the pair is
// guaranteed and is really one beat delivered in two plates. Leaving the first half unheld put
// five seconds of ordinary sorting between the cause and the instruction, which is exactly long
// enough for them to arrive as two unrelated events.

  // been named. That quiet moment is the only one a day has, and spending it on "what am I looking
  // at" is what lets the first card be about the card.

  // The pair used to be one joke told twice - the second line repeated the first with the currency
  // swapped, and the swap was the only thing in it the player did not already know. It reads well
  // and it teaches nothing: the two floors differ in what happens to a guest once they are on them,
  // and that difference is the reason the down swipe is a decision rather than an overflow.

  // So the pair is now a contrast instead of an echo, and it turns on one word. Upstairs they STAY:
  // the contract runs, and when it lapses the guest is still standing there, costing Suspicion

  // one of the twenty-one purchasable things in this game is about the tower, and none of them is
  // about the action the player performs two hundred times a run. This one widens the window on
  // the Snap Decision (GDD 5.5), so a player who reads the docket rather than reflexing at it
  // still earns the permanent 10%. It is worth nothing to a player who already snaps everything -
  // it does not raise the bonus, it lowers the bar to it.
  { id: 'wall',     name: 'Motivational Wall',        effect: 'LONGER SNAP',     cost: '+NOISE',
    base: 75,  mult: 1, limit: 1, page: 'extras', floor: 'ops', gives: { snap: 0.5, noise: 0.024 } },
  { id: 'breakroom', name: 'Break Room',              effect: 'FASTER DESKS',    cost: '+NOISE',
    base: 120, mult: 1, limit: 1, page: 'extras', floor: 'ops', gives: { desk: 0.10, noise: 0.028 } },

  // Consumables (GDD 9.1). `use` is what makes a row a consumable: buying it drops it into one of
  // the two HUD slots instead of into the world, and it is spent by a tap during a day. No limit
  // field, because the two slots are the limit - there is no inventory to hold a third.
  //
  // The second line is a qualifier rather than a price here, so it is only drawn red when it opens
  // with a plus: the termination is the one that charges the meter, and the others state a duration.
  { id: 'choir',     name: 'Choral Cover-Up',       effect: 'Suspicion x0.2', cost: 'for 25s',
    base: 60, mult: 1, page: 'supplies', use: true },
  { id: 'terminate', name: 'Contract Termination',  effect: 'Frees a suite',  cost: '+8 Suspicion',
    base: 45, mult: 1, page: 'supplies', use: true },
  { id: 'rush',      name: 'Rush Processing',       effect: 'Desks finish',   cost: 'in 15s',
    base: 55, mult: 1, page: 'supplies', use: true },
  { id: 'shuttle',   name: 'Emergency Shuttle',     effect: 'Clears queue',   cost: 'No penalty',
    base: 40, mult: 1, page: 'supplies', use: true }
];

// What the banner in the lounge calls each one while it is running. The full name does not fit
// beside the queue row, and the banner is a countdown rather than a label.
const SUPPLY_SHORT = {
  choir:     'COVER-UP',
  terminate: 'TAP A SUITE',
  rush:      'RUSH',
  shuttle:   'SHUTTLE'
};

// The shift associate (GDD 9.3). One slot, three of these four offered every night, hired for a
// wage charged at every day's settlement and fired for nothing. It exists because the measured
// shape of a run has capacity bought out by day five, after which Credits have nowhere to go and
// the second half of the session is execution without decisions: a permanent outgoing gives the
// credit line something to be for, right to the end.
//
// The GDD's own numbers are arithmetic rather than doctrine, the same way the Suspicion rates at
// step 5 were: -0.3 Suspicion/s would erase a drip that runs at about 0.35 with a full tower, so
// the Renegade Auditor scrubs 0.08 and is worth roughly a quarter of the bar.
const STAFF = [
  { id: 'flow',       name: 'Flow Optimizer',     wage: 25,
    effect: 'Faster desks', cost: '+15% Noise',    desk: 0.20, noise: 1.15 },
  { id: 'experience', name: 'Experience Manager', wage: 30,
    effect: '+20% Aura',    cost: '+Suspicion',    aura: 1.20, perGuest: 0.020 },
  { id: 'auditor',    name: 'Renegade Auditor',   wage: 45,
    effect: '-Suspicion',   cost: '-15% Credits',  scrub: 0.08, credits: 0.85 },
  { id: 'intern',     name: 'Intern',             wage: 8,
    effect: '+1 free desk', cost: 'Drops souls',   desks: 1, drop: 0.12 }
];

const STAFF_OFFER = 3;            // how many of the four are on the table on any one night

// The tabs of the night panel (GDD 9). BUILD is what the run is bought with, EXTRAS is what makes
// the resort popular and loud, STAFF is the standing outgoing, SUPPLIES is the one move available
// from inside a day.
//
// `fromDay` is the day AFTER WHICH the tab appears, so the first shop of the run is a single grid
// of eight items and looks exactly like the shop did before wave C. Twenty-one buyable things on
// the first night is a wall in front of a judge who has thirty seconds of attention and about a
// hundred credits, and the two tabs nobody opens are three systems scoring nothing.
//
// Gated on the day rather than on Credits or on how much has been bought: a day is deterministic,
// the harness can measure it, and every judge gets the same run. A condition-based unlock is
// invisible from inside the game and different for everybody.
//
// The panel opens on the tab that arrived tonight, and `beat` is the Associate line that explains
// it - which is the whole reason for the mechanism. A system the player never taps is worth less
// than no system at all, and a caption over the grid was one more thing to read on the screen that
// already carries a memo, an Earth feed and a grid of prices (GDD 8.4).
const SHOP_PAGES = [
  { id: 'build',    label: 'BUILD',    fromDay: 1 },
  // Second, because it is the only agency that exists INSIDE a day, and day two is the first one
  // that pushes back. Also the cheapest page in the panel, so it can be acted on at once.
  { id: 'supplies', label: 'SUPPLIES', fromDay: 2, beat: 'tabSupplies' },
  // Third, and deliberately the night before the comet: buying more arrivals the day before
  // arrivals triple is a real decision rather than a gift.
  { id: 'extras',   label: 'EXTRAS',   fromDay: 3, beat: 'tabExtras' },
  // Fourth, because the measured hole it fills opens on day five: capacity is bought out, and
  // Credits stop having anything to be for.
  { id: 'staff',    label: 'STAFF',    fromDay: 4, beat: 'tabStaff' }
];

// The end-of-day plate. Three states, because the difference between "you are behind" and "you are
// out" has to be legible in the two seconds the plate is up.
const PLATE_TEXT = {
  met:    { title: 'DAY %d COMPLETE',              note: 'Head Office is not displeased.' },
  miss:   { title: 'PERFORMANCE IMPROVEMENT PLAN', note: 'Aura reset. +25 Suspicion.' },
  final:  { title: 'FINAL NOTICE',                 note: 'Second missed quota.' }
};

// 09_state.js

// The entire mutable game state in one object. Everything the session owns lives here, which is
// what makes PLAY AGAIN a single call instead of a hunt for stragglers (there is no persistence).

const SCREEN = {
  BOOT: 'BOOT',
  TITLE: 'TITLE',
  DAY_ACTIVE: 'DAY_ACTIVE',
  DAY_END: 'DAY_END',
  NIGHT_CARD: 'NIGHT_CARD',   // the one contract offered between the settlement and the shop
  SHOP: 'SHOP',
  AUDIT: 'AUDIT',       // the three-second beam and collapse that precedes a loss
  LOSE: 'LOSE',
  WIN: 'WIN'
};

// Everything a night contract can do to a day, in one place and with the neutral value spelled
// out (GDD 8.3). A modifier read at the point it applies is the same rule the shop upgrades follow:
// a coefficient copied into the world at the moment of the choice is a second copy of that choice,
// waiting to disagree with the first.
const PACT_NEUTRAL = {
  arrivalMult:  1,       // multiplies the interval between arrivals, so >1 is a slower day
  quotaMult:    1,
  auraMult:     1,
  noiseMult:    1,
  deskMult:     1,       // how long a soul takes to process downstairs
  contractMult: 1,       // stamped onto a guest at check-in, like the EULA Conveyor
  suspDrip:     0,       // extra Suspicion per second, on top of what the tower is producing
  dayBonus:     0,       // seconds added to the day
  priceMult:    1,       // shop prices, and only for the one night that follows
  preFill:      0,       // souls already waiting when the day opens
  maint:        false,   // the highest lounge slot is shut for the day
  noOverflow:   false    // a full queue turns arrivals away without the Suspicion hit
};

function neutralPact() {
  return Object.assign({}, PACT_NEUTRAL);
}

const state = {
  screen: SCREEN.BOOT,

  day: 1,
  dayTime: 0,           // seconds left in the current day, counts down
  dayLen: 0,
  dayHold: false,       // day one waits for the first swipe before anything starts (GDD 2)
  plateTime: 0,         // seconds left on the end-of-day plate

  aura: 0,
  credits: 0,
  suspicion: 0,

  // The growth meter and its slow half (GDD 4.1). Neither has a bar: Buzz is read as the speed of
  // the queue and Reputation is read as Buzz. They are here rather than derived on the fly because
  // Buzz eases towards what the tower deserves instead of snapping to it - a riot has to thin the
  // queue over a few seconds, not between two frames.
  buzz: 0,
  reputation: 0,

  heavenSlots: [],      // { unlocked, guest, maint, wrecked }

  cubicles: [],         // { unlocked, guest }

  queue: [],            // souls waiting; the one being decided sits on the card, not in here
  card: null,           // the soul in the work zone, see takeNextCard()
  arrivalTimer: 0,      // seconds until the next soul walks in
  flyers: [],           // filed cards travelling to their slot, visual only
  fullFlash: { heaven: 0, ops: 0 },   // FULL over a floor that refused a swipe
  turnAway: 0,          // an arrival that found the queue full and left
  popups: [],           // floating production numbers, visual only
  snapFlash: 0,         // the snap-decision bonus announcing itself

  notes: [],            // note icons rising out of operations, visual only
  noteTimer: 0,         // seconds until the next one is heard
  suspFlash: 0,         // the Suspicion bar flaring after a one-off hit
  suspPop: { n: 0, t: 0 },   // and the total of those hits, floated in the HUD

  upgrades: {},         // shop item id -> how many levels of it have been bought
  // The two consumable slots and the one effect that can be running (GDD 9.1). `arm` is the
  // Contract Termination waiting for the player to say which suite: the only consumable that
  // needs a second gesture, and the only reason `active` is not just a countdown.
  supplies: [],
  active: { id: null, t: 0, dur: 0, arm: false },
  quotaMisses: 0,       // two ends the run (GDD 8)
  dayResult: { quota: 0, aura: 0, state: 'met' },   // what the end-of-day plate reports
  shopIn: 0,            // 0 to 1 while the shop panel slides up
  shopPage: 0,          // which tab of the night panel is on screen (SHOP_PAGES)
  shopFlash: { index: -1, t: 0, ok: false },        // a cell that was just bought, or refused

  // The shift associate (GDD 9.3): who is on shift, which three are on the table tonight, and one
  // line reporting what last night's settlement did about the wage. One slot, and that is the whole
  // of the roster - the modifiers read off `hired` where they apply, like everything else here.
  staff: { hired: null, offer: [], note: '', desk: -1 },

  // The night contract (GDD 8.3): the deck it is drawn from, the card on the table, and what the
  // last answer did to the coming day. `pact` is cleared when the next card is dealt, not at the
  // start of a day - the shop sits between the two, and the discount has to survive it.
  night: { deck: [], card: null, in: 0, choice: -1, flash: 0 },
  pact: neutralPact(),

  auditTime: 0,         // the collapse before a loss counts down here
  endTime: 0,           // seconds the ending screen has been up, so the last word can be spoken
  loseReason: 'audit',  // which of LOSE_TEXT the lose screen shows

  // The onboarding beats (GDD 8.4): which have already been said, which are waiting their turn, and
  // the one on screen. In here rather than in a module of its own so PLAY AGAIN teaches from
  // scratch - a second judge on the same tab must get the same first run as the first one.
  tutorial: { seen: {}, queue: [], id: null, line: null, hold: false, t: 0, life: TUTORIAL_LIFE },

  // The ghost hand that teaches the strip drag (GDD 3.1), and the only lesson in the game with no
  // words in it. `learned` is its off switch and the player owns it: one horizontal drag on a floor
  // and the hand never runs again this run. `opened` and `alerted` are the two moments that arm it,
  // each once. In `state` for the same reason the beats are - PLAY AGAIN has to teach from scratch.
  stripHint: { learned: false, opened: false, alerted: false, plays: 0, t: 0, dir: -1, base: 0 },

  // `denied`, `toOps` and `suspPeak` exist for the verdict on the ending screen (GDD 11) and for
  // nothing else: the title is read off how the run was played, so the run has to have been counted.
  stats: { soulsProcessed: 0, auraTotal: 0, creditsTotal: 0, daysSurvived: 0, riots: 0, processed: 0,
           denied: 0, toOps: 0, suspPeak: 0, turnedAway: 0, completed: 0, repaired: 0 }
};

function makeSlots(total, unlocked) {
  const arr = [];
  // `wrecked` is separate from `maint` and not a second name for it. Maintenance is the Renovation
  // pact, it is chosen, it lasts one day and 13_fsm clears it every morning. A wreck is a riot's
  // leavings: nobody chose it and nothing clears it but a thumb, which is the whole of why the
  // riot now has a tail.
  for (let i = 0; i < total; i++) arr.push({ unlocked: i < unlocked, guest: null, maint: false, wrecked: false });

  return arr;
}

function resetGame() {

  state.cubicles = makeSlots(MAX_CUBICLES, START.cubicles);

  state.queue.length = 0;
  state.card = null;
  state.arrivalTimer = 0;
  state.flyers.length = 0;
  state.fullFlash.heaven = 0;
  state.fullFlash.ops = 0;

  state.notes.length = 0;
  state.noteTimer = 0;
  state.suspFlash = 0;
  state.suspPop.n = 0;
  state.suspPop.t = 0;

  state.upgrades = {};
  state.supplies = [];
  for (let i = 0; i < SUPPLY_SLOTS; i++) state.supplies.push(null);
  state.active.id = null;
  state.active.t = 0;
  state.active.dur = 0;
  state.active.arm = false;
  state.quotaMisses = 0;
  state.dayResult = { quota: 0, aura: 0, state: 'met' };
  state.shopIn = 0;
  state.shopPage = 0;
  state.shopFlash.index = -1;
  state.shopFlash.t = 0;
  state.shopFlash.ok = false;

  state.staff.offer.length = 0;
  state.staff.note = '';
  state.staff.desk = -1;

  state.night.deck.length = 0;
  state.night.card = null;
