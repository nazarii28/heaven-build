}
function ctx(){ initAudio(); if (AC.state === 'suspended') AC.resume(); return AC; }

let live = [];
// 2 = high, 1 = mid, 0 = low. It was a flag until a phone reported that HALL OFF changed nothing
// and AQ LOW fixed everything, which said the cost is not in the fixed graph but in what a note
// costs to build - and left nothing in between the two to try. Where the nodes go, for a pad at
// high with fm, vibrato, tremolo and air:
//
//   3 unison layers x (osc + gain + filter)      9
//   + sub oscillator x 3                         6
//   + fm oscillator and depth gain x 3           6
//   + vibrato oscillator and depth gain x 3      6
//   + tremolo oscillator and depth gain x 3      6
//   + air noise, filter and gain x 3             9
//                                               42 nodes, for one note
//
// The multiplier is the whole story: `sub()` is called once per unison layer and each layer builds
// its own modulators, so a third voice does not cost a third more, it costs a third of forty-two.
// Mid takes the two multiplications out - two layers instead of three, and modulators built once
// for the note rather than once per layer - which is the same note, 12 nodes instead of 42. What
// it does NOT do is what low does besides: low also silences every channel at priority 3 or under,
// drops the modulators entirely and shortens the hall, and that is why low is audibly a different
// arrangement rather than the same one played more cheaply.
let qLevel = 2, reverbOn = true;
// How many detuned copies a voice may use, and whether the modulators are built for every copy or
// only the first. One vibrato across a stack of three near-identical detuned oscillators is very
// nearly the same sound as three; three times the nodes is not very nearly the same cost.
let uniMax = 3, modsAll = true;
// Set by `emit` while two mixes overlap: for that stretch every voice is a single layer with no
// modulators, whatever the tier says. See `emit` for the measurement behind it.
let xfadeThin = false;
// `dc` marks the node at the END of a voice's chain - the one wired into a permanent pan or bus
// node. Nothing in this engine ever disconnected anything: an oscillator stops itself, but the gain
// and filter it fed stay wired into the always-on graph, waiting for the collector to notice they
// are orphaned. At a couple of hundred nodes a second that is a rendering graph that GROWS for the
// length of a run, and the audio thread walks it every 128 samples - which is why the fault came on
// partway through a session rather than at the start, and why the cheapest tier survived longest
// rather than sounding different in kind.
//
// Disconnecting the terminal node detaches the whole chain behind it in one call, since nothing
// upstream is referenced anywhere else once its source has finished.
function reg(node, end, st, dc){ live.push({ e: end, n: node, s: st, d: dc }); }
function killAll(){
  const t = AC.currentTime;
  for (const L of live) {
    try { if (L.d) L.n.disconnect(); else L.n.stop(Math.max(t, L.s)); } catch (e) {}
  }
  live = [];
}

const UNI_IDX = { 1: [1], 2: [0, 2], 3: [0, 1, 2] };
const UNI_DET = { 1: [0], 2: [-1, 1], 3: [-1, 0, 1] };

// one layer of unison
function sub(t0, f, dur, rec, out, amp, cents, midi, mod){
  const g = AC.createGain();
  let node = g;
  if (rec.f) {
    const flt = AC.createBiquadFilter();
    flt.type = rec.ft || 'lowpass'; flt.Q.value = rec.q;
    const base = clamp(rec.f, 120, 16000);
    if (rec.fe) {
      flt.frequency.setValueAtTime(base * rec.fe, t0);
      flt.frequency.exponentialRampToValueAtTime(base, t0 + Math.min(.4, dur));
    } else if (rec.fslow && qLevel) {           // pads open up rather than just standing there
      flt.frequency.setValueAtTime(base / rec.fslow, t0);
      flt.frequency.exponentialRampToValueAtTime(base, t0 + Math.min(2.2, dur + .4));
    } else flt.frequency.setValueAtTime(base, t0);
    g.connect(flt); node = flt;
  }
  node.connect(out);

  const peak = rec.g * amp, sLev = rec.sus ? Math.max(.0002, peak * rec.s) : 0;
  const term = node;                       // detached once the voice has finished; see reg()
  g.gain.setValueAtTime(.0001, t0);
  g.gain.linearRampToValueAtTime(peak, t0 + rec.a);
  let stopAt;
  if (rec.sus) {
    const hold = Math.max(rec.a + rec.d, dur);
    g.gain.exponentialRampToValueAtTime(sLev, t0 + rec.a + rec.d);
    g.gain.setValueAtTime(sLev, t0 + hold);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + hold + rec.r);
    stopAt = t0 + hold + rec.r + .05;
  } else {
    g.gain.exponentialRampToValueAtTime(.0001, t0 + rec.a + rec.d);
    stopAt = t0 + rec.a + rec.d + .05;
  }

  const o = AC.createOscillator();
  const w = WAVE[rec.w];
  if (Array.isArray(w)) o.setPeriodicWave(w[bandOf(midi)]);
  else if (w) o.setPeriodicWave(w);
  else o.type = 'sawtooth';
  o.frequency.setValueAtTime(f, t0);
  if (cents) o.detune.setValueAtTime(cents, t0);
  o.connect(g); o.start(t0); o.stop(stopAt); reg(o, stopAt, t0);
  reg(term, stopAt, t0, true);

  if (rec.sub) {                                 // low end under the bass
    const s2 = AC.createOscillator(); s2.type = 'sine';
    s2.frequency.setValueAtTime(f / 2, t0);
    const sg = AC.createGain(); sg.gain.value = rec.sub;
    s2.connect(sg); sg.connect(g);
    s2.start(t0); s2.stop(stopAt); reg(s2, stopAt, t0);
  }
  if (rec.fm && mod) {
    const m = AC.createOscillator(); m.type = 'sine';
    m.frequency.setValueAtTime(f * rec.fm[0], t0);
    const mg = AC.createGain();
    mg.gain.setValueAtTime(f * rec.fm[1], t0);
    mg.gain.exponentialRampToValueAtTime(f * .02, t0 + Math.min(1.4, dur + .3));
    m.connect(mg); mg.connect(o.frequency);
    m.start(t0); m.stop(stopAt); reg(m, stopAt, t0);
  }
  if (rec.vib && mod) {
    const l = AC.createOscillator(); l.type = 'sine';
    l.frequency.value = rec.vib[0] * (.9 + Math.random() * .2);  // each one its own
    const lg = AC.createGain();
    lg.gain.setValueAtTime(0, t0);
    lg.gain.linearRampToValueAtTime(rec.vib[1], t0 + rec.vib[2] + .4);
    l.connect(lg); lg.connect(o.detune);
    l.start(t0); l.stop(stopAt); reg(l, stopAt, t0);
  }
  if (rec.trem && mod) {
    const l = AC.createOscillator(); l.type = 'sine'; l.frequency.value = rec.trem[0];
    const lg = AC.createGain(); lg.gain.value = peak * rec.trem[1];
    l.connect(lg); lg.connect(g.gain);
    l.start(t0); l.stop(stopAt); reg(l, stopAt, t0);
  }
  if (rec.air && mod) noiseAt(t0, Math.min(dur, .8), f * 2.6, 1.4, peak * rec.air, out);
}

function voice(t0, f, dur, rec, tr, ch, amp, midi){
  const uni = Math.min(rec.uni, xfadeThin ? 1 : uniMax);
  const idx = UNI_IDX[uni], det = UNI_DET[uni];
  const a = amp / Math.sqrt(uni);
  const mods = !xfadeThin && qLevel > 0;
  for (let k = 0; k < uni; k++)
    sub(t0 + k * .006, f, dur, rec, pan[tr][ch][idx[k]], a, det[k] * rec.det, midi,
        mods && (modsAll || k === 0));
}

// Every noise hit reads a window out of the one buffer built at init, from a random offset so
// two hats in a row are not the same sample of static. This used to allocate a buffer per hit
// and fill it with Math.random() - a 1.7 s crash cymbal is 80,000 samples of that, on the main
// thread, inside a scheduler tick that has 25 ms to finish. That was the stall that starved the
// audio thread and made the speaker crackle; the drums are the busiest channel in the mix, so
// it happened several times a bar.
function noiseAt(t0, dur, bp, q, vol, out, sweepTo){
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const off = Math.random() * Math.max(.001, noiseBuf.duration - dur - .05);
  const f = AC.createBiquadFilter();
  f.type = 'bandpass'; f.Q.value = q;
  f.frequency.setValueAtTime(bp, t0);
  if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(out);
  src.start(t0, off); src.stop(t0 + dur + .02); reg(src, t0 + dur + .02, t0);
  reg(g, t0 + dur + .02, t0, true);
}

function drum(t0, note, amp, tr, ch, style){
  const st = style === undefined ? tr : style;
  const out = pan[tr][ch][1], soft = st === 0, heavy = st === 2;
  const tone = (fa, fb, t, vol, type) => {
    const o = AC.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(fa, t0);
    if (fb) o.frequency.exponentialRampToValueAtTime(fb, t0 + t * .5);
    const g = AC.createGain();
    g.gain.setValueAtTime(Math.max(.0002, vol), t0);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + t);
    o.connect(g); g.connect(out); o.start(t0); o.stop(t0 + t + .04);
    reg(o, t0 + t + .04, t0);
    reg(g, t0 + t + .04, t0, true);
  };
  if (note === 36) {
    tone(heavy ? 155 : 118, heavy ? 41 : 49, heavy ? .42 : .3, amp * (heavy ? .9 : soft ? .48 : .74));
    noiseAt(t0, .02, 2400, .8, amp * .1, out);
  } else if (note === 38 || note === 40 || note === 37) {
    noiseAt(t0, soft ? .17 : .12, soft ? 3400 : 1800, soft ? .55 : .85,
            amp * (soft ? .28 : heavy ? .72 : .55), out);
    if (!soft) tone(190, 150, .09, amp * .26, 'triangle');
  } else if (note === 42 || note === 44) {
    noiseAt(t0, .04, 7400, 1.4, amp * (soft ? .12 : .22), out);
  } else if (note === 46) {
    noiseAt(t0, .26, 6800, 1.1, amp * .2, out);
  } else if (note === 49 || note === 57) {
    noiseAt(t0, heavy ? 1.7 : 1.2, 4000, .4, amp * (soft ? .15 : .28), out, 1500);
  } else if (note === 51 || note === 53 || note === 59) {
    noiseAt(t0, .34, 6200, 1.5, amp * (soft ? .09 : .15), out);
    if (note === 53) tone(1180, 0, .38, amp * .1);
  } else if (note === 54) {
    noiseAt(t0, .14, 8600, 2, amp * .14, out);
  } else {
    const f = 92 * Math.pow(2, (note - 41) / 14);
    tone(f * 1.35, f, .34, amp * (heavy ? .72 : .5));
    noiseAt(t0, .05, f * 6, 1.2, amp * .1, out);
  }
}

// ---------------------------------------------------------------------------
// 4. Suspicion -> mix
// ---------------------------------------------------------------------------
let suspicion = 0, solo = -1;
const busTarget = [1, 0, 0];
// Heaven takes the first ~25 of the scale, hell everything from ~75. All the ground
// between them is carried by the middle layer: it is what should be playing most of a run.
// Moved with the meter tiers (GDD 1.5, 7.1): heaven now owns 0-20 and hell 60-100, because at the
// old 0-25 / 75-100 split the hell arrangement never played in a run the player was winning.
function busWeights(v){
  const h = 1 - smoothstep(v, 10, 22);
  const m = smoothstep(v, 8, 20) * (1 - smoothstep(v, 59, 74));
  const l = smoothstep(v, 58, 72);
  const s = Math.max(1, (h + m + l) * .85);
  return [h / s, m / s, l / s];
}
// The game calls this every simulation step - 60 times a second, for the length of a run - and
// until it was measured on a phone nobody had asked what a call costs. Seven AudioParam events
// crossing from the main thread to the audio thread, plus a freshly built 1024-point Float32Array
// handed to a WaveShaper that sits in the always-on chain, which makes it rebuild its state and,
// at '2x', its oversampling buffers with it. A quarter of a megabyte a second of garbage to say
// the same thing sixty times over, to a mix that answers through a 0.9 s crossfade and cannot
// express the difference between one frame and the next.
//
// So it does the work when the meter has actually moved. A quarter of a point is far under what a
// 0.9 s fade can render, and the drip takes whole seconds to cross that. `force` is for the callers
// that change something other than the meter - the reverb, a theme ending, the first build - and
// have to be applied whatever the number says.
let lastApplied = -1;
function applySuspicion(force){
  if (!AC) return;
  if (!force && Math.abs(suspicion - lastApplied) < .25) return;
  lastApplied = suspicion;
  const t = AC.currentTime, w = busWeights(suspicion);
  for (let i = 0; i < 3; i++) {
    busTarget[i] = solo >= 0 ? (solo === i ? 1 : 0) : w[i];
    bus[i].gain.setTargetAtTime(busTarget[i], t, .9);
    busWet[i].gain.setTargetAtTime(reverbOn ? busTarget[i] : 0, t, .9);
  }
  color.frequency.setTargetAtTime(11000 * Math.pow(2600 / 11000, suspicion / 100), t, .9);
  // Picked out of a table built at init rather than computed here. Sixteen steps across a
  // distortion that takes thirty points of meter to arrive is finer than the ear follows, and the
  // assignment only happens on a step change, so the shaper is left alone for seconds at a time.
  const di = Math.round(smoothstep(suspicion, 70, 100) * (DIST_STEPS - 1));
  if (di !== distIdx) { distIdx = di; shaper.curve = distTable[di]; }
  wireHell(busTarget[2] > BUS_AUDIBLE);
}
function setSuspicion(v){ suspicion = clamp(v, 0, 100); applySuspicion(); }

// Off means disconnected, not turned down. A convolver whose input is silent still convolves - it
// has no way of knowing its tail has run out - so a wet send held at zero gain costs the machine
// exactly what a loud one does. Pulling the connection is what buys the CPU back; the send is
// faded first and the wire cut afterwards, so the hall empties instead of stopping dead.
// The hell mix is the only thing routed through the distortion shaper, and it is silent below
// Suspicion 58 - but `bus[2]` was wired into the shaper at init and left there, so a node doing
// 2x-oversampled waveshaping ran every 128 samples for the whole of every run, including the
// nine tenths of one where nothing was going through it. Oversampling carries latency, so the
// node does not get to pass silence along and skip its work the way a plain filter would.
//
// Wired the moment the mix becomes audible - the gain fade takes 0.9 s, so there is no hurry -
// and cut a second and a half after it goes quiet, once that fade has finished. `bus[2]` has
// exactly one outgoing connection, so the bare disconnect is unambiguous.
let hellWired = true, hellTimer = null;
function wireHell(on){
  if (!AC || on === hellWired) return;
  hellWired = on;
  clearTimeout(hellTimer);
  if (on) bus[2].connect(shaper);
  else hellTimer = setTimeout(function(){ try { bus[2].disconnect(); } catch (e) {} }, 1600);
}

let revTimer = null;
function setReverb(on){
  reverbOn = !!on;
  if (!AC) return;
  if (reverbOn) for (let i = 0; i < 3; i++) busWet[i].connect(hall);
  applySuspicion(true);
  clearTimeout(revTimer);
  if (!reverbOn) revTimer = setTimeout(function(){
    for (let i = 0; i < 3; i++) { try { busWet[i].disconnect(); } catch (e) {} }
  }, 1400);
}

// ---------------------------------------------------------------------------
// 5. Scheduler (lookahead - the timing does not drift the way setTimeout does)
// ---------------------------------------------------------------------------
// The second buffer, and a completely different one from the output buffer: this is how far ahead
// of the clock notes are handed over, and so how long the MAIN thread may be blocked before a note
// misses its slot and `emit` throws it away. A dropped note is a hole in the bar, which sounds
// like the same fault as a crackle and is not one.
//
// It costs nothing in the way the output buffer does. Sound effects are scheduled against
// `currentTime` when they fire, not through this, so widening it does not put any delay between a
// finger and a stamp. What it does delay is the mix ANSWERING - a Suspicion crossfade only reaches
// notes emitted after it, so the mix reacts one lookahead late, against a fade that already takes
// 0.9 s.
//
// So why not a full second. Nodes enter the `live` registry when they are scheduled, not when they
// sound, so a wider lookahead means more of them registered at any moment - and CAP_SOFT/CAP_HARD
// start dropping low-priority notes on that count. Past a point, widening this buffer thins the
// arrangement, which is the exact thing it exists to prevent. 250 ms is roughly a 15 fps stall
// survived intact and adds about a tenth to the registry against a typical note length.
let AHEAD = .25;
const TICK_MS = 25;
// live counts NODES, not notes: one voice is 2 to 5 nodes
let CAP_SOFT = 200, CAP_HARD = 300;
let running = false, startT = 0, timer = null, cullPrio = 0;
// A mix quieter than this is not emitted at all. See `emit` for what happens while two are above it.
const BUS_AUDIBLE = .05, XFADE_PRIO = 4;
const cur = [new Int32Array(16), new Int32Array(16), new Int32Array(16)];
const chLevel = new Float32Array(16), chMute = new Uint8Array(16);
let liveCount = 0;

// Applies everything the tier decides that is not frozen into the graph at init. `quality` itself
// is read per note by `sub` and `voice`; these three are read by the scheduler.
// The tier now moves ONE thing: what a voice costs to build. Everything else it used to drag along
// was measured on a phone and found not to be carrying anything.
//
//   the hall      - HALL OFF changed nothing at either end, so low no longer gets a short mono
//                   impulse. It was the largest audible sacrifice in the tier and bought nothing.
//   the channels  - low used to silence everything at priority 3 or under. CULL 6 silences more
//                   than that and did not help mid, so note count is not the lever either. The
//                   flat rule is gone; the CULL dial remains, and CULL 4 reproduces it exactly if
//                   the measurement ever turns around.
//   the caps      - same ceiling for every tier. They are a load-driven safety net, and a tier
//                   whose notes are already cheap does not need a tighter one.
//
// What is left is the finding: this phone can afford about one oscillator layer and no modulators.
// That is low's synthesis cost with high's arrangement, which is strictly better music for exactly
// the same bill.
function applyTier(){
  uniMax   = qLevel === 2 ? 3 : qLevel === 1 ? 2 : 1;
  modsAll  = qLevel === 2;
  AHEAD    = qLevel ? .25 : .34;      // the wider lookahead is free, so the cheap tier keeps it
  CAP_SOFT = 200;
  CAP_HARD = 300;
}

// Counts, and does nothing else. A tick arriving far later than the 25 ms it asked for means the
// main thread was blocked, and blocked long enough the notes it should have been scheduling are
// already in the past - so this number is the difference between "the audio thread cannot render
// the mix" and "the main thread never gave it the notes", which sound identical and are fixed in
// opposite places. The dev panel reads it on the device.
//
// It used to act on what it counted, dropping the engine to the cheap tier after twelve late
// ticks. That was removed rather than tuned: a mix that thins by itself when the game gets busy
// is a worse thing to hear than either mix, and it makes every measurement ambiguous - you can no
// longer tell whether what you are listening to is the build you shipped.
// The threshold is 50 ms over the tick, not 120: at 120 the first phone read L0 next to a worst gap
// of 125 ms, which is a stall of a hundred milliseconds reported as nothing at all. A counter whose
// threshold sits above the events it is meant to count is worse than no counter, because zero looks
// like an answer.
let lateHits = 0, worstGap = 0, lastTick = 0, peakLive = 0;
function watchLateness(now){
  if (lastTick) {
    const gap = now - lastTick;
    if (gap > worstGap) worstGap = gap;
    if (gap > TICK_MS / 1000 + .05) lateHits++;
  }
  if (liveCount > peakLive) peakLive = liveCount;
  lastTick = now;
}

function resetCursors(fromU){
  for (let tr = 0; tr < 3; tr++)
    for (let ch = 0; ch < 16; ch++) {
      const c = DATA[tr][ch]; let i = 0;
      while (i < c.n && c.t[i] < fromU) i++;
      cur[tr][ch] = i;
    }
}

function pump(){
  const now = AC.currentTime;
  // Compacted in place rather than filtered into a new array: this runs forty times a second for
  // the length of a run, and a fresh 200-entry array each time is garbage the main thread has to
  // collect - during which it is not scheduling notes.
  let k = 0, sounding = 0;
  for (let i = 0; i < live.length; i++) {
    const L = live[i];
    if (L.e > now) { live[k++] = L; if (!L.d) sounding++; }
    else if (L.d) { try { L.n.disconnect(); } catch (e) {} }
  }
  live.length = k;
  // Counts SOURCES, not registry entries. Every voice now also registers its terminal node so the
  // chain can be detached when it ends, and counting those would halve CAP_SOFT and CAP_HARD
  // without anyone changing them - the caps are calibrated against oscillators and buffer sources,
  // which is what actually costs the audio thread anything.
  liveCount = sounding;
  watchLateness(now);

  let hSec = now - startT + AHEAD;
  if (hSec >= TOTAL_SEC) {          // first run the tail out to the end of the loop,
    emit(LOOP_U, now);              // and only then wrap round - with no gap
    startT += TOTAL_SEC;
    resetCursors(0);
    hSec -= TOTAL_SEC;
  }
  emit(secToU(Math.max(0, hSec)), now);
  timer = setTimeout(pump, TICK_MS);
}

let dropped = 0;
function emit(hU, now){
  // How many mixes are sounding at once. One is the normal state; two means a crossfade, and a
  // crossfade used to be the most expensive thing in the game by a wide margin - a phone put its
  // worst lag at Suspicion 65, which is exactly where the two densest mixes meet.
  //
  // The first attempt dropped each mix to its high-priority channels and barely helped, because
  // priority is a musical ranking and cost is not. Measured per channel, the hell mix's `choir`
  // alone is 86 of its 240 average simultaneous nodes - three unison layers, each with a filter,
  // a vibrato and a breath of air, sustained with a 1.6 s release - and `pad` and `choir2` are the
  // next two. All three rank high, so the skeleton kept every expensive channel and threw away the
  // cheap ones. It saved 29%.
  //
  // So the crossfade thins VOICES instead of removing PARTS: while two mixes overlap, every note
  // in both is built as a single layer with no modulators. Every channel is still there and the
  // arrangement is complete; what changes is the timbre, for the stretch where it is changing
  // anyway. Measured, that puts the overlap at 232 average nodes against 265 for one mix playing
  // alone at full quality - so the crossfade now costs LESS than ordinary playback and cannot be
  // the peak again.
  let busy = 0;
  for (let tr = 0; tr < 3; tr++) if (busTarget[tr] > BUS_AUDIBLE) busy++;
  xfadeThin = busy > 1;

  // Three floors on which channels sound at all, and the highest wins. `cullPrio` is the flat dial
  // set from outside; the cap-driven one reacts to how loaded the engine is right now; XFADE_PRIO
  // applies only across an overlap.
  //
  // What the rungs silence, by PRIO: 4 takes texture and drone, 5 adds ostin, 6 adds arp and
  // lowstr. Lead, choir, bass, drums and counter are never reachable this way.
  //
  // XFADE_PRIO is 4, and it is chosen by cost rather than by rank for the same reason the skeleton
  // was abandoned: texture and drone are the two most expensive channels in the game that nothing
  // depends on - long sustained beds holding nodes for seconds - and they are the least missed for
  // the length of a transition. Worth 232 average nodes down to 205, on top of the thinning.
  const minPrio = Math.max(cullPrio, busy > 1 ? XFADE_PRIO : 0,
                           liveCount > CAP_HARD ? 8 : liveCount > CAP_SOFT ? 5 : 0);
  for (let tr = 0; tr < 3; tr++) {
    const audible = busTarget[tr] > BUS_AUDIBLE;
    // A crossfade used to render two COMPLETE arrangements at once. The audibility test is a gain
    // floor of 5%, and the weights cross over slowly - at Suspicion 15 the heaven and middle mixes
    // sit at 0.59 each, so every note of both was built. That is the doubling a phone reported as
    // "it starts lagging when Suspicion rises": not a leak, not a tier, a band of the meter where
    // the engine simply does twice the work. The bands are wide, too - 8 to 22 and 58 to 74 - so a
    // run spends real time in them rather than passing through.
    //
    // So a mix that is not carrying the moment is played as a skeleton rather than in full. Above
    // BUS_SOLO it is essentially alone and gets everything; below that it keeps priority 7 and up,
    // which is lead, counter, choir, bass, drums, pad, choir2 and solo - enough to be recognisably
    // itself and to fade in and out as itself, without its decoration. Two skeletons cost about
    // what one full arrangement does, which is what the crossfade used to cost before it doubled.
    //
    const rset = REC[tr];
    for (let ch = 0; ch < 16; ch++) {
      const c = DATA[tr][ch];
      let i = cur[tr][ch];
      if (!audible || chMute[ch]) {               // the cursor always moves, or the parts drift apart
        while (i < c.n && c.t[i] < hU) i++;
        cur[tr][ch] = i; continue;
      }
      const role = ROLE[ch];
      const rec = ch === 9 ? null : rset[role];
      while (i < c.n && c.t[i] < hU) {
        const u = c.t[i], t0 = startT + uToSec(u);
        if (t0 > now - .02) {
          if (PRIO[ch] >= minPrio) {
            const amp = (c.v[i] / 127) * VOL[ch] * dynAt(u, tr, role);
            const durS = Math.max(.04, uToSec(u + c.d[i]) - uToSec(u));
            if (ch === 9) drum(t0, c.p[i], amp * 1.15, tr, ch);
            else if (rec) voice(t0, hz(c.p[i]), durS, rec, tr, ch, amp, c.p[i]);
            else noiseAt(t0, Math.min(durS, 2.6), 380, .55, amp * .45,
                         pan[tr][ch][1], 6800);
            if (amp > chLevel[ch]) chLevel[ch] = Math.min(1, amp * 3.2);
          } else dropped++;
        }
        i++;
      }
      cur[tr][ch] = i;
    }
  }
}

function play(fromSec){
  ctx();
  if (running) { running = false; clearTimeout(timer); }
  if (themeId >= 0) { themeId = -1; clearTimeout(themeTimer); }
  killAll();
  applySuspicion(true);
  const from = fromSec || 0;
  startT = AC.currentTime + .08 - from;
  resetCursors(secToU(from));
  running = true;
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setValueAtTime(.0001, AC.currentTime);
  master.gain.linearRampToValueAtTime(.5, AC.currentTime + .35);
  pump();
}
function stop(fade){
  running = false; clearTimeout(timer);
  if (!AC) return;
  const q = AC.currentTime + (fade === undefined ? .4 : fade) + .05;
  for (const L of live) if (L.e > q) { try { L.n.stop(Math.max(q, L.s)); } catch (e) {} }
  const t = AC.currentTime, f = fade === undefined ? .4 : fade;
  master.gain.cancelScheduledValues(t);
  master.gain.setValueAtTime(master.gain.value, t);
  master.gain.linearRampToValueAtTime(.0001, t + f);
}
function posSec(){ return running && AC ? clamp(AC.currentTime - startT, 0, TOTAL_SEC) : 0; }


// ---------------------------------------------------------------------------
// 6. Sound effects.
//    Each cue is one gesture: the same rhythm and the same contour IN SCALE DEGREES,
//    with the mode and the timbre taken from the current variant. So a cue is
//    recognised instantly, but you can still hear where you are.
//    Inside the crossfade zone the versions sound at once, weighted like the buses.
//
//    Twenty-two cues since the sound pass. Seven of them are new and one - `checkin` -
//    was rewritten, and all eight arrived as MIDI authored against the table below:
//    the pack's tracks are named for the roles in SR, so importing a cue is reading
//    its notes back out as degrees. That is also why the bank in 6c can stand in for
//    this section note for note - it is a render of the same data.
// ---------------------------------------------------------------------------
const SMODE = [[0,2,4,5,7,9,11], [0,2,3,5,7,9,10], [0,1,3,5,7,8,10]];
const SREV  = [.42, .34, .55];

// role -> envelope + wave in each of the three modes
const SR = {
  bell:  { a:.003, d:1.5, sus:false, g:.20, w:['glass','glass','metal'] },
  spark: { a:.002, d:.9,  sus:false, g:.13, w:['glass','glass','glass'] },
  thud:  { a:.002, d:.4,  sus:false, g:.55, w:['soft','soft','soft'], drop:.42 },
  click: { a:.001, d:.08, sus:false, g:.22, w:['pluck','pluck','metal'], f:3000 },
  pad:   { a:.35,  d:.5, s:.82, r:.8, g:.17, w:['strings','strings','metal'], f:2000 },
  choir: { a:.5,   d:.5, s:.9,  r:1.1, g:.30, w:['ah','oo','synth'], f:3600 },
  brass: { a:.02,  d:.35, s:.8, r:.55, g:.21, w:['brass','brass','brass'], f:2200 },
  low:   { a:.012, d:.7, s:.5,  r:.45, g:.30, w:['soft','soft','organ'], f:900 },
  str:   { a:.06,  d:.5, s:.85, r:.9, g:.16, w:['strings','strings','strings'], f:2200 },
  noise: { noise:[2600, 1.0] },
  sweep: { noise:[420, .55], up:5600 },
};
// n: [role, beat, degree, octave, velocity, length in beats]
// bend: [role, cents down]   drum: [beat, note, velocity]   duck: [depth, seconds]
const SCUE = {
  checkin:  { n:[['low',0,1,-2,58,.4],['click',0,5,1,84,.1],['bell',.05,5,0,94,.55],
                 ['bell',.24,1,1,104,1],['spark',.24,1,2,52,.8]],
              drum:[[0,37,56]], duck:[.3,.2] },
  reassign: { n:[['click',0,1,1,102,.2],['low',.2,1,-1,90,1.2]],
              bend:[['low',900]], drum:[[0,42,62]], duck:[.2,.25] },
  deny:     { n:Array.from({length:14},(_,k)=>['noise',.07*k,1+(k%3)*2,-1,92-k*3,.09])
                 .concat([['sweep',1.05,1,0,88,.9]]),
              drum:[[0,42,70],[1.05,49,86]], duck:[.35,.5] },
  elevator: { n:[['pad',0,1,0,88,3.2],['low',0,1,-2,94,3.2],['str',0,5,-1,62,3.0]],
              bend:[['pad',700],['low',700],['str',700]], drum:[[3.3,35,78]], duck:[.25,1.7] },
  purchase: { n:[['bell',0,5,0,100,1],['bell',.25,1,1,92,1],['bell',.5,3,1,84,1.4],
                 ['spark',.5,1,2,62,1.6]], duck:[.2,.2] },
  nofunds:  { n:[['low',0,5,-1,92,.35],['low',.22,4,-1,76,.5]] },
  snap:     { n:[['spark',0,1,2,94,.9],['spark',.13,5,2,64,.8]] },
  soul:     { n:[['spark',0,1,1,64,.9],['spark',.18,5,1,48,.8]] },
  dayStart: { n:[['bell',0,1,0,96,3],['choir',.3,1,0,58,2.8],['choir',.3,3,0,54,2.8],
                 ['choir',.3,5,0,50,2.8]], duck:[.2,.5] },
  quotaMet: { n:[['bell',0,1,0,96,.9],['bell',.18,3,0,90,.9],['bell',.36,5,0,84,.9],
                 ['bell',.54,1,1,92,1.6],['choir',.5,1,0,60,2],['choir',.5,5,0,56,2],
                 ['choir',.5,3,1,52,2]], duck:[.2,.35] },
  susp40:   { n:[['str',0,1,0,86,1],['str',0,3,0,82,1],['str',0,7,0,78,1],
                 ['low',0,1,-2,90,2.2]], duck:[.3,.5] },
  susp75:   { n:[['sweep',0,1,0,96,2],['low',2,1,-2,96,2.4],['low',2,5,-2,88,2.4],
                 ['choir',2.1,1,0,62,2.2]], duck:[.4,1.6] },
  riot:     { n:Array.from({length:12},(_,k)=>['thud',.33*k,k%2?1:5,-2,58+k*5,.3])
                 .concat([['brass',4,1,-1,108,2],['brass',4,3,-1,104,2],
                          ['brass',4,5,-1,100,2],['brass',4,1,0,96,2],
                          ['str',4,1,0,84,2.4]]),
              drum:[[4,49,112],[4,36,118]], duck:[.55,1.6] },
  quotaFail:{ n:[5,4,3,1].map((d,k)=>['brass',.5*k,d,-1,100-k*6,.9])
                 .concat([5,4,3,1].map((d,k)=>['low',.5*k,d,-2,92-k*6,.9]))
                 .concat([['str',2,1,-1,86,3.5],['str',2,5,-1,80,3.5]]),
              drum:[[2,49,106],[2,36,100]], duck:[.45,1.8] },
  goodPerson:{n:[['choir',0,1,0,78,6],['choir',0,3,0,74,6],['choir',0,5,0,70,6],
                 ['choir',0,1,1,66,6],['bell',3,1,1,66,3.5],['str',0,1,-1,56,6]],
              duck:[.25,3] },
  // The seven added in the sound pass. Every one of them answers an event the game was already
  // firing into silence, so they are all small on purpose: `scroll` and `processed` can happen
  // several times a second, and a cue that size has to sit under the music rather than on it.
  scroll:   { n:[['click',0,5,1,44,.06]] },
  processed:{ n:[['click',0,1,1,50,.07],['bell',.03,3,0,72,.35],['bell',.17,5,0,66,.55]] },
  // A contract running out is a bell that never arrives: the pad holds under two sparks that fall
  // instead of rising, which is `soul` played backwards in shape if not in notes.
  expire:   { n:[['pad',0,1,-1,34,.75],['spark',0,5,0,58,.4],['spark',.15,1,0,46,.65]] },
  shop:     { n:[['sweep',0,1,0,60,.45],['pad',.05,1,0,58,.9],['pad',.05,5,0,52,.9],
                 ['bell',.22,3,1,58,.7]], duck:[.15,.35] },
  // The pair that reports the meter moving. Up is a second degree leaning on the first - the one
  // interval in the scale that will not resolve; down is the same bell figure `quotaMet` opens on,
  // stopped after three notes.
  suspicion:{ n:[['low',0,1,-2,60,.45],['str',0,1,0,68,.28],['str',.07,2,0,76,.38]] },
  relief:   { n:[['bell',0,5,0,70,.5],['choir',.1,1,0,40,1.3],['bell',.17,3,0,62,.6],
                 ['bell',.34,1,0,56,1.1]] },
  // Lands on the audit beam, over a defeat theme that is already playing, which is what the duck
  // is for - without it the chord is one more voice in a texture instead of the end of the run.
  lose:     { n:[['low',0,1,-2,110,1.7],['brass',0,1,-1,108,1.3],['brass',0,2,-1,100,1.3],
                 ['str',0,1,0,84,1.7]],
              drum:[[0,36,112],[0,49,104]], duck:[.45,1.2] },
};

function renderCue(cue, m, t0, gain){
  const dm = m === 2 ? 1.25 : 1, tr = m === 2 ? -12 : 0, spb = .5 * dm;
  const bendFor = {};
  for (const [role, c] of (cue.bend || [])) bendFor[role] = c;
  for (const ev of (cue.n || [])) {
    const [role, tb, deg, oct, vel, dur] = ev;
    const r = SR[role]; if (!r) continue;
    const t = t0 + tb * spb;
    const oc = Math.floor((deg - 1) / 7), ix = (deg - 1) % 7;
    const midi = 62 + SMODE[m][ix] + 12 * (oct + oc) + tr;
    const amp = (vel / 127) * gain;
    if (r.noise) {
      const f = r.noise[0] * Math.pow(2, (midi - 62) / 12);
      noiseAt(t, dur * spb, f, r.noise[1], amp * .3, sfxBus,
              r.up ? r.up : (bendFor[role] ? f * .35 : 0));
      continue;
    }
    const rec = { a:r.a, d:r.d, s:r.s === undefined ? .7 : r.s, r:r.r === undefined ? .3 : r.r,
                  g:r.g, sus:!!r.s, q:1, uni:1, det:0, w:r.w[m], f:r.f };
    sub(t, hz(midi), dur * spb, rec, sfxBus, amp, 0, midi);
    if (r.drop) sT(t, hz(midi) * 1.6, r.d * .6, { to: hz(midi) * .5, v: amp * .3 });
    if (bendFor[role]) {
      // the fall is done as a second layer: the target is lower by the given cents
      sT(t, hz(midi), dur * spb, { to: hz(midi) * Math.pow(2, -bendFor[role] / 1200),
                                   gl: dur * spb * .9, v: amp * r.g * .9,
                                   w: r.w[m], midi, a: r.a, f: r.f });
    }
  }
  for (const [tb, note, vel] of (cue.drum || []))
    drum(t0 + tb * spb, note, (vel / 127) * gain * .9, m, 9, m);
}

function sT(t0, f, dur, o){
  o = o || {};
  const osc = AC.createOscillator();
  const w = WAVE[o.w];
  if (Array.isArray(w)) osc.setPeriodicWave(w[bandOf(o.midi || 62)]);
  else if (w) osc.setPeriodicWave(w);
  else osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f, t0);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + (o.gl || dur));
  const g = AC.createGain();
  g.gain.setValueAtTime(.0001, t0);
  g.gain.linearRampToValueAtTime(Math.max(.0002, o.v || .15), t0 + (o.a || .005));
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  let node = g;
  if (o.f) { const flt = AC.createBiquadFilter();
    flt.type = 'lowpass'; flt.frequency.value = o.f; g.connect(flt); node = flt; }
  node.connect(o.out || sfxBus);
  osc.connect(g); osc.start(t0); osc.stop(t0 + dur + .05); reg(osc, t0 + dur + .05, t0);
  reg(node, t0 + dur + .05, t0, true);
}

function duck(amount, dur){
  if (!AC) return;
  const t = AC.currentTime;
  musicGain.gain.cancelScheduledValues(t);
  musicGain.gain.setValueAtTime(musicGain.gain.value, t);
  musicGain.gain.linearRampToValueAtTime(Math.max(.15, 1 - amount), t + .04);
  musicGain.gain.linearRampToValueAtTime(1, t + .04 + dur);
}

// ---------------------------------------------------------------------------
// 6c. The sample bank used to live here, and does not any more.
//
//     It was written as the A/B against section 6 and it won: the build now plays
//     the rendered cues out of sfx.opus, and this file is the fallback for the two
//     cases a file cannot serve. Which is exactly why the bank could not stay -
//     the reasons that send a build down this path are a browser that will not
//     decode Ogg Opus and a page on an opaque origin that cannot fetch at all, and
//     neither of those can load a bank either. A second copy of the loader here
//     would be code unreachable by construction.
//
//     It is in 97_audio_files.js now, with the cut map beside it. What stayed is
//     the duck, because that belongs to the cue rather than to the waveform, and
//     the file player reads it back out through `cueDuck` below rather than keeping
//     a second table of the same fourteen numbers.
// ---------------------------------------------------------------------------
function playSfx(id){
  ctx();
  const cue = SCUE[id]; if (!cue) return;
  const w = solo >= 0 ? [0, 1, 2].map(i => (i === solo ? 1 : 0)) : busWeights(suspicion);
  const t = AC.currentTime + .03;
  for (let m = 0; m < 3; m++) if (w[m] > .18) renderCue(cue, m, t, w[m]);
  if (cue.duck) duck(cue.duck[0], cue.duck[1]);
}

// ---------------------------------------------------------------------------
// 6b. Victory and defeat themes - the same note data, their own tempo, their own
//     palette (REC[3] and REC[4]) and a motif shared with the soundtrack.
// ---------------------------------------------------------------------------
let themeId = -1, themeStart = 0, themeTimer = null;
const themeCur = new Int32Array(16);
const themeSpu = i => (THEMES[i].tempo / 1e6) / (PPQ / DIV);

function playTheme(i){
  ctx();
  running = false; clearTimeout(timer); clearTimeout(themeTimer);
  killAll();
  themeId = i; themeCur.fill(0);
  themeStart = AC.currentTime + .2;
  for (let b = 0; b < 3; b++) {
    bus[b].gain.cancelScheduledValues(AC.currentTime);
    bus[b].gain.setTargetAtTime(b === 0 ? 1 : 0, AC.currentTime, .05);
    busWet[b].gain.setTargetAtTime(b === 0 && reverbOn ? 1 : 0, AC.currentTime, .05);
  }
  color.frequency.setTargetAtTime(11000, AC.currentTime, .2);
  musicGain.gain.cancelScheduledValues(AC.currentTime);
  musicGain.gain.setValueAtTime(1, AC.currentTime);
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setValueAtTime(.5, AC.currentTime);
  if (i === 1) {                                   // defeat gets a long exit
    const t = themeStart + THEMES[1].sec - 5;
    musicGain.gain.setValueAtTime(1, t);
    musicGain.gain.linearRampToValueAtTime(.12, t + 4.6);
  }
  pumpTheme();
}
function pumpTheme(){
  if (themeId < 0) return;
  const now = AC.currentTime;
  live = live.filter(L => L.e > now);
  liveCount = live.length;
  const spu = themeSpu(themeId), set = REC[3 + themeId], base = 3 + themeId;
  const hU = (now - themeStart + AHEAD) / spu;
  for (let ch = 0; ch < 16; ch++) {
    const c = DATA[base][ch];
    let i = themeCur[ch];
    if (chMute[ch]) { while (i < c.n && c.t[i] < hU) i++; themeCur[ch] = i; continue; }
    const role = ROLE[ch], rec = ch === 9 ? null : set[role];
    while (i < c.n && c.t[i] < hU) {
      const t0 = themeStart + c.t[i] * spu;
      if (t0 > now - .02) {
        const amp = (c.v[i] / 127) * VOL[ch] * .85;
        const durS = Math.max(.05, c.d[i] * spu);
        if (ch === 9) drum(t0, c.p[i], amp * 1.1, 0, ch, 2);
        else if (rec) voice(t0, hz(c.p[i]), durS, rec, 0, ch, amp, c.p[i]);
        else noiseAt(t0, Math.min(durS, 2.6), 380, .55, amp * .45, pan[0][ch][1], 6800);
        if (amp > chLevel[ch]) chLevel[ch] = Math.min(1, amp * 3.2);
      }
      i++;
    }
    themeCur[ch] = i;
  }
  if (now - themeStart > THEMES[themeId].sec + 5) { themeId = -1; applySuspicion(true); return; }
  themeTimer = setTimeout(pumpTheme, TICK_MS);
}


// ---------------------------------------------------------------------------
// 7. Public interface. Everything the game needs.
// ---------------------------------------------------------------------------
const NAMES = ['victory', 'defeat'];
return {
  /** Create the AudioContext. Call FROM A TAP HANDLER - otherwise the browser will
   *  not allow sound. Repeat calls are safe. */
  init(){ ctx(); return this; },

  /** Start the soundtrack loop. fromSec is an optional starting point. */
  play(fromSec){ play(fromSec || 0); return this; },

  /** Stop with a fade (0.4 s by default). */
  stop(fade){ stop(fade); return this; },

  /** Suspicion 0..100. Call whenever state.suspicion changes. The crossfade is smooth
   *  on its own, so calling it every frame is fine. */
  setSuspicion(v){ setSuspicion(v); return this; },

  /** A sound effect. Takes the mode and the timbre of the current variant by itself,
   *  and inside the transition zone sounds in both. */
  sfx(id){ playSfx(id); return this; },

  /** How far a cue ducks the music and for how long, or null. Read by the file player in
   *  97_audio_files.js, which plays the same cues out of a render and needs the same duck.
   *  A plain lookup in a table built at load - it starts nothing and creates no context, so
   *  it is safe to call on a build that is not using this engine at all. */
  cueDuck(id){ const c = SCUE[id]; return c && c.duck ? c.duck : null; },

  /** Present so that a caller holding either player can call them without asking which it
   *  is. This one synthesises every cue and has nothing to load up front. */
  bank(){ return this; },
  bankState(){ return 'ready'; },

  /** Ending theme: 'victory' (day 10 survived) or 'defeat' (Suspicion 100).
   *  Stops the loop by itself. */
  theme(which){
    const i = NAMES.indexOf(which);
    if (i >= 0) playTheme(i);
    return this;
  },

  /** Volume 0..1. */
  volume(v){
    if (AC) userVol.gain.setTargetAtTime(Math.pow(clamp(v, 0, 1), 1.6), AC.currentTime, .05);
    return this;
  },

  /** 'high' - three detuned copies per voice, each with its own modulators.
   *  'mid'  - two copies, modulators built once per note instead of once per copy. Same
   *           arrangement, same reverb, roughly a third of the nodes per note.
   *  'low'  - one copy, no modulators, channels at priority 3 and under silenced, short mono
   *           hall. Audibly a thinner arrangement, not just a cheaper one.
   *  Switchable while playing. 'low' additionally wants to be set BEFORE init(), because the
   *  reverb length and the shaper's oversampling are fixed when the context is built. */
  quality(mode){
    qLevel = mode === 'low' ? 0 : mode === 'mid' ? 1 : 2;
    applyTier();
    return this;
  },

  /** Reverb on or off. */
  reverb(on){ setReverb(on); return this; },

  /** Silence every channel below this priority, 0 to disable. A dial for finding how much of the
   *  arrangement a device can carry, independent of the quality tier: the tier changes what a
   *  note costs to build, this changes how many notes there are. See PRIO and `emit`. */
  cull(n){ cullPrio = n | 0; return this; },

  /** Mute one role by channel number 0..15 (see ROLES). */
  mute(ch, on){ chMute[ch] = on ? 1 : 0; return this; },

  /** Current state, for debugging and the HUD. */
  state(){
    return {
      backend: 'synth',
      playing: running, theme: themeId >= 0 ? NAMES[themeId] : null,
      pos: posSec(), total: TOTAL_SEC,
      bar: running ? Math.floor(secToU(posSec()) / BAR_U) + 1 : 0,
      suspicion, voices: liveCount,
      // Scheduler ticks that arrived more than 120 ms late, and the worst gap seen, since the
      // context was created. Both are diagnostics: nothing in the engine reads them.
      late: lateHits, worstGap: worstGap, peakVoices: peakLive,
      quality: ['low', 'mid', 'high'][qLevel], cull: cullPrio, dropped: dropped,
      // What the device actually GAVE us, as opposed to what OUT_LATENCY asked for. `latencyHint`
      // is a request and the answer is the device's; this is the only way to find out what it
      // said. baseLatency is the graph's own buffering, outputLatency adds everything between the
      // buffer and the speaker and is absent on Safari.
      sampleRate: AC ? AC.sampleRate : 0,
      baseLatency: AC ? (AC.baseLatency || 0) : 0,
      outputLatency: AC ? (AC.outputLatency || 0) : 0,
      buses: AC ? bus.map(b => b.gain.value) : [1, 0, 0],
      levels: Array.from(chLevel),
    };
  },

  /** Reference tables. */
  SFX_IDS: Object.keys(SCUE),
  ROLES: ROLE.slice(),
  BARS: TOTAL_BARS,
  DURATION: TOTAL_SEC,
};

// 99_main.js

// Entry point: fixed-timestep loop (GDD 1.3) and the boot sequence.

let acc = 0;
let lastTime = 0;
let fpsFrames = 0, fpsTime = 0, fps = 0;

function update(dt) {
  updateInput(dt);
  for (const g of Input.gestures) handleGesture(g);
  Input.gestures.length = 0;


  updateGame(dt);
  updateFx(dt);
}

function render() {
  const s = Display.scale;


  // Repaint the whole backing store first: the shake translate would otherwise smear the edges.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.bgDeep;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.setTransform(s, 0, 0, s, Fx.offsetX * s, Fx.offsetY * s);
  renderScene(ctx);
  renderUI(ctx);
  if (DEBUG) renderDebug(ctx, fps);
}

function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!(dt > 0)) dt = 0;
  if (dt > MAX_FRAME_DELTA) dt = MAX_FRAME_DELTA;   // a backgrounded tab must not burn the day

  // A sideways device pauses the day rather than running it where the player cannot read it.
  if (Display.landscape) {
    Input.gestures.length = 0;
    acc = 0;
    renderRotateNotice(ctx);
    requestAnimationFrame(frame);
    return;
  }

  acc += dt;
  let steps = 0;
  while (acc >= SIM_DT && steps < 8) {
    update(SIM_DT);
    acc -= SIM_DT;
    steps++;
  }
  if (acc > SIM_DT * 8) acc = 0;

  fpsFrames++;
  fpsTime += dt;
  if (fpsTime >= 0.5) { fps = Math.round(fpsFrames / fpsTime); fpsFrames = 0; fpsTime = 0; }

  render();
  requestAnimationFrame(frame);
}

function boot() {
  resizeDisplay();
  initInput();
  // No sprite loading step: every sprite in this build is a character grid in the source, baked
  // into an offscreen canvas the first time it is drawn (15_sprites.js).
  resetGame();
  initScene();
  gotoTitle();
  // Downloads only, and deliberately after the first screen is up rather than before it: nothing
  // on the title waits for audio, and the fetches should be competing with a drawn screen instead
  // of delaying one. See preloadAudio in 07_audio.js.
  preloadAudio();

  window.addEventListener('resize', resizeDisplay);
  window.addEventListener('orientationchange', resizeDisplay);

  lastTime = performance.now();
  requestAnimationFrame(frame);
}

boot();

//@DEV-ONLY - never in a release build. Included only by `node tools/build.mjs --dev`, which is why
// the filename starts with an underscore: the normal build skips those, and check.mjs fails on the
// marker above if this file ever reaches dist/index.html.
//
// A playtest panel. It touches no game module: the buttons are plain DOM next to the canvas, and
// the one hook it needs is taken by wrapping `frame` after boot, so nothing in src/*.js has to know
// that any of this exists.

const CHEAT_SPEEDS = [1, 2, 4];
let cheatSpeed = 1;
let cheatRealTime = 0;      // the last real timestamp the loop was handed
let cheatFakeTime = 0;      // and the stretched one it thinks it is running on

// --- The cheats ----------------------------------------------------------------

// Real seconds of simulation, not seconds off the clock: contracts tick, production accrues,
// arrivals arrive, Suspicion climbs. Rendering is skipped, so ten seconds land in a millisecond or
// two - which is also why it is the honest way to skip time in a game made of timers.
function cheatAdvance(seconds) {
  const steps = Math.round(seconds / SIM_DT);
  for (let i = 0; i < steps; i++) update(SIM_DT);
}

// Not `endDay()` directly: letting the clock run out means the settlement, the plate and the shop
// all happen the way they do in a real day.
function cheatEndDay() {
  if (state.screen === SCREEN.DAY_ACTIVE) state.dayTime = 0.05;
}

function cheatExpireAll() {
  for (const slot of state.heavenSlots) {
    if (!slot.guest || slot.guest.expired) continue;
    slot.guest.contract = 0;
    slot.guest.expired = true;
  }
}

// Straight to the night before a given day, with the tower as it stands. For the screenshot pass,
// which has to reach day eight without playing seven of them: the settlement, the night card and
// the shop all still happen, so the header it photographs is the header a player would see.
function cheatJumpToDay(day) {
  if (state.screen === SCREEN.DAY_ACTIVE) {
    state.day = Math.max(1, day - 1);
    state.aura = dayQuota(state.day);
    state.dayTime = 0.05;
    for (let i = 0; i < 200 && state.screen !== SCREEN.SHOP; i++) {
      update(SIM_DT);
      if (state.screen === SCREEN.NIGHT_CARD && state.night.in >= 1) {
        if (state.night.choice < 0) answerPact(false); else openShop();
      }
    }
  }
}

function cheatSpawnSoul() {
  if (state.screen === SCREEN.DAY_ACTIVE) arriveSoul();
}

// All four shop tabs on the first night. The pages are gated by `state.day >= page.fromDay`, and
// the honest way to reach the fourth one is to survive four days - which is four minutes of play
// before anybody can look at the staff page at all.
//
// It moves the gate rather than the day. Setting `state.day` to 4 would open the tabs and also
// change the quota, the arrival interval, the archetype weights and the number in the HUD, so what
// the tester then looked at would be the wrong night. The dates in SHOP_PAGES are plain data on a
// mutable object, so the panel keeps its one rule - it touches no game module, it edits the table
// the game reads.
//
// Side effect worth knowing while testing onboarding: `newShopPage()` fires the tab beats for a
// page whose `fromDay` equals tonight, so after this every page arrived on night one and the three
// beats (tabSupplies, tabExtras, tabStaff) never speak again in this run.
function cheatOpenShopPages() {
  for (const page of SHOP_PAGES) page.fromDay = 1;
  return 'TABS OPEN';
}

// Playtesting against an eight-minute loop on repeat is its own kind of punishment, and the
// engine is unreachable from outside the build's IIFE, so the panel keeps a handle for the
// screenshot harness as well.
// Goes through the game's own toggle rather than the engine directly, so the HUD icon and the
// panel button can never disagree about whether the build is muted.
function cheatToggleMusic() {
  toggleSound();
  return soundEnabled() ? 'MUTE' : 'UNMUTE';
}

// The A/B that matters now: which of the two players is running. Both answer the same calls, use
// the same cue names, the same mode weights and the same ducking, so flipping this mid-run changes
// exactly one thing - whether what comes out was recorded or is being built a note at a time.
//
// It restarts the music from the top, because handing a position from one player to the other is a
// promise neither of them can keep: the engine's clock is its own scheduler and the file player's
// is three media elements. And it leaves both AudioContexts alive, which is the one thing here
// that a shipped build would never do. It is a comparison, not a mode.
function cheatBackendLabel() {
  return audioBackend() === WTHFiles ? 'SRC FILES' : 'SRC SYNTH';
}

function cheatToggleBackend() {
  const to = audioBackend() === WTHFiles ? WTHAudio : WTHFiles;
  if (to === WTHFiles && !WTHFiles.supported()) return 'SRC SYNTH ONLY';
  const playing = audioBackend().state().playing;
  audioBackend().stop(0.2);
  if (to === WTHAudio) WTHAudio.quality(detectAudioQuality());
  to.init();
  to.volume(soundEnabled() ? MUSIC_VOLUME : 0);
  to.bank(SFX_BANK);
  to.setSuspicion(state.suspicion);
  A = to;
  if (playing) to.play();
  return cheatBackendLabel();
}

// The crossfade, taken apart. The meter decides which of the three arrangements is audible, so
// most of a run never hears two of them, and there is no other way to answer "is the hell mix
// actually in this build, and is it aligned with the others". Files only - the engine has a solo
// inside it and no way in from out here, and adding one to a fallback is not worth the line.
const CHEAT_SOLO = [-1, 0, 1, 2];
const CHEAT_SOLO_NAME = ['SOLO OFF', 'SOLO HVN', 'SOLO MID', 'SOLO HELL'];
let cheatSolo = 0;
function cheatCycleSolo() {
  const b = audioBackend();
  if (!b || !b.solo) return 'SOLO N/A';
  cheatSolo = (cheatSolo + 1) % CHEAT_SOLO.length;
  b.solo(CHEAT_SOLO[cheatSolo]);
  return CHEAT_SOLO_NAME[cheatSolo];
}

// Two buttons for diagnosing a device that crackles, because the fault has three possible homes
// and only pressing things tells them apart. On the phone this was written for the answer was:
// HALL OFF changed nothing, AQ LOW fixed it. That pair is more informative than either alone -
// the reverb is the most expensive single node in the graph, so if removing it does nothing then
// the cost is not the fixed graph, and what is left is what a note costs to build.
//
// They speak to the engine by name rather than to whichever player is running, because there is
// nothing in the file player for either of them to move: it has no tiers, no channels to silence
// and no hall. On a build in its shipped state they change nothing audible, which is the correct
// answer and not a bug - press SRC SYNTH first.
//
// Note the runtime limit when reading a result off these. The reverb's length and the shaper's
// oversampling are fixed when the context is built, so pressing AQ down to 'low' here gives less
// than a device that booted on 'low'.
const CHEAT_AQ = ['high', 'mid', 'low'];
// The other half of the same question, and deliberately a separate button. The tier changes what a
// NOTE costs to build; this changes how many notes there are. Rungs: 4 silences texture and drone,
// 5 adds ostin, 6 adds arp and lowstr.
const CHEAT_CULL = [0, 4, 5, 6];
function cheatCycleCull() {
  const now = WTHAudio.state().cull;
  const next = CHEAT_CULL[(CHEAT_CULL.indexOf(now) + 1) % CHEAT_CULL.length];
  WTHAudio.cull(next);
  return 'CULL ' + next;
}
function cheatCycleQuality() {
  const now = WTHAudio.state().quality;
  const next = CHEAT_AQ[(CHEAT_AQ.indexOf(now) + 1) % CHEAT_AQ.length];
  WTHAudio.quality(next);
  return 'AQ ' + next.toUpperCase();
}

let cheatReverb = true;
function cheatToggleReverb() {
  cheatReverb = !cheatReverb;
  WTHAudio.reverb(cheatReverb);
  return cheatReverb ? 'HALL ON' : 'HALL OFF';
}

// The reading that says which half of the machine is at fault, on a device that has no console.
// Two players, two readouts, because they fail in different ways and a shared one would have to
// leave out what each of them is actually asked.
//
// On FILES: the second word is the cue decode, and until it says READY every stamp is silent. D is
// the worst offset seen between the three stems since the loop started, in ms, and S how many times
// one had to be seeked back rather than walked back - those two are the whole health of the
// crossfade. A D that climbs is a decoder falling behind; an S that climbs on a stem you can hear
// is audible as a click. P is where in the eight minutes the loop is. X names the reason the file
// path gave up, if it did, in which case the engine is already playing and this is the wrong
// readout to be reading.
//
// On SYNTH: L is scheduler ticks that arrived more than 120 ms late - the main thread was blocked
// and the notes went out late, which is a renderer problem. W is the worst such gap in ms. V is a
// PEAK, not a snapshot - the most nodes alive at once since the context was made; a live reading
// was worth nothing, because the button is pressed at whatever moment the hand arrives and the
// interesting moment is the busiest bar, which is never that one. Crackling with L near zero means
// the main thread was fine and the audio thread is the one drowning, which is a synthesis problem.
// The two sound identical and are fixed in opposite files.
//
// B and T were one number to begin with, added together, and that was useless: `baseLatency` is
// the buffer `latencyHint` actually asks for and `outputLatency` is everything after it - the OS
// mixer, the speaker, a Bluetooth hop - which can be a hundred milliseconds of hardware we do not
// control. Summed, "the hint was honoured and the headphones are wireless" reads exactly the same
// as "the hint was ignored". So B is the buffer, in frames, and it is the one to check first: it
// should say 2048, and if it says 128 the request was refused and nothing else here means what it
// looks like. T is the whole trip to the speaker in ms. Both are the same on either player.
function cheatAudioStats() {
  const s = audioBackend().state();
  const tail = ' B' + Math.round(s.baseLatency * s.sampleRate) +
               ' T' + Math.round((s.baseLatency + s.outputLatency) * 1000);
  if (s.backend === 'files') {
    return 'FILES ' + s.bank.toUpperCase() +
           ' D' + s.drift + ' S' + s.seeks +
           ' P' + Math.round(s.pos) + tail +
           (s.failed ? ' X:' + s.failReason : '');
  }
  return 'SYNTH Q' + s.quality.toUpperCase().slice(0, 1) + ' C' + s.cull +
         ' L' + s.late + ' W' + Math.round(s.worstGap * 1000) +
         ' V' + s.peakVoices + ' D' + s.dropped + tail;
}

function cheatCycleSpeed() {
  cheatSpeed = CHEAT_SPEEDS[(CHEAT_SPEEDS.indexOf(cheatSpeed) + 1) % CHEAT_SPEEDS.length];
  return 'SPEED x' + cheatSpeed;
}

// --- The panel -----------------------------------------------------------------

// A label returned from an action renames its own button, which is how the speed toggle reports
// where it is.
const CHEAT_BUTTONS = [
  ['>> 10s',   () => cheatAdvance(10)],
  ['>> 30s',   () => cheatAdvance(30)],
  ['END DAY',  cheatEndDay],
  ['SPEED x1', cheatCycleSpeed],
  ['+500 CR',  () => { state.credits += 500; }],
  ['+100 AU',  () => { state.aura += 100; }],
  ['+10 SUS',  () => addSuspicion(10)],
  ['-10 SUS',  () => addSuspicion(-10)],
  ['EXPIRE',   cheatExpireAll],
  ['+SOUL',    cheatSpawnSoul],
  ['MUTE',     cheatToggleMusic],
  [AUDIO_SOURCE === 'files' ? 'SRC FILES' : 'SRC SYNTH', cheatToggleBackend],
  ['SOLO OFF', cheatCycleSolo],
  ['AQ CYCLE', cheatCycleQuality],
  ['CULL 0',   cheatCycleCull],
  ['HALL ON',  cheatToggleReverb],
  ['AUDIO?',   cheatAudioStats],
  ['+SLOT',    () => unlockNextSlot(state.heavenSlots)],
  ['+DESK',    () => unlockNextSlot(state.cubicles)],
  ['+TABS',    cheatOpenShopPages]
];

function cheatStyle(el, css) {
  for (const k in css) el.style[k] = css[k];
}

function cheatButton(label, background, color) {
  const b = document.createElement('button');
  b.textContent = label;
  cheatStyle(b, {
    font: '10px monospace', padding: '3px 5px', cursor: 'pointer',
    background: background, color: color, border: '1px solid #5a5f80'
  });
  return b;
}

function buildCheatPanel() {
  const bar = document.createElement('div');
  cheatStyle(bar, {
    position: 'fixed', left: '0', bottom: '0', zIndex: '10',
    display: 'flex', alignItems: 'flex-end', gap: '3px', padding: '3px',
    background: 'rgba(16,14,24,0.85)', maxWidth: '52vw'
  });

  const body = document.createElement('div');
  cheatStyle(body, { display: 'flex', flexWrap: 'wrap', gap: '2px' });
  for (const [label, action] of CHEAT_BUTTONS) {
    const b = cheatButton(label, '#2a2438', '#f2ead2');
    b.addEventListener('click', function () {
      // Only a string renames the button - several of the actions return a boolean, and "true"
      // is not a useful label for anything.
      const renamed = action();
      if (typeof renamed === 'string') b.textContent = renamed;
      b.blur();                 // otherwise the next keypress goes to the button, not the page
    });
    body.appendChild(b);
  }

  // On a phone-sized window the panel covers the bottom of the game, so it starts folded there and
  // open on a desktop window, where it lands in the letterbox beside the canvas.
  if (window.innerWidth < 700) body.style.display = 'none';
  const toggle = cheatButton('DEV', '#e0484b', '#100e18');
  toggle.addEventListener('click', function () {
    body.style.display = body.style.display === 'none' ? 'flex' : 'none';
    toggle.blur();
  });

  bar.appendChild(toggle);
  bar.appendChild(body);
  document.body.appendChild(bar);
}

// --- Hook ----------------------------------------------------------------------

// Speed is applied by stretching the timestamp the loop is handed rather than by running the
// update twice per frame: the fixed-step accumulator then does the arithmetic it already does, and
// the 100 ms delta clamp still protects a backgrounded tab. Above about x6 the clamp would win.
// `frame` re-schedules itself by name, so the wrapper is what gets requested next time round.
const cheatFrame = frame;
frame = function (now) {
  const dt = cheatRealTime ? now - cheatRealTime : 0;
  cheatRealTime = now;
  cheatFakeTime += dt * cheatSpeed;
  cheatFrame(cheatFakeTime);
};

// Handles for the harnesses in tools/. Everything the game defines lives inside the IIFE in
// index.template.html, so a script driving the page over the DevTools protocol can see exactly
// what is hung on `window` here and nothing else - which is why `state.tutorial.hold` read as
// `undefined` from outside and every check against it quietly passed.
window.__audio = WTHAudio;
window.__files = WTHFiles;
window.__dev = {
  state: state,
  // Which player answered and how it is doing. The same reading the AUDIO? button prints, as an
  // object rather than a line, so a harness can assert on it instead of parsing a label.
  audio: function () { return audioBackend() ? audioBackend().state() : null; },
  audioGate: function () { return { gated: audioGated(), value: audioLoadProgress() }; },
  input: function (cx, cy) {
    return { id: Input.pointerId, queued: Input.gestures.length, active: Input.drag.active,
             vx: cx === undefined ? null : Math.round(toVirtualX(cx)),
             vy: cy === undefined ? null : Math.round(toVirtualY(cy)),
             rect: (function (r) { return { l: Math.round(r.left), t: Math.round(r.top),
                                            w: Math.round(r.width), h: Math.round(r.height) }; })(canvas.getBoundingClientRect()),
             slot0: (function (r) { return { x: r.x, y: r.y, w: r.w, h: r.h }; })(heavenSlotRect(0)) };
  },

  advance: cheatAdvance,
  expireAll: cheatExpireAll,
  openShopPages: cheatOpenShopPages,
  spawnSoul: cheatSpawnSoul,
  endDay: cheatEndDay,
  jumpToDay: cheatJumpToDay,
  // An onboarding beat that holds stops `advance` dead, because advance steps the real update and
  // the real update is what the hold stops. A scripted skip has to tap it away the way a player
  // would, so it gets the same call the gesture handler makes.
  dismissBeat: tutorialDismiss,
  // The two baked cloud canvases, so a shape on screen can be attributed to the layer that drew it
  // rather than guessed at from the composite. Dev build only, like everything else on this handle.
  cloudLayers: function () { return { back: cloudBack, front: cloudFront }; },
  // The night contract's buttons move with the length of the text on the card, so the harness asks
  // where they are rather than hard-coding a row that is right for one contract in eleven.
  nightButtons: function () {
    return [0, 1].map(function (i) {
      const r = nightButtonRect(i);
      return { x: Math.round(r.x + r.w / 2), y: Math.round(r.y + r.h / 2) };
    });
  }
};

cheatRealTime = performance.now();
cheatFakeTime = cheatRealTime;
buildCheatPanel();

// The balance harness (build step 9). It plays the real game with no renderer: a scripted player
// makes the same calls the input layer makes, `update(SIM_DT)` is stepped by hand, and the run
// reports what actually happened day by day. Nothing here models the economy - modelling it would
// produce a second set of rules to keep in sync, and the whole point is to measure the first set.

// A policy is a player. `reaction` is how long a card sits on the desk before it is decided, which
// is the single most important number in here: decide instantly and the snap bonus is free and the
// throughput is superhuman, so an honest run has to be slower than the machine can be.
// The acceptance band from GDD 15: a balanced player is meant to live here rather than to park at
// zero. Kept apart from SUSP_AMBER/SUSP_ALARM on purpose - those are what the game paints, this is
