// because there is no room for an outline and no need for one: what is behind the mark is the sky
// through the middle of the ring, and near-black on sky is the strongest contrast in the palette.
// The ring's colour is what says a contract has lapsed; this is the same thing said without it
// (GDD 9), so it has to be read at a glance and not admired.
const HALO_MARK = [
  '.xxx.',
  'x...x',
  '...x.',
  '..x..',
  '.....',
  '..x..',
];

function drawExpiredMark(ctx, cx, cy) {
  ctx.fillStyle = C.bgDeep;
  for (let y = 0; y < HALO_MARK.length; y++)
    for (let x = 0; x < 5; x++)
      if (HALO_MARK[y].charAt(x) === 'x') ctx.fillRect(cx - 2 + x, cy - 3 + y, 1, 1);
}

// Contract state is carried by the halo's colour and by whether it pulses, so the whole row can be
// scanned at once: gold is fine, blinking red is about to go wrong, solid red with a marker is
// already wrong.
//
// Each colour travels with the whole ramp it is drawn in, because the halo changes colour four
// ways and a shade that did not follow it would be right for one of them. Five entries, in the
// order HALO_TONE names them: [L, G, D, K, and the tone the arc fades through as it comes apart].
// The first four are the drawing's own light; the fifth is dimmer than any of them, so a crumbling
// pixel cannot be read as a healthy one.
//
// The riot flash has fewer real steps than the drawing has slots, and that is deliberate: it is a
// one-frame alarm at 3 Hz, so it wants to be a shape in near-white, not a rendered ring.
const HALO_GOLD = [C.haloLit, C.haloGold, C.haloDeep, C.haloDark, C.haloFade];
const HALO_RED = [C.suspLit, C.suspicion, C.suspDark, C.suspShade, C.suspFade];
const HALO_RIOT = [C.ink, C.ink, C.inkDim, C.inkDim, C.inkFaint];
// Indexed, because the halo cache is keyed on which set was asked for and an array makes a poor
// key. Order is the cache's business only; `ringColor` names them.
const HALO_TONES = [HALO_GOLD, HALO_RED, HALO_RIOT];

// The halo is a pure function of how many pixels of arc are lit and which tones they are drawn in:
// `decay` follows from `n`, and the erosion is hashed on the band pixel rather than on time, which
// is what makes two halos at the same fraction erode identically. So there are 75 x 3 pictures in
// the whole game, and they were being rebuilt a pixel at a time, per guest, per frame.
//
// That is the load the phone was reporting as "hoarseness that gets worse when there are more
// souls in the slots and in the basement": an arc is 74 fillRects, a busy lounge is ten or more
// halos, and at 60 fps that is tens of thousands of canvas draw calls a second competing with the
// audio thread for four cores. A contract only crosses a 1/74 boundary a couple of times a second,
// so the same picture was being redrawn from scratch a couple of dozen frames running.
//
// Cached as one small canvas each, blitted with a single drawImage. Bounded by construction - one
// entry per (n, tone set) - so it fills once and never grows.
const haloCache = {};
function drawHalo(ctx, cx, cy, fraction, toneIdx) {
  if (!ringBand) ringBand = buildHaloBand();
  const total = ringBand.length / 3;
  const n = Math.ceil(total * clamp(fraction, 0, 1));
  const key = toneIdx * 256 + n;
  let cv = haloCache[key];
  if (!cv) {
    // The band is centred on the halo's middle pixel, so the canvas is the grid and the painter is
    // handed that centre in the canvas's own coordinates.
    cv = makeLayer(HALO_W, HALO_H);
    paintHalo(cv.getContext('2d'), (HALO_W - 1) / 2, (HALO_H - 1) / 2, fraction, HALO_TONES[toneIdx]);
    haloCache[key] = cv;
  }
  ctx.drawImage(cv, Math.round(cx) - (HALO_W - 1) / 2, Math.round(cy) - (HALO_H - 1) / 2);
}

function ringColor(guest, time) {
  const st = contractState(guest);
  if (st === 'active') return 0;             // HALO_GOLD
  if (st === 'expired') {
    // The riot clock used to be reported by the figure flashing red. The roster took that away -
    // thirteen people cannot share a state colour - so it is reported here, faster than any other
    // rhythm on screen, against the solid red of an expiry that is merely standing there.
    if (guest.riot > 0 && Math.sin(guest.riot * Math.PI * 2 * RIOT_BLINK) < 0) return 2;   // HALO_RIOT
    return 1;                                // HALO_RED
  }
  return Math.sin(time * Math.PI * 2 * CONTRACT_PULSE) > 0 ? 1 : 0;   // HALO_RED : HALO_GOLD
}

// A tap on a guest who is still under contract shakes the figure and does nothing else.
function guestNudge(guest) {
  if (!guest.nudge) return 0;
  return Math.round(Math.sin(guest.nudge * 60) * 2);
}

// Drawn above both cloud layers with the slot outlines: this is UI, and a cloud pillar eating the
// side of a timer costs exactly the legibility the halo exists to provide.
//
// The halo sits above the head rather than around the body (GDD 6.1a). Gold contract ring over a
// gold figure was flagged at build step 4 as the one timer on screen that had to be hunted for;
// lifted clear of the silhouette it is read at a glance, and the joke it was always going to be -
// a subscription to paradise, going out over somebody's head - finally lands.
function renderContracts(ctx) {
  const count = visibleSlotCount(state.heavenSlots);
  for (let i = 0; i < count; i++) {
    const guest = state.heavenSlots[i].guest;
    if (!guest) continue;
    const r = heavenSlotRect(i);
    // Anchored to the slot, and only the horizontal nudge comes from the guest: a tap on somebody
    // who is not going anywhere shakes the whole entity, halo included, but the height of the row
    // is a property of the lounge rather than of who is standing in it.
    const gx = r.x + r.w / 2 + guestNudge(guest);
    const cy = r.y - HALO_LIFT;

    // An expired contract draws the halo whole and red rather than empty: nothing left to count
    // down is not the same message as nothing there, and an empty halo said the second one. The
    // marker above it is what separates the two without colour (GDD 9).
    const fraction = guest.expired ? 1 : guest.contract / guest.contractMax;
    const tone = ringColor(guest, guest.t);
    drawHalo(ctx, gx, cy, fraction, tone);
    if (guest.expired) drawExpiredMark(ctx, gx, cy);
  }
}

// --- Attractions (GDD 9.2) -----------------------------------------------------
// A bought attraction is a fixture standing in the world: the three resort ones on the crest of
// the cloud, the three operations ones against the back wall of the basement. Screen-fixed rather
// than pinned into the strip, because they are also the only readout of what has been bought -
// an amenity that scrolled off the side of the lounge would stop reporting itself.
//
// Each is its own shop icon on a plate. That is a deliberate re-use: the icon is already drawn,
// already in the game palette and already legible at 16 px, and a second drawing of the same six
// things would be two places to keep a pool looking like a pool.
const PROP = { w: 26, h: 26, gap: 4 };   // the icon box plus a 3 px plate margin on every side

function drawAttractionProp(ctx, id, x, y) {
  fillRect(ctx, x, y, PROP.w, PROP.h, C.hudBg);
  strokeRect(ctx, x, y, PROP.w, PROP.h, C.inkFaint);
  drawShopIcon(ctx, id, x + 3, y + 3);
}

function renderAttractions(ctx) {
  const z = Display.zones;
  // The crest of the cloud mass, which is the one line in the sky that is the same height
  // whatever the view is.
  const crest = z.ground.y - HEAVEN_SLOT.h - CLOUD_MASS_H;
  let hx = EDGE_MARGIN, ox = EDGE_MARGIN;
  for (const item of SHOP_ITEMS) {
    if (!item.floor || upgradeLevel(item.id) <= 0) continue;
    if (item.floor === 'heaven') {
      drawAttractionProp(ctx, item.id, hx, crest + 2);
      hx += PROP.w + PROP.gap;
    } else {
      drawAttractionProp(ctx, item.id, ox, z.ops.y + 6);
      ox += PROP.w + PROP.gap;
    }
  }
}

// --- Noise ---------------------------------------------------------------------

// An eighth note drawn as pixels rather than typed: the glyph is not in the font table, and at this size a
// note is four rectangles anyway. Six px wide, seven tall, drawn from its top-left corner.
function drawNote(ctx, x, y, color) {
  fillRect(ctx, x + 3, y, 1, 5, color);
  fillRect(ctx, x + 4, y, 2, 2, color);
  fillRect(ctx, x, y + 4, 4, 3, color);
}

// The colour is a function of height, and the whole point of the mechanic is in that function:
// grey while it is still in the basement, amber inside the red underlight of the cloud, red once
// it is above the ground line. An icon changing colour mid-rise IS "the noise reached paradise".
function noteColor(y) {
  const horizon = Display.zones.ground.y;
  if (y > horizon + FADE_H * 0.5) return C.inkDim;
  if (y > horizon) return C.suspAmber;
  return C.suspicion;
}

// Drawn over both cloud layers: an icon that vanished behind the cloud it is supposed to be
// seeping through would report the opposite of what is happening.
function renderNotes(ctx) {
  for (const n of state.notes) {
    // Held at full opacity almost to the end: an icon spends the last quarter of its rise in the
    // underlight and above it, and that is the part worth seeing, so the dissolve is short and
    // late. The one-pixel shadow is what keeps a red icon legible against the white cloud it has
    // just got into - the same problem the contract ring has, and the same answer.
    const t = n.t / NOTE_LIFE;
    ctx.globalAlpha = t < 0.12 ? t / 0.12 : (t > 0.9 ? (1 - t) / 0.1 : 1);
    const x = n.x + Math.round(Strip.ops.scroll) + Math.sin(n.phase + n.t * 2) * NOTE_SWAY;
    drawNote(ctx, x, n.y + 1, C.bgDeep);
    drawNote(ctx, x, n.y, noteColor(n.y));
    ctx.globalAlpha = 1;
  }
}

function queueFigureRect(i) {
  const z = Display.zones.heaven;
  return {
    x: EDGE_MARGIN + i * (QUEUE_FIGURE.w + QUEUE_FIGURE.gap),
    y: z.y + 2,
    w: QUEUE_FIGURE.w,
    h: QUEUE_FIGURE.h
  };
}

function renderQueue(ctx) {
  for (let i = 0; i < state.queue.length && i < QUEUE_MAX; i++) {
    const r = queueFigureRect(i);
    drawQueueFigure(ctx, r.x, r.y, i);
  }
  // The soul that arrived to a full queue and turned around, blinking away at the tail. Drawn as a
  // flat red silhouette of the same figure: the red is the penalty, and keeping the shape means the
  // player reads it as one more of the same people rather than as a new kind of thing.
  if (state.turnAway > 0) {
    const r = queueFigureRect(QUEUE_MAX);
    if (Math.floor(state.turnAway * 12) % 2 === 0) {
      drawSilhouette(ctx, SPR_QUEUE_SOUL, r.x, r.y, 0, C.suspicion);
    }
  }
}

// The lock on a fixture that has not been bought yet, 12x12. It carries both a dark outline and a
// light face, because it has to land on cloud upstairs and on the Operations floor downstairs and
// be the same object in both.
function drawLock(ctx, x, y) {
  drawSprite(ctx, SPR_LOCK, x, y);
}

// --- Edge chevrons (GDD 3.1) --------------------------------------------------

// A solid triangle pointing off the screen, drawn a row at a time: the apex is one pixel wide and
// the base is the full width, so the diagonal is a clean stair rather than an antialiased smear.
function drawChevron(ctx, r, side, color) {
  ctx.fillStyle = color;
  const half = (r.h - 1) / 2;
  for (let k = 0; k < r.h; k++) {
    const inset = Math.round(Math.abs(k - half) * (r.w - 1) / half);
    ctx.fillRect(side > 0 ? r.x : r.x + inset, r.y + k, r.w - inset, 1);
  }
}

// The ghost hand that teaches the drag (11_floors.js). Drawn over everything on the floors and
// under the chevrons, which is the order the two are read in: the arrow is the alarm and must never
// be covered, and the hand is the answer to the question the arrow leaves open.
//
// A hand on its own reads as "tap here" - a still pointer over a still row is a target, not a
// gesture. What makes it a drag is that it has come from somewhere, so the fingertip leaves a short
// wake along the path it has already covered, thinning towards the start. Dashes rather than dots:
// a square is a point and points do not have a direction, and the first version of this was two
// faint specks beside the hand that read as dither in the cloud. They stop at the start of the
// sweep rather than fading forever, because a tail longer than the gesture would be a line under
// the row, and a line under the row is a different piece of UI making a different promise.
//
// Drawn in the outline colour and not in the hand's own warm white, which is the second thing that
// made the first version invisible: the wake lives entirely on pale cloud, and half-transparent
// warm white on pale cloud is pale cloud. The hand gets away with white because it carries a dark
// contour; a one-pixel dash has no room for one, so it has to BE the dark part.
function renderStripHint(ctx) {
  if (!stripHintLive()) return;
  const h = state.stripHint;
  const a = stripHintAlpha(h);
  if (a <= 0) return;
  const p = stripHintHand(h);

  for (let i = 1; i <= HINT_TRAIL; i++) {
    const back = i * HINT_TRAIL_GAP;
    if (back > HINT_SWEEP * p.travel) break;
    ctx.globalAlpha = a * (1 - i / (HINT_TRAIL + 1));
    fillRect(ctx, p.x - h.dir * back - 1, p.y + 1, 3, 1, C.outline);
  }

  ctx.globalAlpha = a;
  drawSprite(ctx, SPR_HINT_HAND, p.x - HINT_HAND_TIP, p.y);
  ctx.globalAlpha = 1;
}

// Red means an expired contract is out there and how many; white means a free slot is out there
// and something is waiting for it. Red flashes because it is the one that costs the player a slot
// if it is ignored, and both are drawn last of everything in the scene so nothing can cover them.
function renderChevrons(ctx) {
  for (const kind of ['heaven', 'ops']) {
    for (const side of [-1, 1]) {
      const report = edgeReport(kind, side);
      if (!report) continue;
      const b = chevronBadge(kind, side, report);
      const flash = Math.sin(Fx.time * Math.PI * 2 * CHEVRON_PULSE) > 0;
      const color = report.alert ? (flash ? C.suspicion : C.suspAmber) : C.ink;
      fillRect(ctx, b.x, b.y, b.w, b.h, C.bgDeep);
      strokeRect(ctx, b.x, b.y, b.w, b.h, color);
      drawChevron(ctx, b.tri, side, color);
      if (!b.label) continue;
      // The count sits on the inboard side of the arrow, where there is plate to put it on.
      const y = b.tri.y + Math.round((b.tri.h - FONT_H) / 2) + 1;
      if (side > 0) drawTextRight(ctx, b.label, b.tri.x - 2, y, color, 1);
      else drawText(ctx, b.label, b.tri.x + b.tri.w + 2, y, color, 1);
    }
  }
}

// The colour going out of paradise as the meter climbs (GDD 10). A wash over the sky and the cloud
// rather than a second set of baked layers: the cloud is an ImageData bake of some 200 000 pixels,
// and rebuilding it every time Suspicion moves would cost more than the rest of the frame together.
// It is laid over the guests as well - the light in the room is what changes, not the wallpaper -
// but under the slot outlines, the rings and the chevrons, which are UI and must not dim at all.
function renderSuspicionWash(ctx) {
  const t = clamp((state.suspicion - SUSP_AMBER) / (SUSP_MAX - SUSP_AMBER), 0, 1);
  if (t <= 0) return;
  ctx.globalAlpha = t * WASH_ALPHA;
  fillRect(ctx, 0, 0, VIEW_W, Display.zones.ground.y + FADE_H, C.panel);
  ctx.globalAlpha = 1;
}

function renderScene(ctx) {
  const z = Display.zones;
  refreshScene();
  const dir = dragDirection();

  // Half the scroll of the desks in front of it, which is the only depth cue this floor has: the
  // old fill was two rectangles at view width and did not move at all, so a floor being dragged
  // sideways slid its furniture across a wall that was nailed down.
  fillRect(ctx, 0, z.ops.y, VIEW_W, z.ops.h, C.opsBg);
  ctx.drawImage(opsBack, Math.round(opsBackX + Strip.ops.scroll * OPS_BACK_PARALLAX), z.ops.y);
  fillRect(ctx, 0, z.ops.y + z.ops.h - OPS_FLOOR_H, VIEW_W, OPS_FLOOR_H, C.opsFloor);
  ctx.drawImage(sky, 0, 0);

  // The cloud belongs to the heaven strip and moves with it, so both read the same scroll offset.
  const scroll = Math.round(Strip.heaven.scroll);
  ctx.drawImage(cloudBack, cloudX + scroll, 0);

  // The suites themselves, behind everything that stands in them. The sprite has no border of its
  // own: depth is carried by tone alone, the interior sitting darker than the cloud around it and
  // the floor band lighter (GDD 12.4), and the cloud pillars drawn afterwards are what close its
  // edges. An outline here would turn a niche in something soft into a box sitting on top of it.
  const hCount = visibleSlotCount(state.heavenSlots);
  for (let i = 0; i < hCount; i++) {
    const r = heavenSlotRect(i);
    drawSprite(ctx, SPR_SLOT_HEAVEN, r.x, r.y);
  }

  // Guests go between the two cloud layers so the lip covers their feet.
  for (let i = 0; i < hCount; i++) {
    const slot = state.heavenSlots[i];
    if (!slot.guest) continue;
    const r = heavenSlotRect(i);
    // A saturated body with a pale head and a dark outline: a warm white guest on a warm white
    // cloud would be a silhouette with nothing inside it. Expired goes grey - no longer a paying
    // resident, just a problem standing up.
    drawGuest(ctx, r.x + (r.w - GUEST.w) / 2 + guestNudge(slot.guest), r.y + r.h - GUEST.h,
              slot.guest.soul);
  }

  // The suite the Renovation contract shut for the day (GDD 8.3). It had no drawing at all until
  // now: a slot with `maint` set was rendered as an ordinary empty suite, so the one contract in
  // the deck that takes something away took it away invisibly, and the player was left to work out
  // from a refused swipe that a suite they could see was not a suite they could use.
  //
  // In front of whoever is still standing in the room, because a barrier behind the person it is
  // barring is not a barrier, and behind the cloud lip, so the lip tucks its legs in the way it
  // tucks in a guest's feet. Both of those are why it is drawn here and not with the outlines.
  for (let i = 0; i < hCount; i++) {
    if (!state.heavenSlots[i].maint) continue;
    const r = heavenSlotRect(i);
    drawSprite(ctx, SPR_SUITE_CLOSED, r.x, r.y);
  }

  ctx.drawImage(cloudFront, cloudX + scroll, 0);
  renderAttractions(ctx);
  renderSuspicionWash(ctx);

  // Slot outlines go on top of everything, pillars included: they are UI, not scenery, and the
  // player has to be able to count free slots at a glance without the cloud eating a corner.
  //
  // What is left of them is state, and only state. The dashed rectangle used to be the drawing of
  // an empty suite as well as the affordance for one; now that a suite is a niche with a floor in
  // it, an empty one is already the plainest thing in the row, because nobody is standing in it. So
  // a resting empty slot gets no outline at all and the outline is spent on the three cases the
  // player has to be told about.
  for (let i = 0; i < hCount; i++) {
    const r = heavenSlotRect(i);
    const slot = state.heavenSlots[i];
    // The hold readout brackets the state outlines rather than sitting on one side of them: the
    // rising band goes under, because it is what is happening inside the room, and the ring goes
    // over, because it is drawn on the same four rows as the outline it is filling.
    //
    // The order used to be ring-first, and that is how a working progress readout came to be
    // invisible. The ring is the slot rectangle and a wreck's outline is the same slot rectangle,
    // so the red line below repainted every pixel of it every frame - and a wreck is the ONLY
    // thing the hold is ever offered on, so the ring was covered on every hold there has ever
    // been. Drawn afterwards it converts that outline from red to clean as it goes round, which is
    // the sentence the gesture was always trying to say.
    //
    // A wreck was briefly drawn with a bar along the floor of the niche as well as the outline
    // below. The screenshot settled it: the bar lands under the outline's own bottom edge, so it
    // was a second piece of vocabulary saying what the first already said.
    const hold = serviceHoldOn(i);

    if (hold > 0) drawHoldFill(ctx, r.x, r.y, r.w, r.h, hold);
    if (!slot.unlocked) {
      drawLock(ctx, r.x + (r.w - 12) / 2, r.y + (r.h - 12) / 2);
    } else if (slot.wrecked) {
      // Outlined solid rather than dashed, and in the same red as the mark on its floor. Dashed is
      // spoken for twice over in this row - cyan for "a swipe could land here", ink for "empty with
      // souls waiting" - and both of those mean a slot that is available. This one is the opposite,
      // so it does not borrow their line style.
      strokeRect(ctx, r.x, r.y, r.w, r.h, C.suspicion);
    } else if (slot.guest && armedTermination()) {

      // An armed Contract Termination (GDD 9.1) turns the question round: for as long as it is
      // waiting, the OCCUPIED suites are the targets, so they are the ones outlined.
      strokeRect(ctx, r.x, r.y, r.w, r.h, C.suspicion);
    } else if (!slot.guest && !slot.maint) {
      // A live swipe upwards lights the slots it could land in, so the target of the gesture is
      // visible before the finger is lifted. Otherwise: an empty slot with souls waiting blinks,
      // because that pair of facts is the definition of falling behind (GDD 10). It blinks at the
      // same 1 Hz as the Suspicion bar on purpose - the game has one alarm rhythm, not three.
      //
      // A suite shut for maintenance is excluded from both, and it was in neither before. Both
      // were lies about it and the second was the worse one: `firstFreeSlot` skips a `maint` slot,
      // so the cyan outline offered a landing the swipe could never make, and the ink blink is the
      // game's own alarm for a free slot going to waste while souls queue - fired at the player
      // over a slot they had already agreed to lose and could do nothing about. The barrier drawn
      // in the doorway is the whole statement; saying it a second time in an outline would be
      // spending an attention channel on a fact with no action attached to it (GDD 9.4).
      const idle = state.queue.length > 0 && Math.sin(Fx.time * Math.PI * 2 * SUSP_ALARM_PULSE) > 0;
      if (dir === 'up') dashedRect(ctx, r.x, r.y, r.w, r.h, C.aura, 3, 3, 0);
      else if (idle) dashedRect(ctx, r.x, r.y, r.w, r.h, C.ink, 3, 3, 0);
    }
    // Last, over whichever outline the branch above drew. It cannot collide with the swipe-target
    // outline - the input layer is single-touch everywhere, so a card being dragged and a suite
    // being held cannot coexist - and a wrecked suite is never a swipe target anyway, because it
    // is not a slot anything can be put in.
    if (hold > 0) drawHoldRing(ctx, r.x, r.y, r.w, r.h, hold);
  }

  const cCount = visibleSlotCount(state.cubicles);
  for (let i = 0; i < cCount; i++) {
    const r = cubicleRect(i);
    const slot = state.cubicles[i];
    // The desk is drawn whether or not it has been bought, and a locked one simply has the lock
    // standing on it. An empty rectangle where an unbought desk goes made the basement look
    // unfinished rather than unbought, and the row of desks is the readout of how much floor
    // there is left to fill.
    //
    // The two frames differ by one scan line on the monitor and nothing else. Offset by desk index
    // so the row does not blink in unison, which is the difference between four machines left on
    // overnight and one broken light.
    drawSprite(ctx, SPR_CUBICLE, r.x, r.y, (Math.floor(Fx.time * 2) + i) % frameCount(SPR_CUBICLE));
    if (!slot.unlocked) {
      drawLock(ctx, r.x + (r.w - 12) / 2, r.y + (r.h - 12) / 2);
    } else {
      if (slot.guest) {
        // The occupant stands in the well the L-shaped desk leaves open, cut off at the waist with
        // the cut hidden behind the front of the desk. The desk art hides it now; the separate
        // ledge the primitive needed went with the primitive.
        drawGuestAtDesk(ctx, r.x + DESK_BUST_X + guestNudge(slot.guest), r.y + DESK_BUST_DROP,
                        slot.guest.soul);
        // How much processing is left, across the front of the desk. It used to run along the top
        // edge, which was the only clear strip a rectangle for a desk had; the sprite has a strip
        // light up there now, and a bar laid over it read as the light going out, which is a
        // different sentence. The desk front is the other place the figure never reaches - it is
        // cut off two rows above it - and a pile going down on the front of a desk is the thing
        // the bar is measuring anyway.
        //
        // It gets a track, which the halo upstairs deliberately does not. The rule there is that
        // how much halo there is IS how much contract there is, and it works because a ring is a
        // closed shape: the eye knows where the missing part would have been. A straight bar has
        // no such reference, and laid bare on a sprite with a strip light, a monitor, two paper
        // trays and a red kick plate on it, a teal line of some length is not a fraction of
        // anything - which is how a working readout came to be reported as missing.
        //
        // Three rows and inset by two, which is exactly the clear span of the desk front: the
        // sprite has plain opsMid on rows 31 to 33 between its own border and its red kick plate,
        // and the recessed track is what stops the bar sharing an edge with that plate.
        deskBar(ctx, r.x + 2, r.y + r.h - 5, r.w - 4, 3,
                clamp(slot.guest.desk / slot.guest.deskMax, 0, 1));
      } else if (dir === 'down') {
        strokeRect(ctx, r.x, r.y, r.w, r.h, C.aura);
      } else if (expiredGuestCount() > 0 && Math.sin(Fx.time * Math.PI * 2 * SUSP_ALARM_PULSE) > 0) {
        // A free desk blinks while an expired guest is standing upstairs - the same rule the edge
        // chevrons use, applied to the desks that are on screen: a free desk is the only thing that
        // stops that guest rioting, and it is worth nothing if the player has not noticed it.
        strokeRect(ctx, r.x, r.y, r.w, r.h, C.ink);
      }
    }
  }

  renderNotes(ctx);
  renderContracts(ctx);
  renderQueue(ctx);

  // Only during a day: between days the floors are not being managed, and a chevron over the
  // shop panel would be pointing at something the player cannot act on. The ghost hand keeps the
  // same company and goes under, so the arrow it is explaining stays the topmost thing on screen.
  if (state.screen === SCREEN.DAY_ACTIVE) {
    renderStripHint(ctx);
    renderChevrons(ctx);
  }

  fillRect(ctx, 0, z.work.y, VIEW_W, z.work.h, C.bgDeep);
  fillRect(ctx, 0, z.work.y, VIEW_W, 2, C.panel);
}

// ==========================================================================
// 17_render_ui.js
// ==========================================================================

// HUD and screens. Button rectangles are functions rather than constants because the view height
// changes between devices, and the state machine hit-tests against the very same rectangles.

const BUTTON = { w: 104, h: 26 };

function centredButton(y) {
  return { x: Math.floor((VIEW_W - BUTTON.w) / 2), y: y, w: BUTTON.w, h: BUTTON.h };
}
function clockInButtonRect() { return centredButton(Math.floor(Display.viewH * 0.58)); }
function playAgainButtonRect() { return centredButton(Display.viewH - 70); }

function drawButton(ctx, r, label) {
  fillRect(ctx, r.x, r.y, r.w, r.h, C.ink);
  fillRect(ctx, r.x, r.y + r.h - 2, r.w, 2, C.inkFaint);
  drawTextCentered(ctx, label, r.x + r.w / 2, r.y + Math.round((r.h - 7) / 2), C.bgDeep, 1);
}

// The same plate, filling left to right as the sound arrives. It is the button rather than a bar
// somewhere else on purpose: the thing that is not ready is the thing being waited for, and putting
// the wait anywhere else would leave a perfectly ordinary CLOCK IN sitting there not answering.
//
// The whole plate fills rather than a strip along its edge. The strip was tried first, to match the
// pressed edge of the live button, and two pixels of it on a twenty-six pixel plate is not a thing
// anyone reads as movement - which is the one job it has, since the difference between a wait and a
// hang is entirely whether something is visibly happening. The label sits in the dark ink over
// both halves, which it has the contrast for either way.
function drawLoadingButton(ctx, r, p) {
  fillRect(ctx, r.x, r.y, r.w, r.h, C.inkFaint);
  fillRect(ctx, r.x, r.y, Math.round(r.w * clamp(p, 0, 1)), r.h, C.ink);
  drawTextCentered(ctx, 'LOADING', r.x + r.w / 2, r.y + Math.round((r.h - 7) / 2), C.bgDeep, 1);
}

// --- The sound toggle (GDD 1.5, 3) --------------------------------------------
// Top right of the HUD, on every screen that has one, and hit-tested before any screen gets a
// look at the gesture. It is not a feature so much as a debt: the loop starts on CLOCK IN at
// three quarters volume and runs for the whole session, and a judge may well be playing in a room
// with other people in it.
function soundButtonRect() {
  const z = Display.zones.hud;
  return { x: VIEW_W - EDGE_MARGIN - SOUND_BTN.w, y: z.y + 3, w: SOUND_BTN.w, h: SOUND_BTN.h };
}

// Hidden for the three seconds of the audit and nowhere else: the fold closes over the HUD, and a
// control floating on the black would read as a rendering fault. Hidden means unreachable too -
// see handleGesture - because an invisible button is worse than a missing one.
function soundButtonVisible() {
  return state.screen !== SCREEN.AUDIT;
}

// A speaker at eleven pixels square: a box, a cone drawn column by column, and either two waves or
// a cross where they would be. No text, because there is no room for any, and no third state -
// this is on or off (GDD 1.5).
function drawSoundIcon(ctx, r, on) {
  const color = on ? C.ink : C.inkFaint;
  fillRect(ctx, r.x + 1, r.y + 4, 3, 3, color);
  for (let k = 0; k < 3; k++) fillRect(ctx, r.x + 4 + k, r.y + 3 - k, 1, 5 + k * 2, color);
  if (on) {
    fillRect(ctx, r.x + 8, r.y + 4, 1, 3, color);
    fillRect(ctx, r.x + 10, r.y + 2, 1, 7, color);
  } else {
    ctx.fillStyle = C.inkDim;
    for (let k = 0; k < 4; k++) {
      ctx.fillRect(r.x + 7 + k, r.y + 3 + k, 1, 1);
      ctx.fillRect(r.x + 10 - k, r.y + 3 + k, 1, 1);
    }
  }
}

// --- The consumable slots and the banner (GDD 3, 9.1) -------------------------
// Two boxes on the second HUD row, hard against the right edge under the clock. The HUD is the
// only zone in the game that scrolls nothing and owns no gesture, which is the whole reason the
// slots live there rather than in the lounge they act on.
function supplySlotRect(i) {
  const z = Display.zones.hud;
  return {
    x: SUPPLY_SLOT.right - (SUPPLY_SLOTS - i) * SUPPLY_SLOT.w - (SUPPLY_SLOTS - 1 - i) * SUPPLY_SLOT.gap,
    y: z.y + SUPPLY_SLOT.y,
    w: SUPPLY_SLOT.w,
    h: SUPPLY_SLOT.h
  };
}

// The running effect reports itself at the top edge of the lounge, beside the queue row: a
// countdown belongs where the consequences are, and the left half of that row is the queue.
function supplyBannerRect() {
  const z = Display.zones.heaven;
  return { x: SUPPLY_BANNER.x, y: z.y + 2, w: VIEW_W - EDGE_MARGIN - SUPPLY_BANNER.x, h: SUPPLY_BANNER.h };
}

// drawSupplyIcon now lives in 15g_art_supplies.js, beside the marks it draws. It has to be gone
// from here rather than left as a fallback: both declarations are hoisted, so the last one
// parsed wins, and 15g loads BEFORE this file - the primitive would quietly beat the sprite.

// Drawn on every screen that has a HUD, because what is in the slots is part of what the player
// owns and the night is when they decide to buy another one. Only a day can spend them.
function renderSupplySlots(ctx) {
  if (!supplyEverBought()) return;
  for (let i = 0; i < SUPPLY_SLOTS; i++) {
    const r = supplySlotRect(i);
    const id = state.supplies[i];
    if (!id) {
      dashedRect(ctx, r.x, r.y, r.w, r.h, C.inkFaint, 2, 2, 0);
      continue;
    }
    // A slot that can be spent right now is lit; during the night, or while another effect is
    // running, it is present but plainly not a button.
    const live = state.screen === SCREEN.DAY_ACTIVE && !supplyBusy();
    fillRect(ctx, r.x, r.y, r.w, r.h, C.panel);
    strokeRect(ctx, r.x, r.y, r.w, r.h, live ? C.aura : C.inkFaint);
    drawSupplyIcon(ctx, id, r, live ? C.ink : C.inkDim);
  }
}

function renderSupplyBanner(ctx) {
  if (!state.active.id) return;
  const r = supplyBannerRect();
  const arm = state.active.arm;
  const accent = arm ? C.credits : C.aura;
  fillRect(ctx, r.x, r.y, r.w, r.h, C.hudBg);
  strokeRect(ctx, r.x, r.y, r.w, r.h, accent);
  const label = SUPPLY_SHORT[state.active.id] || '';
  drawText(ctx, label, r.x + 4, r.y + 4, accent, 1);
  // An armed consumable has no clock, so the right of the plate is left empty rather than filled
  // with a zero: the question is what it is reporting.
  if (!arm) drawTextRight(ctx, Math.ceil(state.active.t) + 's', r.x + r.w - 4, r.y + 4, C.ink, 1);
}

function dim(ctx, alpha) {
  ctx.fillStyle = 'rgba(6,5,12,' + alpha + ')';
  ctx.fillRect(0, 0, VIEW_W, Display.viewH);
}

// The same veil with a hole cut in it: four bands around `r`, so one thing on screen keeps its own
// brightness while the rest of the frame goes behind an onboarding beat (GDD 8.4).
//
// Four fills rather than a composite operation. 'destination-out' would punch through everything
// already painted, background included, and leave a transparent window onto the page - and the
// point of the hole is that what shows through it is the scene, undimmed. Drawing around it also
// keeps the whole thing on the integer grid, which a clipped path would not.
// Takes one rect or several. Several is what a beat needs when it names a cause and an effect that
// live in different parts of the screen - a stat on the docket and the meter that stat feeds - and
// two lit boxes draw the line between them that the three lines of text cannot afford to.
//
// The holes must be vertically disjoint, and the walk below is why: it goes down the screen filling
// the band above each hole, then the strip to its left and right, then continues from its bottom
// edge. Nothing is ever painted twice, which matters because two overlapping veils at 0.78 would
// come out near black over the overlap. An overlap does not corrupt the frame - the clamp collapses
// the offending band to zero height - it just stops being a hole.
function dimExcept(ctx, alpha, rects) {
  const holes = (Array.isArray(rects) ? rects : [rects]).filter(Boolean).sort((a, b) => a.y - b.y);
  if (!holes.length) { dim(ctx, alpha); return; }
  const h = Display.viewH;
  ctx.fillStyle = 'rgba(6,5,12,' + alpha + ')';
  let y = 0;
  for (const r of holes) {
    const y0 = clamp(r.y, y, h), y1 = clamp(r.y + r.h, y0, h);
    const x0 = clamp(r.x, 0, VIEW_W), x1 = clamp(r.x + r.w, x0, VIEW_W);
    ctx.fillRect(0, y, VIEW_W, y0 - y);
    ctx.fillRect(0, y0, x0, y1 - y0);
    ctx.fillRect(x1, y0, VIEW_W - x1, y1 - y0);
    y = y1;
  }
  ctx.fillRect(0, y, VIEW_W, h - y);
}

// --- HUD (GDD 3) --------------------------------------------------------------

// The Suspicion meter's own geometry, shared by the HUD that draws it and the onboarding beat that
// points at it. Two copies of `z.y + z.h - 6` is one copy too many the first time the HUD is
// re-laid out: the spotlight would go on confidently framing the row above the meter.
function suspicionBar() {
  const z = Display.zones.hud;
  return { x: EDGE_MARGIN, y: z.y + z.h - 6, w: VIEW_W - EDGE_MARGIN * 2, h: 4 };
}

// The whole readout, not just the track: the label, the number on the right and the bar under them
// are one row and one idea, and a hole cut around the bar alone would leave the word SUSPICION in
// the dark above a lit stripe.
function suspicionRowRect() {
  const bar = suspicionBar();
  return { x: bar.x, y: bar.y - 10, w: bar.w, h: 10 + bar.h + 1 };
}

function renderHud(ctx) {
  const z = Display.zones.hud;
  fillRect(ctx, 0, z.y, VIEW_W, z.h, C.hudBg);
  fillRect(ctx, 0, z.y + z.h - 1, VIEW_W, 1, C.panel);

  // In the shop the HUD reports the day the player is buying FOR, not the one just finished, and
  // the clock reads as stopped: the quota on screen is the number those Credits have to beat.
  const shopping = state.screen === SCREEN.SHOP || state.screen === SCREEN.NIGHT_CARD;
  const day = shopping ? Math.min(state.day + 1, LAST_DAY) : state.day;

  const x = EDGE_MARGIN + 2;
  drawText(ctx, 'DAY ' + day + '/' + LAST_DAY, x, z.y + 4, C.ink, 1);
  // The clock gives up the right edge to the sound toggle and sits just inside it.
  drawTextRight(ctx, shopping ? '--:--' : formatTime(state.dayTime),
                soundButtonRect().x - 4, z.y + 4, C.inkDim, 1);

  const quota = dayQuota(day);
  drawText(ctx, '\u2726 ' + Math.floor(state.aura) + ' / ' + quota, x, z.y + 15,
           state.aura >= quota ? C.good : C.aura, 1);
  drawText(ctx, '\u25c8 ' + Math.floor(state.credits), HUD_CREDITS_X, z.y + 15, C.credits, 1);

  // Suspicion gets the full width of the HUD and a row of its own above it: the bar answers "how
  // close", the number answers "how much", and a one-off hit prints its own size between them.
  // Below the amber tier the readout is deliberately grey - a bar that is already red at zero has
  // spent its alarm before anything has gone wrong.
  const bar = suspicionBar();
  const barY = bar.y, barW = bar.w;
  const alarm = state.suspicion >= SUSP_ALARM;
  const tier = alarm ? C.suspicion : (state.suspicion >= SUSP_AMBER ? C.suspAmber : C.inkDim);

  drawText(ctx, 'SUSPICION', x, barY - 9, C.inkFaint, 1);
  drawTextRight(ctx, String(Math.floor(state.suspicion)), VIEW_W - EDGE_MARGIN - 2, barY - 9, tier, 1);
  // The bottom of the meter has a price too since wave C (GDD 4.1, 7.1), and the player has to be
  // able to read it off the same row. No Buzz bar - there is one meter on screen and it now says
  // which of its two ends you are too close to.
  if (state.suspicion < SUSP_STARVE) {
    drawText(ctx, 'TOO QUIET', x + textWidth('SUSPICION ', 1), barY - 9, C.suspAmber, 1);
  }

  fillRect(ctx, EDGE_MARGIN, barY, barW, 4, C.panel);
  // The starvation zone is painted into the track rather than announced: the stretch of bar below
  // it is a colder colour and carries a tick at the threshold, so "there is a floor and it is not
  // where you want to be" is legible before the game ever has to say it.
  const starveW = Math.round(barW * SUSP_STARVE / SUSP_MAX);
  fillRect(ctx, EDGE_MARGIN, barY, starveW, 4, C.inkFaint);
  fillRect(ctx, EDGE_MARGIN + starveW, barY, 1, 4, C.inkDim);
  const fill = Math.round(barW * clamp(state.suspicion, 0, SUSP_MAX) / SUSP_MAX);
  if (fill > 0) {
    // In the red the bar pulses. It is the only thing on screen allowed to move by itself, so it
    // can be found in peripheral vision while the player is reading a card.
    const dark = alarm && Math.sin(Fx.time * Math.PI * 2 * SUSP_ALARM_PULSE) < 0;
    fillRect(ctx, EDGE_MARGIN, barY, fill, 4,
             state.suspFlash > 0 ? C.ink : (dark ? C.suspAmber : tier));
  }

  renderSupplySlots(ctx);

  if (state.suspPop.t > 0) {
    const t = 1 - state.suspPop.t / SUSP_POP_LIFE;
    const n = Math.round(state.suspPop.n);
    ctx.globalAlpha = t > 0.7 ? (1 - t) / 0.3 : 1;
    // The basket is the only thing that moves the meter down, and it prints in the same row as
    // everything that moves it up - green and signed, so the two never read as the same event.
    drawTextOutlined(ctx, (n > 0 ? '+' : '') + n, VIEW_W / 2,
                     barY - 9 - Math.round(4 * easeOut(t)), n < 0 ? C.good : C.suspicion, C.hudBg);
    ctx.globalAlpha = 1;
  }
}

// --- Title (GDD 2) ------------------------------------------------------------
function renderTitle(ctx) {
  dim(ctx, 0.9);
  const cx = VIEW_W / 2;
  const top = Math.floor(Display.viewH * 0.20);

  drawTextCentered(ctx, 'WELCOME TO', cx, top, C.inkDim, 1);

  // The trademark sign is not in the glyph table, so it is set as small caps beside the wordmark.
  const wordW = textWidth('HEAVEN', 2);
  const tmW = textWidth('TM', 1);
  const wx = Math.round(cx - (wordW + 2 + tmW) / 2);
  drawText(ctx, 'HEAVEN', wx, top + 14, C.ink, 2);
  drawText(ctx, 'TM', wx + wordW + 2, top + 14, C.credits, 1);

  drawTextCentered(ctx, TAGLINE, cx, top + 36, C.inkFaint, 1);

  if (audioGated()) drawLoadingButton(ctx, clockInButtonRect(), audioLoadProgress());
  else drawButton(ctx, clockInButtonRect(), 'CLOCK IN');

  // Day one's memo and feed are on the title screen, because day one has no night before it. Same
  // two lines, same order, so the header the player meets here is the header they meet every night.
  renderNightHeader(ctx, 1, Math.floor(Display.viewH * 0.74));
}

// --- End of day plate ---------------------------------------------------------
// Three lines and two seconds: what happened, the number it happened to, and what it cost. The
// quota line is always present, met or missed, because the player is learning the shape of the
// curve as much as today's result.
function renderDayEndPlate(ctx) {
  dim(ctx, 0.7);
  const r = state.dayResult;
  const text = PLATE_TEXT[r.state];
  const accent = r.state === 'met' ? C.good : C.suspicion;
  const cx = VIEW_W / 2;
  const top = Math.floor((Display.viewH - PLATE_H) / 2);

  fillRect(ctx, 16, top, VIEW_W - 32, PLATE_H, C.hudBg);
  strokeRect(ctx, 16, top, VIEW_W - 32, PLATE_H, accent);

  drawTextCentered(ctx, text.title.replace('%d', String(state.day)), cx, top + 8, C.ink, 1);
  drawTextCentered(ctx, '✦ ' + Math.floor(r.aura) + ' / ' + r.quota, cx, top + 22, accent, 1);
  drawTextCentered(ctx, text.note, cx, top + 36, C.inkFaint, 1);
}

// --- The night contract (GDD 8.3) ---------------------------------------------
// Reigns in one card, between the settlement and the shop. Same panel geometry as the shop, so the
// night reads as one place with two pages rather than as two screens: the HUD stays up because the
// Suspicion meter and the Credits are exactly what the offer is being weighed against.
//
// The buttons are wide and stacked, and each carries its effect underneath in plain numbers. The
// rule is that a label never lies - what is not obvious about a contract is its second-order
// consequence, and a game that misreports its own button reads as a bug rather than as a choice.
function nightPanelRect() {
  return shopPanelRect();
}

// The whole card is centred in the panel as one block, the way the shop centres its memo and grid
// together: the body text is two lines on some contracts and five on others, and a button pinned
// to the bottom of a tall phone would leave the offer stranded a screen away from the answer.
function nightLayout() {
  const p = nightPanelRect();
  const card = state.night.card;
  const body = card ? wrapText(card.text, VIEW_W - 34, 1) : [];
  const block = NIGHT_BTN.h + 30;        // one button plus the two lines of consequence under it
  const head = 14 + 34 + 14;             // the label, the seal, the title
  const contentH = head + body.length * 10 + 12 + block * 2;
  // Biased above the middle rather than centred: on a 480-row view a centred block leaves a third
  // of a screen of nothing above the only thing there is to read.
  const top = p.y + Math.max(8, Math.floor((p.h - 24 - contentH) * 0.38));
  return {
    top: top,
    body: body,
    buttonsY: top + head + body.length * 10 + 12,
    block: block
  };
}

function nightButtonRect(i) {
  const lay = nightLayout();
  return {
    x: Math.floor((VIEW_W - NIGHT_BTN.w) / 2),
    y: lay.buttonsY + i * lay.block,
    w: NIGHT_BTN.w,
    h: NIGHT_BTN.h
  };
}

// After an answer the whole bottom of the panel is the way on. A small button under a consequence
// the player has just been handed is the wrong size of target for the only thing left to do here.
function nightContinueRect() {
  const p = nightPanelRect();
  const top = nightButtonRect(0).y - 8;
  return { x: 0, y: top, w: VIEW_W, h: p.y + p.h - top };
}

// A signed contract, folded once: a wax seal, three ruled lines and a signature scratch. Drawn
// rather than typed because the panel is otherwise a page of text with no picture on it at all.
function drawContractSeal(ctx, cx, y) {
  fillRect(ctx, cx - 18, y, 36, 26, C.ink);
  fillRect(ctx, cx - 18, y, 36, 2, C.credits);
  for (let k = 0; k < 3; k++) fillRect(ctx, cx - 13, y + 7 + k * 4, 20, 1, C.inkFaint);
  fillRect(ctx, cx + 1, y + 19, 13, 1, C.bgDeep);
  fillRect(ctx, cx + 3, y + 18, 2, 1, C.bgDeep);
  fillRect(ctx, cx + 8, y + 17, 2, 2, C.bgDeep);
  fillRect(ctx, cx - 15, y + 15, 8, 8, C.suspicion);
  fillRect(ctx, cx - 13, y + 17, 4, 4, C.bgDeep);
}

function renderNightButton(ctx, i, label, note, accent) {
  const r = nightButtonRect(i);
  const chosen = state.night.choice === i;
  const answered = state.night.choice >= 0;

  // Once an answer is given the other button is not greyed out, it is gone: a dead control left on
  // screen invites a second tap at the one moment the game has nothing to answer with.
  if (answered && !chosen) return;

  fillRect(ctx, r.x, r.y, r.w, r.h, chosen ? C.hudBg : C.ink);
  strokeRect(ctx, r.x, r.y, r.w, r.h, accent);
  if (!chosen) fillRect(ctx, r.x, r.y + r.h - 2, r.w, 2, C.inkFaint);
  drawTextCentered(ctx, label, r.x + r.w / 2, r.y + Math.round((r.h - 7) / 2),
                   chosen ? accent : C.bgDeep, 1);

  const lines = wrapText(note, r.w - 4, 1);
  for (let n = 0; n < lines.length && n < 2; n++) {
    drawTextCentered(ctx, lines[n], VIEW_W / 2, r.y + r.h + 5 + n * 9, chosen ? C.ink : C.inkFaint, 1);
  }
}

function renderNight(ctx) {
  const p = nightPanelRect();
  const card = state.night.card;
  if (!card) return;
  const lay = nightLayout();
  const slide = Math.round((1 - easeOut(clamp(state.night.in, 0, 1))) * p.h);

  ctx.save();
  ctx.translate(0, slide);

  fillRect(ctx, p.x, p.y, p.w, p.h, C.bgDeep);
  fillRect(ctx, p.x, p.y, p.w, 2, C.panel);

  const cx = VIEW_W / 2;
  drawTextCentered(ctx, 'CONTRACT OFFER', cx, lay.top, C.inkFaint, 1);
  drawContractSeal(ctx, cx, lay.top + 14);
  drawTextCentered(ctx, card.title, cx, lay.top + 48, C.credits, 1);
  for (let i = 0; i < lay.body.length; i++) {
    drawTextCentered(ctx, lay.body[i], cx, lay.top + 62 + i * 10, C.ink, 1);
  }

  renderNightButton(ctx, 0, 'ACCEPT', card.yes, C.aura);
  renderNightButton(ctx, 1, 'DECLINE', card.no, C.suspicion);

  if (state.night.choice >= 0) {
    drawTextCentered(ctx, 'TAP TO CONTINUE', cx, lay.buttonsY + lay.block * 2 - 4, C.credits, 1);
  }

  ctx.restore();
}

// --- Shop (GDD 9) -------------------------------------------------------------
// The panel takes everything below the HUD rather than only the work zone the GDD drew it in.
// Half the item names need two lines at this width, and a cell that cannot hold its own name is
// worse than a covered basement - the names carry the tone, and the HUD keeps Credits and the
// Suspicion meter on screen, which is what the player is actually spending against.
function shopPanelRect() {
  const y = Display.zones.heaven.y;
  return { x: 0, y: y, w: VIEW_W, h: Display.viewH - y };
}

function startDayButtonRect() {
  const p = shopPanelRect();
  return { x: Math.floor((VIEW_W - BUTTON.w) / 2), y: p.y + p.h - BUTTON.h - 8, w: BUTTON.w, h: BUTTON.h };
}

// --- The tabs (GDD 9) ---------------------------------------------------------
// Three pages of one panel rather than three screens: the tab row is pinned to the top of the
// panel and everything under it is laid out the same way on every page, so switching tabs moves
// the contents and never the furniture.
function shopPageItems(page) {
  const out = [];
  for (let i = 0; i < SHOP_ITEMS.length; i++) if (SHOP_ITEMS[i].page === page) out.push(i);
  return out;
}

// The pages arrive one a night over the first four nights (GDD 9). `state.day` in the shop is the
// day that has just finished, so a page with `fromDay: 2` is on the table from the night after the
// second day and never before it.
function shopPageUnlocked(i) {
  const page = SHOP_PAGES[i];
  return !!page && state.day >= page.fromDay;
}

function unlockedShopPages() {
  const out = [];
  for (let i = 0; i < SHOP_PAGES.length; i++) if (shopPageUnlocked(i)) out.push(i);
  return out;
}

// Which page, if any, is on the table for the first time tonight. One at most, by construction of
// the table, and it is what the panel opens on and what the intro line is about.
function newShopPage() {
  for (let i = 0; i < SHOP_PAGES.length; i++) if (SHOP_PAGES[i].fromDay === state.day) return i;
  return -1;
}

function currentShopPage() {
  return SHOP_PAGES[clamp(state.shopPage, 0, SHOP_PAGES.length - 1)].id;
}

// No tab row at all on the first night: one page is not a choice, and the first shop a judge sees
// should look exactly like the shop looked before wave C - one grid, eight items.
function shopTabsVisible() {
  return unlockedShopPages().length > 1;
}

// The row is divided between the pages that exist, so it fills the width and grows as pages
// arrive. A row of four with two of them greyed out would advertise what the player cannot have.
function shopTabRect(i) {
  const pages = unlockedShopPages();
  const slot = pages.indexOf(i);
  if (slot < 0) return { x: 0, y: -999, w: 0, h: 0 };
  const p = shopPanelRect();
  const w = Math.floor((VIEW_W - EDGE_MARGIN * 2) / pages.length);
  return { x: EDGE_MARGIN + slot * w, y: p.y + 5, w: w, h: SHOP_TAB_H };
}

function renderShopTabs(ctx) {
  if (!shopTabsVisible()) return;
  const fresh = newShopPage();
  for (const i of unlockedShopPages()) {
    const r = shopTabRect(i);
    const on = i === state.shopPage;
    fillRect(ctx, r.x, r.y, r.w, r.h, on ? C.panel : C.hudBg);
    // The selected tab is underlined in gold rather than boxed: at thirteen pixels tall a border
    // on all four sides leaves nothing inside it for the word. A tab that arrived tonight and is
    // not the one being looked at keeps a gold word, so it is still findable after a tap away.
    fillRect(ctx, r.x, r.y + r.h - 2, r.w, 2, on ? C.credits : C.bgDeep);
    drawTextCentered(ctx, SHOP_PAGES[i].label, r.x + r.w / 2, r.y + 3,
                     on ? C.ink : (i === fresh ? C.credits : C.inkFaint), 1);
  }
}

function shopGridRows() {
  if (currentShopPage() === 'staff') return Math.ceil(STAFF_OFFER / SHOP_COLS);
  return Math.ceil(shopPageItems(currentShopPage()).length / SHOP_COLS);
}

// The memo and the grid are centred as ONE block rather than the memo pinned to the top of the
// panel: with two items pinning left the notice stranded a screen away from the only two things
// to read, and with eight items the block fills the panel and the difference disappears.
function shopLayout() {
  const p = shopPanelRect();
  const rows = shopGridRows();
  const p0 = shopPanelRect();
  const top = shopTabsVisible() ? p0.y + 5 + SHOP_TAB_H + 4 : p0.y + 6;
  const bottom = startDayButtonRect().y - 8;
  const h = clamp(Math.floor((bottom - top - SHOP_MEMO_H - (rows - 1) * SHOP_GAP) / rows),
                  SHOP_CELL_H_MIN, SHOP_CELL_H_MAX);
  // One optional strip between the memo and the grid: the ON SHIFT line the staff page carries.
  // The line that used to introduce an arriving tab lived here too; it is now spoken by the
  // Associate over the panel (GDD 9), which is why the grid no longer changes height on the one
  // night a page lands.
  const staff = currentShopPage() === 'staff' ? STAFF_ROW_H : 0;
  const head = SHOP_MEMO_H + staff;
  const contentH = head + rows * h + (rows - 1) * SHOP_GAP;
  // Biased above the middle rather than centred, the same fraction the night card uses. A page
  // with three rows on it instead of four is not an invitation to push the memo half a screen
  // down: the block should sit under the tabs on every page, and only the slack below it changes.
  const y0 = top + Math.floor((bottom - top - contentH) * 0.28);
  return {
    memoY: y0,
    staffY: y0 + SHOP_MEMO_H,
    gridY: y0 + head,
    cellH: h
  };
}

// `i` is the index into SHOP_ITEMS, not into the page: every other module refers to an item by its
// place in the one flat table, and the balance harness buys by id. The position on screen is the
// item's place among the cells of ITS page, which is the only thing the tabs change.
// Where the Associate stands on the night panel: directly under the tab row, so the gold word that
// just appeared and the line explaining it are read in that order and nothing has to point.
//
// He stands IN PLACE of the night header rather than over it. The plate is 50 px and the header is
// 66, so no offset covers it - the first pass sliced MEMO FROM HEAD OFFICE across the middle and
// left the second line of the Earth feed sticking out below the plate as a strip of text with no
// title on it. Dimming does not fix that; it only makes the fragment darker. The header is one tap
// away and has waited on this screen every other night of the run, so it waits four more seconds.
function shopPlateY() {
  const p = shopPanelRect();
  const tabs = shopTabsVisible() ? SHOP_TAB_H + 4 : 0;
  return p.y + 5 + tabs + 4;
}

function shopCellRect(i) {
  const slot = shopPageItems(SHOP_ITEMS[i].page).indexOf(i);
  if (slot < 0) return { x: 0, y: -999, w: 0, h: 0 };
  const lay = shopLayout();
  const gridW = SHOP_COLS * SHOP_CELL_W + (SHOP_COLS - 1) * SHOP_GAP;
  return {
    x: Math.floor((VIEW_W - gridW) / 2) + (slot % SHOP_COLS) * (SHOP_CELL_W + SHOP_GAP),
    y: lay.gridY + Math.floor(slot / SHOP_COLS) * (lay.cellH + SHOP_GAP),
    w: SHOP_CELL_W,
    h: lay.cellH
  };
}

// --- The shift associate (GDD 9.3) --------------------------------------------
// Three candidates in the same cells the shop uses, because a candidate carries exactly the four
// facts a shop item does: a name, a price, one thing it gives and one thing it costs. Above them,
// one line saying who is on shift - which is the "row on the night screen" the GDD asked for, with
// the three candidates moved into the grid because a name, a wage, a plus and a minus will not fit
// three times across 204 px.
function staffCellRect(i) {
  const lay = shopLayout();
  const gridW = SHOP_COLS * SHOP_CELL_W + (SHOP_COLS - 1) * SHOP_GAP;
  return {
    x: Math.floor((VIEW_W - gridW) / 2) + (i % SHOP_COLS) * (SHOP_CELL_W + SHOP_GAP),
    y: lay.gridY + Math.floor(i / SHOP_COLS) * (lay.cellH + SHOP_GAP),
    w: SHOP_CELL_W,
    h: lay.cellH
  };
}

function staffFireRect() {
  const lay = shopLayout();
  return { x: VIEW_W - EDGE_MARGIN - 34, y: lay.staffY, w: 34, h: 12 };
}

// drawStaffIcon now lives in 15h_art_staff.js, beside the four it draws. Deleted here for the
// same hoisting reason as drawSupplyIcon above.

function renderStaffCell(ctx, i) {
  const card = staffCard(state.staff.offer[i]);
  if (!card) return;
  const r = staffCellRect(i);
  const affordable = state.credits >= card.wage;
  const flash = state.shopFlash.index === -1 - i && state.shopFlash.t > 0;

  fillRect(ctx, r.x, r.y, r.w, r.h, C.hudBg);
  strokeRect(ctx, r.x, r.y, r.w, r.h, flash ? C.good : C.panel);

  const lines = wrapText(card.name, r.w - 10, 1);
  for (let n = 0; n < lines.length && n < 2; n++) {
    drawText(ctx, lines[n], r.x + 5, r.y + 5 + n * 9, C.ink, 1);
  }

  const iconY = cellIconY(r, lines.length);
  drawStaffIcon(ctx, card.id, r.x + 5, iconY);
  const tx = r.x + 5 + SHOP_ICON + 4;
  drawText(ctx, card.effect, tx, iconY + 1, C.inkDim, 1);
  drawText(ctx, card.cost, tx, iconY + 10, C.suspicion, 1);

  // The wage is per day and says so: it is the one price in this game that is charged again
  // tomorrow, and a bare number in the corner would read like every other price in the panel.
  const onShift = state.staff.hired === card.id;
  drawText(ctx, card.wage + ' ◈/day', r.x + 5, r.y + r.h - 12, affordable ? C.credits : C.inkFaint, 1);
  drawTextRight(ctx, onShift ? 'ON SHIFT' : 'HIRE', r.x + r.w - 5, r.y + r.h - 12,
                onShift ? C.good : C.inkFaint, 1);
}

function renderStaffRow(ctx) {
  const lay = shopLayout();
  const y = lay.staffY;
  const s = hiredStaff();
  drawText(ctx, 'ON SHIFT', EDGE_MARGIN + 2, y, C.inkFaint, 1);
  if (!s) {
    drawText(ctx, 'nobody', EDGE_MARGIN + 2 + textWidth('ON SHIFT ', 1), y, C.inkDim, 1);
    return;
  }
  drawText(ctx, s.name, EDGE_MARGIN + 2 + textWidth('ON SHIFT ', 1), y, C.ink, 1);
  // What last night's settlement did about the wage, under the name: a wage that is charged
  // silently is a wage the player finds out about by watching Credits go missing.
  if (state.staff.note) {
    drawText(ctx, state.staff.note, EDGE_MARGIN + 2, y + 9, C.inkFaint, 1);
  }
  const r = staffFireRect();
  strokeRect(ctx, r.x, r.y, r.w, r.h, C.suspicion);
  drawTextCentered(ctx, 'FIRE', r.x + r.w / 2, r.y + 3, C.suspicion, 1);
}

// Where the icon row starts. Anchored to the BOTTOM of the cell, so a grid of cells has its prices
// and its icons on the same two lines however long the names are - except when the cell is too
// short for that, and then it is pushed down under the name instead.
//
// The exception is not hypothetical: cells shrink to fit the panel, and a two-line name in a 50 px
// cell (four rows on the 384 px view, which is where the BUILD page lives) put the effect line
// straight through the second line of the name. It has been that way since step 8 and was two
// pixels from visible; the tab row of the staged unlock took those two pixels.
//
// The ceiling is what the finished 20 px art added. Four pixels taller than the placeholder it
// replaced, the icon on a short cell ran its last rows through the price, and a basket drawn
// across a number is a number that cannot be read. So the icon gives way upward, toward the name:
// a picture with its top row against a letter is still a picture, and the name has already had its
// two lines.
function cellIconY(r, nameLines) {
  const underName = r.y + 3 + Math.min(nameLines, 2) * 9;
  const clearOfPrice = r.y + r.h - SHOP_PRICE_UP - 1 - SHOP_ICON;
  return Math.min(Math.max(r.y + r.h - 35, underName), Math.max(clearOfPrice, r.y + 3));
}

// One lookup, and nothing under it. Every one of the eighteen purchases now resolves to a sprite:
// the eight on the build page from 15d, the six attractions from 15f and the four consumables from
// 15g, the last two merging themselves into SHOP_ICON_SPRITES at load so this stays a single map.
//
// The 16x16 primitive chain that used to follow - ten branches and the SHOP_ICON_ART inset that
// centred them in the 20 px box - is deleted rather than kept as a fallback. It became unreachable
// the moment the last two maps merged in, and unreachable code in a submission that is judged as
// readable source is worse than no code. An id that matches nothing now draws nothing, which is a
// blank cell nobody would notice in a screenshot - so tools/check.mjs reads all three maps and
// fails the build instead.
//
// Each icon is the thing itself rather than a symbol for it - a pie, a sprig, a poster - which is
// the rule the placeholders were drawn to and the rule the pack kept.
function drawShopIcon(ctx, id, x, y) {
  const spr = SHOP_ICON_SPRITES[id];
  if (spr) drawSprite(ctx, spr, x, y);
}

// The name gets the full width of the cell and up to two lines; the icon and the effect line sit
// under it, and price and level share the bottom row. The first version put the name beside the
// icon, which left 71 px for strings like "Lavender Scream Dampener" - three lines in a box with
// room for two, so the item lost the last word of its own name.
function renderShopCell(ctx, i) {
  const item = SHOP_ITEMS[i];
  const r = shopCellRect(i);
  const level = upgradeLevel(item.id);
  const maxed = itemMaxed(item);
  const price = itemPrice(item);
  // An item that would do nothing right now prices itself as unaffordable, because that is what
  // it is: the Credits are there, but the purchase is not.
  const buyable = state.credits >= price && !itemIdle(item);

  const flash = state.shopFlash.index === i && state.shopFlash.t > 0;
  fillRect(ctx, r.x, r.y, r.w, r.h, C.hudBg);
  strokeRect(ctx, r.x, r.y, r.w, r.h, flash ? (state.shopFlash.ok ? C.good : C.suspicion) : C.panel);

  const lines = wrapText(item.name, r.w - 10, 1);
  for (let n = 0; n < lines.length && n < 2; n++) {
    drawText(ctx, lines[n], r.x + 5, r.y + 3 + n * 9, maxed ? C.inkDim : C.ink, 1);
  }

  const iconY = cellIconY(r, lines.length);
  drawShopIcon(ctx, item.id, r.x + SHOP_ICON_X, iconY);
  // One line of effect, or two when the item charges for itself in a meter rather than in Credits.
  // The cost line is red and sits directly under the gain, so the trade is one glance rather than
  // a thing the player finds out about on the day after the purchase.
  const tx = r.x + SHOP_ICON_X + SHOP_ICON + SHOP_TEXT_GAP;
  if (item.cost) {
    // Red only when the second line opens with a plus, which is what makes it a cost. A
    // consumable's second line is usually a duration, and a duration printed in the alarm colour
    // would read as a threat.
    drawText(ctx, item.effect, tx, iconY + 1, C.inkDim, 1);
    drawText(ctx, item.cost, tx, iconY + 10, item.cost.charAt(0) === '+' ? C.suspicion : C.aura, 1);
  } else {
    drawText(ctx, item.effect, tx, iconY + 6, C.inkFaint, 1);
  }

  // Price on the left, how far along you are on the right. An item you cannot afford is dimmed
  // rather than hidden: the price is the information, and greying it out still shows it.
  if (maxed) drawText(ctx, 'MAX', r.x + 5, r.y + r.h - SHOP_PRICE_UP, C.good, 1);
  else drawText(ctx, price + ' \u25c8', r.x + 5, r.y + r.h - SHOP_PRICE_UP,
                buyable ? C.credits : C.inkFaint, 1);

  // A levelled item counts towards its limit; a consumable has no limit, so it counts what it has
  // cost you so far and says nothing at all until it has cost you something.
  const tag = item.limit ? 'LV ' + level + '/' + item.limit : (level ? 'x ' + level : '');
  if (tag) drawTextRight(ctx, tag, r.x + r.w - 5, r.y + r.h - SHOP_PRICE_UP, C.inkFaint, 1);
}

// The header of the night screen: the memo, and under it one line of news from Earth (GDD 8.2).
// The feed does nothing mechanically and is not required reading. It is there because the arrival
// rate climbing from day four onwards is already in DAYS[] and, unexplained, reads as "the game
// got harder" rather than as the only plot the session has - a comet named on day three, punctual
// on day four, and a Head Office that keeps sending memos about it.
//
// On the last day the header is a title as well: eight is not another row of larger numbers.
function renderNightHeader(ctx, day, y) {
  const cx = VIEW_W / 2;
  if (day >= LAST_DAY) {
    drawTextCentered(ctx, LAST_DAY_TITLE, cx, y - 12, C.suspicion, 1);
  }
  drawTextCentered(ctx, 'MEMO FROM HEAD OFFICE', cx, y, C.inkFaint, 1);
  const memo = wrapText(MEMOS[day - 1], VIEW_W - 24, 1);
  for (let i = 0; i < memo.length && i < 3; i++) {
    drawTextCentered(ctx, memo[i], cx, y + 11 + i * 9, C.credits, 1);
  }
  const feed = wrapText(EARTH_FEED[day - 1], VIEW_W - 24, 1);
  const feedY = y + 11 + Math.min(memo.length, 3) * 9 + 5;
  for (let i = 0; i < feed.length && i < 2; i++) {
    drawTextCentered(ctx, feed[i], cx, feedY + i * 9, C.inkDim, 1);
  }
}

function renderShop(ctx) {
  const p = shopPanelRect();
  const slide = Math.round((1 - easeOut(clamp(state.shopIn, 0, 1))) * p.h);

  ctx.save();
  ctx.translate(0, slide);

  fillRect(ctx, p.x, p.y, p.w, p.h, C.bgDeep);
  fillRect(ctx, p.x, p.y, p.w, 2, C.panel);

  const lay = shopLayout();
  const nextDay = Math.min(state.day + 1, LAST_DAY);
  renderShopTabs(ctx);
  // The memo and the Earth feed stand down while the Associate is introducing a tab: the plate goes
  // where they go, and half a memo behind it reads as a rendering fault rather than as a memo.
  if (!tutorialOnShop()) renderNightHeader(ctx, nextDay, lay.memoY);

  if (currentShopPage() === 'staff') {
    renderStaffRow(ctx);
    for (let i = 0; i < state.staff.offer.length; i++) renderStaffCell(ctx, i);
  } else {
    for (const i of shopPageItems(currentShopPage())) renderShopCell(ctx, i);
  }

  drawButton(ctx, startDayButtonRect(), 'START DAY ' + nextDay);
  ctx.restore();
}

// --- The audit (GDD 11) -------------------------------------------------------
// Three seconds between the meter filling and the numbers. An ending that cuts straight to a
// statistics table reads as a crash rather than as a consequence, and this is the one moment the
// game gets to be theatrical. A beam widens out of the top of the screen, then the set folds shut
// from both edges - all of it drawn over the scene, so nothing in the cached cloud layers has to
// know that the game is ending.
function renderAudit(ctx) {
  const h = Display.viewH;
  const t = 1 - clamp(state.auditTime / AUDIT_TIME, 0, 1);

  // The beam starts under the HUD, not at the top of the canvas: the meter that just filled is
  // the caption for the whole scene, and washing it out would take the explanation away.
  const beam = clamp(t / 0.6, 0, 1);
  const w = Math.round(lerp(12, VIEW_W, easeOut(beam)));
  const beamTop = Display.zones.heaven.y;
  ctx.globalAlpha = 0.12 + 0.55 * beam;
  fillRect(ctx, Math.floor((VIEW_W - w) / 2), beamTop, w, Display.zones.ground.y - beamTop, C.ink);
  ctx.globalAlpha = 1;

  const fold = clamp((t - 0.45) / 0.55, 0, 1);
  const band = Math.ceil(h / 2 * easeOut(fold));
  if (band > 0) {
    fillRect(ctx, 0, 0, VIEW_W, band, C.bgDeep);
    fillRect(ctx, 0, h - band, VIEW_W, band, C.bgDeep);
    fillRect(ctx, 0, band - 1, VIEW_W, 1, C.inkFaint);
    fillRect(ctx, 0, h - band, VIEW_W, 1, C.inkFaint);
  }
}

// --- End screens (GDD 11) -----------------------------------------------------
// Win and both losses are the same screen with different words: the run is over and here is what
// it amounted to. "Guests walked out" is on all three because it is the one number that explains
// a loss, and on a win it is the score the player wants to see at zero.
function renderEndScreen(ctx, text, accent) {
  dim(ctx, 0.9);
  const cx = VIEW_W / 2;
  const top = Math.floor(Display.viewH * 0.22);
  drawTextCentered(ctx, text.title, cx, top, accent, 2);

  const lines = wrapText(text.line, VIEW_W - 28, 1);
  for (let i = 0; i < lines.length; i++) {
    drawTextCentered(ctx, lines[i], cx, top + 26 + i * 10, C.inkDim, 1);
  }

  const rows = [
    ['Days survived', String(state.stats.daysSurvived)],
    ['Souls processed', String(state.stats.soulsProcessed)],
    ['Aura generated', String(Math.floor(state.stats.auraTotal))],
    ['Credits earned', String(Math.floor(state.stats.creditsTotal))],
    ['Souls filed below', String(state.stats.processed)],
    ['Guests walked out', String(state.stats.riots)]
  ];

  // The statistics sit on their own plate rather than straight on the dimmed scene. The tower is
  // still visible behind this screen on purpose, but a column of numbers laid over contract rings
  // and question marks is the one place where that atmosphere costs more than it gives.
  // The verdict, over the numbers it was read out of (GDD 11). It is the second half of the same
  // idea as the Associate's last word: nothing branches, the run was simply being counted, and the
  // title is what those counts add up to. A run that filed most of paradise into the basement is
  // told so by name.
  const verdict = runVerdict();
  // Wrapped, not printed: the first pass set the line straight and "Almost nobody was turned away
  // at the door" ran off both edges of a 216 px screen. Everything else on this screen is wrapped
  // for the same reason, and a title read off the run is no place to start making exceptions.
  const vlines = wrapText(verdict.line, VIEW_W - 28, 1);
  const statTop = top + 26 + lines.length * 10 + 24 + vlines.length * 10;
  drawTextCentered(ctx, verdict.title, VIEW_W / 2, statTop - 20 - vlines.length * 10, C.credits, 1);
  for (let i = 0; i < vlines.length; i++) {
    drawTextCentered(ctx, vlines[i], VIEW_W / 2, statTop - 10 - (vlines.length - i) * 10, C.inkFaint, 1);
  }

  const boxH = rows.length * 11 + 9;
  fillRect(ctx, 20, statTop - 6, VIEW_W - 40, boxH, C.hudBg);
  strokeRect(ctx, 20, statTop - 6, VIEW_W - 40, boxH, C.panel);

  for (let i = 0; i < rows.length; i++) {
    const y = statTop + i * 11;
    drawText(ctx, rows[i][0], 28, y, C.inkFaint, 1);
    drawTextRight(ctx, rows[i][1], VIEW_W - 28, y, C.ink, 1);
  }

  // The Associate has the last word, and it is a different one for each of the three endings
  // (GDD 8.4). That is the whole of "this ending was written for your run": `state.loseReason`
  // already knew which way it went wrong, and nothing in the game had ever said so out loud.
  renderSpeakerPlate(ctx, playAgainButtonRect().y - SPEAKER.h - 10, text.host, accent, false,
                     state.endTime);

  drawButton(ctx, playAgainButtonRect(), 'PLAY AGAIN');
}

function renderWin(ctx) {
  renderEndScreen(ctx, WIN_TEXT, C.ink);
}

function renderLose(ctx) {
  renderEndScreen(ctx, LOSE_TEXT[state.loseReason], C.suspicion);
}

// Drawn with its own scale transform on a full-viewport canvas, so it stays readable exactly
// when the game itself would not be. Everything below is laid out inside NOTICE_W x NOTICE_H.
function renderRotateNotice(ctx) {
  const k = Display.noticeScale;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.bgDeep;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.setTransform(k, 0, 0, k,
    Math.floor((canvas.width - NOTICE_W * k) / 2),
    Math.floor((canvas.height - NOTICE_H * k) / 2));

  const cx = NOTICE_W / 2;

  // A sideways phone, an arrow, an upright phone. Two silhouettes and a direction, which needs
  // no glyph that could be mistaken for anything else at this size.
  const left = cx - 34;
  strokeRect(ctx, left, 12, 34, 20, C.inkFaint);
  fillRect(ctx, left + 2, 21, 1, 4, C.inkFaint);
  drawText(ctx, '→', left + 38, 16, C.credits, 1);
  strokeRect(ctx, left + 48, 5, 20, 34, C.ink);
  fillRect(ctx, left + 55, 8, 6, 1, C.ink);
  fillRect(ctx, left + 56, 35, 4, 1, C.ink);

  drawTextCentered(ctx, ROTATE_NOTICE[0], cx, 48, C.ink, 1);
  drawTextCentered(ctx, ROTATE_NOTICE[1], cx, 58, C.ink, 1);
  drawTextCentered(ctx, ROTATE_NOTICE[2], cx, 70, C.inkFaint, 1);
  drawTextCentered(ctx, ROTATE_NOTICE[3], cx, 78, C.inkFaint, 1);
}

// --- The alarm vignette (GDD 10) ----------------------------------------------
// Red creeping in from the edges once the meter is in the red. Nested one-pixel frames with falling
// alpha rather than a radial gradient: a gradient bands under an integer upscale, and steps are
// what the rest of the game is drawn with anyway. It pulses in time with the Suspicion bar - one
// alarm, reported twice, so it can be caught in peripheral vision while reading a card.
function renderVignette(ctx) {
  if (state.suspicion < SUSP_ALARM) return;
  const depth = clamp((state.suspicion - SUSP_ALARM) / (SUSP_MAX - SUSP_ALARM), 0, 1);
  const pulse = 0.55 + 0.45 * Math.sin(Fx.time * Math.PI * 2 * SUSP_ALARM_PULSE);
  const peak = VIGNETTE_ALPHA * (0.4 + 0.6 * depth) * pulse;
  const h = Display.viewH;

  ctx.fillStyle = C.suspicion;
  for (let k = 0; k < VIGNETTE_W; k++) {
    const f = 1 - k / VIGNETTE_W;
    ctx.globalAlpha = peak * f * f;
    ctx.fillRect(k, k, VIEW_W - k * 2, 1);
    ctx.fillRect(k, h - 1 - k, VIEW_W - k * 2, 1);
    ctx.fillRect(k, k, 1, h - k * 2);
    ctx.fillRect(VIEW_W - 1 - k, k, 1, h - k * 2);
  }
  ctx.globalAlpha = 1;
}

function renderDebug(ctx, fps) {
  const line = 'x' + Display.scale + ' ' + VIEW_W + 'x' + Display.viewH + ' ' + fps + 'fps';
  drawTextRight(ctx, line, VIEW_W - 2, Display.viewH - 10, C.inkFaint, 1);
}

function renderUI(ctx) {
  // The work zone keeps drawing over the end-of-day plate so a swipe made on the last second of
  // the day finishes its animation instead of vanishing.
  if (state.screen === SCREEN.DAY_ACTIVE || state.screen === SCREEN.DAY_END ||
      state.screen === SCREEN.AUDIT) {
    renderPopups(ctx);      // over the scene, under the HUD: they float off guests inside the cloud
    renderWorkZone(ctx);
  }
  // The HUD stays up through the audit: the meter that just filled is the explanation for what is
  // happening on screen, and hiding it would make the beam arbitrary.
  if (state.screen !== SCREEN.TITLE && state.screen !== SCREEN.WIN && state.screen !== SCREEN.LOSE) {
    renderHud(ctx);
  }
  // The banner is scene furniture rather than HUD - it reports something happening in the lounge -
  // but it is drawn here so a holding onboarding beat can dim it along with everything else.
  if (state.screen === SCREEN.DAY_ACTIVE) renderSupplyBanner(ctx);

  // Over the scene and the HUD, under the vignette: a holding beat dims everything behind itself,
  // and the alarm border is the one thing that still has to be visible through that.
  if (state.screen === SCREEN.DAY_ACTIVE) renderTutorial(ctx);

  if (state.screen === SCREEN.TITLE) renderTitle(ctx);
  if (state.screen === SCREEN.DAY_END) renderDayEndPlate(ctx);
  if (state.screen === SCREEN.NIGHT_CARD) renderNight(ctx);
  if (state.screen === SCREEN.SHOP) renderShop(ctx);
  // Outside renderShop's slide transform: the beat only fires once the panel has settled, and a
  // plate that rode the panel up would arrive from off screen after the thing it explains.
  if (state.screen === SCREEN.SHOP && tutorialOnShop()) renderTutorial(ctx, shopPlateY());
  if (state.screen === SCREEN.AUDIT) renderAudit(ctx);
  if (state.screen === SCREEN.LOSE) renderLose(ctx);
  if (state.screen === SCREEN.WIN) renderWin(ctx);

  // Over everything, including the HUD it is warning about, but never on the title or the end
  // screens: those have their own colour, and a red border around a statistics table is decoration
  // rather than a signal.
  if (state.screen === SCREEN.DAY_ACTIVE || state.screen === SCREEN.DAY_END ||
      state.screen === SCREEN.NIGHT_CARD || state.screen === SCREEN.SHOP ||
      state.screen === SCREEN.AUDIT) {
    renderVignette(ctx);
  }

  // Last of all, so nothing tints it: the title and the end screens dim the whole canvas, and a
  // greyed-out mute button on the screen where the defeat theme is playing is the wrong answer.
  if (soundButtonVisible()) drawSoundIcon(ctx, soundButtonRect(), soundEnabled());
}

// ==========================================================================
// 18_render_card.js
// ==========================================================================

// The work zone: the soul card, the swipe affordances around it, the FULL refusal and the filed
// cards flying to their slots (GDD 5.3, 12.2). Build step 2.

let cardLayer = null;      // the card is drawn here first, then blitted with a shear, see blitTilted

// Card geometry. Most of it is no longer here: the blank in 15e_art_card.js owns the portrait well
// and the ten pip sockets and reports both in its own def, so the layout moves when the art is
// re-cut rather than when somebody remembers to update a constant.
//
// What is left is the three places the blank leaves clear for printing, measured off its grid: the
// band over the rule to the right of the portrait, the strip after each coloured marker where a
// stat is named, and the shaded footer. The first version of this card ran the name across the full
// width above everything, because a 32 px portrait beside it left 134 px and the longest archetype
// needs 140. The blank buys the name 150 by putting its rule under it instead of over it.
const CARD_WELL = { w: 32, h: 40 };      // the portrait well the blank cuts, at SPR_SOUL_CARD.portrait
const CARD_NAME = { x: 44, y: 14 };
const CARD_STAT_X = 50;                  // after the coloured marker, where the leader dots begin
// x clears the tick the blank prints in the footer at column 5: at 10 the arrow sat right against
// it and the pair read as a minus sign in front of a positive number.
const CARD_WORTH = { x: 16, y: 60, right: 190 };

// The photograph on the personnel file, and the reason this card stopped reading as a row in a
// table (GDD 12.5). The same figure that stands in the lounge, and now at full length: the well the
// blank cuts is 32x40 and a soul is 22x38, so the whole person fits in it and the waist crop the
// old plate needed is gone.
//
// The well is filled dark before the figure goes in. The blank leaves it paper-white and half the
// roster carries something pale - a white toque, a light coat - which on paper would leave the
// figure nothing to be light against. Filled with the Operations back wall it also matches the
// plate the Associate's portrait has baked into it, so a guest and the host read as the same kind
// of object on the same kind of card.
function drawSoulPortrait(g, soul) {
  const spr = soulSprite(soul);
  const wx = SPR_SOUL_CARD.portrait[0], wy = SPR_SOUL_CARD.portrait[1];
  fillRect(g, wx, wy, CARD_WELL.w, CARD_WELL.h, C.opsBg);
  if (spr) drawSprite(g, spr, wx + (CARD_WELL.w - GUEST.w) / 2, wy + (CARD_WELL.h - GUEST.h) / 2);
}

// The screen rect of one stat row, marker through the last pip, for the onboarding beat that points
// at it (GDD 8.4). Read off the blank's own pip grid rather than written down as a box: the rows
// have already moved once when the card was re-cut, and a copied constant would have gone on
// pointing confidently at the wrong number.
//
// x starts two pixels left of the coloured marker at column 44 and the width runs to two past the
// fifth socket, so the row is framed as the player reads it - marker, name, dots, pips - and the
// vertical rule beside the portrait stays outside the hole. It follows the card's drag offset and
// its arrival rise for the same reason everything else in this file does: the docket is a physical
// object on a desk, and a highlight nailed to the rest position would slide off it.
const CARD_STAT_FOCUS = { x: 42, pad: 2, right: 2 };

function cardStatRect(row) {
  const card = state.card;
  if (!card) return null;
  const rest = cardRect();
  const pips = SPR_SOUL_CARD.pips;
  const rise = Math.round((1 - easeOut(card.in)) * 24);
  return {
    x: Math.round(rest.x + card.ox) + CARD_STAT_FOCUS.x,
    y: Math.round(rest.y + card.oy + rise) + pips.rows[row] - CARD_STAT_FOCUS.pad,
    w: pips.x + (STAT_MAX - 1) * pips.step + pips.size + CARD_STAT_FOCUS.right - CARD_STAT_FOCUS.x,
    h: pips.size + CARD_STAT_FOCUS.pad * 2
  };
}

// A stat is five sockets and the blank has already printed the empty ones, so filling one means
// painting the inside of a socket that is already on the paper. Nothing here draws an outline: an
// empty pip is a hole in the form, not a box somebody drew.
function drawPips(ctx, y, value, color) {
  const pips = SPR_SOUL_CARD.pips;
  for (let i = 0; i < value; i++) {
    fillRect(ctx, pips.x + i * pips.step + 1, y + 1, pips.size - 2, pips.size - 2, color);
  }
}

// The card is a pale docket on a dark desk: the contrast runs the other way to the rest of the
// screen, which is what makes the work zone read as a separate surface rather than as more scene.
function paintCard(g, soul) {
  drawSprite(g, SPR_SOUL_CARD, 0, 0);

  drawText(g, soul.name, CARD_NAME.x, CARD_NAME.y, C.inkText, 1);
  drawSoulPortrait(g, soul);

  // Green row first, red row second, because that is the order the blank prints its two markers in
  // and the marker is what carries the good/bad reading before a word has been read.

  const pips = SPR_SOUL_CARD.pips;
  drawText(g, STAT_LABEL.s, CARD_STAT_X, pips.rows[0], C.inkText, 1);
  drawPips(g, pips.rows[0], soul.s, C.good);
  drawText(g, STAT_LABEL.k, CARD_STAT_X, pips.rows[1], C.inkText, 1);
  drawPips(g, pips.rows[1], soulSkepticism(soul), C.suspicion);


  // What this particular soul is worth, in each direction, before the player has to decide. The
