function simFreeHeaven() {
  return firstFreeSlot(state.heavenSlots) >= 0;
}

function simFreeDesks() {
  return freeSlotCount(state.cubicles);
}

// What a scripted player treats as worth a suite. Two pips of Sanctity is where the roster splits
// into souls that pay for a lounge slot and souls that are only filling one: it takes in 37% of the
// pool by weight, which is about what `g >= 3` took in before the flip, so the styles are as picky
// as they were and the comparison across the change is honest.
const SIM_WORTH_S = 2;

// And what it treats as worth a DESK, which is a bar that could not exist before 2 September because
// every soul paid the same rate there. Three pips of Gullibility is the soul that pays more at a
// desk than the flat rate used to pay everybody (1.7/s against 1.5), so the bar is read off the
// change itself rather than picked: below it a desk is worth less than it was worth yesterday.
const SIM_WORTH_G = 3;

// Where this soul goes. The rule the policies share: Skepticism is only charged upstairs, so a
// doubter at a desk is free, and a soul with no Sanctity earns nothing in the lounge. Since the flip
// those are usually NOT the same soul - the roster's holy are also its doubters - so a suite is a
// trade rather than a filter, which is the whole reason the flip was made.
function simDecide(p, soul) {
  const desks = simFreeDesks();
  const lounge = simFreeHeaven();
  const useDesk = desks > (p.deskBuffer || 0);
  const k = soulSkepticism(soul);

  // The sorter: the lounge for Sanctity, a desk for Gullibility, the door for anything that reads
  // low on both. Unlike the cherry lines it refuses on a pair of tests rather than one, so it is
  // the style that most directly asks whether the new desk rate has made a filter out of the card.
  if (p.sortFrom && state.day >= p.sortFrom) {
    if (soul.s >= p.sortS && lounge) return 'up';
    if (soul.g >= p.sortG && useDesk) return 'down';
    if (soul.s >= p.sortS && useDesk) return 'down';
    if (soul.g >= p.sortG && lounge) return 'up';
    return 'left';
  }
  // Cherry-picking, on whichever axis the style believes in. `cherryS` keeps only the earners and
  // pays the meter for them; `cherryG` keeps only the souls that are cheap on the meter and earns
  // very little. Before the flip those two were the same filter, which is exactly the defect the
  // flip removes: both are kept so the sweep measures both.
  if (p.cherryFrom && state.day >= p.cherryFrom) {
    const keep = p.cherryS ? soul.s >= p.cherryS : soul.g >= p.cherryG;
    return (keep && lounge) ? 'up' : 'left';
  }
  // Never refuse anybody there is room for. A soul that earns nothing upstairs AND costs the meter
  // there prefers a desk, but it goes upstairs rather than out of the door if there is no desk.
  if (p.placeAll) {
    if (soul.s < SIM_WORTH_S && k > SUSP_SKEPTIC_FREE) {
      if (useDesk) return 'down';
      if (lounge) return 'up';
      return 'left';
    }
    if (lounge) return 'up';
    if (useDesk) return 'down';
    return 'left';
  }
  // A floor on what is worth a suite, without the deny-everything of the rule above: below it the
  // soul still has somewhere useful to be.
  if (p.minS && soul.s < p.minS) return useDesk ? 'down' : (lounge ? 'up' : 'left');

  if (p.creditsFirst && state.day <= p.creditsFirst && desks > 0) return 'down';
  // The earners go up first and are worth their pips on the meter. Everything below the bar is
  // sorted by what it EARNS at a desk, which is the rule that changed on 2 September: the old line
  // sent doubters down because Skepticism is only charged upstairs, and a doubter is now the soul
  // that earns least downstairs. Reading the desk's own rate instead is not a new strategy, it is
  // the same sentence - "put the soul where it is worth something" - applied to a floor that has a
  // worth to read. A style left on the old rule would have been measured filling its desks with the
  // cheapest workers in the building and reporting the change as a loss.
  if (soul.s >= SIM_WORTH_S) return lounge ? 'up' : (useDesk ? 'down' : 'left');
  if (p.auraOnly) return lounge ? 'up' : (desks > 0 ? 'down' : 'left');
  if (soul.g >= SIM_WORTH_G) return useDesk ? 'down' : (lounge ? 'up' : 'left');
  // Worth little in either place: a suite while it is cheap on the meter, a desk for the small
  // money rather than the price of refusing with room to spare, and the door only when both are
  // shut.
  if (lounge && k <= SUSP_SKEPTIC_FREE) return 'up';
  if (useDesk) return 'down';
  if (lounge) return 'up';
  return 'left';
}


// One tick of the player. Everything it calls is a function the real input layer calls too.
//
// A new screen has to be taught here in the same commit that adds it: this loop runs until WIN or
// LOSE, and a screen it cannot leave does not crash the run - it rides quietly to
// `outcome: 'timeout'`, so the numbers keep arriving and keep being wrong. The day-one hold (GDD 2)
// is the same hazard in miniature: nothing advances until the first swipe, and the only reason this
// scripted player still gets past it is that the held day keeps updating the card, so `card.age`
// grows and the reaction below fires on its own.
// The repair hold (GDD 6.5), modelled as what it costs rather than as what it pays: one thumb,
// busy for SERVICE_HOLD seconds, during which nothing else on this screen happens. That is the
// whole price of the mechanic, so a harness that gave the slot back without spending the seconds
// would be measuring a different game - the card on the desk ages out of its snap bonus under a
// hold, the queue keeps arriving, and an expiry downstairs waits.
//
// The change from the concierge is not in this code, it is in what `simRepairTarget` finds. The
// concierge always had a target, so every style held constantly and the price was paid in a quiet
// moment of the style's own choosing. A wreck only exists after this style has already lost a guest
// to a riot, which is to say the harness now pays for the hold at the worst moment rather than the
// best one - and that IS the mechanic, so the measurement is finally of the thing itself.
//
// A style takes a hold only when the desk is not asking for a decision, which is what a player who
// is keeping up would do: the card must have SERVICE_HOLD left before it is due, so the hold
// finishes before the soul does. A style that is drowning therefore repairs late, which is correct.
function simRepairTarget() {
  const count = visibleSlotCount(state.heavenSlots);
  for (let i = 0; i < count; i++) {
    if (state.heavenSlots[i].wrecked) return i;
  }
  return -1;
}

function simService(p, clock) {
  if (!p.service) return false;
  const card = state.card;
  if (card && card.in >= 1 && card.age >= p.reaction - SERVICE_HOLD) return false;
  const i = simRepairTarget();
  if (i < 0) return false;
  clock.busy = SERVICE_HOLD;
  clock.serveSlot = i;
  return true;
}


function simPlay(p, clock) {
  if (state.screen === SCREEN.DAY_ACTIVE) {
    // An onboarding beat that holds the day (GDD 8.4) stops the world until something taps it away,
    // and this loop is the something. Without it the run does not crash - it rides quietly to
    // `outcome: 'timeout'`, which is the failure mode the standing rule in GDD 13.0 is about.
    if (tutorialHolding()) { tutorialDismiss(); return; }

    // A hold in progress owns the thumb. It is checked before everything below, and the slot is
    // re-tested on completion for the same reason the game re-tests it: what was under the finger
    // when it came down need not still be there.
    if (clock.busy > 0) {
      clock.busy -= SIM_DT;
      if (clock.busy > 0) return;
      const slot = state.heavenSlots[clock.serveSlot];
      if (slot && slot.wrecked) serveGuest(clock.serveSlot);
      return;
    }


    const card = state.card;
    if (card && card.in >= 1 && card.age >= p.reaction) {
      handleCardSwipe(simDecide(p, card.soul));
    }
    simSupplies(p);
    // One tap at a time, on a human cadence: a bot that relocates every expired guest in the same
    // frame is not a player, it is the Express Elevator.
    if (clock.relocateAt <= 0 && simFreeDesks() > 0) {
      for (let i = 0; i < state.heavenSlots.length; i++) {
        const guest = state.heavenSlots[i].guest;
        if (guest && guest.expired) { relocateGuest(i); clock.relocateAt = p.relocate; return; }
      }
    }
    // Last, because it is the only thing here a player would put down to do something else.
    simService(p, clock);
    return;
  }

  // The night contract (GDD 8.3), taught here in the same commit that adds it: a screen this loop
  // cannot leave does not crash the run, it rides quietly to `outcome: 'timeout'` and keeps
  // reporting numbers that are wrong. Three policies sign everything and one signs nothing, which
  // is the pair of extremes the balance has to survive rather than an average of them.
  if (state.screen === SCREEN.NIGHT_CARD && state.night.in >= 1) {
    if (state.night.choice < 0) answerPact(!!p.pacts);
    else openShop();
    return;
  }

  if (state.screen === SCREEN.SHOP && state.shopIn >= 1) {
    simShop(p);
    startDay(state.day + 1);
  }
}

// Spending a consumable, which is the only decision this game has that is taken DURING a day
// (GDD 9.1). Three rules, in the order a player would think of them: cover the meter when it is
// about to become the problem, rush the desks when there is an expiry with nowhere to go, and
// terminate a suite when even that has not opened one.
function simSupplies(p) {
  if (supplyBusy()) return;
  const stuck = expiredGuestCount() > 0 && simFreeDesks() === 0;
  for (let i = 0; i < state.supplies.length; i++) {
    const id = state.supplies[i];
    if (!id) continue;
    if (id === 'choir' && state.suspicion >= (p.coverAt || 58)) { useSupply(i); return; }
    if (id === 'rush' && stuck) { useSupply(i); return; }
    if (id === 'shuttle' && state.queue.length >= QUEUE_MAX - 1) { useSupply(i); return; }
    if (id === 'terminate' && stuck) {
      useSupply(i);
      // The armed state needs the second gesture the player would make: pick the expired guest,
      // which is the one the deadlock is about.
      for (let k = 0; k < state.heavenSlots.length; k++) {
        const guest = state.heavenSlots[k].guest;
        if (guest && guest.expired) { terminateGuest(k); break; }
      }
      return;
    }
  }
}

// Buys down the priority list until nothing on it is affordable. Deliberately greedy rather than
// clever: a policy that saves for two days is a different experiment, and this one is meant to
// answer "is there anything worth buying at all on the day the shop opens".
//
// The one piece of judgement in here is the basket: a player watching the meter climb buys relief
// before they buy growth, and a bot that never does makes the meter look unsurvivable when it is
// merely expensive.
function simShop(p) {
  // The shift associate is hired before anything is bought, because the wage is the reason the
  // credit line still has a decision in it on day seven and a bot that spends its last coin on a
  // cubicle would never test that.
  if (p.staff && !state.staff.hired && state.staff.offer.indexOf(p.staff) >= 0) {
    const card = staffCard(p.staff);
    if (card && state.credits >= card.wage * 2) hireStaff(p.staff);
  }
  let bought = true;
  while (bought) {
    bought = false;
    const base = p.shop.concat(p.supplies || []);
    const order = (p.reliefAt && state.suspicion >= p.reliefAt)
      ? ['basket'].concat(base.filter(id => id !== 'basket'))
      : base;
    for (const id of order) {
      const index = SHOP_ITEMS.findIndex(it => it.id === id);
      const item = SHOP_ITEMS[index];
      if (!item || itemMaxed(item) || itemIdle(item)) continue;
      if (state.credits < itemPrice(item)) continue;
      buyItem(index);
      state.simPurchases.push(state.day + ':' + id);
      bought = true;
    }
  }
}

// --- The run -------------------------------------------------------------------

function simRun(policyName, seed, maxSeconds) {
  const p = SIM_POLICIES[policyName];
  resetGame();
  rngState = (seed >>> 0) || 1;
  state.simPurchases = [];
  startDay(1);

  const clock = { relocateAt: 0, busy: 0, serveSlot: -1 };
  const days = [];
  let reported = 0;
  let before = simSnapshot();
  const steps = Math.round((maxSeconds || 1200) / SIM_DT);

  // Where the meter spends its time, not where it ends the day (GDD 15). The end-of-day value says
  // nothing about whether the player lived in the band the art, the vignette and the hell layer of
  // the soundtrack are written for; only seconds do. Counted over active play, so the shop and the
  // end-of-day plate do not dilute it.
  // `buzz` and `starved` join the band in wave C: the acceptance criteria are about where the
  // meter lives, and after Buzz the answer to "why is it low" is either "the player is holding it
  // down" or "the tower has nobody in it", which are opposite problems with the same reading.
  const band = { active: 0, target: 0, amber: 0, alarm: 0, peak: 0, buzz: 0, starved: 0 };

  for (let i = 0; i < steps; i++) {
    simPlay(p, clock);
    if (clock.relocateAt > 0) clock.relocateAt -= SIM_DT;
    update(SIM_DT);

    if (state.screen === SCREEN.DAY_ACTIVE && !state.dayHold) {
      const v = state.suspicion;
      band.active += SIM_DT;
      if (v >= SIM_BAND_LO && v < SIM_BAND_HI) band.target += SIM_DT;
      if (v >= SUSP_AMBER) band.amber += SIM_DT;
      if (v >= SUSP_ALARM) band.alarm += SIM_DT;
      if (v < SUSP_STARVE) band.starved += SIM_DT;
      if (v > band.peak) band.peak = v;
      band.buzz += state.buzz * SIM_DT;
    }

    // The settlement has already happened by the time the plate is up, so that is where a day is
    // read off. The plate stands for a couple of seconds, hence the guard.
    if (state.screen === SCREEN.DAY_END && reported < state.day) {
      days.push(simDayReport(before));
      reported = state.day;
      before = simSnapshot();
    }
    if (state.screen === SCREEN.LOSE || state.screen === SCREEN.WIN) break;
  }

  // A run that ended in the middle of a day - an audit - still has that day worth reporting.
  if (reported < state.day) days.push(simDayReport(before, true));

  return {
    policy: policyName,
    seed: seed,
    outcome: state.screen === SCREEN.WIN ? 'win'
      : (state.screen === SCREEN.LOSE || state.screen === SCREEN.AUDIT ? 'lose:' + state.loseReason : 'timeout'),
    lastDay: state.day,
    band: {
      active: Math.round(band.active),
      target: band.active ? band.target / band.active : 0,
      amber: band.active ? band.amber / band.active : 0,
      alarm: band.active ? band.alarm / band.active : 0,
      starved: band.active ? band.starved / band.active : 0,
      buzz: band.active ? Math.round(band.buzz / band.active) : 0,
      peak: Math.round(band.peak)
    },
    reputation: Math.round(state.reputation),
    quotaMisses: state.quotaMisses,
    verdict: runVerdict().title,
    riots: state.stats.riots,
    souls: state.stats.soulsProcessed,
    denied: state.stats.denied,
    turnedAway: state.stats.turnedAway,
    completed: state.stats.completed,
    repaired: state.stats.repaired,
    wrecked: state.heavenSlots.filter(s => s.wrecked).length,

    purchases: state.simPurchases.slice(),
    days: days
  };
}

function simSnapshot() {
  return {
    credits: state.credits,
    riots: state.stats.riots,
    souls: state.stats.soulsProcessed,
    purchases: state.simPurchases.length
  };
}

function simDayReport(before, unfinished) {
  const r = state.dayResult;
  return {
    day: state.day,
    quota: unfinished ? dayQuota(state.day) : r.quota,
    aura: Math.round(unfinished ? state.aura : r.aura),
    met: unfinished ? null : r.state,
    credits: Math.round(state.credits),
    earned: Math.round(state.credits - before.credits),
    suspicion: Math.round(state.suspicion),
    buzz: Math.round(state.buzz),
    rep: Math.round(state.reputation),
    riots: state.stats.riots - before.riots,
    souls: state.stats.soulsProcessed - before.souls,
    queue: state.queue.length,
    bought: state.simPurchases.length - before.purchases,
    slots: unlockedSlotCount(state.heavenSlots) + '/' + unlockedSlotCount(state.cubicles)
  };
}

// --- Staging, for the screenshot harness --------------------------------------
// Everything in the build lives inside one IIFE, so a screenshot tool driving the page over
// DevTools cannot reach a single game function. Rather than open the whole scope to it, this is
// one named door: put the game on a named screen with a stated amount of money and a stated number
// of guests already placed, and let the tool photograph it. Dev-only, like the rest of this file.
function simStage(opts) {
  const o = opts || {};
  resetGame();
  rngState = (o.seed >>> 0) || 20260827;
  startDay(o.day || 1);
  state.dayHold = false;
  if (o.credits != null) state.credits = o.credits;
  if (o.suspicion != null) state.suspicion = o.suspicion;
  if (o.reputation != null) state.reputation = o.reputation;
  for (const id of (o.own || [])) state.upgrades[id] = (state.upgrades[id] || 0) + 1;
  (o.supplies || []).forEach((id, i) => { if (i < SUPPLY_SLOTS) state.supplies[i] = id; });
  for (let i = 0; i < (o.guests || 0); i++) {
    const slot = firstFreeSlot(state.heavenSlots);
    if (slot < 0) break;
    placeGuest(state.heavenSlots, slot, makeSoul(state.day));
  }
  for (let i = 0; i < (o.desks || 0); i++) {
    const slot = firstFreeSlot(state.cubicles);
    if (slot < 0) break;
    placeGuest(state.cubicles, slot, makeSoul(state.day));
  }
  // A staged screenshot is not a run: the onboarding beats would hold the day and cover the thing
  // being photographed, and an effect that has to be shown running cannot be waited for.
  // Wrecks are staged rather than caused, because causing one takes a full contract plus RIOT_DELAY
  // and a screenshot tool cannot wait 86 seconds for a photograph.
  // The slot is unlocked here as well as wrecked. `own: ['suite']` raises the upgrade LEVEL without
  // running the purchase that unlocks a slot, so a staged wreck on an unbought suite would be
  // invisible - which cost half an hour of looking for a missing chevron that was correctly absent.
  for (const i of (o.wrecked || [])) {
    const slot = state.heavenSlots[i];
    if (slot) { slot.unlocked = true; slot.guest = null; slot.wrecked = true; }
  }

  if (o.quiet) { for (const id in TUTORIAL) state.tutorial.seen[id] = true; tutorialDismiss(); }

  if (o.active) { state.supplies[0] = o.active; useSupply(0); }
  if (o.hire) { hireStaff(o.hire); state.staff.note = o.note || ''; }
  state.buzz = buzzTarget();
  // The page is left where openShop() put it unless the caller names one: on the night a tab
  // arrives the panel opens on that tab, and a screenshot that overrode it would photograph the
  // one thing the staged unlock exists to prevent.
  if (o.screen === 'shop') {
    openShop();
    state.shopIn = 1;
    if (o.page !== undefined) state.shopPage = o.page;
  }
  else if (o.screen === 'night') { openNight(); state.night.in = 1; }
  else { takeNextCard(); if (state.card) state.card.in = 1; }
  return state.screen;
}

// The harness in tools/balance.mjs calls this over the DevTools protocol and formats the result.
window.__sim = {
  policies: Object.keys(SIM_POLICIES),
  run: simRun,
  stage: simStage,
  // Three readouts the screenshot tooling needs from outside the bundle: where a suite is in CSS
  // pixels, whether the slot is wrecked, and where the lounge strip has been scrolled to.

  probe: function (i) {
    const r = heavenSlotRect(i || 0);
    const b = canvas.getBoundingClientRect();
    return { x: b.left + (r.x + r.w / 2) * (b.width / VIEW_W),
             y: b.top + (r.y + r.h / 2) * (b.height / Display.viewH) };
  },
  wrecked: function (i) { return !!state.heavenSlots[i].wrecked; },

  scroll: function () { return Math.round(Strip.heaven.scroll); },

  // The ghost hand, from outside the bundle. Everything about it is invisible to a screenshot for
  // most of its 2.4 s loop - the hand is transparent at both ends of the sweep and absent for the
  // gap between two of them - so the only way to check it is to read the clock that drives it.
  // The onboarding gate, from outside the bundle. Every question a harness has about it is a
  // predicate the bundle keeps to itself: whether the plate is the acting kind, whether the day is
  // genuinely stopped behind it, and how far the hold under the finger has got.
  gate: function () {
    const t = state.tutorial;
    return { id: t.id, line: !!t.line, hold: t.hold, acting: tutorialActing(),
             wreck: firstWreckedSlot(), holdSlot: serviceHold.slot,
             holdT: Math.round(serviceHold.t * 100) / 100,
             dayTime: Math.round(state.dayTime * 10) / 10,
             queue: state.queue.length, card: !!state.card,
             scroll: Math.round(Strip.heaven.scroll) };
  },

  hint: function () {
    const h = state.stripHint;
    return { t: Math.round(h.t * 1000) / 1000, plays: h.plays, dir: h.dir,
             learned: h.learned, opened: h.opened, alerted: h.alerted,
             live: stripHintLive(), alpha: Math.round(stripHintAlpha(h) * 100) / 100,
             nudge: Math.round(stripHintNudge(h) * 10) / 10,
             scroll: Math.round(Strip.heaven.scroll * 10) / 10 };
  },


  sweep: function (seeds, policies, maxSeconds) {
    const out = [];
    for (const name of (policies || Object.keys(SIM_POLICIES))) {
      for (const seed of seeds) out.push(simRun(name, seed, maxSeconds));
    }
    return out;
  }
};

})();
</script>
</body>
</html>
