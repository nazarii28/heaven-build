  state.night.in = 0;
  state.night.choice = -1;
  state.night.flash = 0;
  state.pact = neutralPact();

  state.auditTime = 0;
  state.endTime = 0;
  state.loseReason = 'audit';
  state.tutorial.seen = {};
  state.tutorial.queue.length = 0;
  state.tutorial.id = null;
  state.tutorial.line = null;
  state.tutorial.hold = false;
  state.tutorial.t = 0;
  state.tutorial.life = TUTORIAL_LIFE;
  state.stripHint.learned = false;
  state.stripHint.opened = false;
  state.stripHint.alerted = false;
  state.stripHint.plays = 0;
  state.stripHint.t = 0;
  state.stripHint.dir = -1;
  state.stripHint.base = 0;
  resetStrips();
  resetFx();
  resetAudio();

  state.stats = { soulsProcessed: 0, auraTotal: 0, creditsTotal: 0, daysSurvived: 0, riots: 0, processed: 0,
                  denied: 0, toOps: 0, suspPeak: 0, turnedAway: 0, completed: 0, repaired: 0 };
}

// The deck is shuffled on the first night rather than in resetGame, and that is not tidiness: the
// balance harness seeds the generator AFTER resetting the game, so a shuffle done during the reset
// would be drawn from whatever state the previous run left behind and the seed would not reproduce
// the run. Dealt from the top, so no contract is offered twice in one session - eleven cards
// against seven nights is thin enough that a repeat would be noticed.
function shufflePactDeck() {
  const deck = state.night.deck;
  deck.length = 0;
  for (const p of PACTS) deck.push(p.id);
  for (let i = deck.length - 1; i > 0; i--) {
    const j = rngInt(i + 1);
    const t = deck[i]; deck[i] = deck[j]; deck[j] = t;
  }
}

// How many slots are currently visible on a floor: the unlocked ones plus the next locked one,
// which is always shown as an invitation to buy (GDD 3.1).
function unlockedSlotCount(slots) {
  let n = 0;
  for (const s of slots) if (s.unlocked) n++;
  return n;
}

function visibleSlotCount(slots) {
  return Math.min(slots.length, unlockedSlotCount(slots) + 1);
}

function dayConfig(day) {
  return DAYS[clamp(day, 1, LAST_DAY) - 1];
}

// ==========================================================================
// 10_souls.js
// ==========================================================================

// Arrivals, the queue, the soul card and the three sorting swipes (GDD 5). Build step 2.
// This module owns the primary action of the game: every soul that arrives leaves through one of
// exactly three gestures. Resource effects are deliberately absent - the swipes place souls and
// nothing else until step 3 turns Aura and Credits on.

// --- Arrivals -----------------------------------------------------------------

// Weighted draw over the archetype dictionary. Two rules bend the weights: the rarest archetype
// is withheld until the player has learned to read the stats, and from the late days onward the
// dangerous souls get twice their weight, which is what makes the late days feel different without
// adding a single new mechanic.
//
// Dangerous means high SKEPTICISM, and this line had to move with the flip or it would have been
// doing the opposite of its job. It used to double the saints, which under the old axes were the
// expensive souls; now the saints are the earners, and doubling them would have made the late days
// richer instead of harder.
function pickArchetype(day) {
  const pool = [];
  for (const a of ARCHETYPES) if (!a.fromDay || day >= a.fromDay) pool.push(a);
  return pickWeighted(pool, function (a) {
    const late = day >= LATE_DAY && (STAT_MAX - a.g) >= LATE_SKEPTIC;
    return late ? a.weight * 2 : a.weight;
  });
}


// A soul is a flat copy of its archetype, never a reference: from step 3 a soul carries per-soul
// modifiers (the snap bonus) and must not write them back into the dictionary.
function makeSoul(day) {
  const a = pickArchetype(day);
  return { name: a.name, g: a.g, s: a.s, glow: !!a.glow };
}

function arriveSoul() {
  // A full queue turns the arrival away at the door (GDD 5.4), and a soul sent back from the gates
  // of paradise tells people. Cheap per head, but it is a leak that only opens when the player has
  // already lost control of the floor, which is when it is hardest to pay.
  if (state.queue.length >= QUEUE_MAX) {
    state.turnAway = TURN_AWAY_FLASH;
    sfx('turnAway');
    // The Complaints Box (GDD 8.3) takes the talking out of it: they still leave, and the slot is
    // still lost, but nobody upstairs hears about it. Reputation is charged either way - the box
    // stops Head Office hearing about it, not the queue outside (GDD 4.1).
    state.stats.turnedAway++;
    addReputation(-REP_TURN_AWAY);
    if (!state.pact.noOverflow) addSuspicion(SUSP_TURN_AWAY);
    return;
  }
  // The Intern loses one now and then (GDD 9.3), and it happens at the door: a soul the player had
  // already seen standing in the queue vanishing would read as a bug rather than as an Intern.
  if (staffDropsArrival()) return;
  const soul = makeSoul(state.day);
  state.queue.push(soul);
  // The Genuinely Good Person gets announced. It is the rarest archetype in the game and the one
  // whose arrival is a decision rather than a card, so it is worth hearing before it is read.
  sfx(soul.glow ? 'goodPerson' : 'arrive');
}

// --- The card -----------------------------------------------------------------

function takeNextCard() {
  if (state.card || !state.queue.length) return;
  state.card = {
    soul: state.queue.shift(),
    in: 0,            // 0 to 1 while the card rises into the work zone
    age: 0,           // seconds since it finished arriving; the snap bonus reads this at step 3
    ox: 0, oy: 0,     // where the card is drawn relative to its rest position
    dragging: false,
    springX: 0, springY: 0, springT: 0
  };
}

// The whole work zone is the swipe field, not just the card: at 196x72 in a 216 px view there is
// no room to demand precision, and a swipe that starts an inch below the card is the same intent.
function workZoneRect() {
  const z = Display.zones.work;
  return { x: 0, y: z.y, w: VIEW_W, h: z.h };
}

function cardIsLive() {
  return state.screen === SCREEN.DAY_ACTIVE && state.card !== null;
}

// True while the player is dragging the card itself, which is what the renderer needs in order to
// follow the finger. The test is on where the drag STARTED, so a swipe stays owned by the card
// even after the finger has left the work zone.
function draggingCard() {
  return cardIsLive() && Input.drag.active &&
         pointInRect(Input.drag.startX, Input.drag.startY, workZoneRect());
}

// Which way a live drag is currently leaning, or null below the threshold. The renderer lights up
// the matching hint and target zone from this - the player sees the verdict before releasing.
function dragDirection() {
  if (!draggingCard() || state.card.in < 1) return null;
  const dx = Input.drag.dx, dy = Input.drag.dy;
  const adx = Math.abs(dx), ady = Math.abs(dy);
  if (Math.max(adx, ady) < SWIPE_THRESHOLD) return null;
  if (adx > ady) return dx > 0 ? 'right' : 'left';
  return dy > 0 ? 'down' : 'up';
}

// --- Placement ----------------------------------------------------------------

// A slot shut for maintenance (the Renovation contract, GDD 8.3) or wrecked by a riot (GDD 6.5) is
// unlocked and still owned, it just cannot be filled. Checked here and in freeSlotCount, which
// between them are every place in the game that asks whether there is room.

function firstFreeSlot(slots) {
  for (let i = 0; i < slots.length; i++) {
    if (slots[i].unlocked && !slots[i].maint && !slots[i].wrecked && !slots[i].guest) return i;

  }
  return -1;
}

// Past the limit the offset grows at a fraction of the finger movement, so the card never leaves
// the work zone but the gesture still reads as continuous.
function damp(v, limit) {
  const a = Math.abs(v);
  if (a <= limit) return v;
  return (v < 0 ? -1 : 1) * (limit + (a - limit) * 0.2);
}

// A card that has been dealt with flies to where it ended up. The flyer is a copy rather than the
// card itself, so the next soul can be dealt with immediately: at a 1.1 s arrival interval a 0.4 s
// animation sitting in the input path would cap throughput below the arrival rate on its own.
function addFlyer(to, color) {
  const from = cardRect();
  state.flyers.push({
    x0: from.x + state.card.ox, y0: from.y + state.card.oy, w0: from.w, h0: from.h,
    x1: to.x, y1: to.y, w1: to.w, h1: to.h,
    t: 0, dur: FLY_TIME, color: color
  });
}

// One guest record, wherever it is standing. The emit clock starts at a random phase so a row of
// guests does not fire its popups in lockstep, which reads as one flashing block rather than as
// several souls earning. The contract only counts for anything upstairs (GDD 6).
function newGuest(soul) {
  return {
    soul: soul,
    t: 0,
    acc: 0,
    emit: rngRange(0.4, POPUP_EVERY),
    contract: contractTime(),
    contractMax: contractTime(),
    desk: deskTime(),         // only counts down while this guest is at a desk downstairs
    deskMax: deskTime(),      // and the bar above the desk is read against the length it started with
    expired: false,

    riot: 0,
    lift: 0,
    panic: 0,
    nudge: 0
  };
}

function placeGuest(slots, index, soul) {
  slots[index].guest = newGuest(soul);
  state.stats.soulsProcessed++;
}

// Deciding fast is worth a permanent 10% on that soul (GDD 5.5). It is off on day 1: the first day
// is when the player is still reading the card, and charging for that would teach the wrong thing.
// Deny is neutral to it - there is nothing to be faster about when refusing.
function claimSnapBonus(soul) {
  if (state.day < SNAP_FROM_DAY || state.card.age > snapTime()) return;
  soul.bonus = SNAP_BONUS;
  state.snapFlash = SNAP_FLASH;
  sfx('snap');
}

function refuse(zone) {
  const card = state.card;
  card.springX = card.ox;
  card.springY = card.oy;
  card.springT = CARD_SPRING;
  state.fullFlash[zone] = FULL_FLASH;
  addShake(2, 0.18);
  sfx('refused');
}

function springBack() {
  const card = state.card;
  card.springX = card.ox;
  card.springY = card.oy;
  card.springT = CARD_SPRING;
}

function checkIn() {
  const i = firstFreeSlot(state.heavenSlots);
  if (i < 0) { refuse('heaven'); return; }
  const soul = state.card.soul;
  claimSnapBonus(soul);
  addFlyer(heavenSlotRect(i), C.aura);
  placeGuest(state.heavenSlots, i, soul);
  state.card = null;
  // The stamp is cyan because CHECK IN is: the swipe hint, the action label, the popup and the
  // verdict are one colour from finger to slot, and the player never has to learn a second code.
  addStamp('APPROVED', C.aura);
  addShake(3, 0.1);
  haptic(HAPTIC.checkIn);
  sfx('checkIn');
}

function reassign() {
  const i = firstFreeSlot(state.cubicles);
  if (i < 0) { refuse('ops'); return; }
  const soul = state.card.soul;
  claimSnapBonus(soul);
  addFlyer(cubicleRect(i), C.monitor);
  placeGuest(state.cubicles, i, soul);
  state.stats.toOps++;
  state.card = null;
  // Grey: the basement is neither a reward nor a punishment, it is where the paperwork goes.
  addStamp('REASSIGNED', C.inkDim);
  addShake(3, 0.1);
  haptic(HAPTIC.reassign);
  sfx('reassign');
}

// Deny is the one action that is never refused - it is the pressure valve when both floors are
// full. It costs Credits, so the valve has a price and spamming it is not a strategy.
// Whether this refusal had an alternative. The LOUNGE only, and the exclusion of the basement is
// the whole of what makes this price fair. A free desk is very often a deliberate buffer - a place
// to put the next expiry before it becomes a riot - and a competent player keeps one or two empty
// on purpose. Charging them for that would be charging them for planning: measured on 2 September,
// counting desks took the balanced style from 7 wins in 24 to 1, because its two-desk buffer read
// as room on every refusal it ever made. An empty SUITE is not ambiguous. It is the thing the soul
// was refused from, it earns nothing standing empty, and there is no strategy that wants one.
function denyHadRoom() {
  return firstFreeSlot(state.heavenSlots) >= 0;
}


function deny() {
  const from = cardRect();
  addFlyer({ x: -CARD.w, y: from.y + 10, w: CARD.w, h: CARD.h }, C.suspicion);
  const cost = denyHadRoom() ? DENY_COST_ROOM : DENY_COST;
  spendCredits(cost);
  // Turning one away at the door is the cheapest action in the game and now has a second price:
  // word gets back, and tomorrow's queue is shorter for it (GDD 4.1).
  addReputation(-REP_DENY);
  // At the top of the work zone, not just above the card: everything in the band right above the
  // card is already spoken for by the swipe hints, and a cost printed across one of them is noise.
  // The number is printed rather than a fixed string precisely because there are two of them, and
  // which one was charged is the whole of what the player has to learn from this popup.
  addPopup(VIEW_W / 2, Display.zones.work.y + 12, '-' + cost + ' ◈', C.suspicion);

  state.stats.soulsProcessed++;
  state.stats.denied++;
  state.card = null;
  addStamp(pick(DENY_STAMPS), C.suspicion);
  addShake(4, 0.12);
  haptic(HAPTIC.deny);
  sfx('deny');
}

function sortCard(dir) {
  // The first assigned swipe of day one starts the day (GDD 2). Right is not one of them: it is
  // the direction that means nothing, and a stray flick must not start the clock.
  if (dir !== 'right') state.dayHold = false;
  if (dir === 'up') checkIn();
  else if (dir === 'down') reassign();
  else if (dir === 'left') deny();
  else springBack();      // right is deliberately unassigned, so a stray flick costs nothing
}

// Called from the state machine when a swipe lands anywhere in the work zone.
function handleCardSwipe(dir) {
  if (!cardIsLive() || state.card.in < 1) return;
  sortCard(dir);
}

// --- Update -------------------------------------------------------------------

function updateArrivals(dt) {
  state.arrivalTimer -= dt;
  if (state.arrivalTimer <= 0) {
    arriveSoul();
    state.arrivalTimer = arrivalInterval();
  }
}

function updateCard(dt) {
  takeNextCard();
  const card = state.card;
  if (!card) return;

  if (card.in < 1) card.in = Math.min(1, card.in + dt / CARD_IN);
  else card.age += dt;

  // The card follows the finger, damped past CARD_DRAG_MAX; otherwise it is easing back from
  // wherever it was let go.
  const dragging = draggingCard();
  // A drag let go between the tap slop and the swipe threshold queues no gesture at all, so
  // nothing else would ever start its spring and the card would snap home in one frame.
  if (card.dragging && !dragging && card.springT <= 0) springBack();
  card.dragging = dragging;

  if (dragging) {
    card.springT = 0;
    card.ox = damp(Input.drag.dx, CARD_DRAG_MAX);
    card.oy = damp(Input.drag.dy, CARD_DRAG_MAX);
  } else if (card.springT > 0) {
    card.springT = Math.max(0, card.springT - dt);
    const k = card.springT / CARD_SPRING;
    card.ox = card.springX * k * k;
    card.oy = card.springY * k * k;
  } else {
    card.ox = 0;
    card.oy = 0;
  }
}

// Purely visual timers. They keep running while the end-of-day plate is up so an animation started
// on the last second of a day finishes instead of freezing mid-air.
function updateSoulFx(dt) {
  for (let i = state.flyers.length - 1; i >= 0; i--) {
    const f = state.flyers[i];
    f.t += dt / (f.dur || FLY_TIME);
    if (f.t >= 1) state.flyers.splice(i, 1);
  }
  if (state.turnAway > 0) state.turnAway = Math.max(0, state.turnAway - dt);
  for (const k in state.fullFlash) {
    if (state.fullFlash[k] > 0) state.fullFlash[k] = Math.max(0, state.fullFlash[k] - dt);
  }
  for (const s of state.heavenSlots) if (s.guest) s.guest.t += dt;
  for (const s of state.cubicles) if (s.guest) s.guest.t += dt;
  updatePopups(dt);
}

function updateSouls(dt) {
  updateArrivals(dt);
  updateCard(dt);
}

// ==========================================================================
// 11_floors.js
// ==========================================================================

// Guests, contract rings, expiry, the tap-to-relocate elevator and riots (GDD 6). Build step 4.
// This is the mechanism the whole game turns on: a checked-in soul stops being an asset on a
// timer, and the player has to have somewhere to put it before that happens.

function freeSlotCount(slots) {
  let n = 0;
  for (const s of slots) if (s.unlocked && !s.maint && !s.wrecked && !s.guest) n++;

  return n;
}

// The last stretch of a contract pulses, and an expired one is solid red. The player has to read
// "this one is about to go wrong" from across the screen without focusing on any single timer.
function contractState(guest) {
  if (guest.expired) return 'expired';
  if (guest.contract <= CONTRACT_WARN) return 'warning';
  return 'active';
}

// What fraction of its rate a guest in a suite is producing. An expired contract pays nothing -
// that is the real cost of ignoring one, on top of the Suspicion drip for leaving it up there -
// unless the Orchestra is playing, which is the one thing in the game that pays a lapsed guest
// (GDD 9.2). It is a fraction rather than a flag because that is what the attraction sells: half
// of nothing is still nothing, and the multiplication says so without a branch.
function guestOutput(guest) {
  return guest.expired ? attractionSum('lapsed') : 1;
}

function panicFactor(guest) {
  return guest.panic > 0 ? PANIC_FACTOR : 1;
}

// --- Relocation ---------------------------------------------------------------

// The service lift. The guest leaves the lounge slot at once and appears downstairs at once - the
// 0.8 s ride is a travelling outline, the same trick the filed card uses, because a second copy
// of the figure in transit reads as two souls rather than one moving.
function relocateGuest(heavenIndex) {
  const slot = state.heavenSlots[heavenIndex];
  const target = firstFreeSlot(state.cubicles);
  if (target < 0) return false;

  const from = heavenSlotRect(heavenIndex);
  const to = cubicleRect(target);
  state.flyers.push({
    x0: from.x, y0: from.y, w0: from.w, h0: from.h,
    x1: to.x, y1: to.y, w1: to.w, h1: to.h,
    t: 0, dur: ELEVATOR_TIME, color: C.ink
  });

  state.cubicles[target].guest = newGuest(slot.guest.soul);
  state.stats.toOps++;
  // A contract that ran its course and left without a scene is the one thing that builds
  // Reputation (GDD 4.1), and it is banked here rather than at the moment of expiry: a guest who
  // is still standing upstairs has not left quietly yet, and may not.
  if (slot.guest.expired) { state.stats.completed++; addReputation(REP_CONTRACT); }
  slot.guest = null;
  sfx('elevator');
  return true;
}

// A soul that has been processed leaves, and its desk comes back. This is the only thing that
// makes the basement a rate rather than a total: six desks that never empty can absorb six expiries
// in a whole session, and everything after that is a riot by arithmetic.
function dischargeGuest(index) {
  const r = cubicleRect(index);
  addPopup(r.x + r.w / 2, r.y - 2, 'PROCESSED', C.inkDim);
  state.cubicles[index].guest = null;
  state.stats.processed++;
  sfx('processed');
}

// A guest whose contract ran out with no desk free downstairs eventually walks off in disgust.
// The neighbours see it happen and slow down - the loss is never just the one slot.
//
// And it leaves the suite behind it. Before this the riot was a spike: five points of the meter,
// the neighbours slowed for five seconds, and by the eighth second it had never happened. A guest
// who tears the place up on the way out is the one event in the game the player caused by their own
// arithmetic, and the only one whose consequence used to be shorter than the mistake that made it.
// The wreck is what gives it a tail, and the tail is exactly as long as the player leaves it.
function riot(index) {
  state.heavenSlots[index].guest = null;
  state.heavenSlots[index].wrecked = true;

  for (const j of [index - 1, index + 1]) {
    const n = state.heavenSlots[j];
    if (n && n.guest) n.guest.panic = PANIC_TIME;
  }
  state.stats.riots++;
  // The most expensive event in the game, and wave C made it more so: a slot, five points of the
  // meter, and the intake for the days after it.
  addReputation(-REP_RIOT);
  addShake(5, 0.25);
  haptic(HAPTIC.riot);
  // Over the slot that just emptied, not at the top of the zone: that band belongs to the waiting
  // queue, and it marks which slot the player just lost.
  const r = heavenSlotRect(index);
  addPopup(r.x + r.w / 2, r.y - 8, 'WRECKED', C.suspicion, POPUP_LIFE_LONG);

  sfx('riot');
  // Fired from here rather than from a condition: by the time a riot is visible in the state, the
  // guest that caused it has already gone (GDD 8.4).
  tutorialSay('riot');
  // By far the most expensive thing that can happen in a day, and the only one that costs a slot
  // and the meter at the same time.
  addSuspicion(SUSP_RIOT);
}

// --- The strip: scrolling and edge chevrons (GDD 3.1) -------------------------
// Slots grow sideways, so from the first purchase onwards a floor is wider than the screen and
// part of it is out of sight. That is only acceptable because of the rule the chevrons enforce:
// nothing important is allowed to die off-screen quietly.

const stripDrag = { kind: null, start: 0, locked: false, dead: false, was: false };

function scrollStripTo(kind, value) {
  const s = Strip[kind];
  s.from = s.scroll;
  s.to = clamp(value, stripMinScroll(kind), 0);
  s.t = 0;
}

// Brings one slot to the middle of the screen. Centring rather than nudging it just past the
// margin: a chevron tap is a request to look at something, and a guest pinned to the edge it was
// hiding behind still reads as off-screen.
function scrollStripToSlot(kind, i) {
  const size = stripSize(kind);
  scrollStripTo(kind, VIEW_W / 2 - (stripOrigin(kind) + i * (size.w + size.gap) + size.w / 2));
}

function resetStrips() {
  for (const kind of ['heaven', 'ops']) {
    const s = Strip[kind];
    s.scroll = 0;
    s.from = 0;
    s.to = 0;
    s.t = 1;
  }
  stripDrag.kind = null;
  stripDrag.was = false;
}

// Which floor a pointer landed on. The lounge owns everything down to the top of the operations
// zone, because its slots hang off the ground line and the underlight below them is still cloud.
function stripAt(y) {
  const z = Display.zones;
  if (y >= z.heaven.y && y < z.ops.y) return 'heaven';
  if (y >= z.ops.y && y < z.work.y) return 'ops';
  return null;
}

// Dragging a floor is a live gesture, not a recognised one: the strip has to follow the finger, so
// this reads Input.drag directly instead of waiting for the release. The axis is committed once,
// after a few pixels of travel - without that, a vertical swipe that starts over a floor drags the
// strip sideways on its way past.
function updateStripDrag() {
  const d = Input.drag;
  if (!d.active) { stripDrag.kind = null; stripDrag.was = false; return; }

  if (!stripDrag.was) {
    stripDrag.was = true;
    stripDrag.kind = stripAt(d.startY);
    stripDrag.locked = false;
    stripDrag.dead = false;
    if (stripDrag.kind) stripDrag.start = Strip[stripDrag.kind].scroll;
  }
  const kind = stripDrag.kind;
  if (!kind || stripDrag.dead) return;

  if (!stripDrag.locked) {
    if (Math.max(Math.abs(d.dx), Math.abs(d.dy)) < SCROLL_AXIS_LOCK) return;
    stripDrag.locked = true;
    stripDrag.dead = Math.abs(d.dx) <= Math.abs(d.dy);
    if (stripDrag.dead) return;
    // The ghost hand's off switch, and the only one it has. It fires here rather than off a
    // scroll, so a drag on the operations floor - which does not scroll at all until a desk is
    // bought - counts: what the hint teaches is the gesture, not the result of it.
    state.stripHint.learned = true;
    state.stripHint.plays = 0;
  }

  Strip[kind].t = 1;                     // a finger on the strip outranks an autoscroll in flight
  Strip[kind].scroll = clamp(stripDrag.start + d.dx, stripMinScroll(kind), 0);
}

function updateStrips(dt) {
  updateStripDrag();
  for (const kind of ['heaven', 'ops']) {
    const s = Strip[kind];
    if (s.t < 1) {
      s.t = Math.min(1, s.t + dt / SCROLL_SNAP);
      s.scroll = lerp(s.from, s.to, easeOut(s.t));
    }
    // Re-clamped every frame rather than on purchase: a bought slot lengthens the strip, and the
    // shop is not the only thing that can change what a legal scroll is.
    s.scroll = clamp(s.scroll, stripMinScroll(kind), 0);
  }
  // Last, and deliberately after the clamp: the hint writes the lounge scroll itself, so it has to
  // be the frame's final word on it.
  updateStripHint(dt);
}

// --- The ghost hand (GDD 3.1) -------------------------------------------------
// The strip is the one object in the game that answers to a gesture nothing on screen asks for.
// Everything else announces itself: the docket carries three swipe labels, a wreck gets a beat, an
// expired guest blinks and is tapped. A floor simply sits there being wider than the screen, and
// the only thing that ever said so was the chevron - which is a button, and is tapped, and so
// teaches the player that off-screen slots are reached by pressing an arrow rather than by moving
// the floor. It answers WHERE and it has never once answered HOW.
//
// So the gesture is shown instead of described: a translucent hand presses on the slot row, drags,
// and lets go, and the row follows it a few pixels and springs back. No words, because the
// Associate's plate stops the day and this is not worth stopping the day for; no arrow, because an
// arrow is what was already there and already failed.
const HINT_CYCLE = HINT_PRESS + HINT_TRAVEL + HINT_LIFT + HINT_GAP;

// Two moments arm it, each once per run, and neither of them is a timer.
//
// The opening: day one is running, which means the first docket has already been swiped and all
// three swipe beats have been read, and the row of suites is now the last thing on screen that
// nobody has said anything about.
//
// The first chevron: there is something out past an edge that matters, and the player still has
// not dragged - which is the only evidence there is that the overhanging fourth suite taught them
// nothing. This is the one thing the chevron cannot say about itself.
function checkStripHint() {
  const h = state.stripHint;
  if (h.learned || h.plays > 0 || stripMinScroll('heaven') >= 0) return;
  if (!h.opened) { h.opened = true; h.plays = HINT_PLAYS_OPEN; h.t = 0; return; }
  if (!h.alerted && (edgeReport('heaven', 1) || edgeReport('heaven', -1))) {
    h.alerted = true;
    h.plays = HINT_PLAYS_ALERT;
    h.t = 0;
  }
}

// The hand is only ever on screen while the floor is actually there to be dragged. Anything that
// takes the floor away - a plate over it, a finger already on it, a chevron autoscroll still
// landing - takes the hand with it and restarts the loop, rather than freezing it where it stands.
// A paused hand reads as a stuck animation, and a hint that looks like a bug is worse than none.
//
// A finger anywhere ELSE is ignored on purpose. Sorting a docket is a vertical swipe in the work
// zone, it happens every few seconds all day, and aborting on it would mean a 2.4 s loop that
// almost never gets to finish. The two cannot be read for each other: one is a hand moving
// sideways over the suites, the other is a card moving up out of the desk.
function stripHintReady() {
  return state.screen === SCREEN.DAY_ACTIVE && !state.dayHold && !tutorialActive()
         && !stripDrag.kind && Strip.heaven.t >= 1 && stripMinScroll('heaven') < 0;
}

// Which way a finger would go: towards whichever end of the strip is still out of sight, and
// towards the edge that has something to say if either has. A hand sweeping away from a live
// chevron would be two pieces of UI disagreeing about the same floor.
function stripHintDir() {
  if (edgeReport('heaven', 1)) return -1;
  if (edgeReport('heaven', -1)) return 1;
  return Strip.heaven.scroll > stripMinScroll('heaven') ? -1 : 1;
}

// 0 to 1 across the sweep, flat outside it at both ends.
function stripHintTravel(t) {
  if (t <= HINT_PRESS) return 0;
  if (t >= HINT_PRESS + HINT_TRAVEL) return 1;
  return easeInOut((t - HINT_PRESS) / HINT_TRAVEL);
}

// What the strip is offset by while the hand is on it. It follows for the length of the sweep and
// is let go over the lift, which is the whole sentence: the floor moved because the finger moved,
// and it is back where it started, so nothing has been decided and nothing is off screen that was
// not off screen before. Seven pixels against a 40 px suite - enough to see, far too little to
// move a tap off the guest it was aimed at.
function stripHintNudge(h) {
  const end = HINT_PRESS + HINT_TRAVEL;
  if (h.t < HINT_PRESS) return 0;
  if (h.t < end) return HINT_NUDGE * h.dir * stripHintTravel(h.t);
  if (h.t < end + HINT_LIFT) return HINT_NUDGE * h.dir * (1 - easeOut((h.t - end) / HINT_LIFT));
  return 0;
}

function stripHintAlpha(h) {
  const end = HINT_PRESS + HINT_TRAVEL;
  if (h.t < HINT_PRESS) return HINT_ALPHA * (h.t / HINT_PRESS);
  if (h.t < end) return HINT_ALPHA;
  if (h.t < end + HINT_LIFT) return HINT_ALPHA * (1 - (h.t - end) / HINT_LIFT);
  return 0;
}

// Where the fingertip is this frame. The sweep is centred on the view, so it stays on screen
// whichever way it is going and lands over the middle suites rather than over an edge.
function stripHintHand(h) {
  return {
    x: VIEW_W / 2 + h.dir * HINT_SWEEP * (stripHintTravel(h.t) - 0.5),
    y: Display.zones.ground.y - HINT_HAND_Y,
    travel: stripHintTravel(h.t)
  };
}

// The renderer asks this rather than reading `plays`: a burst that is armed and waiting for a plate
// to clear has plays left and nothing to draw.
function stripHintLive() {
  const h = state.stripHint;
  return h.plays > 0 && h.t > 0 && stripHintReady();
}

function updateStripHint(dt) {
  const h = state.stripHint;
  checkStripHint();
  if (h.plays <= 0) return;
  if (!stripHintReady()) {
    // Interrupted mid-loop. The strip is handed back through the same autoscroll a chevron tap
    // uses, so the two can never be writing to `scroll` in the same frame - except when a finger
    // is already on the floor, which outranks both and keeps the strip exactly where it landed.
    // Snapping it home under a thumb that has just come down is the one wrong answer here.
    if (h.t > 0) {
      // An autoscroll already in flight owns the strip and is going somewhere the hint knows
      // nothing about - a chevron the player tapped, or the suite an acting beat has just centred.
      // Handing the strip back to a base captured before either of those would drag it off the
      // thing it was sent to, which on the onboarding gate means dragging the spotlight's own
      // subject back off the screen. Seven pixels of un-restored nudge is the cheaper wrong.
      if (!stripDrag.kind && Strip.heaven.t >= 1) scrollStripTo('heaven', h.base);
      h.t = 0;
    }
    return;
  }
  // Read at the top of each loop rather than of each burst, so a chevron tap between two loops is
  // respected: the hand starts from wherever the player left the floor.
  if (h.t === 0) {
    h.base = Strip.heaven.scroll;
    h.dir = stripHintDir();
  }
  h.t += dt;
  if (h.t >= HINT_CYCLE) { h.t = 0; h.plays--; return; }
  Strip.heaven.scroll = clamp(h.base + stripHintNudge(h), stripMinScroll('heaven'), 0);
}

function expiredGuestCount() {
  let n = 0;
  for (const s of state.heavenSlots) if (s.guest && s.guest.expired) n++;
  return n;
}

// The wreck nearest the left end, or -1. Both callers want a slot rather than a count: the
// onboarding gate points a spotlight at one and scrolls it into reach, and the condition that ends
// the gate is this returning -1.
function firstWreckedSlot() {
  for (let i = 0; i < state.heavenSlots.length; i++) if (state.heavenSlots[i].wrecked) return i;
  return -1;
}

// Half a slot on screen still counts as on screen: the guest inside it is centred, so it is fully
// visible long before its slot is, and a chevron pointing at something the player can already see
// is a chevron they learn to ignore.
function slotSide(kind, i) {
  const c = slotX(kind, i) + stripSize(kind).w / 2;
  if (c < 0) return -1;
  if (c > VIEW_W) return 1;
  return 0;
}

// What is out past one edge of one floor, in priority order: work first, then a free slot with
// something waiting to fill it. Returns null when that edge has nothing to say. `index` is the
// nearest such slot, which is where a tap on the chevron scrolls to.
//
// A wreck counts as work, alongside an expired contract, and shares the red chevron rather than
// getting a third kind. That is not crowding two meanings into one channel - it is the channel's
// actual meaning, which was always "there is something off-screen that wants your thumb". One of
// them wants a tap and the other a hold; both want you to scroll there, which is all the chevron
// does. GDD 9.4 rejects a fourth attention channel, and a wreck does not need one.
//
// It also has to be excluded from the free count below, or the white chevron would point at a slot
// nothing can be put into - an arrow that lies is worse than no arrow.

function edgeReport(kind, side) {
  const slots = stripSlots(kind);
  const count = visibleSlotCount(slots);
  // The lounge only matters while there is a soul to place; downstairs also matters while there is
  // an expired guest upstairs, because a free desk is the only thing that stops that guest rioting.
  const wants = kind === 'heaven'
    ? (state.card !== null || state.queue.length > 0)
    : (state.card !== null || expiredGuestCount() > 0);

  let alerts = 0, alertIndex = -1, freeIndex = -1;
  for (let n = 0; n < count; n++) {
    const i = side > 0 ? n : count - 1 - n;      // nearest to that edge first
    const slot = slots[i];
    if (!slot.unlocked || slotSide(kind, i) !== side) continue;
    if (slot.guest) {
      if (slot.guest.expired) {
        alerts++;
        if (alertIndex < 0) alertIndex = i;
      }
    } else if (slot.wrecked) {
      alerts++;
      if (alertIndex < 0) alertIndex = i;
    } else if (!slot.maint && freeIndex < 0) freeIndex = i;

  }
  if (alerts > 0) return { alert: true, count: alerts, index: alertIndex };
  if (wants && freeIndex >= 0) return { alert: false, count: 0, index: freeIndex };
  return null;
}

// One chevron is an arrow and its count on a dark plate, vertically centred on the slot row of its
// floor and one edge margin in from the canvas edge, which keeps it inside the crop tolerance
// (GDD 1.2) on the phones that lose pixels off the sides. It is plated for the same reason the
// swipe labels are: it lands on top of a guest standing at the edge of the screen, and a red arrow
// on a white cloud behind a violet figure is exactly the collision it exists to prevent.
function chevronBadge(kind, side, report) {
  const size = stripSize(kind);
  const label = report.alert ? String(report.count) : '';
  const inner = CHEVRON.w + (label ? 2 + textWidth(label, 1) : 0);
  const w = inner + CHEVRON_PLATE * 2;
  const h = CHEVRON.h + CHEVRON_PLATE * 2;
  const mid = kind === 'heaven'
    ? Display.zones.ground.y - size.h / 2
    : cubicleRect(0).y + size.h / 2;
  const x = side > 0 ? VIEW_W - EDGE_MARGIN - w : EDGE_MARGIN;
  const y = Math.round(mid - h / 2);
  return {
    x: x, y: y, w: w, h: h, label: label,
    tri: {
      x: side > 0 ? x + w - CHEVRON_PLATE - CHEVRON.w : x + CHEVRON_PLATE,
      y: y + CHEVRON_PLATE,
      w: CHEVRON.w,
      h: CHEVRON.h
    }
  };
}

// Which chevron a point is on, or null. `exact` is the whole of the difference between the passes
// in handleFloorTap: it tests the plate AS DRAWN, and without it the plate is grown to HIT_MIN (38)
// like every other button in the game - which, on a badge twenty pixels wide sitting one edge
// margin in, reaches a long way over the nearest suite. `alerts` filters to one kind of chevron;
// leaving it out asks for either.
function chevronAt(x, y, exact, alerts) {
  for (const kind of ['heaven', 'ops']) {
    for (const side of [-1, 1]) {
      const report = edgeReport(kind, side);
      if (!report) continue;
      if (alerts !== undefined && report.alert !== alerts) continue;
      const badge = chevronBadge(kind, side, report);
      if (!pointInRect(x, y, exact ? badge : hitRect(badge))) continue;
      return { kind: kind, index: report.index };
    }
  }
  return null;
}

function takeChevron(hit) {
  if (!hit) return false;
  scrollStripToSlot(hit.kind, hit.index);
  sfx('scroll');
  return true;
}

// Three things can be under one finger at the edge of the screen, so they are tried in the order of
// what the player most likely meant - with one rule ahead of all of it: a tap on the plate AS DRAWN
// belongs to the plate. The badge is opaque and it is the last thing painted over those pixels, so
// anything else is the screen disagreeing with itself. A button that visibly sits on top of a guest
// and answers with the guest is worse than no button, and that was the white chevron's behaviour
// until now: the priority rule below was written about the GROWN box and was quietly deciding the
// drawn one as well.
//
// Under the plate the old order still holds, and it is about that grown box. A red chevron is an
// emergency out of sight and wins the margin around itself. A guest that is on screen beats a white
// chevron's margin, because a visible expired contract is worth more than the free slot the white
// one is pointing at - and the white one is still there afterwards, one plate-sized tap away.
function handleFloorTap(g) {
  if (g.type !== 'tap') return;
  if (takeChevron(chevronAt(g.x, g.y, true))) return;
  if (takeChevron(chevronAt(g.x, g.y, false, true))) return;
  if (handleSlotTap(g)) return;
  takeChevron(chevronAt(g.x, g.y, false, false));
}

// --- Repairing a wrecked suite (GDD 6.5) --------------------------------------

// A press-and-hold on a suite a riot tore up. It costs nothing but the seconds the thumb spends on
// it, which is the scarcest thing the player has: the queue keeps arriving through the hold and the
// card on the desk keeps ageing out of its snap bonus.
//
// This gesture replaced the concierge, and the reason is worth keeping. The concierge held an
// OCCUPIED suite and made its guest present better, which was available on every guest, all the
// time, forever, at a price nobody could feel - `served` ran at about 40 of some 45 check-ins per
// run, so it was not a decision, it was a tax the player paid themselves for existing. A repair
// cannot become that, because the game only ever offers it as the consequence of a riot: the
// mechanic is unavailable to a player who is keeping up, and it is unavoidable for one who is not.
//
// The gesture still fits the one hole the input vocabulary had - a tap on an occupied suite has
// always been a shrug, and a tap on an expired guest is the lift - and it now sits on the one
// object in the lounge that had no gesture at all.
const serviceHold = { slot: -1, t: 0, fired: false, consume: false, was: false };

// A wreck, and nothing else. It is re-checked when the hold completes for the same reason the
// concierge re-checked its guest: what is under a resting finger can change under it.
function servableSlot(i) {
  const slot = state.heavenSlots[i];
  return !!slot && slot.unlocked && slot.wrecked;
}

// A holding beat normally takes every gesture off the player, and the onboarding gate is the one
// exception in the game: it is a holding beat whose entire purpose is to be answered by this
// gesture, so refusing the gesture while it is up would be a lock with no key.
function serviceReady() {
  return state.screen === SCREEN.DAY_ACTIVE && !state.dayHold
         && (!tutorialHolding() || tutorialActing());
}


// Which suite a finger came down on, or -1. Resolved once, at the moment the finger lands: the
// strip cannot scroll under a hold (it needs SCROLL_AXIS_LOCK px of travel, and travel cancels the
// hold), so the slot found here is the slot still under the thumb when the hold completes.
function serviceSlotAt(x, y) {
  if (!serviceReady()) return -1;
  // The same rule the tap order uses, at the other gesture. A finger that came down on the chevron
  // plate is on the chevron and not on the suite behind it - and without this line a hold there
  // would repair the wreck underneath and the release would then scroll, which is two answers to
  // one gesture. Only the plate as drawn: the grown box is a courtesy for missing the button, and a
  // courtesy has no business cancelling a repair.
  if (chevronAt(x, y, true)) return -1;
  const count = visibleSlotCount(state.heavenSlots);
  for (let i = 0; i < count; i++) {
    if (!servableSlot(i)) continue;
    if (pointInRect(x, y, heavenSlotRect(i))) return i;
  }
  return -1;
}

function serveGuest(i) {
  state.heavenSlots[i].wrecked = false;
  state.stats.repaired++;
  spendCredits(REPAIR_COST);
  const r = heavenSlotRect(i);
  addPopup(r.x + r.w / 2, r.y - 4, '-' + REPAIR_COST + ' ◈', C.suspicion, POPUP_LIFE_LONG);

  addShake(2, 0.12);
  haptic(HAPTIC.checkIn);
  sfx('serve');
}


// Live, like the strip drag and for the same reason: the ring has to fill under the finger, so this
// reads Input.drag every frame instead of waiting for a gesture on release.
//
// Movement cancels rather than merely pausing. TAP_SLOP (7) is one pixel past SCROLL_AXIS_LOCK (6),
// so by the time a finger has moved far enough to abandon the hold the strip has already committed
// to its axis: a scroll that starts on a guest scrolls, and never also serves.
function updateServiceHold(dt) {
  const d = Input.drag;
  if (!d.active) { serviceHold.was = false; serviceHold.slot = -1; serviceHold.t = 0; return; }

  if (!serviceHold.was) {
    serviceHold.was = true;
    serviceHold.fired = false;
    serviceHold.consume = false;
    serviceHold.t = 0;
    serviceHold.slot = serviceSlotAt(d.startX, d.startY);
  }
  if (serviceHold.slot < 0 || serviceHold.fired) return;

  if (Math.max(Math.abs(d.dx), Math.abs(d.dy)) > TAP_SLOP) { serviceHold.slot = -1; serviceHold.t = 0; return; }

  serviceHold.t += dt;
  if (serviceHold.t < SERVICE_HOLD) return;
  // Re-checked rather than trusted, on the same principle the concierge used: what was under the
  // finger when it came down is not necessarily what is under it 1.2 seconds later.
  if (servableSlot(serviceHold.slot)) serveGuest(serviceHold.slot);

  serviceHold.fired = true;
  // The release of a completed hold still arrives as a tap - it never moved - and that tap would
  // reach the slot underneath. It is eaten once, by the one gesture it belongs to, rather than by
  // a flag left standing between gestures.

  serviceHold.consume = true;
  serviceHold.slot = -1;
}

// How full the ring under the finger is, 0 when there is no hold in progress. Read by the renderer.
function serviceHoldOn(i) {
  return (serviceHold.slot === i && serviceHold.t > 0) ? clamp(serviceHold.t / SERVICE_HOLD, 0, 1) : 0;
}

// --- Input --------------------------------------------------------------------

// A tap on an expired guest sends it downstairs. A tap on a working one gets a shrug: there is no
// early eviction in this game, and planning the buffer downstairs ahead of time is the strategy.
// A tap on a wreck answers instead of falling through to nothing. This is the whole of the
// gesture's discoverability: the player who has just watched a guest tear a suite up will tap it,
// and a tap that does nothing at all teaches that the suite is scenery. A shake and the same
// refusal note the game already uses says "not like that" - and the hold ring that starts filling
// the moment the finger stays says the rest without a word.
//
// Its own function because the onboarding gate wants this answer and nothing else in this file:
// while the gate is up a tap must not relocate a guest, arm anything or scroll, and it must not
// put the plate away either - the only thing left for it to say is "not like that".
function tapWreck(g) {
  const count = visibleSlotCount(state.heavenSlots);
  for (let i = 0; i < count; i++) {
    const slot = state.heavenSlots[i];
    if (slot.guest || !slot.wrecked) continue;
    if (!pointInRect(g.x, g.y, heavenSlotRect(i))) continue;
    addShake(2, 0.12);
    sfx('busy');
    return true;
  }
  return false;
}

function handleSlotTap(g) {
  if (serviceHold.consume) { serviceHold.consume = false; return true; }
  if (tapWreck(g)) return true;

  const count = visibleSlotCount(state.heavenSlots);
  for (let i = 0; i < count; i++) {
    const slot = state.heavenSlots[i];
    if (!slot.guest) continue;
    if (!pointInRect(g.x, g.y, heavenSlotRect(i))) continue;


    // An armed Contract Termination (GDD 9.1) outranks both of the answers below: the player has
    // already paid for this tap and is being asked which suite, so a working contract must not
    // reply with a shrug.
    if (supplyRunning('terminate') && state.active.arm) return terminateGuest(i);

    if (!slot.guest.expired) {
      slot.guest.nudge = NUDGE_TIME;
      sfx('busy');
    } else if (!relocateGuest(i)) {
      state.fullFlash.ops = FULL_FLASH;   // nowhere to put it, which is exactly the riot's cause
      addShake(2, 0.18);
      sfx('refused');
    }
    return true;
  }
  return false;
}

// --- Update -------------------------------------------------------------------

function updateFloors(dt) {
  updateServiceHold(dt);

  for (let i = 0; i < state.heavenSlots.length; i++) {
    const guest = state.heavenSlots[i].guest;
    if (!guest) continue;

    if (guest.panic > 0) guest.panic = Math.max(0, guest.panic - dt);
    if (guest.nudge > 0) guest.nudge = Math.max(0, guest.nudge - dt);

    if (!guest.expired) {
      guest.contract -= dt;
      if (guest.contract <= 0) {
        guest.contract = 0;
        guest.expired = true;
        sfx('expire');
      }
      continue;
    }

    // Asked per guest rather than once for the whole floor: the express lift can take the last
    // free desk halfway through this loop, and the guest after it has to know that.
    const roomBelow = freeSlotCount(state.cubicles) > 0;

    // The riot clock only runs while there is genuinely nowhere to move this guest. With a desk
    // free downstairs an expired guest simply waits, earning nothing - that is what makes keeping
    // a cubicle empty a strategy rather than a habit.
    if (!roomBelow) {
      guest.riot += dt;
      if (guest.riot >= RIOT_DELAY) { riot(i); continue; }
      continue;
    }

    guest.riot = 0;
    // The express lift is automation, not teleportation: the guest stands there expired for a
    // beat first, so the player sees what the machine is doing for them and can still learn the
    // rule it is following. Without the pause the marker would never appear at all.
    if (!hasExpressLift()) continue;
    guest.lift += dt;
    if (guest.lift >= LIFT_DELAY) relocateGuest(i);
  }

  for (let i = 0; i < state.cubicles.length; i++) {
    const guest = state.cubicles[i].guest;
    if (!guest) continue;
    if (guest.nudge > 0) guest.nudge = Math.max(0, guest.nudge - dt);
    guest.desk -= dt;
    if (guest.desk <= 0) dischargeGuest(i);
  }
}

// ==========================================================================
// 12_economy.js
// ==========================================================================

// Aura and Credits production, Suspicion sources and Noise, the daily quota and shop purchases
// (GDD 4, 7, 9). Build steps 3, 5, 6 and 8. Step 3 is the two production lines and nothing else:
// a soul upstairs makes Aura out of how holy it is, a soul downstairs makes Credits.

// Skepticism is the complement of Gullibility and is derived here rather than stored, because a
// soul has one temperament and storing both halves of it is storing the same fact twice. The
// archetype dictionary authors the person - how credulous, how holy - and this file decides what
// that person is worth and what it costs.
function soulSkepticism(soul) {
  return STAT_MAX - soul.g;
}

// One soul cannot make both, which is the whole tension of the game: Aura pays today's quota,
// Credits buy tomorrow's capacity. The snap bonus is per soul and permanent, so it travels with
// the soul if it is later moved downstairs.
//
// Sanctity is the whole of it. There was a concierge floor here until 2 September, and its removal
// is the point rather than a simplification: what a guest is worth upstairs is now a fact about the
// guest, so the only way to raise production is to house better souls or house more of them.
function soulAura(soul) {
  return soul.s * AURA_PER_S * (soul.bonus || 1) * auraMult();
}




// And what it is worth downstairs is a fact about the guest too, since 2 September. Gullibility is
// the seller's stat: a credulous soul at a desk signs whatever Operations puts in front of it, a
// doubter does the filing and nothing else. This is the other half of what the flip left undone -
// Sanctity was given the lounge, and the basement was left paying a flat rate to everybody, so
// half the card had no question in it.
//
// The two floors read the two stats and neither reads both, which is what keeps them a choice:
// Sanctity earns upstairs and is charged nothing there, Gullibility earns downstairs and is charged
// nothing there, and the cost of a suite is the Skepticism that comes with the holy. A soul is
// therefore rarely equally good in both places, and never bad in both by accident - the base rate
// sees to that.
function soulCredits(soul) {
  return (CREDITS_BASE + CREDITS_PER_G * soul.g) * (soul.bonus || 1) * creditMult();
}

// The four upgrades that are not an unlock are read here, at the point they apply, rather than
// written into the state when they are bought: a level is the whole of what was purchased, and a
// multiplier stored somewhere else is a second copy of it waiting to go stale.
function auraMult() {
  return (1 + UP_AURA * upgradeLevel('pie')) * state.pact.auraMult * staffValue('aura', 1);
}

function creditMult() {
  return (1 + UP_CREDITS * upgradeLevel('poster') + attractionSum('credits')) * staffValue('credits', 1);
}

// Read once when a soul checks in, and kept on the guest: a contract bought longer halfway through
// someone's stay would silently rewind the ring the player is reading.
function contractTime() {
  return CONTRACT_TIME * (1 + UP_CONTRACT * upgradeLevel('eula')) * state.pact.contractMult;
}

// How long a card may sit on the desk and still be worth the Snap Decision bonus (GDD 5.5).
function snapTime() {
  return SNAP_TIME * (1 + attractionSum('snap'));
}

// How long a soul sits at a desk. Kept on the guest as `deskMax` when it arrives there, for the
// same reason the contract is stamped on at check-in: a night contract signed while somebody is
// halfway through their paperwork must not rewind the bar the player is reading.
function deskTime() {
  return DESK_TIME * state.pact.deskMult * (1 - attractionSum('desk')) * (1 - staffValue('desk', 0));
}

// The quota the current day is actually being measured against. The night contract is signed
// before the shop opens, so this is already the pact's day both while the shop is on screen
// (showing day + 1) and while that day is being played.
function dayQuota(day) {
  return Math.round(dayConfig(day).quota * state.pact.quotaMult);
}

function hasExpressLift() {
  return upgradeLevel('lift') > 0;
}

// How much of the basement the lavender absorbs. Three levels take 90% of it, which is the cap in
// GDD 7 and the reason the desks never become free of consequence.
function dampening() {
  return clamp(UP_DAMPEN * upgradeLevel('lavender'), 0, 0.9);
}

// Production is banked per guest and floated up as a single number every couple of seconds:
// a popup per frame would be an unreadable smear, and a popup per unit would spam at high rates.
function bankProduction(guest, amount, dt) {
  guest.acc += amount * dt;
  guest.emit -= dt;
  return guest.emit <= 0;
}

// `life` overrides the default for the rare popup that reports something the player must not
// miss. A riot costs a guest outright, and 0.8 s of text is easy to blink past mid-swipe.
function addPopup(x, y, text, color, life) {
  if (state.popups.length >= MAX_POPUPS) state.popups.shift();
  state.popups.push({ x: x, y: y, text: text, color: color, t: 0, life: life || POPUP_LIFE });
}

// A banked total that rounds to nothing produces no popup at all. That is deliberate feedback:
// a soul with no Sanctity is visibly earning the resort nothing.

function flushProduction(guest, rect, symbol, color) {
  const whole = Math.round(guest.acc);
  if (whole > 0) addPopup(rect.x + rect.w / 2, rect.y - 4, '+' + whole + ' ' + symbol, color);
  guest.acc = 0;
  guest.emit = POPUP_EVERY;
}

function updateEconomy(dt) {
  for (let i = 0; i < state.heavenSlots.length; i++) {
    const guest = state.heavenSlots[i].guest;
    if (!guest) continue;
    const rate = soulAura(guest.soul) * panicFactor(guest) * guestOutput(guest);
    if (rate <= 0) continue;



    state.aura += rate * dt;
    state.stats.auraTotal += rate * dt;
    if (bankProduction(guest, rate, dt)) {
      flushProduction(guest, heavenSlotRect(i), '✦', C.aura);
    }
  }

  for (let i = 0; i < state.cubicles.length; i++) {
    const guest = state.cubicles[i].guest;
    if (!guest) continue;
    const rate = soulCredits(guest.soul);
    state.credits += rate * dt;
    state.stats.creditsTotal += rate * dt;
    if (bankProduction(guest, rate, dt)) {
      flushProduction(guest, cubicleRect(i), '◈', C.credits);
    }
  }
}

function spendCredits(amount) {
  state.credits = Math.max(0, state.credits - amount);
}

function updatePopups(dt) {
  for (let i = state.popups.length - 1; i >= 0; i--) {
    const p = state.popups[i];
    p.t += dt / p.life;
    if (p.t >= 1) state.popups.splice(i, 1);
  }
  if (state.snapFlash > 0) state.snapFlash = Math.max(0, state.snapFlash - dt);
  if (state.suspFlash > 0) state.suspFlash = Math.max(0, state.suspFlash - dt);
  if (state.suspPop.t > 0) {
    state.suspPop.t = Math.max(0, state.suspPop.t - dt);
    if (state.suspPop.t === 0) state.suspPop.n = 0;
  }
}

// --- Attractions (GDD 9.2) ----------------------------------------------------
// An attraction is a shop item like any other; what makes it an attraction is that it pays in
// popularity rather than in capacity, and that it charges for it in the meter. There is no
// placement, no grid and no second screen (GDD 9.4) - the whole system is a `gives` object on a
// shop row, summed off the levels the same way every other upgrade is read.
function attractionSum(key) {
  let total = 0;
  for (const item of SHOP_ITEMS) {
    if (!item.gives || !item.gives[key]) continue;
    const n = upgradeLevel(item.id);
    if (n > 0) total += item.gives[key] * n;
  }
  return total;
}

function attractionBuzz() { return attractionSum('buzz'); }

// --- The shift associate (GDD 9.3) --------------------------------------------
// One slot, three candidates a night, a wage charged at every settlement. Everything an associate
// does is a modifier read where it applies - there is no roster, no screen and no state beyond a
// single id, which is the same discipline the shop upgrades and the night contracts follow.

function staffCard(id) {
  for (const s of STAFF) if (s.id === id) return s;
  return null;
}

function hiredStaff() {
  return state.staff.hired ? staffCard(state.staff.hired) : null;
}

// One field off the associate on shift, or the neutral value. Every call site reads its own field
// and does not have to know which associate is standing there.
function staffValue(key, neutral) {
  const s = hiredStaff();
  return s && s[key] !== undefined ? s[key] : neutral;
}

// Three of the four, drawn fresh every night. Whoever is on shift is not offered again - the slot
// is occupied and re-hiring the same person is not a decision.
function dealStaff() {
  const pool = [];
  for (const s of STAFF) if (s.id !== state.staff.hired) pool.push(s.id);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = rngInt(i + 1);
    const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  state.staff.offer = pool.slice(0, STAFF_OFFER);
}

// Hiring is free and instant; the wage starts at the next settlement. Hiring over somebody is
// allowed and simply replaces them, because two taps to swap a modifier is a menu, not a decision.
function hireStaff(id) {
  if (!staffCard(id) || state.staff.hired === id) { sfx('refused'); return false; }
  // Same backstop as itemIdle: the STAFF page arrives on the fourth night and nothing may be
  // hired through a code path before it does.
  if (!shopPageUnlocked(itemPageIndex({ page: 'staff' }))) return false;
  revokeStaffDesk();
  state.staff.hired = id;
  state.staff.note = '';
  grantStaffDesk();
  // The offer is NOT re-dealt here. Hiring is free, so a fresh set of three after every hire would
  // be an unlimited re-roll: tap the cheapest, look at the new three, tap again. One draw a night.
  sfx('buy');
  return true;
}

function fireStaff() {
  if (!state.staff.hired) return false;
  revokeStaffDesk();
  state.staff.hired = null;
  state.staff.note = '';
  sfx('deny');
  return true;
}

// Charged at the end of every day, before the quota is settled, so the Credits the shop opens with
// are already the Credits the player actually has. An associate who cannot be paid leaves - and
// tells people, which is the only reason the wage is a decision rather than a subtraction.
function payStaff() {
  const s = hiredStaff();
  if (!s) { state.staff.note = ''; return; }
  if (state.credits < s.wage) {
    revokeStaffDesk();
    state.staff.hired = null;
    state.staff.note = 'LEFT UNPAID. +' + STAFF_QUIT_SUSPICION + ' SUSPICION';
    addSuspicion(STAFF_QUIT_SUSPICION);
    return;
  }
  spendCredits(s.wage);
  state.staff.note = 'WAGE PAID: ' + s.wage + ' ◈';
}

// The Intern's temporary desk (GDD 9.3). It really is unlocked rather than counted, and the index
// is remembered: every question about capacity in this game goes through `slot.unlocked`, and a
// second kind of unlocked desk would be a second answer to that question in eight places. Firing
// the Intern takes the desk back, and whoever is standing at it is filed on the way out.
function grantStaffDesk() {
  if (staffValue('desks', 0) <= 0 || state.staff.desk >= 0) return;
  for (let i = 0; i < state.cubicles.length; i++) {
    if (state.cubicles[i].unlocked) continue;
    state.cubicles[i].unlocked = true;
    state.staff.desk = i;
    return;
  }
}

function revokeStaffDesk() {
  if (state.staff.desk < 0) return;
  state.staff.desk = -1;
  // The desk that comes back is the HIGHEST unlocked one, not the index that was handed over.
  // Cubicles unlock from the left and every count in the game reads that row as contiguous, so
  // re-locking the middle of it would leave a hole that `visibleSlotCount` cannot describe - a
  // locked desk sitting between two working ones, one of which the player had paid for.
  let last = -1;
  for (let i = 0; i < state.cubicles.length; i++) if (state.cubicles[i].unlocked) last = i;
  if (last < 0) return;
  if (state.cubicles[last].guest) dischargeGuest(last);
  state.cubicles[last].unlocked = false;
}

// The Intern also loses one now and then. It happens at the door, before the queue, so nothing that
// was ever on screen disappears - a soul the player had already seen would read as a bug.
function staffDropsArrival() {
  const chance = staffValue('drop', 0);
  return chance > 0 && rng() < chance;
}

// --- Consumables (GDD 9.1) ----------------------------------------------------
// The only move the player has from inside a day. Bought at night, carried in two HUD slots, spent
// with one tap. One effect at a time and no stacking: `state.active` is a single record, so there
// is nothing to reconcile when two of them would have overlapped.

function shopItemById(id) {
  for (const item of SHOP_ITEMS) if (item.id === id) return item;
  return null;
}

// The two slots are not drawn until the player has bought their first consumable. Two dashed boxes
// in the HUD of a day-one judge who has never seen the SUPPLIES tab are a question with no answer
// on screen; once one has been bought, the slots stay for the rest of the run, empty or not, so
// the place a consumable lives never moves.
function supplyEverBought() {
  for (const item of SHOP_ITEMS) if (item.use && upgradeLevel(item.id) > 0) return true;
  return false;
}

function freeSupplySlot() {
  for (let i = 0; i < state.supplies.length; i++) if (!state.supplies[i]) return i;
  return -1;
}

// True while a named effect is running. Read where the effect applies, like every other modifier
// in this file.
function supplyRunning(id) {
  return state.active.id === id && (state.active.t > 0 || state.active.arm);
}

function armedTermination() {
  return state.active.arm && state.active.id === 'terminate';
}

function supplyBusy() {
  return state.active.t > 0 || state.active.arm;
}

function clearSupply() {
  state.active.id = null;
  state.active.t = 0;
  state.active.dur = 0;
  state.active.arm = false;
}

function startSupply(id, duration, arm) {
  state.active.id = id;
  state.active.dur = duration;
  state.active.t = duration;
  state.active.arm = !!arm;
}

// Spending one. Refused rather than queued while another is running: two overlapping effects is
// exactly the inventory this design does not have (GDD 9.4), and the refusal is the same shake and
// the same sound a full floor gives.
function useSupply(slot) {
  const id = state.supplies[slot];
  if (!id || supplyBusy() || state.screen !== SCREEN.DAY_ACTIVE) {
    addShake(2, 0.18);
    sfx('refused');
    return false;
  }
  state.supplies[slot] = null;

  if (id === 'choir') {
    startSupply(id, SUPPLY.choirTime, false);

  } else if (id === 'terminate') {
    // The one consumable that asks a question. It arms and waits for the player to say which
    // suite; everything else happens the moment it is tapped.
    startSupply(id, 0, true);

  } else if (id === 'rush') {
    // Applied at once, to the desks that are occupied now: a desk filled thirty seconds later is
    // not part of the rush, and the banner counts the rush down so that reads as a rule.
    for (const cell of state.cubicles) {
      if (cell.guest) cell.guest.desk = Math.min(cell.guest.desk, SUPPLY.rushTime);
    }
    startSupply(id, SUPPLY.rushTime, false);

  } else if (id === 'shuttle') {
    // The valve for the last day. They leave, and for once nobody talks about it - no Suspicion,
    // no Reputation, no Credits.
    state.queue.length = 0;
    startSupply(id, SUPPLY.shuttleFlash, false);
  }
  sfx('elevator');
  haptic(HAPTIC.checkIn);
  return true;
}

// The armed Contract Termination, answered by a tap on an occupied suite (see handleSlotTap).
// Any guest, not only an expired one: the deadlock this exists for is a lounge with nothing free
// and a basement with nothing free, and waiting for the contract to run out first is the thing
// that cannot be afforded.
function terminateGuest(index) {
  const slot = state.heavenSlots[index];
  if (!slot.guest) return false;
  const r = heavenSlotRect(index);
  slot.guest = null;
  clearSupply();
  addPopup(r.x + r.w / 2, r.y - 8, 'TERMINATED', C.suspicion, POPUP_LIFE_LONG);
  addShake(4, 0.2);
  haptic(HAPTIC.deny);
  sfx('deny');
  addSuspicion(SUPPLY.terminateSusp);
  return true;
}

function updateSupplies(dt) {
  if (state.active.arm || !state.active.id) return;
  state.active.t -= dt;
  if (state.active.t <= 0) clearSupply();
}

// --- Buzz and Reputation (GDD 4.1) --------------------------------------------
// Wave C, and the reason the wave exists. Everything above this line was a game in which Suspicion
// only ever cost the player something, so the only correct play was to hold it at zero. Buzz turns
// the same three sources - a full lounge, an attraction, a reputation - into the arrival rate, and
// prices all of them in the same meter. Neither number has a bar of its own: Buzz is read as how
// fast the queue fills, Reputation is read as Buzz.

// How full the lounge looks from the outside. An expired guest still counts - it is standing in the
// window like everybody else, and the crowd outside cannot see a contract.
function loungeOccupancy() {
  let unlocked = 0, filled = 0;
  for (const slot of state.heavenSlots) {
    if (!slot.unlocked) continue;
    unlocked++;
    if (slot.guest) filled++;
  }
  return unlocked ? filled / unlocked : 0;
}

// The starvation zone (GDD 7.1): a resort nobody has any reason to talk about is a resort nobody
// arrives at. This is the price on the bottom of the meter, and it is what stops "hold Suspicion at
// zero" from being the answer to the whole game.
function starvationFactor() {
  if (state.suspicion >= SUSP_STARVE) return 1;
  return lerp(BUZZ_STARVE, 1, clamp(state.suspicion / SUSP_STARVE, 0, 1));
}

function buzzTarget() {
  const raw = BUZZ_BASE + BUZZ_OCCUPANCY * loungeOccupancy() +
              (state.reputation - REP_NEUTRAL) * BUZZ_REP + attractionBuzz();
  return clamp(raw, 0, 100) * starvationFactor();
}

// Eased rather than assigned: the target jumps the moment a guest is placed or walks out, and an
// arrival rate that changed between two frames would read as the game stuttering rather than as the
// crowd noticing.
function updateBuzz(dt) {
  const step = BUZZ_EASE * dt;
  state.buzz += clamp(buzzTarget() - state.buzz, -step, step);
}

// The day table is the middle of this range, not its floor (GDD 8): at Buzz 0 the interval is half
// again as long, at Buzz 100 it is nearly halved, and the numbers tuned before wave C still describe
// a tower running at the middle of its popularity.
function arrivalInterval() {
  const mult = lerp(BUZZ_SLOW, BUZZ_FAST, clamp(state.buzz, 0, 100) / 100);
  return dayConfig(state.day).interval * mult * state.pact.arrivalMult;
}

// Reputation moves in whole events, never per frame: a contract that ran its course and left
// quietly, against a guest who walked out and anybody refused at the door.
function addReputation(amount) {
  state.reputation = clamp(state.reputation + amount, 0, REP_MAX);
}

// --- Suspicion and Noise (GDD 7) ----------------------------------------------
// Build step 5. Two kinds of source: a drip that runs every frame from what is currently standing
// in the tower, and one-off hits from things that go wrong. The drip is silent by design - it is
// read off the bar, not announced - while every hit flares the bar and prints its own number, so
// the player can always tell an accident from the cost of doing business.

// The threshold is checked wherever the meter moves, not only in the per-frame drip: the quota
// penalty lands at the end of a day, when the drip is no longer running, and a run that ended
// there must not sit through a shop and a whole further day before finding out.
function checkAudit() {
  if (state.suspicion >= SUSP_MAX) loseGame('audit');
}

// Takes a negative amount too - the Passionfruit Basket is the one thing in the game that moves
// the meter the other way, and it deserves the same flash and the same number in the HUD row.
function addSuspicion(amount) {
  state.suspicion = clamp(state.suspicion + amount, 0, SUSP_MAX);
  if (state.suspicion > state.stats.suspPeak) state.stats.suspPeak = state.suspicion;
  state.suspPop.n += amount;
  state.suspPop.t = SUSP_POP_LIFE;
  state.suspFlash = SUSP_FLASH;
  sfx(amount < 0 ? 'relief' : 'suspicion');
  // A one-off hit can land outside a day - the quota penalty arrives at the settlement, when the
  // per-frame drip is no longer running - so the mix is told here as well as in updateSuspicion.
  audioSuspicion(state.suspicion);
  checkAudit();
}

// Skepticism is a threshold, not a slope: the first two pips are free and everything above them
// costs. A linear cost per point cannot both leave an ordinary soul cheap and make a hard case
// frightening, and the stat is only worth reading on the card if the answer changes somewhere
// along the row of pips.
function skepticRate(soul) {
  return Math.max(0, soulSkepticism(soul) - SUSP_SKEPTIC_FREE) * SUSP_PER_SKEPTIC;
}



// Every soul at a desk downstairs is audible upstairs. This is the whole reason the basement is a
// decision rather than free money, and the reason the dampener in the shop is worth buying.
function noiseRate() {
  let souls = 0;
  for (const slot of state.cubicles) if (slot.guest) souls++;
  // An attraction bolted to the operations floor is as audible as the souls at the desks, and the
  // lavender absorbs it on the same terms: the dampener is a basement machine, so it only ever
  // works on the basement.
  const raw = (souls * NOISE_PER_SOUL + attractionSum('noise')) * (1 - dampening()) * state.pact.noiseMult;
  // The icons rising out of the basement thin out with it, because the choir is a thing the player
  // has to be able to SEE working for the 25 seconds they paid for.
  const withStaff = raw * staffValue('noise', 1);
  return supplyRunning('choir') ? withStaff * SUPPLY.choirMult : withStaff;
}

function suspicionRate() {
  // Buzz is charged here and nowhere else, which is the whole of the coupling asked for in GDD 4.1:
  // there is no second death meter, there is one drip priced per point of popularity. A full lounge
  // is audible, an attraction is obviously fake, and a resort people talk about is a resort Head
  // Office eventually hears about.
  // Attractions upstairs are charged undampened: the pool is not noise, it is a large obviously
  // fake thing visible from the outside, and no amount of lavender hides it.
  let rate = noiseRate() + state.pact.suspDrip + state.buzz * SUSP_PER_BUZZ + attractionSum('susp');
  // The Choral Cover-Up sings over the drip and nothing else (GDD 9.1): a riot or an arrival turned
  // away still costs full price, because a one-off hit is an event and the choir is not loud enough
  // to make an event not have happened.
  for (const slot of state.heavenSlots) {
    // A suite nobody has put back is charged whether or not anything is standing in it (GDD 6.5).
    // It is charged in this loop rather than with the tower sources above because it is a fact
    // about one slot rather than about the building - and because it has to end the instant a
    // thumb has spent SERVICE_HOLD on it, which is a per-slot event.
    if (slot.wrecked) rate += SUSP_PER_WRECK;
    const guest = slot.guest;
    if (!guest) continue;
    // A doubter is a risk whether or not the contract still runs, and an expired guest is a second
    // risk on top: it is standing in the lounge asking the window questions.
    rate += skepticRate(guest.soul);
    if (guest.expired) rate += SUSP_PER_EXPIRED;
  }

  // The Experience Manager charges by the head, and the Renegade Auditor scrubs a flat rate off
  // whatever the tower is producing. The auditor can take the total below zero, which is the one
  // exception to "the meter never falls on its own" - it is not falling on its own, it is being
  // paid 45 credits a day to fall.
  const perGuest = staffValue('perGuest', 0);
  if (perGuest > 0) {
    for (const slot of state.heavenSlots) if (slot.guest) rate += perGuest;
  }
  rate -= staffValue('scrub', 0);
  return supplyRunning('choir') ? rate * SUPPLY.choirMult : rate;
}

function updateSuspicion(dt) {
  const rate = suspicionRate();
  // Clamped at both ends since wave C: an associate paid to scrub the meter can make the rate
  // negative, and a negative meter would make the starvation zone unreachable from above.
  state.suspicion = clamp(state.suspicion + rate * dt, 0, SUSP_MAX);
  if (state.suspicion > state.stats.suspPeak) state.stats.suspPeak = state.suspicion;

  spawnNotes(noiseRate(), dt);
  audioSuspicion(state.suspicion);
  checkAudit();
}

// --- Noise icons --------------------------------------------------------------

// One icon is spawned per interval rather than per frame, so the stream thins out to a lone icon
// every few seconds with two souls downstairs and becomes continuous with six.
function spawnNotes(noise, dt) {
  if (noise <= 0) { state.noteTimer = 0; return; }
  state.noteTimer -= dt;
  if (state.noteTimer > 0) return;
  state.noteTimer = 1 / (noise * NOTE_PER_NOISE);

  const occupied = [];
  const count = visibleSlotCount(state.cubicles);
  for (let i = 0; i < count; i++) if (state.cubicles[i].guest) occupied.push(i);
  if (!occupied.length) return;

  // At the cap the spawn is skipped rather than the oldest icon dropped: the oldest is the one
  // nearest the top of its rise, and culling it would cut the stream off exactly where the whole
  // point of it is. The cap is a safety rail, not a queue.
  if (state.notes.length >= MAX_NOTES) return;

  const r = cubicleRect(pick(occupied));
  const y = r.y + rngRange(2, 10);
  state.notes.push({
    // Held in strip space, not screen space: an icon whose column detached from the desk it is
    // coming out of while the floor is dragged reports the wrong desk.
    x: r.x + rngRange(8, r.w - 8) - Math.round(Strip.ops.scroll),
    y: y,
    // The speed is derived from where this icon starts and where it has to end, not fixed: the
    // ops floor and the ground line move apart on a taller phone, and an icon that ran out of
    // life below the underlight would report the exact opposite of what the mechanic says.
    vy: (y - (Display.zones.ground.y - NOTE_TOP)) / NOTE_LIFE,
    t: 0,
    phase: rngRange(0, Math.PI * 2)
  });
}

function updateNotes(dt) {
  for (let i = state.notes.length - 1; i >= 0; i--) {
    const n = state.notes[i];
    n.t += dt;
    n.y -= n.vy * dt;
    if (n.t >= NOTE_LIFE) state.notes.splice(i, 1);
  }
}

// --- The quota and the shop (GDD 8, 9) ----------------------------------------
// Build step 6. The quota is the goal the whole day is measured against, and the shop is the only
// thing Credits are for, which is what makes the choice between the two floors matter beyond the
// current minute: Aura pays tonight, Credits buy the capacity that pays for the rest of the week.

// The surplus carries over (GDD 4). Banking it is a real strategy on the early days, and the quota
// grows faster than production can, so it never becomes a way to coast.
function settleQuota() {
  const quota = dayQuota(state.day);
  const produced = state.aura;
  if (produced >= quota) {
    state.aura -= quota;
    state.dayResult = { quota: quota, aura: produced, state: 'met' };
    return;
  }

  // A missed quota takes the whole day's Aura with it: falling short is not a partial payment,
  // it is a failed one, and leaving the shortfall banked would soften the next day for free.
  state.aura = 0;
  state.quotaMisses++;
  const out = state.quotaMisses >= QUOTA_MAX_MISSES;
  state.dayResult = { quota: quota, aura: produced, state: out ? 'final' : 'miss' };
  if (!out) addSuspicion(QUOTA_MISS_SUSPICION);
}

// --- Purchases ----------------------------------------------------------------

function upgradeLevel(id) {
  return state.upgrades[id] || 0;
}

function itemPrice(item) {
  return Math.round(item.base * Math.pow(item.mult, upgradeLevel(item.id)) * state.pact.priceMult);
}

// A consumable has no limit field, so it is never maxed out.
function itemMaxed(item) {
  return !!item.limit && upgradeLevel(item.id) >= item.limit;
}

// An item that would do nothing right now is refused rather than sold, and prices itself as
// unaffordable so the refusal is visible before the tap. Two cases: the basket at zero Suspicion,
// and a consumable with no free slot to put it in - two slots is the whole of the inventory
// system (GDD 9.1), so "full" has to be a state the panel reports.
// Which page an item lives on, as an index into SHOP_PAGES.
function itemPageIndex(item) {
  for (let i = 0; i < SHOP_PAGES.length; i++) if (SHOP_PAGES[i].id === item.page) return i;
  return -1;
}

function itemIdle(item) {
  // A page that has not arrived yet is not drawn, so this is a backstop rather than a readout -
  // and it is the backstop the balance harness needs, because the harness buys by id and would
  // otherwise sit in its greedy loop offering Credits for a tab that does not exist.
  if (!shopPageUnlocked(itemPageIndex(item))) return true;
  if (item.use) return freeSupplySlot() < 0;
  // A slot purchase with nothing left to unlock. It could not happen before wave C - the two
  // limits added up to exactly the two maxima - and it can now, because the Intern's desk takes
  // one of the six while it is on shift. Refused rather than sold, like everything else here.
  if (item.id === 'suite') return unlockedSlotCount(state.heavenSlots) >= MAX_HEAVEN_SLOTS;
  if (item.id === 'cubicle') return unlockedSlotCount(state.cubicles) >= MAX_CUBICLES;
  return item.id === 'basket' && state.suspicion <= 0;
}

function unlockNextSlot(slots) {
  for (const slot of slots) {
    if (!slot.unlocked) { slot.unlocked = true; return true; }
  }
  return false;
}

// The one place where an item id turns into an effect on the world - and it is deliberately short.
// Only the two unlocks and the one consumable change anything when bought; the percentage items
// and the lift are levels read by the systems that care, at the moment they care.
function applyUpgrade(id) {
  if (id === 'suite') unlockNextSlot(state.heavenSlots);
  else if (id === 'cubicle') unlockNextSlot(state.cubicles);
  else if (id === 'basket') addSuspicion(-UP_BASKET);
}

// Switching tabs clears the flash: it belongs to a cell on the page that is leaving, and a green
// border left behind would land on whichever item happens to sit in that slot on the new page.
function selectShopPage(i) {
  if (state.shopPage === i || !shopPageUnlocked(i)) return;
  state.shopPage = i;
  state.shopFlash.index = -1;
  state.shopFlash.t = 0;
  sfx('scroll');
}

function flashShopCell(index, ok) {
  state.shopFlash.index = index;
  state.shopFlash.t = SHOP_FLASH;
  state.shopFlash.ok = ok;
}

function buyItem(index) {
  const item = SHOP_ITEMS[index];
  if (!item || itemMaxed(item) || itemIdle(item)) { flashShopCell(index, false); sfx('refused'); return; }

  const price = itemPrice(item);
  if (state.credits < price) {
    // Refused at the cell, not by a greyed-out button: the player finds out why at the place the
    // failure is, which is the same rule the FULL flash on a floor follows.
    flashShopCell(index, false);
    addShake(2, 0.18);
    sfx('refused');
    return;
  }

  spendCredits(price);
  // The level is still counted for a consumable - it is what the `x 3` tag on the cell reports -
  // but the price multiplier is 1, so counting it costs nothing.
  state.upgrades[item.id] = upgradeLevel(item.id) + 1;
  if (item.use) state.supplies[freeSupplySlot()] = item.id;
  else applyUpgrade(item.id);
  flashShopCell(index, true);
  sfx('buy');
}

function updateNight(dt) {
  if (state.night.in < 1) state.night.in = Math.min(1, state.night.in + dt / NIGHT_IN);
  if (state.night.flash > 0) state.night.flash = Math.max(0, state.night.flash - dt);
}

function updateShop(dt) {
  if (state.shopIn < 1) state.shopIn = Math.min(1, state.shopIn + dt / SHOP_IN);
  if (state.shopFlash.t > 0) state.shopFlash.t = Math.max(0, state.shopFlash.t - dt);
}

// --- The night contract (GDD 8.3) ---------------------------------------------
// The one place where a contract id turns into an effect on the world, which is the same shape
// applyUpgrade has and for the same reason: the text lives in 08_data.js and knows nothing about
// the game, the numbers live in PACT and are tunable, and this switch is the only thing that has
// to be read to know what a night can do to a day.
//
// Effects split in two. What is immediate - credits in hand, a cut to the meter, contracts already
